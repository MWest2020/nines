title: "Slow and leaky"
summary: "payments-web's pipeline takes eight minutes and prints a live deploy token. Move the token to the secret store, cache the packages, and get the leaked token revoked."
offer.1: "Ruben, DevOps. Two problems with payments-web's pipeline. It downloads the whole internet on every run. And the secret scanner just found our live deploy token in it."
offer.2: "My laptop is the desk in the middle, the repository is open. Our CI docs are in the repo. Fix the pipeline, and make sure that token is dead."
active.1: "Deleting the line is the easy half. Git remembers every version of that file."
done.1: "Pipeline #209: install in 40 seconds from the cache, and the deploy log says DEPLOY_TOKEN=[MASKED]. That is how it should look."
done.2: "And the security team has revoked the old token. Anyone who cloned the repo last week still has it in their history, but now it opens nothing."
npc.name: "Ruben"
npc.idle: "A fast pipeline gets run. A slow one gets skipped, 'just this once'."
npc.mentor: "DevOps it is! Good. Pipelines, releases, the plumbing between a commit and a customer. Plenty to do."
npc.coach: "Choose a path first: Joyce, the career coach, is in front of the Career Centre. Then come back, I've got a pipeline for you."
npc.after: "I added the secret scanner as a step before the build, so a token now fails the pipeline instead of reaching main."
motd: "ci-02, in ~/payments-web. The pipeline is slow and leaks a deploy token. Start with ci-last-run.log."
obj.no_token: "no token in .nines-ci.yml"
obj.secret: "deploy gets DEPLOY_TOKEN from the secret store"
obj.cache: "install caches packages, keyed on package-lock.json"
obj.green: "the fix is committed and the pipeline passes"
obj.revoke: "the leaked token is in ~/ops/revoke-request.txt"
hint.log: "The last run's log is in the repository: cat ci-last-run.log. It shows where the minutes go, and what the scanner found."
hint.docs: "The team wrote down how this CI does caches and secrets: docs/ci.md. Both fixes go in .nines-ci.yml."
hint.commit: "The pipeline only runs on a commit: git add .nines-ci.yml, then git commit -m with a message."
hint.revoke: "The token is out of the file, but not out of git: the old commit still holds it, and the log printed it. Treat it as leaked: put it in ~/ops/revoke-request.txt so it gets revoked."
hint.syntax: "The CI refuses the file. Compare your cache and secrets blocks with the examples in docs/ci.md: indentation matters, and secrets is a list of names."
event.package_json_key: "Ruben leans over: \"package.json changes for every new script. Key the cache on package-lock.json: that one changes exactly when the dependencies do.\""
