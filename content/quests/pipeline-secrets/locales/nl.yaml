title: "Traag en lek"
summary: "De pipeline van payments-web duurt acht minuten en print een live deploytoken. Zet het token in de secret store, cache de packages en laat het gelekte token intrekken."
offer.1: "Ruben, DevOps. Twee problemen met de pipeline van payments-web. Hij downloadt bij elke run het halve internet. En de secret scanner heeft net ons live deploytoken erin gevonden."
offer.2: "Mijn laptop is het bureau in het midden, de repository staat open. Onze CI-documentatie zit in de repo. Herstel de pipeline, en zorg dat dat token dood is."
active.1: "De regel weghalen is de makkelijke helft. Git onthoudt elke versie van dat bestand."
done.1: "Pipeline #209: install in 40 seconden uit de cache, en het deploylog zegt DEPLOY_TOKEN=[MASKED]. Zo hoort het eruit te zien."
done.2: "En het securityteam heeft het oude token ingetrokken. Wie vorige week de repo clonede, heeft het nog in zijn geschiedenis, maar nu opent het niets meer."
npc.name: "Ruben"
npc.idle: "Een snelle pipeline wordt gedraaid. Een trage wordt overgeslagen, 'alleen deze keer'."
npc.mentor: "DevOps dus! Mooi. Pipelines, releases, het leidingwerk tussen een commit en een klant. Genoeg te doen."
npc.coach: "Kies eerst een pad: Petra, de loopbaancoach, staat voor het loopbaanbureau. Kom daarna terug, ik heb een pipeline voor je."
npc.after: "Ik heb de secret scanner als stap vóór de build gezet, dus een token laat de pipeline nu falen in plaats van main te halen."
motd: "ci-02, in ~/payments-web. De pipeline is traag en lekt een deploytoken. Begin met ci-last-run.log."
obj.no_token: "geen token in .nines-ci.yml"
obj.secret: "deploy krijgt DEPLOY_TOKEN uit de secret store"
obj.cache: "install gebruikt een cache (--cache .npm), met package-lock.json als sleutel"
obj.green: "de fix is gecommit en de pipeline slaagt"
obj.revoke: "het gelekte token staat in ~/ops/revoke-request.txt"
hint.log: "Het log van de vorige run staat in de repository: cat ci-last-run.log. Daar zie je waar de minuten heen gaan, en wat de scanner vond."
hint.docs: "Het team heeft opgeschreven hoe deze CI caches en secrets doet: docs/ci.md. Beide fixes horen in .nines-ci.yml."
hint.commit: "De pipeline draait alleen bij een commit: git add .nines-ci.yml, en dan git commit -m met een bericht."
hint.revoke: "Het token is uit het bestand, maar niet uit git: de oude commit bevat het nog, en het log heeft het geprint. Beschouw het als gelekt: zet het in ~/ops/revoke-request.txt zodat het wordt ingetrokken."
hint.syntax: "De CI weigert het bestand. Vergelijk je cache- en secrets-blok met de voorbeelden in docs/ci.md: inspringing telt, en secrets is een lijst met namen."
event.package_json_key: "Ruben buigt zich naar je toe: \"package.json verandert bij elk nieuw script. Gebruik package-lock.json als sleutel: die verandert precies wanneer de dependencies veranderen.\""
