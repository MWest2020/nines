# The DevOps Engineer's first Medior quest: a pipeline that is slow (no cache, every run downloads
# every package) and leaks (a live deploy token written into the pipeline file). The player moves
# the token to the CI's secret store, adds a cache keyed on the lockfile, commits, and asks for
# the leaked token to be revoked, because git keeps it in the history. Ruben sits in The Stack
# (npc-1); his desk is stack-desk-ci.
