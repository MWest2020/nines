title: "Vrijdag, 15:30"
summary: "Daan, de productmanager, wil nog één ding in de release van vandaag. Het is maar één veldje, zegt hij."
offer.1: "Daan, product. Heb je even? Het gaat over de release van vandaag. Klein dingetje."
offer.2: "Nou ja. Redelijk klein. Even de vergaderkamer in?"
active.1: "De vergaderkamer is vrij. Neem je agenda mee, en je ruggengraat."
done.1: "Oké, ik geef het toe: maandag met een flag was beter dan vrijdag met een schietgebedje."
npc.name: "Daan"
npc.idle: "Elke feature is klein als je hem niet zelf hoeft te bouwen. Ik leer het nog."
npc.after: "Marketing vond het plan B prima. Wie had gedacht dat één reservezin een nieuwsbrief kon redden."
attacker: "Daan · productmanager"
intro.1: "Daar komt Daan aan, productmanager. \"Heb je even?\""
intro.2: "Vrijdag, 15:30. Om 16:00 gaat de release met de nieuwe checkoutpagina live. Daan schuift een stoel bij: \"Kunnen we cadeaukaarten nog in de release van vandaag doen? Het is maar één veldje.\""
ask.prompt.1: "\"Het is maar één veldje. Lukt dat?\" Je mag twee vragen stellen voor je antwoordt. Welke twee?"
ask.why.text: "\"Wat lost het op, en wat als het maandag live gaat in plaats van vandaag?\""
ask.why.why: "Goed. Zo vind je de echte deadline en de echte waarde. 'Vandaag' blijkt vaak 'voor de nieuwsbrief van maandag' te betekenen, en dat verandert alles."
ask.scope.text: "\"Valt onder 'één veldje' ook kaartcontrole, deelbetalingen en terugbetalingen?\""
ask.scope.why: "Goed. Zo komt de scope achter 'één veldje' boven. Geldfeatures zijn nooit één veldje: controle, deelbetalingen en terugbetalingen zijn precies waar de bugs zitten."
ask.provider.text: "\"Welke betaalprovider doet de cadeaukaarten, en hebben ze een API of een kant-en-klaar checkoutcomponent dat we kunnen gebruiken?\""
ask.provider.why: "Half goed. Een redelijke technische vraag, maar te vroeg: eerst begrijpen wat er nodig is en waarom, dan pas hoe."
ask.who.text: "\"Wie heeft dit goedgekeurd?\""
ask.who.why: "Zwak. Het klinkt defensief en vertelt je niets over het probleem. Botsen er prioriteiten, breng dat dan in als je de vraag begrijpt."
ask.weekend.text: "\"Als ik dit weekend doorwerk, kan het dan maandagochtend live, zodat we de release van vandaag niet hoeven te veranderen?\""
ask.weekend.why: "Zwak. Je weekend aanbieden verbergt de echte kosten, schept een verwachting voor de volgende keer, en levert nog steeds ongeteste geldcode op."
offer.prompt.1: "Daan: \"Marketing heeft het beloofd in de nieuwsbrief van maandag, om 9:00: klanten kunnen betalen met een cadeaukaart. Kaart checken, betalen, alles.\""
offer.prompt.2: "\"Dus? Vandaag?\""
offer.slice.text: "\"Niet vandaag. Maandag 8:30: een klein stuk op het kant-en-klare component van de provider, achter een flag. Niet klaar? Dan zegt marketing 'binnenkort'.\""
offer.slice.why: "Goed. Je onderhandelt over scope (alleen volledige betalingen, op het kant-en-klare component van de provider, terugbetalen op de kaart: uren werk, geen dagen) en risico (een aparte release met een flag in plaats van een wijziging op het laatste moment), en je hebt een plan B. Daan krijgt het meeste van wat hij nodig heeft, en de release van 16:00 gaat live zoals hij getest is."
offer.yes.text: "\"Oké, ik voeg het veld nu toe. De provider doet het moeilijke werk toch, en als er dit weekend iets stukgaat, draaien we de release gewoon terug.\""
offer.yes.why: "Zwak. Een half uur voor ongeteste betaalcode, in een release die een half uur later live gaat zonder dat er nog iemand oplet: het recept voor een incident in het weekend. En een rollback haalt de geteste checkoutpagina dan ook weg."
offer.no.text: "\"Nee. Het staat niet in deze sprint, en wijzigingen na de cutoff moeten eerst door refinement en planning.\""
offer.no.why: "Half goed. Het beschermt de release, maar een kaal nee met een procesreden helpt niemand met de nieuwsbrief. Goed nee zeggen is aanbieden wat wél kan."
offer.postpone.text: "\"Laten we de release van vandaag naar maandag schuiven en alles samen doen, zodat marketing alles tegelijk heeft en we niet op vrijdag deployen.\""
offer.postpone.why: "Half goed. Je voorkomt een deploy op vrijdag, maar je houdt werk tegen dat klaar en getest is, en je bundelt twee wijzigingen in één grotere release die lastiger terug te draaien is. Kleinere releases zijn veiliger."
size.prompt.1: "Daan: \"En de volledige versie, met deelbetalingen, terugbetalingen en e-mails? Hoe lang?\""
size.prompt.2: "De meest vergelijkbare feature van je team, kortingscodes, kostte 6 werkdagen bouwen plus 2 dagen testen."
size.working: "Uitwerking: schat met een vergelijking. Kortingscodes kostten 6 + 2 = 8 werkdagen, en cadeaukaarten raken dezelfde checkout, dus begin bij zo'n 8 dagen: ongeveer twee weken. Terugbetalen op een tegoed is nieuw, dus schat eerder hoog dan laag. Geef Daan een bandbreedte, 'ongeveer twee weken, misschien drie', en noem wat het langer kan maken."
size.hours.text: "minder dan een dag: het is één veldje"
size.hours.why: "Veel te laag. 'Eén veldje' is het zichtbare deel; de betaallogica, de terugbetalingen en de tests erachter zijn het echte werk."
size.days.text: "1 tot 3 werkdagen"
size.days.why: "Te laag. De meest vergelijkbare feature kostte 8 werkdagen. Zonder reden waarom cadeaukaarten veel simpeler zijn, vertrouw je de vergelijking meer dan je optimisme."
size.weeks.text: "4 tot 15 werkdagen"
size.weeks.why: "Goed: rond de 8 werkdagen, ongeveer twee weken, misschien iets meer door de terugbetalingen."
size.months.text: "16 werkdagen of meer"
size.months.why: "Te pessimistisch voor wat je weet: de meest vergelijkbare feature kostte 8 dagen. Marge nemen is eerlijk als er echte onbekenden zijn, maar noem ze dan in plaats van gewoon te verdubbelen."
testing.prompt.1: "Daan: \"Om maandag tijd te winnen, slaan we ons eigen testen over. Zo zie ik het:\""
testing.prompt.2: "\"Logisch toch?\""
testing.proposal.1: "De betaalprovider heeft zijn cadeaukaart-API helemaal getest."
testing.proposal.2: "Dus kunnen we live zonder het zelf te testen."
testing.integration.text: "De provider heeft zijn API getest, niet hoe wij hem gebruiken: deelbedragen, terugbetalingen, dubbel afschrijven bij retries."
testing.integration.why: "Goed. De bugs zitten in de koppeling: hoe wij afronden, wat we doen bij een timeout, of een retry twee keer afschrijft. Dat kan de provider niet voor ons testen."
testing.process.text: "Ons proces zegt dat elke wijziging door QA moet voor de release, en een uitzondering voor één feature ondermijnt het hele proces."
testing.process.why: "Half goed. Klopt, maar een regel is een zwak argument richting een stakeholder. Noem liever het risico: verkeerde terugbetalingen en dubbele afschrijvingen kosten geld en vertrouwen."
testing.down.text: "De API van de provider ligt maandag misschien plat."
testing.down.why: "Zwak. Beschikbaarheid is een ander probleem; testen voorkomt geen storing. Het is een goede reden voor een terugvaloptie, geen antwoord op 'waarom testen?'"
testing.trust.text: "Prima: de provider is een groot, gecertificeerd bedrijf."
testing.trust.why: "Zwak. Hun kunde dekt alleen hun kant. Onze code die hen aanroept, is nieuw en ongetest."
rollout.prompt.1: "Maandagochtend, de kleinere versie is gebouwd. Daan: \"Hoe krijg je het veilig live voor negenen?\" Zet de stappen op volgorde."
rollout.ci.text: "De volledige CI-pipeline op de release draaien."
rollout.ci.why: "Eerst testen: er gaat niets naar productie wat de pipeline niet heeft doorstaan."
rollout.deploy.text: "Naar productie deployen met de cadeaukaart-flag uit."
rollout.deploy.why: "Donker deployen. De code staat live maar uit, dus de deploy verandert zelf niets voor klanten en kan los worden teruggedraaid."
rollout.staff.text: "De flag alleen voor medewerkers aanzetten en een echte testaankoop doen."
rollout.staff.why: "Probeer het in productie, met echt geld, op jezelf. Een testomgeving is nooit precies gelijk aan productie."
rollout.canary.text: "Aanzetten voor 5% van de klanten en fouten en geslaagde betalingen in de gaten houden."
rollout.canary.why: "Een canary: een klein deel van het echte verkeer, met de dashboards open. Een probleem raakt weinig klanten, en de flag zet het meteen weer uit."
rollout.everyone.text: "Aanzetten voor iedereen."
rollout.everyone.why: "Iedereen, als de canary er gezond uitziet."
rollout.cleanup.text: "De flag uit de code halen als het een tijdje stabiel draait."
rollout.cleanup.why: "Opruimen. Oude flags stapelen zich op tot verwarrende dode code; ze weghalen hoort bij de feature."
pushback.prompt.1: "8:30. De testaankoop door medewerkers laat een bug zien: terugbetalingen gaan naar de bankkaart van de klant in plaats van terug op de cadeaukaart, zoals afgesproken."
pushback.prompt.2: "Daan: \"Zet het toch maar aan! De nieuwsbrief gaat om negen uur de deur uit!\""
pushback.hold.text: "De flag uit laten. Daan helder vertellen wat er misgaat, wanneer je een fix verwacht, en de 'binnenkort'-zin voorstellen."
pushback.hold.why: "Goed. Heldere feiten (terugbetalingen zouden cadeaukaarttegoed in contant geld omzetten), een nieuwe schatting en het plan B dat je vrijdag afsprak. Goed nee zeggen is nee zeggen tegen het risico, niet tegen Daan: hij kan nog steeds een nieuwsbrief sturen."
pushback.ship.text: "Aanzetten: terugbetalingen zijn zeldzaam in de eerste dagen na een lancering, en de fix kan later vandaag volgen voordat iemand erom vraagt."
pushback.ship.why: "Zwak. Elke terugbetaling zet cadeaukaarttegoed om in geld op een bankkaart, en dat krijg je lastig terug. Zeldzaam is niet nooit, en een nieuwsbrief maakt het minder zeldzaam."
pushback.manual.text: "Aanzetten en de paar terugbetalingen met de hand corrigeren tot de fix live is, zodat marketing zijn belofte houdt en klanten niets merken."
pushback.manual.why: "Half goed, en er valt over te twisten. Sommige teams accepteren een handmatige workaround voor een zeldzaam geval, maar alleen als de eigenaar van het risico (finance) akkoord is, het om heel weinig gevallen gaat en iemand het echt bijhoudt. Dat besluit je niet alleen om 8:30."
pushback.silent.text: "Weigeren, en stil blijven tot het gefixt is."
pushback.silent.why: "Zwak. Als je stil wordt, moet hij gissen, en belooft hij marketing misschien dingen die jij niet kunt waarmaken. Onder druk communiceer je meer, niet minder."
hint.ask: "Voordat je ja of nee zegt: zoek uit wat 'één veldje' echt inhoudt en waarom het vandaag moet."
hint.offer: "Het beste antwoord op 'lukt X voor Y?' is vaak: 'dit kleinere deel lukt dan, en dit is plan B'."
hint.rollout: "Donker live zetten, op jezelf proberen, dan op een paar klanten, dan op iedereen."
hint.calm: "Daan is de vijand niet; hij heeft ook een deadline. Zoek de versie van ja die klanten niet in gevaar brengt."
won.1: "Daan zucht en glimlacht dan. \"Kleinere scope, een flag en een plan B voor marketing. Goed dan. Fijn weekend.\""
lost.1: "Daan loopt weg om iemand te zoeken die wel ja zegt. Laten we dat gesprek opnieuw doen; de uitleg laat zien waar het misging."
