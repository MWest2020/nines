title: "Friday, 15:30"
summary: "Daan, the product manager, wants one more thing in today's release. It's just one field, he says."
offer.1: "Daan, product. Got a minute? It's about today's release. Small thing."
offer.2: "Well. Small-ish. Meeting room?"
active.1: "The meeting room is free. Bring your calendar and your backbone."
done.1: "OK, I'll admit it: Monday with a flag beat Friday with a prayer."
npc.name: "Daan"
npc.idle: "Every feature is small when you don't have to build it. I'm learning."
npc.after: "Marketing liked the plan B. Who knew a fallback line could save a newsletter."
attacker: "Daan · product manager"
intro.1: "Incoming: Daan, product manager. \"Got a minute?\""
intro.2: "Friday, 15:30. The release with the new checkout page goes out at 16:00. Daan pulls up a chair: \"Can we add gift cards to today's release? It's just one field.\""
ask.prompt.1: "\"It's just one field. Can you do it?\" You get two questions before you answer. Which two?"
ask.why.text: "\"What does it solve, and what happens if it goes live on Monday instead of today?\""
ask.why.why: "Best. It finds the real deadline and the real value. 'Today' often turns out to mean 'before Monday's newsletter', which changes everything."
ask.scope.text: "\"Does 'one field' include checking the card with the provider, partial payments, refunds and the e-mails?\""
ask.scope.why: "Best. It uncovers the scope hiding behind 'one field'. Money features are never one field: validation, partial payments and refunds are where the bugs live."
ask.provider.text: "\"Which payment provider handles gift cards?\""
ask.provider.why: "Half right. A fair technical question, but too early: first understand what is needed and why, then how."
ask.who.text: "\"Who approved this?\""
ask.who.why: "Weak. It sounds defensive and tells you nothing about the problem. If priorities clash, raise that once you understand the request."
ask.weekend.text: "\"Can I work this weekend to make it happen?\""
ask.weekend.why: "Weak. Volunteering your weekend hides the real cost, sets an expectation for next time, and still ships untested money code."
offer.prompt.1: "Daan: \"Marketing promised it in Monday's newsletter, at 9:00: customers can pay with gift cards. Checking the card, paying, the works.\""
offer.prompt.2: "\"So? Today?\""
offer.slice.text: "\"Not in today's release. On Monday morning I can ship a smaller version: gift cards for full payments only, behind a feature flag, tested. If it isn't ready by 8:30, marketing uses a 'coming soon' line.\""
offer.slice.why: "Best. It negotiates scope (a smaller slice) and risk (a separate, flagged release instead of a Friday change), and it comes with a plan B. Daan gets most of what he needs, and the 16:00 release ships as tested."
offer.yes.text: "\"Sure, I'll squeeze it in before four.\""
offer.yes.why: "Weak. Thirty minutes for untested payment code, deployed on a Friday afternoon just before everyone leaves: the classic recipe for a weekend incident."
offer.no.text: "\"No. It's not in the sprint.\""
offer.no.why: "Half right. It protects the release, but a bare no with a process reason helps nobody with the newsletter. Saying no well means offering what you can do instead."
offer.postpone.text: "\"Let's move today's release to Monday and ship both together.\""
offer.postpone.why: "Half right. It avoids a Friday deploy, but it delays work that is ready and tested, and it bundles two changes into one bigger release that is harder to roll back. Smaller releases are safer."
size.prompt.1: "Daan: \"And the full version, with partial payments, refunds and e-mails? How long?\""
size.prompt.2: "Your team's most similar feature, discount codes, took 6 working days to build plus 2 days of testing."
size.working: "Working: estimate by analogy. Discount codes took 6 + 2 = 8 working days, and gift cards touch the same checkout, so start from about 8 days: roughly two weeks. Refunds onto a balance are new, so lean to the high side. Give Daan a range, 'about two weeks, maybe three', and name what could make it longer."
size.hours.text: "a few hours: it's one field"
size.hours.why: "Far too low. 'One field' is the visible part; the payment logic, the refunds and the tests behind it are the real work."
size.days.text: "1 to 3 working days"
size.days.why: "Too low. The most similar feature took 8 working days. Without a reason why gift cards are much simpler, trust the analogy over optimism."
size.weeks.text: "4 to 15 working days (about 1 to 3 weeks)"
size.weeks.why: "Right: around 8 working days, roughly two weeks, maybe a bit more because of the refunds."
size.months.text: "more than 15 working days"
size.months.why: "Too pessimistic for what you know: the most similar feature took 8 days. Padding is honest when there are real unknowns, but then name them instead of just doubling."
testing.prompt.1: "Daan: \"To save time on Monday, let's skip our own testing. Here's my reasoning:\""
testing.prompt.2: "\"Makes sense, right?\""
testing.proposal.1: "The payment provider has fully tested their gift card API."
testing.proposal.2: "So we can go live without testing it ourselves."
testing.integration.text: "The provider tested their API, not our use of it: partial amounts, refunds to the right card, double charges when a request is retried. Money paths need our own tests."
testing.integration.why: "Best. The bugs live in the integration: how we round, what we do on a timeout, whether a retry charges twice. The provider cannot test that for us."
testing.process.text: "Our process says every change must be tested."
testing.process.why: "Half right. True, but a rule is a weak argument with a stakeholder. Name the risk instead: wrong refunds and double charges cost money and trust."
testing.down.text: "The provider's API might be down on Monday."
testing.down.why: "Weak. Availability is a different problem; testing does not prevent an outage. It is a good reason to have a fallback, not an answer to 'why test?'"
testing.trust.text: "Fine: the provider is a big company, they know what they're doing."
testing.trust.why: "Weak. Their competence covers their side only. Our code that calls them is new and untested."
rollout.prompt.1: "Monday morning, the smaller version is built. Daan: \"How do you get it live safely before nine?\" Put the steps in order."
rollout.ci.text: "Run the full CI pipeline on the release."
rollout.ci.why: "Tests first: nothing goes to production that the pipeline has not passed."
rollout.deploy.text: "Deploy to production with the gift card flag off."
rollout.deploy.why: "Deploy dark. The code is live but switched off, so the deploy itself changes nothing for customers and can be rolled back on its own."
rollout.staff.text: "Turn the flag on for staff only and make a real test purchase."
rollout.staff.why: "Try it in production, with real money, on yourselves. Staging never matches production exactly."
rollout.canary.text: "Turn it on for 5% of customers and watch errors and payment success."
rollout.canary.why: "A canary: a small share of real traffic, with the dashboards open. A problem hits few customers, and the flag turns it off at once."
rollout.everyone.text: "Turn it on for everyone."
rollout.everyone.why: "Everyone, once the canary looks healthy."
rollout.cleanup.text: "Remove the flag from the code once it has been stable for a while."
rollout.cleanup.why: "Clean up. Old flags pile up into confusing dead code; removing them is part of the feature."
pushback.prompt.1: "8:30. The staff test purchase shows a bug: refunds go to the customer's bank card instead of back onto the gift card."
pushback.prompt.2: "Daan: \"Turn it on anyway! The newsletter goes out at nine!\""
pushback.hold.text: "Keep the flag off. Tell Daan plainly what breaks (refunds pay out real money for gift card balance), when you expect a fix, and suggest the 'coming soon' line for the newsletter."
pushback.hold.why: "Best. Clear facts, a new estimate and the fallback you agreed on Friday. Saying no well is saying no to the risk, not to Daan: he can still send a newsletter."
pushback.ship.text: "Turn it on; refunds are rare."
pushback.ship.why: "Weak. Each refund pays out money that was never paid in, and that is hard to claw back. Rare is not never, and a newsletter makes it less rare."
pushback.manual.text: "Turn it on and fix the refunds by hand for now."
pushback.manual.why: "Half right, and debatable. Some teams do accept a manual workaround for a rare case, but only when the owner of the risk (finance) agrees, the volume is tiny and someone actually watches. That is not your call alone at 8:30."
pushback.silent.text: "Refuse, and stop answering Daan until it is fixed."
pushback.silent.why: "Weak. Going silent leaves him guessing, and promising things you can't keep. Under pressure, communicate more, not less."
hint.ask: "Before you say yes or no, find out what 'one field' really contains and why it has to be today."
hint.offer: "The best answer to 'can you do X by Y?' is often 'I can do this smaller part by then, and here is plan B'."
hint.rollout: "Ship dark, try it on yourselves, then on a few customers, then on everyone."
hint.calm: "Daan is not the enemy; he has a deadline too. Look for the version of yes that doesn't put customers at risk."
won.1: "Daan sighs, then smiles. \"Smaller scope, a flag and a plan B for marketing. Fine. Have a good weekend.\""
lost.1: "Daan walks off to find someone who will say yes. Let's replay that conversation; the explanations show where it slipped."
