title: "Het Senior-gesprek: kaartverkoop"
summary: "Noor, principal engineer op de Seniortop, vraagt je de kaartverkoop voor een stadiontour te ontwerpen zonder ooit één stoel twee keer te verkopen."
offer.1: "Ik ben Noor. Ik leid hier boven de designreviews, en elke senior staat één keer aan mijn whiteboard."
offer.2: "Het onderwerp van vandaag is binnen minuten uitverkocht en haalt het nieuws als het misgaat. Zullen we?"
active.1: "Eén regel gaat boven alles: geen stoel wordt ooit twee keer verkocht. Kom er steeds op terug."
done.1: "Goede sessie. Je hield de invariant in de database en de drukte erbuiten. Dat is het vak."
npc.name: "Noor"
npc.idle: "Ooit 400.000 mensen om 10:00 op één knop zien drukken? Ik wel. Kom naar mijn whiteboard."
npc.after: "Contention, geen throughput. Denk daaraan als iemand weer een grotere server wil."
attacker: "Noor · principal engineer"
intro.1: "Whiteboardgesprek · Onderwerp: kaartverkoop"
intro.2: "Noor schuift een poster over tafel: een stadiontour, kaartverkoop zaterdag om 10:00. \"Ontwerp het boekingssysteem. Eén regel gaat boven alles: geen stoel wordt ooit twee keer verkocht.\""
clarify.prompt.1: "\"Je krijgt twee vragen voordat je gaat tekenen. Welke twee?\""
clarify.seats.text: "\"Genummerde stoelen of vrije plaatsen, en hoeveel stoelen mag één bestelling bevatten?\""
clarify.seats.why: "Goed. Dit bepaalt het datamodel. Bij genummerde stoelen is elke stoel een eigen record waar precies één koper om moet winnen; vrije plaatsen zijn een voorraadteller die je verlaagt, met alle contention op één getal. Het aantal stoelen per bestelling bepaalt of één claim meerdere stoelen tegelijk moet pakken, alles of niets."
clarify.demand.text: "\"Hoeveel kopers verwachten we in de eerste minuten, tegenover hoeveel stoelen?\""
clarify.demand.why: "Goed. De verhouding tussen kopers en stoelen stuurt het ontwerp: 400.000 mensen voor 50.000 stoelen betekent dat de meeste pogingen verliezen. Je hebt dus een wachtrij ervoor nodig en een claim die snel faalt, niet meer throughput erachter."
clarify.checkout.text: "\"Hoe lang doet een koper gemiddeld over het kiezen van stoelen tot een bevestigde betaling?\""
clarify.checkout.why: "Half goed. Het bepaalt hoe lang een reservering geldig blijft, dus je hebt het nodig, maar de reservering werkt met elke duur hetzelfde. Stel deze vraag als je de vorm van de voorraad en de omvang van de drukte kent; die veranderen de architectuur."
clarify.provider.text: "\"Met welke betaalprovider koppelen we?\""
clarify.provider.why: "Zwak. Een integratiedetail: de grote providers ondersteunen idempotency keys en asynchrone bevestigingen, dus het ontwerp eromheen is hetzelfde. Welke betaalmethodes je accepteert doet er later toe, niet wiens API."
clarify.nosql.text: "\"Mag ik de stoelen in een NoSQL-store zetten, zodat de stoelentabel kan uitschalen?\""
clarify.nosql.why: "Zwak, als eerste vraag. Je kiest een tool voordat je de eisen kent, en volume is niet het moeilijke deel: 50.000 stoelen passen in elke database. Het moeilijke deel is een claim die precies één koper wint, en daarvoor heb je een conditionele write nodig, in welke store dan ook."
hold.prompt.1: "\"Genummerde stoelen, maximaal 6 per bestelling, 400.000 kopers voor 50.000 stoelen. Afrekenen duurt een paar minuten, dus we reserveren stoelen voor 10.\""
hold.prompt.2: "\"Waar staat een reservering, en waardoor verloopt hij?\""
hold.row.text: "In het record van de stoel: status, reserverings-id en expires_at volgens de databaseklok; een claim ziet een verlopen reservering als vrij en wacht nooit op een opruimjob."
hold.row.why: "Goed. Verlopen is een vergelijking op het moment van claimen (expires_at < now()), dus de correctheid hangt nooit af van een timer of job die op tijd draait, en één klok, die van de database, voorkomt klokverschillen tussen appservers (now() is het begin van de transactie, dus houd de claim één kort statement). De reservering staat naast de verkoop, dus er tickets van maken is één transactie op dezelfde rijen. Een opruimjob zet alleen oude rijen terug voor zaalkaarten en rapportages."
hold.cron.text: "In het record van de stoel, met een status; een job draait elke minuut en geeft reserveringen ouder dan 10 minuten vrij, zodat een claim alleen naar vrije stoelen kijkt."
hold.cron.why: "Half goed. Het werkt, maar de correctheid hangt nu af van de job: een stoel blijft tot een minuut na het einde van zijn reservering onverkoopbaar, en als de job vastloopt of achterraakt in de drukste minuten van het jaar, bevriest de voorraad. Laat de claim verlopen reserveringen als vrij zien en houd de job alleen voor het opruimen."
hold.redis.text: "Een key per stoel in Redis met een TTL van 10 minuten, alleen gezet als hij nog niet bestaat; verdwijnt de key, dan is de stoel weer vrij. De database bewaart alleen betaalde tickets."
hold.redis.why: "Half goed, en er valt over te twisten: veel echte systemen doen dit. SET met NX en een TTL is een prima reservering en ontlast de database. Maar reservering en verkoop staan nu in twee stores: een Redis-failover met asynchrone replicatie kan keys kwijtraken, dus twee kopers kunnen één stoel reserveren en betalen. Het is alleen veilig als de database het laatste woord houdt (een unique constraint op het ticket) en er een terugbetaalpad is."
hold.timer.text: "In de appserver die de reservering maakte: die start per reservering een timer van 10 minuten en geeft de stoelen vrij als die afloopt."
hold.timer.why: "Zwak. De timer leeft en sterft met één proces: een deploy of crash tijdens de verkoop laat die stoelen voor altijd gereserveerd, en niets geeft ze vrij. Timers kunnen onder last ook te laat afgaan. Verlopen moet data zijn, een deadline die bij de reservering staat, geen callback."
hold.cart.text: "In de sessie van de koper: de zaalkaart maakt stoelen in iemands winkelwagen grijs, en de server controleert bij het betalen of ze nog vrij zijn."
hold.cart.why: "Zwak. Dat is helemaal geen reservering: twee kopers kunnen elk tien minuten bezig zijn met afrekenen voor dezelfde stoel, en de verliezer merkt het pas bij het betalen. Grijze stoelen zijn weergave; alleen een write op de server claimt een stoel."
race.prompt.1: "Noor tekent de claimcode van een collega. \"Twee kopers, dezelfde stoel, dezelfde milliseconde. Wat gaat er mis?\""
race.proposal.1: "1. SELECT state FROM seats WHERE seat_id = ?   geeft 'free'"
race.proposal.2: "2. Als hij vrij is: UPDATE seats SET state = 'held', hold_id = ? WHERE seat_id = ?"
race.proposal.3: "3. Allebei in één transactie op READ COMMITTED, de standaard van PostgreSQL."
race.both.text: "Beiden kunnen 'free' lezen voordat een van hen schrijft; de tweede UPDATE wacht dan, matcht alleen op seat_id en overschrijft ongemerkt de eerste reservering."
race.both.why: "Goed. Op READ COMMITTED neemt een gewone SELECT geen lock, dus beiden zien 'free'. In PostgreSQL wacht de tweede UPDATE op de rijlock tot de eerste commit, en controleert dan alleen zijn eigen WHERE, seat_id = ?, die nog steeds klopt. Hij overschrijft dus de eerste reservering: twee kopers denken allebei dat ze de stoel hebben. Zet de voorwaarde in de write (WHERE state = 'free' ...) en controleer dat er één rij veranderde, of lock de rij met SELECT ... FOR UPDATE."
race.atomic.text: "Niets: één transactie maakt het lezen en schrijven atomair. Het enige nadeel is twee roundtrips, en een stored procedure maakt daar één van."
race.atomic.why: "Zwak. Atomair betekent alles of niets, niet geïsoleerd van andere transacties. READ COMMITTED staat precies deze interleaving toe, en de twee statements in een stored procedure zetten houdt dezelfde race."
race.expired.text: "Een verlopen reservering telt niet als vrij: een stoel waarvan de 10 minuten om zijn, leest nog 'held', dus hij blijft onverkoopbaar."
race.expired.why: "Half goed. Een echt gat: een claim moet een gereserveerde stoel waarvan expires_at voorbij is als vrij behandelen. Maar een stoel die vastzit kost één verkoop, terwijl de race één stoel twee keer verkoopt, en dat breekt de ene regel."
race.serializable.text: "Het isolatieniveau: alleen SERIALIZABLE houdt deze interleaving tegen, dus de oplossing is dat verhogen en meer afgebroken transacties accepteren."
race.serializable.why: "Half goed. Je ziet de race, maar SERIALIZABLE is niet de enige oplossing en zelden de goedkoopste: in PostgreSQL laat zelfs REPEATABLE READ de tweede update falen met een serialisatiefout, en een conditionele UPDATE lost het op het standaardniveau op, zonder retries. De echte fout is beslissen in de applicatie op basis van een waarde die eerder gelezen is."
claim.prompt.1: "\"10:00:00. Duizenden kopers klikken in dezelfde seconde op hetzelfde blok op de eerste rij.\""
claim.prompt.2: "\"Hoe claim je stoelen zodat er geen twee keer verkocht wordt, en waarom zo onder deze last?\""
claim.conditional.text: "Eén conditionele UPDATE per bestelling op stoelen die vrij of verlopen zijn; controleer het aantal rijen. Verliezers horen meteen 'bezet'."
claim.conditional.why: "Goed. Controle en write zijn één statement in een korte transactie zonder roundtrip naar de applicatie, dus de rijlock duurt microseconden en een verliezer hoort meteen dat de stoel weg is. Bij meerdere stoelen moet het aantal gewijzigde rijen gelijk zijn aan het aantal gevraagde, anders rollback; lock eerst op volgorde van stoel-id (een sub-select met ORDER BY seat_id FOR UPDATE) of probeer opnieuw bij een deadlock, want één UPDATE belooft geen volgorde. Een unieke sleutel op (evenement, stoel) in de tickettabel is de laatste verdedigingslinie."
claim.forupdate.text: "SELECT ... FOR UPDATE op de gekozen stoelen, dan in dezelfde transactie bijwerken: de rijlock zet de kopers van elke stoel een voor een in de rij."
claim.forupdate.why: "Half goed. Correct, en het klassieke antwoord. Maar bij een hete verkoop staat iedereen die een stoel op de eerste rij wil in de rij voor de lock, alleen om te horen dat hij weg is. Verbindingen stapelen zich op in de pool, en een lock die over roundtrips van de applicatie heen wordt vastgehouden, rekt uit. Met meerdere stoelen moet je in een vaste volgorde locken, anders deadlock. NOWAIT, of SKIP LOCKED voor 'een willekeurige stoel in dit blok', maakt er een snel antwoord van."
claim.version.text: "Optimistic concurrency: lees elke stoel met zijn versienummer, werk alleen bij waar de versie nog klopt, en probeer anders de hele flow opnieuw."
claim.version.why: "Half goed. Correct, en de beste keuze als conflicten zeldzaam zijn. Op een hete stoel conflicteert bijna elke poging, en opnieuw proberen is verspild werk omdat de stoel weg is: er valt niets opnieuw te proberen. Een conditionele UPDATE is hetzelfde idee zonder de aparte read."
claim.writer.text: "Zet elke claim voor het evenement op één wachtrij met één consumer die ze op volgorde verwerkt: met maar één schrijver kan er niets racen."
claim.writer.why: "Half goed, en verdedigbaar: één schrijver per evenement haalt races er per ontwerp uit en kan in geheugen erg snel zijn. Maar de koper wacht nu op een asynchroon antwoord, de consumer is een single point of failure die failover nodig heeft zonder een claim twee keer toe te passen, en je bouwt de concurrency control van de database zelf na."
claim.redlock.text: "Een Redis-lock per stoel, SET NX met een TTL, rond het lezen en schrijven, zodat de database geen speciale statements en geen rijlocks nodig heeft."
claim.redlock.why: "Zwak, en de discussie is bekend: een proces dat langer pauzeert dan de TTL van zijn lock (garbage collection, een traag netwerk) schrijft nog nadat een andere koper de lock kreeg, tenzij de store een fencing token controleert. De conditionele write in de database moet de bron van waarheid blijven; een lock ervoor kan de database ontlasten, maar de correctheid mag er niet van afhangen."
retry.prompt.1: "\"De koper tikt op 'Bevestigen en betalen'. De call krijgt na 30 seconden een timeout, en de app probeert het opnieuw.\""
retry.prompt.2: "\"Hoe zorg je dat niemand twee keer betaalt of twee boekingen krijgt?\""
retry.key.text: "Een idempotency key per bevestiging: gemaakt door de app, bij elke retry opnieuw meegestuurd, opgeslagen met de uitkomst, doorgegeven aan de provider."
retry.key.why: "Goed. Een retry met dezelfde key krijgt de opgeslagen uitkomst terug in plaats van alles opnieuw te draaien, en de provider ontdubbelt de betaling op dezelfde key. Leg de key eerst vast onder een unique constraint, in een korte transactie die hem op 'bezig' zet, zodat een gelijktijdige retry wacht of 'bezig' hoort; de uitkomst komt op die rij in de transactie die de tickets maakt. Een timeout betekent 'onbekend', niet 'mislukt'."
retry.check.text: "Kijk voor het afschrijven of deze bestelling al een geslaagde betaling heeft, en geef in dat geval die boeking terug in plaats van opnieuw af te schrijven."
retry.check.why: "Half goed. Het vangt een retry die binnenkomt nadat de eerste poging klaar is. Maar twee gelijktijdige pogingen zien allebei geen betaling en schrijven allebei af, en de betaling die een timeout kreeg kan gelukt zijn zonder dat hij al is vastgelegd. Check-then-act heeft een unieke key nodig om veilig te zijn."
retry.holdkey.text: "Gebruik het id van de reservering als idempotency key: één reservering is één keer afrekenen, dus een retry komt uit bij dezelfde betaling."
retry.holdkey.why: "Half goed. Dichtbij: het koppelt retries aan één keer afrekenen. Maar een key speelt zijn eerste uitkomst opnieuw af: na een geweigerde kaart krijgt een nieuwe poging met een andere kaart onder dezelfde reservering de opgeslagen weigering terug. Een key per bevestiging, gemaakt door de app, past beter: een nieuwe kaart is een nieuwe bevestiging."
retry.fresh.text: "De server maakt voor elk binnenkomend request een nieuwe idempotency key en slaat die op bij de betaling, zodat elke afschrijving te herleiden is."
retry.fresh.why: "Zwak. Een key die bij elk request verandert, ontdubbelt niets: de retry lijkt nieuw. De key moet uit de bedoeling van de koper komen, één keer gemaakt vóór de eerste poging."
retry.noretry.text: "Probeer een betaling nooit automatisch opnieuw: toon een foutmelding en laat de koper beslissen of hij het nog eens probeert, eventueel met andere gegevens."
retry.noretry.why: "Zwak. De koper probeert het dan met de hand opnieuw, en dat is dezelfde dubbele betaling, alleen zonder key. Een timeout betekent niet dat de betaling mislukte; het betekent dat je het nog niet weet."
confirm.prompt.1: "\"Zet de stappen van 'bevestigen en betalen' op volgorde, zodat geen stoel twee keer verkocht wordt en geen betaling eindigt zonder ticket of zonder het geld terug.\""
confirm.key.text: "Leg de idempotency key vast (insert, uniek); heeft die al een uitkomst, geef die terug en stop"
confirm.key.why: "Eerst, samen met het op 'betalen' zetten van de reservering. Een retry moet de eerdere poging vinden voordat er geld beweegt; heeft de key al een uitkomst, dan draait niets hieronder opnieuw."
confirm.extend.text: "Zet de reservering op 'betalen' met een langere deadline, zodat hij niet halverwege de betaling verloopt"
confirm.extend.why: "Eerst, samen met het opzoeken van de key. Het is een conditionele write die alleen slaagt zolang de reservering nog van deze koper is: vanaf hier kan een trage betaling de stoelen niet meer naar een ander laten gaan. Mislukt hij, dan is de reservering weg en is er nog geen geld bewogen."
confirm.authorise.text: "Vraag de provider het bedrag te autoriseren, met de idempotency key"
confirm.authorise.why: "Daarna. Autoriseren reserveert het bedrag zonder het af te schrijven, dus als de stoelen toch weg blijken, kost annuleren niets: de koper ziet hooguit een openstaand bedrag dat verdwijnt, nooit een afschrijving gevolgd door een terugbetaling."
confirm.commit.text: "In één transactie: maak tickets van de stoelen als de reservering nog van deze koper is, en sla de uitkomst op onder de key"
confirm.commit.why: "Dan het moment van de waarheid. De tickets en de opgeslagen uitkomst committen samen, bewaakt door dezelfde voorwaarde als elke claim, met de unieke sleutel op (evenement, stoel) als laatste verdedigingslinie."
confirm.capture.text: "Schrijf de geautoriseerde betaling af, of annuleer hem als de transactie mislukte"
confirm.capture.why: "Pas als de tickets bestaan, neem je het geld. Mislukte de transactie, annuleer dan de autorisatie: de koper betaalt nooit voor stoelen die hij niet kreeg."
confirm.mail.text: "Mail de tickets"
confirm.mail.why: "Als laatste. Een mail kun je niet terugnemen, dus die gaat pas weg als alles wat hij belooft waar is. Verstuur hem via een wachtrij, zodat een mailstoring de boeking niet laat mislukken."
late.prompt.1: "\"Het gebeurt toch: een betaalmethode zonder aparte autorisatie, en de webhook meldt dat de betaling 40 seconden na het verlopen van de reservering gelukt is. De stoel is al van iemand anders.\""
late.prompt.2: "\"Wat nu?\""
late.refund.text: "De stoel blijft van de tweede koper. Betaal de eerste terug of bied een vergelijkbare stoel aan, en laat het direct weten."
late.refund.why: "Goed. De invariant wint: de claim van de tweede koper is geldig en blijft staan. Terugbetalen is goedkoop vergeleken met twee mensen op één stoel bij de ingang. Een vergelijkbare stoel aanbieden houdt de verkoop, en het alarm is belangrijk: een stijgend aantal betekent dat reserveringen te kort zijn of betalingen te traag."
late.first.text: "Geef de stoel aan de eerste koper: die heeft betaald, terwijl de tweede hem misschien alleen gereserveerd heeft, dus de eerste betaling weegt zwaarder."
late.first.why: "Zwak. Het breekt de ene regel van de andere kant: de tweede koper heeft misschien al een ticket, en de reservering verliep omdat de eerste betaling te laat kwam. Haal een stoel nooit weg bij een geldige claim."
late.longttl.text: "Voorkom het: laat elke reservering zo lang duren als de traagste betaling kan duren, zeg 30 minuten, zodat een betaling binnen zijn reservering valt."
late.longttl.why: "Half goed. Het gebeurt minder vaak, maar het legt voorraad een half uur vast per afgebroken bestelling, tijdens de heetste verkoop van het jaar, en webhooks kunnen nog later komen: providers proberen het uren of dagen opnieuw. Je hebt het terugbetaalpad nog steeds nodig."
late.overbook.text: "Verkoop per evenement een kleine marge extra tickets, zoals luchtvaartmaatschappijen doen, zodat de no-shows deze zeldzame gevallen opvangen."
late.overbook.why: "Zwak. Luchtvaartmaatschappijen overboeken omdat ze weten dat sommige passagiers niet komen, en boeken om of compenseren bij de gate. Bij genummerde concertstoelen betekent het twee mensen met een ticket voor één stoel: het breekt de invariant expres."
peak.prompt.1: "\"Even rekenen. 400.000 mensen komen in de eerste minuut binnen. Zonder wachtrij laadt ieder de zaalkaart één keer en probeert in die minuut twee keer stoelen te reserveren.\""
peak.prompt.2: "\"Hoeveel requests per seconde krijgt de boekingsservice ongeveer te verwerken?\""
peak.working: "Uitwerking: 400.000 mensen × 3 requests (één zaalkaart, twee reserveringspogingen) = 1,2 miljoen requests in 60 seconden, zo'n 20.000 per seconde, en de eerste seconden zijn erger. Het nuttige werk: 50.000 stoelen à zo'n 2 per bestelling is 25.000 bestellingen; uitverkocht in 10 minuten is zo'n 40 boekingen per seconde. De meeste pogingen verliezen een race, dus het probleem is contention en toelating, niet throughput: een wachtrij laat kopers binnen in het tempo dat het claimpad aankan, en de zaalkaart mag uit een cache komen die even achterloopt, want alleen de conditionele write beslist."
peak.under.text: "minder dan 500 per seconde"
peak.under.why: "Te laag. Dat zit dichter bij de boekingen die slagen, zo'n 40 per seconde, dan bij de pogingen: 400.000 mensen in één minuut is al zo'n 6.700 per seconde, nog voordat je telt wat ieder doet."
peak.low.text: "500 tot 2.000 per seconde"
peak.low.why: "Te laag. Verdeelde je de drukte over de 10 minuten van de verkoop? 1,2 miljoen over 600 seconden is 2.000 per seconde, maar iedereen komt in de eerste minuut."
peak.mid.text: "2.000 tot 8.000 per seconde"
peak.mid.why: "Dichtbij: telde je ieder persoon één keer? 400.000 in 60 seconden is zo'n 6.700 per seconde, maar ieder doet drie requests."
peak.right.text: "8.000 tot 30.000 per seconde"
peak.right.why: "Goed: ongeveer 20.000 per seconde, en meer in de eerste seconden."
peak.over.text: "meer dan 30.000 per seconde"
peak.over.why: "Te hoog. 1,2 miljoen requests over 60 seconden is 20.000 per seconde; deelde je door 10 of 30 seconden in plaats van 60, of telde je bij elke reserveringspoging een zaalkaart mee?"
hint.hold: "Wat gebeurt er met een reservering als de server die hem maakte herstart, of als niemand een job op tijd draait?"
hint.claim: "Duizenden willen dezelfde stoel en maar één kan winnen. Welke aanpak vertelt de verliezers het snelst dat ze verloren hebben?"
hint.late: "Wiens claim op de stoel is nog geldig? Begin bij de ene regel."
hint.peak: "Tel requests, geen mensen: drie per persoon, in één minuut."
hint.breathe: "Even ademhalen. Noor wil horen wat elke keuze kost, niet de naam van een tool."
won.1: "Noor doet de dop op haar stift. \"Reserveringen als data, één conditionele write, keys voor retries, een weg terug als geld en stoelen niet met elkaar kloppen. Dat is een antwoord van een senior.\""
lost.1: "\"Laten we hier pauzeren.\" Noor glimlacht. \"Lees de uitleg, denk na over waar de waarheid staat, en kom terug wanneer je wilt. De tour is elk jaar uitverkocht.\""
