title: "The Senior interview: ticket booking"
summary: "Noor, principal engineer on Senior Summit, asks you to design ticket sales for a stadium tour without ever selling one seat twice."
offer.1: "I'm Noor. I run the design reviews up here, and every senior passes my whiteboard once."
offer.2: "Today's topic sells out in minutes and makes the news when it breaks. Shall we?"
active.1: "One rule outranks everything else: no seat is ever sold twice. Keep coming back to it."
done.1: "Good session. You kept the invariant in the database and the crowd outside it. That is the job."
npc.name: "Noor"
npc.idle: "Ever watched 400,000 people press one button at 10:00? I have. Come to my whiteboard."
npc.after: "Contention, not throughput. Remember that the next time someone wants a bigger server."
attacker: "Noor · principal engineer"
intro.1: "Whiteboard interview. Topic: ticket booking."
intro.2: "Noor slides a poster across the table: a stadium tour, on sale Saturday at 10:00. \"Design the booking system. One rule outranks everything else: no seat is ever sold twice.\""
clarify.prompt.1: "\"You get two questions before you draw. Which two?\""
clarify.seats.text: "\"Assigned seats or general admission, and how many seats can one order take?\""
clarify.seats.why: "Best. This decides the data model. Assigned seats make every seat its own contended record that exactly one buyer must win; general admission is a stock counter you decrement, with all contention on one number. Seats per order decides whether one claim must take several seats at once, all or nothing."
clarify.demand.text: "\"How many buyers do we expect in the first minutes, against how many seats?\""
clarify.demand.why: "Best. The ratio of buyers to seats drives the design: 400,000 people for 50,000 seats means most attempts lose, so you need a waiting room in front and a claim that fails fast, not more throughput behind it."
clarify.checkout.text: "\"How long does a buyer take, from choosing seats to a confirmed payment, on average?\""
clarify.checkout.why: "Half right. It sets the hold's lifetime, so you will need it, but the hold works the same with any duration. Ask it once you know the shape of the inventory and the size of the crowd, which change the architecture."
clarify.provider.text: "\"Which payment provider do we integrate with?\""
clarify.provider.why: "Weak. An integration detail: the major providers support idempotency keys and asynchronous confirmations, so the design around them is the same. Which payment methods you accept matters later, not whose API."
clarify.nosql.text: "\"Can I put the seats in a NoSQL store, so the seat table can scale out?\""
clarify.nosql.why: "Weak, as a first question. It picks a tool before the requirements, and volume is not the hard part: 50,000 seats fit in any database. The hard part is a claim that exactly one buyer wins, which needs a conditional write in whatever store you pick."
hold.prompt.1: "\"Assigned seats, up to 6 per order, 400,000 buyers for 50,000 seats. Checkout takes a few minutes, so we hold seats for 10.\""
hold.prompt.2: "\"Where does a hold live, and what makes it expire?\""
hold.row.text: "On the seat's record: state, hold id and expires_at from the database clock; a claim treats an expired hold as free, never waiting for a sweeper."
hold.row.why: "Best. Expiry is a comparison at claim time (expires_at < now()), so correctness never depends on a timer or a job running on time, and one clock, the database's, avoids skew between app servers (now() is the transaction's start, so keep the claim one short statement). The hold sits next to the sale, so turning it into tickets is one transaction on the same rows. A sweeper only resets stale rows for seat maps and reports."
hold.cron.text: "On the seat's record, with a status; a job runs every minute and frees holds older than 10 minutes, so a claim only looks for free seats."
hold.cron.why: "Half right. It works, but correctness now depends on the job: a seat stays unsellable for up to a minute after its hold ends, and if the job stalls or falls behind in the busiest minutes of the year, inventory freezes. Let the claim treat expired holds as free and keep the job for tidiness."
hold.redis.text: "A key per seat in Redis with a 10-minute TTL, set only if absent; when the key vanishes the seat is free again. The database stores only paid tickets."
hold.redis.why: "Half right, and debatable: many real systems do this. SET with NX and a TTL is a fine hold and takes load off the database. But hold and sale now live in two stores: a Redis failover with asynchronous replication can lose keys, so two buyers can hold and pay for one seat. It is safe only if the database keeps the final say (a unique constraint on the ticket) and a refund path exists."
hold.timer.text: "In the app server that took the hold: it starts a 10-minute timer per hold and frees the seats again when that timer fires."
hold.timer.why: "Weak. The timer lives and dies with one process: a deploy or a crash during the sale leaves those seats held forever, and nothing frees them. Timers can also fire late under load. Expiry must be data, a deadline stored with the hold, not a callback."
hold.cart.text: "In the buyer's session: the seat map greys out seats in someone's cart, and the server checks they are still free when payment starts."
hold.cart.why: "Weak. That is no reservation at all: two buyers can each spend ten minutes checking out the same seat, and the loser finds out at payment. Grey seats are a display; only a write on the server claims a seat."
race.prompt.1: "Noor draws a colleague's claim code. \"Two buyers, same seat, same millisecond. What goes wrong?\""
race.proposal.1: "1. SELECT state FROM seats WHERE seat_id = ?   gives 'free'"
race.proposal.2: "2. If it is free: UPDATE seats SET state = 'held', hold_id = ? WHERE seat_id = ?"
race.proposal.3: "3. Both run in one transaction at READ COMMITTED, PostgreSQL's default."
race.both.text: "Both can read 'free' before either writes; the second UPDATE then waits, matches on seat_id alone and overwrites the first hold."
race.both.why: "Best. At READ COMMITTED a plain SELECT takes no lock, so both see 'free'. In PostgreSQL the second UPDATE blocks on the row lock until the first commits, then re-checks only its WHERE clause, seat_id = ?, which still matches, so it overwrites the first hold: two buyers each believe they hold the seat. Put the condition in the write (WHERE state = 'free' ...) and check that one row changed, or lock the row with SELECT ... FOR UPDATE."
race.atomic.text: "Nothing: one transaction makes the read and the write atomic. The only cost is two round trips, which a stored procedure would turn into one."
race.atomic.why: "Weak. Atomic means all or nothing, not isolated from other transactions. READ COMMITTED allows exactly this interleaving, and moving the two statements into a stored procedure keeps the same race."
race.expired.text: "It does not treat an expired hold as free: a seat whose 10 minutes ran out still reads 'held', so it stays unsellable."
race.expired.why: "Half right. A real gap: a claim must treat a held seat whose expires_at has passed as free. But a seat stuck as held costs one sale, while the race sells one seat twice, which breaks the one rule."
race.serializable.text: "The isolation level: only SERIALIZABLE stops this interleaving, so the fix is to raise it and accept more aborted transactions."
race.serializable.why: "Half right. You found the race, but SERIALIZABLE is not the only fix and rarely the cheapest: in PostgreSQL even REPEATABLE READ makes the second update fail with a serialization error, and a conditional UPDATE fixes it at the default level with no retries. The real flaw is deciding in the application on a value read earlier."
claim.prompt.1: "\"10:00:00. Thousands of buyers click the same front-row block in the same second.\""
claim.prompt.2: "\"How do you claim seats so that none sells twice, and why that way under this load?\""
claim.conditional.text: "One conditional UPDATE per order, for seats that are free or whose hold expired, then check the row count. Losers hear 'taken' at once."
claim.conditional.why: "Best. Check and write are one statement in a short transaction with no application round trip inside, so the row lock is held for microseconds and a loser learns at once that the seat is gone. For several seats, require the row count to equal the seats asked for and roll back otherwise; lock in seat-id order first (a sub-select with ORDER BY seat_id FOR UPDATE), or retry on deadlock, because one UPDATE promises no order. A unique key on (event, seat) in the tickets table is the last line of defence."
claim.forupdate.text: "SELECT ... FOR UPDATE on the chosen seats, then update them in the same transaction: the row lock lines up the buyers of each seat one by one."
claim.forupdate.why: "Half right. Correct, and the classic answer. Under a hot sale, though, everyone who wants a front-row seat queues on its lock only to learn it is gone, connections pile up in the pool, and a lock held across application round trips stretches. With several seats you must lock in a fixed order or deadlock. NOWAIT, or SKIP LOCKED for 'any seat in this block', turns it into a fast answer."
claim.version.text: "Optimistic concurrency: read each seat with its version number, update only where the version still matches, and retry the whole flow if not."
claim.version.why: "Half right. Correct, and the best choice when conflicts are rare. On a hot seat almost every attempt conflicts, and retrying is wasted work because the seat is taken: there is nothing to retry for. A conditional UPDATE is the same idea without the separate read."
claim.writer.text: "Put every claim for the event on one queue with a single consumer that applies them in order: with just one writer, nothing can race."
claim.writer.why: "Half right, and defensible: a single writer per event removes races by design and can be very fast in memory. But the buyer now waits for an asynchronous answer, the consumer is a single point of failure that needs failover without applying a claim twice, and you are rebuilding the database's concurrency control yourself."
claim.redlock.text: "A Redis lock per seat, SET NX with a TTL, around the read and the write, so the database needs no special statements and no row locks."
claim.redlock.why: "Weak, and the debate is well known: a process that pauses (garbage collection, a slow network) past its lock's TTL still writes after another buyer got the lock, unless the store checks a fencing token. The database's conditional write must stay the source of truth; a lock in front can cut load, but correctness must not depend on it."
retry.prompt.1: "\"The buyer taps 'Confirm and pay'. The call times out after 30 seconds, and the app retries.\""
retry.prompt.2: "\"How do you make sure nobody is charged twice or gets two bookings?\""
retry.key.text: "An idempotency key per confirmation: made by the app, resent with each retry, stored with the outcome, passed to the provider."
retry.key.why: "Best. A retry with the same key returns the stored outcome instead of running again, and the provider deduplicates the charge on the same key. Claim the key first, under a unique constraint, in a short transaction that marks it 'in progress', so a concurrent retry waits or hears 'in progress'; the outcome goes on that row in the transaction that creates the tickets. A timeout means 'unknown', not 'failed'."
retry.check.text: "Before charging, look up whether this order already has a successful payment, and if it has, return that booking instead of charging again."
retry.check.why: "Half right. It catches a retry that arrives after the first attempt finished. But two concurrent attempts both see no payment and both charge, and the charge that timed out may have gone through without being recorded yet. Check-then-act needs a unique key to be safe."
retry.holdkey.text: "Use the hold's id as the payment's idempotency key: one hold is one checkout, so a retried call maps to the same charge."
retry.holdkey.why: "Half right. Close: it ties retries to one checkout. But a key replays its first result: after a declined card, a retry with another card under the same hold gets the stored decline back. A key per confirmation, made by the app, fits better: a new card is a new confirmation."
retry.fresh.text: "The server makes a new idempotency key for every request it receives and stores it with the payment, so each charge can be traced."
retry.fresh.why: "Weak. A key that changes with every request deduplicates nothing: the retry looks new. The key has to come from the buyer's intent, created once before the first attempt."
retry.noretry.text: "Never retry a payment automatically: show an error and let the buyer decide whether to try again, with other details if needed."
retry.noretry.why: "Weak. The buyer will retry by hand, which is the same double charge without a key. A timeout does not mean the payment failed; it means you do not know yet."
confirm.prompt.1: "\"Put the steps of 'confirm and pay' in order, so that no seat sells twice and no charge ends without either a ticket or the money back.\""
confirm.key.text: "Claim the idempotency key (insert, unique); if it already has an outcome, return that and stop"
confirm.key.why: "First, together with moving the hold to 'paying'. A retry must find the earlier attempt before any money moves; if the key already has an outcome, nothing below runs again."
confirm.extend.text: "Move the hold to 'paying' with a longer deadline, so it cannot lapse mid-payment"
confirm.extend.why: "First, together with the key lookup. It is a conditional write that succeeds only while the hold is still this buyer's: from here on, a slow payment cannot let the seats lapse to someone else. If it fails, the hold is gone and no money has moved yet."
confirm.authorise.text: "Ask the provider to authorise the amount, with the idempotency key"
confirm.authorise.why: "Next. Authorising reserves the money without taking it, so if the seats turn out to be lost, voiding costs nothing: the buyer sees at most a pending amount that disappears, never a charge followed by a refund."
confirm.commit.text: "In one transaction: turn the seats into tickets if the hold is still this buyer's, and store the outcome under the key"
confirm.commit.why: "Then the moment of truth. The tickets and the stored outcome commit together, guarded by the same condition as every claim, with the unique key on (event, seat) as the last line of defence."
confirm.capture.text: "Capture the authorised payment, or void it if the transaction failed"
confirm.capture.why: "Only once the tickets exist do you take the money. If the transaction failed, void the authorisation: the buyer is never charged for seats they did not get."
confirm.mail.text: "Send the tickets by e-mail"
confirm.mail.why: "Last. An e-mail cannot be taken back, so it goes out once everything it promises is true. Send it from a queue, so a mail outage cannot fail the booking."
late.prompt.1: "\"It happens anyway: a payment method without separate authorisation, and the webhook says it succeeded 40 seconds after the hold expired. The seat already belongs to someone else.\""
late.prompt.2: "\"What now?\""
late.refund.text: "The seat stays with the second buyer. Refund the first or offer a comparable seat, and tell them at once."
late.refund.why: "Best. The invariant wins: the second buyer's claim is valid and stays. A refund is cheap next to two people at one seat at the door. Offering a comparable seat keeps the sale, and the alert matters: a rising rate means holds are too short or payments too slow."
late.first.text: "Give the seat to the first buyer: they paid, while the second may only hold it, so the first payment has the stronger claim."
late.first.why: "Weak. It breaks the one rule from the other side: the second buyer may already have a ticket, and the hold expired because the first payment came too late. Never move a seat away from a valid claim."
late.longttl.text: "Prevent it: make every hold last as long as the slowest payment can take, say 30 minutes, so a payment lands inside its hold."
late.longttl.why: "Half right. It lowers the rate, but it locks inventory for half an hour per abandoned checkout during the hottest sale of the year, and webhooks can still arrive later: providers retry for hours or days. You still need the refund path."
late.overbook.text: "Sell a small margin of extra tickets per event, as airlines do, so the no-shows absorb these rare cases."
late.overbook.why: "Weak. Airlines overbook knowing some passengers will not show up, and rebook or compensate at the gate. For assigned concert seats it means two people with a ticket for one seat: it breaks the invariant on purpose."
peak.prompt.1: "\"Back of the envelope. 400,000 people arrive in the first minute. Without a waiting room, each loads the seat map once and tries to hold seats twice in that minute.\""
peak.prompt.2: "\"Roughly how many requests per second hit the booking service?\""
peak.working: "Working: 400,000 people × 3 requests (one seat map, two hold attempts) = 1.2 million requests in 60 seconds, about 20,000 per second, and the first seconds are worse. The useful work: 50,000 seats at about 2 per order is 25,000 orders; selling out in 10 minutes is about 40 bookings a second. Most attempts lose a race, so the problem is contention and admission, not throughput: a waiting room admits buyers at the rate the claim path can take, and the seat map can come from a cache a few seconds stale, because only the conditional write decides."
peak.under.text: "under 500 per second"
peak.under.why: "Too low. That is nearer the bookings that succeed, about 40 a second, than the attempts: 400,000 people in one minute is already about 6,700 a second before you count what each one does."
peak.low.text: "500 to 2,000 per second"
peak.low.why: "Too low. Did you spread the crowd over the 10 minutes of the sale? 1.2 million over 600 seconds is 2,000 a second, but they all arrive in the first minute."
peak.mid.text: "2,000 to 8,000 per second"
peak.mid.why: "Close: did you count each person once? 400,000 in 60 seconds is about 6,700 a second, but each makes three requests."
peak.right.text: "8,000 to 30,000 per second"
peak.right.why: "Right: about 20,000 per second, and more in the first seconds."
peak.over.text: "more than 30,000 per second"
peak.over.why: "Too high. 1.2 million requests over 60 seconds is 20,000 a second; did you divide by 10 or 30 seconds instead of 60, or count a seat-map load with every hold attempt?"
hint.hold: "What happens to a hold when the server that made it restarts, or when nobody runs a job on time?"
hint.claim: "Thousands want the same seat and only one can win. Which approach tells the losers fastest?"
hint.late: "Whose claim on the seat is still valid? Start from the one rule."
hint.peak: "Count requests, not people: three per person, in one minute."
hint.breathe: "Take a breath. Noor wants to hear what each choice costs, not the name of a tool."
won.1: "Noor caps her marker. \"Holds as data, one conditional write, keys for retries, a way back when money and seats disagree. That is a senior answer.\""
lost.1: "\"Let's pause here.\" Noor smiles. \"Read the explanations, think about where the truth lives, and come back when you like. The tour sells out every year.\""
