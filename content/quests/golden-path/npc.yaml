# Kim, platform engineer and the Platform Engineer path's mentor in Medior City. No sprite yet:
# a placeholder tinted in the palette's forest green.
schema: 1
id: kim
author: {name: "Nines team"}
name: npc.name
tint: "#306838"
spawn: {map: medior-city, slot: npc-4, facing: down}
dialogue:
  - when: 'quest("golden-path") == "done"'
    lines: [npc.after]
  - when: '!path_chosen'
    lines: [npc.nopath]
  - when: 'career_path("platform")'
    lines: [npc.mentor.1, npc.mentor.2]
    intro: true
  - lines: [npc.side]
    intro: true
