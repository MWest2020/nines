title: "Het gouden pad"
summary: "Kim, de platform engineer, wil een template dat elk team een namespace en een Deployment geeft die standaard veilig zijn. Ontwerp het samen met haar."
offer.1: "Kim, platformteam. Elk team dat een nieuwe dienst start, stelt ons dezelfde twintig vragen. Ik wil een template dat ze beantwoordt."
offer.2: "Een gouden pad: één commando, en je krijgt een namespace en een Deployment die vanaf dag één kloppen. Help je me het te ontwerpen?"
active.1: "Het whiteboard staat nog vol YAML. Zullen we het template afmaken?"
done.1: "Quota's met standaardwaarden, limieten die zich gedragen, non-root, standaard dicht, en een weg die teams graag nemen. Uitrollen maar."
npc.name: "Kim"
npc.nopath: "Net aangekomen? Ga eerst even naar Joyce, de loopbaancoach bij het Career Centre. Als je een pad hebt gekozen, kom dan samen met mij wegen aanleggen."
npc.mentor.1: "Platform Engineer dus. Ik ben je mentor: wij leggen de weg aan waar de andere teams over rijden."
npc.mentor.2: "De kunst is de juiste manier de makkelijkste te maken. We beginnen met een template."
npc.side: "Niet jouw pad, maar welkom. Elk team belandt uiteindelijk op iemands platform, dus doe deze maar als zijquest."
npc.after: "Drie teams zijn deze maand op het template overgestapt. Eén ging van de weg af voor een GPU-job, beheert zijn eigen YAML, en is tevreden. Ook prima."
attacker: "Kim · platform engineer"
intro.1: "Whiteboardsessie · Onderwerp: een gouden-padtemplate voor de nieuwe dienst van een team"
intro.2: "Kim haalt de dop van een stift: \"Eén commando geeft een team een namespace en een Deployment. Wat gaat erin, en waar zit de valkuil?\""
ask.prompt.1: "Kim: \"Voor we ook maar een regel YAML schrijven, mag je twee vragen stellen. Welke twee?\""
ask.pain.text: "\"Wat gaat er nu mis als een team een nieuwe dienst aan de praat krijgt?\""
ask.pain.why: "Goed. Een gouden pad lost echte pijn op, anders neemt niemand het. De antwoorden (vergeten limieten, pods als root, geen probes) vertellen je wat het template als eerste goed moet doen."
ask.rules.text: "\"Welke regels zijn harde eisen voor security, en welke zijn gewoon onze gewoontes?\""
ask.rules.why: "Goed. Harde eisen worden vangrails die voor iedereen gelden; gewoontes worden standaardwaarden die teams mogen aanpassen. Haal je ze door elkaar, dan krijg je een kooi of een vrijblijvend advies."
ask.tool.text: "\"Wordt het template een Helm-chart, een Kustomize-basis, of een kleine generator die gewone YAML-bestanden schrijft?\""
ask.tool.why: "Half goed. De tool doet er later toe, maar het is een hoe-vraag. Zoek eerst uit wat het template moet bevatten en voor wie."
ask.force.text: "\"Kunnen we het verplicht maken, zodat geen enkel team nog op een andere manier kan deployen?\""
ask.force.why: "Zwak. Je springt naar een verplichting voordat je weet wat teams nodig hebben. Een pad waar mensen op gedwongen worden, wordt omzeild; een pad dat tijd scheelt, wordt gebruikt."
ask.worst.text: "\"Wie heeft de slechtste manifests? Mooi slecht voorbeeld.\""
ask.worst.why: "Zwak. Een team aan de schandpaal zetten maakt ze je tegenstanders. Kijk naar veelvoorkomende problemen, niet naar schuldigen."
quota.prompt.1: "Kim schrijft op het whiteboard: \"Dit is mijn plan voor resources. Waar gaat het mis?\""
quota.proposal.1: "Elke teamnamespace krijgt een ResourceQuota op requests.cpu en requests.memory."
quota.proposal.2: "De Deployment uit het template zet zijn requests, dus die past binnen het quotum."
quota.proposal.3: "Dus hebben we geen LimitRange nodig."
quota.rejected.text: "Pods zonder requests, zoals een snelle debugpod, worden geweigerd tenzij een LimitRange standaardwaarden zet."
quota.rejected.why: "Goed. Met een quotum op requests.cpu en requests.memory moet elke nieuwe pod in die namespace die requests opgeven, anders weigert de API-server hem. De pods uit het template zitten goed; de zelfgeschreven Job of debugpod niet. Een LimitRange met standaard-requests (en -limieten) vult ze in."
quota.limits.text: "Het quotum moet ook limieten dekken, anders kan één container groeien tot de node geen geheugen meer heeft."
quota.limits.why: "Half goed. Limieten doen ertoe, en een LimitRange kan ook standaardlimieten geven. Maar daar gaat dit plan niet mis: door de ontbrekende LimitRange faalt elke pod zonder requests meteen."
quota.pods.text: "Een ResourceQuota telt alleen objecten zoals pods, geen CPU of geheugen."
quota.pods.why: "Zwak. Een ResourceQuota kan aantallen objecten begrenzen én rekenkracht, waaronder requests.cpu en requests.memory."
quota.cluster.text: "Een ResourceQuota geldt voor het hele cluster, dus het quotum van één team blokkeert alle andere teams."
quota.cluster.why: "Zwak. Een ResourceQuota hoort bij één namespace en geldt alleen daar; daarom krijgt elk team zijn eigen."
limits.prompt.1: "Kim: \"Het template zet requests en limieten. Een team gaat vragen wat er gebeurt als hun app over zijn limieten gaat.\""
limits.prompt.2: "\"Wat vertel je ze?\""
limits.oom.text: "Geheugen over de limiet: OOMKilled. CPU over de limiet: afgeknepen, traag maar levend."
limits.oom.why: "Goed. Geheugen kun je niet terugnemen, dus de kernel stopt de container en de kubelet herstart hem (OOMKilled, daarna misschien CrashLoopBackOff). CPU kun je over de tijd verdelen, dus de container krijgt er gewoon minder van en wordt trager."
limits.evict.text: "Over een van beide limieten wordt de pod geëvict en opnieuw ingepland op een node met meer ruimte."
limits.evict.why: "Zwak. Evictie is iets anders: de kubelet haalt pods weg als de hele node tekortkomt. Over je eigen limiet gaan wordt in de container zelf afgehandeld: gestopt bij geheugen, afgeknepen bij CPU."
limits.swapped.text: "Over de CPU-limiet wordt de container gestopt; over de geheugenlimiet wordt hij vertraagd."
limits.swapped.why: "Zwak. Het is andersom: over de geheugenlimiet wordt de container gestopt, over de CPU-limiet wordt hij afgeknepen."
limits.both.text: "Over de geheugenlimiet wordt de container gestopt; over de CPU-limiet gebeurt even later precies hetzelfde."
limits.both.why: "Half goed. Het geheugendeel klopt. CPU is nooit een reden om een container te stoppen: over zijn CPU-limiet wordt hij afgeknepen, dus hij draait trager."
security.prompt.1: "Kim: \"Wat zet het template standaard in de securityContext?\""
security.nonroot.text: "runAsNonRoot: true en allowPrivilegeEscalation: false; een rootcontainer start niet."
security.nonroot.why: "Goed. Met runAsNonRoot controleert de kubelet de gebruiker voor hij de container start, en weigert hij er een die als UID 0 zou draaien. allowPrivilegeEscalation: false voorkomt dat een proces meer rechten krijgt dan zijn ouderproces. Teams met een echte reden kunnen het aanpassen, zichtbaar, in de review."
security.privileged.text: "Standaard privileged: true, dan werken apps die hosttoegang nodig hebben gewoon."
security.privileged.why: "Zwak. Een privileged container heeft bijna dezelfde toegang als de host. De veilige instelling hoort de standaard te zijn; de uitzondering is de wijziging die iemand moet onderbouwen."
security.half.text: "runAsNonRoot: true is genoeg; privilege escalation is in elke container standaard al geblokkeerd."
security.half.why: "Half goed. runAsNonRoot is een goede standaard, maar allowPrivilegeEscalation staat niet op false tenzij je het zelf zet, dus het template moet het expliciet zetten."
security.teams.text: "Niets: securityinstellingen hangen te veel af van elke app, laat ze over aan de teams die ze draaien."
security.teams.why: "Zwak. De meeste apps hebben precies dezelfde veilige instellingen nodig, en daar is een template voor. Laat je het aan elk team over, dan zetten de meeste teams het nooit."
network.prompt.1: "Kim: \"Netwerk. Op dit moment kan elke pod in het cluster elke andere pod bereiken.\""
network.prompt.2: "\"Wat voegt het template toe?\""
network.deny.text: "Standaard dicht, dan toestaan wat de app nodig heeft: ingress erin, DNS en de database eruit."
network.deny.why: "Goed. Standaard dicht, bewust open: een gecompromitteerde pod kan dan alleen bij wat hij nodig heeft. Denk aan DNS als je uitgaand verkeer dichtzet, anders lost er niets meer op. NetworkPolicies werken alleen als de netwerkplugin van het cluster ze afdwingt, dus controleer dat eerst."
network.namespaces.text: "Niets extra's: aparte namespaces houden de pods van het ene team al weg van het verkeer van een ander team."
network.namespaces.why: "Zwak. Namespaces scheiden namen, quota's en rechten, geen netwerkverkeer. Zonder NetworkPolicies praten pods in verschillende namespaces vrij met elkaar."
network.tickets.text: "Al het verkeer erin en eruit dicht, en teams dienen bij ons een ticket in voor elke uitzondering."
network.tickets.why: "Half goed. Veilig, maar het template hoort de gewone routes (ingress, DNS) al open te zetten, en een ticket per uitzondering maakt van het platformteam een wachtrij. Daarover verschillen de meningen: sommige gereguleerde teams willen die controle juist."
network.inside.text: "Binnen het cluster alles toestaan en alles van buiten het cluster blokkeren."
network.inside.why: "Zwak. De buitengrens is hier niet het risico: zodra één pod gecompromitteerd is, kan hij elke andere pod in het cluster bereiken."
secrets.prompt.1: "Een teamlead schuift aan met zijn eigen plan voor het databasewachtwoord:"
secrets.proposal.1: "Het template zet het wachtwoord in een Kubernetes-Secret."
secrets.proposal.2: "Secrets zijn versleuteld."
secrets.proposal.3: "Dus committen we de YAML van de Secret met de rest in onze Git-repo."
secrets.base64.text: "Secretdata is base64-gecodeerd, niet versleuteld: wie de YAML leest, kan het decoderen."
secrets.base64.why: "Goed. Base64 is een codering die iedereen in één stap terugdraait. Hou het wachtwoord uit Git: gebruik een secrets manager, of versleutel het voor het de repo in gaat, en beperk wie Secrets in het cluster mag lezen."
secrets.etcd.text: "Secrets zijn versleuteld in de database van het cluster, maar een Git-repo heeft die bescherming niet."
secrets.etcd.why: "Half goed. De conclusie klopt, Git is er geen plek voor, maar de aanname niet: Secrets staan onversleuteld in etcd tenzij het cluster encryptie at rest heeft ingesteld. Sommige managed diensten doen dat voor je; controleer het, ga er niet van uit."
secrets.env.text: "Secrets kunnen alleen als omgevingsvariabelen naar een pod, nooit als bestanden gemount worden."
secrets.env.why: "Zwak. Een Secret kun je als bestanden mounten of als omgevingsvariabelen meegeven; bestanden zijn vaak de veiligere keuze. En het is niet de fout in dit plan."
secrets.private.text: "Base64 is goed genoeg voor wachtwoorden, zolang de repository privé blijft."
secrets.private.why: "Zwak. Base64 beschermt niets, en een privérepository wordt gekopieerd naar elke laptop en CI-runner die hem kloont, zolang zijn geschiedenis bestaat."
road.prompt.1: "Kim: \"Laatste. Een team zegt dat het template niet past bij hun batchjob en wil hun eigen manifests schrijven.\""
road.prompt.2: "\"Wat is ons standpunt?\""
road.paved.text: "\"Laat ze. De weg is de makkelijke standaard, geen muur: ernaast beheren ze hun eigen YAML, en de vangrails blijven gelden.\""
road.paved.why: "Goed, al verschillen platformteams hierover van mening. Een geplaveide weg wint door de makkelijkste te zijn, niet de enige. Harde eisen blijven voor iedereen gelden (quota's, regels voor podbeveiliging); de rest is aan het team, en hun redenen vertellen je wat het template mist."
road.mandate.text: "\"Blokkeer het: een admissieregel weigert elke Deployment die niet uit het template komt.\""
road.mandate.why: "Zwak. Het hele template verplichten maakt van elk ongewoon geval een gevecht, of een omweg. Dwing de harde eisen af; laat de weg de rest winnen."
road.explain.text: "\"Prima, zodra ze schriftelijk hebben uitgelegd waarom het template niet bij hun geval past.\""
road.explain.why: "Half goed, en daarover verschillen de meningen. Hun redenen zijn waardevolle feedback, maar een schriftelijke onderbouwing als drempel voegt wrijving toe waar een gesprek volstaat."
road.loose.text: "\"Laat ze, en haal het quotum en de policies van hun namespace, zodat de regels van het template ze niet hinderen.\""
road.loose.why: "Zwak. Van de weg af gaan mag niet betekenen dat de vangrails verdwijnen. Quota's en netwerkpolicies beschermen de andere teams op hetzelfde cluster."
apply.prompt.1: "Kim: \"Het template maakt zijn objecten voor een nieuw team één voor één aan. Zet ze op volgorde.\""
apply.namespace.text: "De namespace aanmaken, met labels voor het team en de omgeving."
apply.namespace.why: "Eerst: al het andere woont in de namespace. Met de labels vinden policies, quota's en dashboards hem."
apply.quota.text: "De ResourceQuota en de LimitRange met standaard-requests en -limieten toevoegen."
apply.quota.why: "Voor elke pod: een LimitRange vult alleen standaardwaarden in voor pods die na hem worden aangemaakt."
apply.account.text: "Het eigen ServiceAccount van de app aanmaken."
apply.account.why: "Voor de Deployment, naast de netwerkpolicy: een pod die een ServiceAccount noemt dat niet bestaat, wordt geweigerd."
apply.policy.text: "De default-deny NetworkPolicy en de uitzonderingen voor de app toepassen."
apply.policy.why: "Voor de Deployment, naast het ServiceAccount: dan draaien de pods geen moment zonder hun policy."
apply.deployment.text: "De Deployment toepassen: requests, limieten, securityContext, probes en labels."
apply.deployment.why: "Nu de Deployment, in een namespace die er klaar voor is."
apply.check.text: "De uitrol controleren: pods Ready en de probes slagen."
apply.check.why: "Als laatste: klaar betekent draaiend en Ready, niet alleen toegepast."
hint.ask: "Zoek uit wat er nu pijn doet, en welke regels nooit mogen buigen."
hint.quota: "Een quotum op requests eist requests van elke pod. Wie levert die voor de pods die het template niet schreef?"
hint.secrets: "Coderen is geen versleutelen. Probeer base64 eens in je hoofd te decoderen: zo makkelijk is het."
hint.apply: "Eerst de namespace, dan wat bepaalt hoe pods worden toegelaten, dan de pods."
hint.road: "Maak de juiste manier de makkelijkste. Bewaak alleen wat nooit mag buigen."
won.1: "Kim doet de dop op de stift. \"Veilige standaarden, eerlijke limieten, en een weg die mensen zelf kiezen. Dat is een gouden pad. Uitrollen maar.\""
lost.1: "Kim veegt het halve whiteboard schoon. \"Bijna, maar hier zou iemand last van krijgen. Laten we het nog eens doorlopen; de uitleg laat zien waar.\""
