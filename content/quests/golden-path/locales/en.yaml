title: "The golden path"
summary: "Kim, the platform engineer, wants a template that gives every team a namespace and a Deployment that are safe by default. Design it with her."
offer.1: "Kim, platform team. Every team that starts a new service asks us the same twenty questions. I want a template that answers them."
offer.2: "A golden path: one command, and you get a namespace and a Deployment that are right from day one. Help me design it?"
active.1: "The whiteboard is still full of YAML. Shall we finish the template?"
done.1: "Quotas with defaults, limits that behave, non-root, deny by default, and a road teams want to take. Let's ship it."
npc.name: "Kim"
npc.nopath: "Just got here? See Joyce, the career coach by the Career Centre, first. Once you've picked a path, come and build some roads with me."
npc.mentor.1: "Platform Engineer, then. I'm your mentor: we build the road the other teams drive on."
npc.mentor.2: "The trick is making the right way the easy way. Let's start with a template."
npc.side: "Not your path, but welcome. Every team ends up on someone's platform, so take this one as a side quest."
npc.after: "Three teams moved onto the template this month. One left the road for a GPU job, owns its own YAML, and is happy. That's fine too."
attacker: "Kim · platform engineer"
intro.1: "Whiteboard session · Topic: a golden-path template for a team's new service"
intro.2: "Kim uncaps a marker: \"One command gives a team a namespace and a Deployment. What goes in, and what's the catch?\""
ask.prompt.1: "Kim: \"Before we write any YAML, you get two questions. Which two?\""
ask.pain.text: "\"What goes wrong today when a team gets a new service running?\""
ask.pain.why: "Best. A golden path solves real pain, or nobody takes it. The answers (forgotten limits, pods as root, no probes) tell you what the template must get right first."
ask.rules.text: "\"Which rules are must-haves for security, and which are just our habits?\""
ask.rules.why: "Best. Must-haves become guardrails that apply to everyone; habits become defaults teams may change. Mixing them up gives you either a cage or a suggestion."
ask.tool.text: "\"Should the template be a Helm chart, a Kustomize base, or a small generator that writes plain YAML files?\""
ask.tool.why: "Half right. The tool matters later, but it is a how-question. First find out what the template must contain and for whom."
ask.force.text: "\"Can we make it mandatory, so that no team can deploy any other way?\""
ask.force.why: "Weak. It jumps to a mandate before you know what teams need. A path people are forced onto gets worked around; one that saves them time gets used."
ask.worst.text: "\"Whose manifests are worst? They'd make a good bad example.\""
ask.worst.why: "Weak. Shaming a team makes them your opponents. Look at common problems, not at culprits."
quota.prompt.1: "Kim writes on the whiteboard: \"Here's my plan for resources. Where does it break?\""
quota.proposal.1: "Every team namespace gets a ResourceQuota on requests.cpu and requests.memory."
quota.proposal.2: "The template's Deployment sets its requests, so it fits the quota."
quota.proposal.3: "So we don't need a LimitRange."
quota.rejected.text: "Pods without requests, such as a quick debug pod, are rejected unless a LimitRange sets defaults."
quota.rejected.why: "Best. With a quota on requests.cpu and requests.memory, every new pod in that namespace must state those requests, or the API server refuses it. The template's pods are fine; the hand-written Job or debug pod is not. A LimitRange with default requests (and limits) fills them in."
quota.limits.text: "The quota should also cover limits, or a single container can grow until the node runs out of memory."
quota.limits.why: "Half right. Limits matter, and a LimitRange can give default limits too. But it is not where this plan breaks: the missing LimitRange makes every pod without requests fail outright."
quota.pods.text: "A ResourceQuota only counts objects such as pods, not CPU or memory."
quota.pods.why: "Weak. A ResourceQuota can cap object counts and compute resources, including requests.cpu and requests.memory."
quota.cluster.text: "A ResourceQuota is cluster-wide, so one team's quota would block every other team."
quota.cluster.why: "Weak. A ResourceQuota lives in one namespace and applies only there; that is why each team gets its own."
limits.prompt.1: "Kim: \"The template sets requests and limits. A team will ask what happens when their app goes over its limits.\""
limits.prompt.2: "\"What do you tell them?\""
limits.oom.text: "Memory over the limit: OOMKilled. CPU over the limit: throttled, slow but alive."
limits.oom.why: "Best. Memory cannot be taken back, so the kernel kills the container and the kubelet restarts it (OOMKilled, then possibly CrashLoopBackOff). CPU can be shared out over time, so the container just gets less of it and slows down."
limits.evict.text: "Over either limit, the pod is evicted and scheduled again on another node with more room."
limits.evict.why: "Weak. Eviction is something else: the kubelet removes pods when the whole node runs short. Going over your own limit is handled inside the container: killed for memory, throttled for CPU."
limits.swapped.text: "Over the CPU limit, the container is killed; over the memory limit, it is slowed down."
limits.swapped.why: "Weak. It is the other way round: memory over the limit gets the container killed, CPU over the limit gets it throttled."
limits.both.text: "Over the memory limit, the container is killed; over the CPU limit, the same happens a little later."
limits.both.why: "Half right. The memory part is right. CPU is never a reason to kill a container: over its CPU limit it is throttled, so it runs slower."
security.prompt.1: "Kim: \"What goes in the template's securityContext by default?\""
security.nonroot.text: "runAsNonRoot: true and allowPrivilegeEscalation: false; a root container won't start."
security.nonroot.why: "Best. With runAsNonRoot the kubelet checks the user before starting the container and refuses one that would run as UID 0. allowPrivilegeEscalation: false stops a process from gaining more privileges than its parent. Teams with a real need can change it, visibly, in review."
security.privileged.text: "privileged: true by default, so apps needing host access just work."
security.privileged.why: "Weak. A privileged container has nearly the same access as the host. The safe setting must be the default; the exception is the change someone has to justify."
security.half.text: "runAsNonRoot: true is enough; privilege escalation is already blocked by default in every container."
security.half.why: "Half right. runAsNonRoot is a good default, but allowPrivilegeEscalation is not false unless you set it, so the template should set it explicitly."
security.teams.text: "Nothing: security settings depend too much on each app, so leave them to the teams that run them."
security.teams.why: "Weak. Most apps need exactly the same safe settings, and that is what a template is for. Leaving it to every team means most teams never set it."
network.prompt.1: "Kim: \"Network. Right now every pod in the cluster can reach every other pod.\""
network.prompt.2: "\"What does the template add?\""
network.deny.text: "Default deny, then allow what the app needs: ingress in, DNS and its database out."
network.deny.why: "Best. Deny by default, allow on purpose: a compromised pod can then reach only what it needs. Remember DNS when you deny outgoing traffic, or nothing resolves. NetworkPolicies only work if the cluster's network plugin enforces them, so check that first."
network.namespaces.text: "Nothing extra: separate namespaces already keep one team's pods away from another team's traffic."
network.namespaces.why: "Weak. Namespaces separate names, quotas and permissions, not network traffic. Without NetworkPolicies, pods in different namespaces can talk freely."
network.tickets.text: "Deny all traffic in and out, and let teams file a ticket with us for every exception they need."
network.tickets.why: "Half right. Secure, but the template should already allow the common paths (ingress, DNS), and a ticket for every exception turns the platform team into a queue. Debatable: some regulated teams do want that review."
network.inside.text: "Allow everything inside the cluster and block everything from outside it."
network.inside.why: "Weak. The perimeter is not the risk here: once one pod is compromised, it can reach every other pod in the cluster."
secrets.prompt.1: "A team lead joins the session with his own plan for the database password:"
secrets.proposal.1: "The template stores the password in a Kubernetes Secret."
secrets.proposal.2: "Secrets are encrypted."
secrets.proposal.3: "So we commit the Secret's YAML to our Git repo with the rest."
secrets.base64.text: "Secret data is base64-encoded, not encrypted: anyone who reads the YAML can decode it."
secrets.base64.why: "Best. Base64 is an encoding, reversible by anyone in one step. Keep the password out of Git: use a secrets manager, or encrypt it before it goes into the repo, and limit who may read Secrets in the cluster."
secrets.etcd.text: "Secrets are encrypted in the cluster's database, but a Git repo has no such protection."
secrets.etcd.why: "Half right. The conclusion is right, Git is no place for it, but the premise is not: Secrets are stored unencrypted in etcd unless the cluster has encryption at rest configured. Some managed services do that for you; check, don't assume."
secrets.env.text: "Secrets can only be passed as environment variables, never mounted into the pod as files."
secrets.env.why: "Weak. A Secret can be mounted as files or passed as environment variables; files are often the safer choice. And it is not the flaw in this plan."
secrets.private.text: "Base64 is good enough for passwords, as long as the repository stays private."
secrets.private.why: "Weak. Base64 protects nothing, and a private repository is copied to every laptop and CI runner that clones it, for as long as its history exists."
road.prompt.1: "Kim: \"Last one. A team says the template doesn't fit their batch job and wants to write their own manifests.\""
road.prompt.2: "\"What's our stance?\""
road.paved.text: "\"Let them. The road is the easy default, not a wall: off it they own their YAML, and the guardrails still apply.\""
road.paved.why: "Best, though platform teams debate it. A paved road wins by being the easiest way, not the only one. Must-haves stay enforced for everyone (quotas, pod security rules); the rest is the team's call, and their reasons tell you what the template is missing."
road.mandate.text: "\"Block it: an admission rule rejects any Deployment that wasn't made from the template.\""
road.mandate.why: "Weak. A mandate on the whole template turns every unusual case into a fight, or a workaround. Enforce the must-haves; let the road win on the rest."
road.explain.text: "\"Fine, once they've explained in writing why the template doesn't fit their case.\""
road.explain.why: "Half right, and debatable. Their reasons are valuable feedback, but a written justification as a gate adds friction where a conversation would do."
road.loose.text: "\"Let them, and drop the quota and policies on their namespace so the template's rules don't get in their way.\""
road.loose.why: "Weak. Leaving the road should not mean leaving the guardrails. Quotas and network policies protect the other teams on the same cluster."
apply.prompt.1: "Kim: \"The template applies its objects one by one for a new team. Put them in order.\""
apply.namespace.text: "Create the namespace, labelled with the team and the environment."
apply.namespace.why: "First: everything else lives in the namespace. The labels let policies, quotas and dashboards find it."
apply.quota.text: "Add the ResourceQuota and the LimitRange with default requests and limits."
apply.quota.why: "Before any pod: a LimitRange only fills in defaults for pods created after it exists."
apply.account.text: "Create the app's own ServiceAccount."
apply.account.why: "Before the Deployment, alongside the network policy: a pod that names a ServiceAccount that does not exist is refused."
apply.policy.text: "Apply the default-deny NetworkPolicy and the app's allows."
apply.policy.why: "Before the Deployment, alongside the ServiceAccount: then the pods never run a moment without their policy."
apply.deployment.text: "Apply the Deployment: requests, limits, securityContext, probes and labels."
apply.deployment.why: "Now the Deployment, into a namespace that is ready for it."
apply.check.text: "Check the rollout: pods Ready and the probes passing."
apply.check.why: "Last: done means running and Ready, not just applied."
hint.ask: "Find out what hurts today, and which rules can never bend."
hint.quota: "A quota on requests demands requests from every pod. Who supplies them for the pods the template didn't write?"
hint.secrets: "Encoding is not encryption. Try decoding base64 in your head: it is that easy."
hint.apply: "Namespace first, then what changes how pods are admitted, then the pods."
hint.road: "Make the right way the easy way. Guard only what must never bend."
won.1: "Kim caps the marker. \"Safe defaults, honest limits, and a road people choose. That's a golden path. Let's ship it.\""
lost.1: "Kim wipes half the whiteboard. \"Close, but this would hurt someone. Let's go through it again; the explanations show where.\""
