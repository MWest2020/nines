title: "Oefengesprek: plekken in de buurt"
summary: "Ravi gaat binnenkort sollicitatiegesprekken voeren voor zijn team en wil op jou oefenen: ontwerp de zoekfunctie achter 'cafés in de buurt' voor een kaart-app."
offer.1: "Ik ben het weer, Ravi. Vanaf volgende maand mag ik kandidaten voor mijn team interviewen, en ik oefen liever eerst op iemand die aardig is."
offer.2: "Eén ontwerpvraag, helemaal serieus: 'cafés in de buurt'. Wil jij mijn kandidaat zijn?"
active.1: "Het whiteboard staat klaar. Eerst vragen, dan tekenen; ik maak aantekeningen."
done.1: "Maandag heb ik mijn eerste echte gesprek. Jouw antwoord over de buurcellen pik ik."
attacker: "Ravi · backend-ontwikkelaar"
intro.1: "Whiteboardgesprek · Onderwerp: plekken in de buurt zoeken"
intro.2: "Ravi legt zijn aantekeningen recht en probeert streng te kijken. \"Een kaart-app. De gebruiker tikt op 'cafés in de buurt'. Ontwerp de zoekfunctie achter die knop.\""
clarify.prompt.1: "\"Je mag me twee vragen stellen voordat je gaat tekenen. Welke twee?\""
clarify.radius.text: "\"Alles binnen een straal, zeg 1 km, of de k dichtstbijzijnde, hoe ver weg die ook liggen?\""
clarify.radius.why: "Goed. Dat zijn verschillende queries. Een straal legt het gebied vast, dus je weet vooraf welke cellen je moet lezen; de 20 dichtstbijzijnde op het platteland kunnen 30 km verderop liggen, dus een k-nearest-zoekopdracht breidt ring voor ring uit tot hij er genoeg heeft. Het antwoord bepaalt elke volgende stap."
clarify.scale.text: "\"Hoeveel plekken, en hoe vaak veranderen ze vergeleken met hoe vaak er gezocht wordt?\""
clarify.scale.why: "Goed. Het aantal bepaalt of de index in het geheugen van één machine past; hoe vaak er iets verandert, bepaalt of je de index vooraf kunt bouwen en kopiëren. Plekken die zelden veranderen tegenover voortdurend zoeken maken het systeem leesintensief: één keer bouwen, repliceren, cachen."
clarify.travel.text: "\"Sorteren we op afstand in vogelvlucht, of op reistijd over de weg?\""
clarify.travel.why: "Half goed, en het is discutabel. Een redelijke vraag, maar afstand in vogelvlucht is het gangbare eerste antwoord, en reistijd is meestal een tweede ronde over de paar resultaten, met een routeservice. Het verandert de volgorde meer dan de index. Stel hem als derde."
clarify.tiles.text: "\"Op welke kaartstijl, en met tegels van welke leverancier, tonen we de resultaten?\""
clarify.tiles.why: "Zwak. Dat is de frontend. Het zegt niets over hoe je de plekken vindt en kost je een van je twee vragen."
clarify.floats.text: "\"Slaan we breedte- en lengtegraad op als doubles, of als fixed-point-integers om per plek geheugen te besparen?\""
clarify.floats.why: "Zwak, als eerste vraag. Een detail voor later (doubles, of 32-bit fixed-point-integers om geheugen te besparen; allebei prima). Het vertelt je niets over de omvang of de vorm van het probleem."
btree.prompt.1: "Ravi: \"Zoeken binnen een straal, standaard 1 km. 100 miljoen plekken wereldwijd, die zelden veranderen, en duizenden zoekopdrachten per seconde.\""
btree.prompt.2: "Hij schrijft een eerste idee op het whiteboard. \"Wat is hier mis mee?\""
btree.proposal.1: "Eén SQL-tabel: places(id, name, lat, lon)."
btree.proposal.2: "Een B-tree-index op lat, en een tweede B-tree-index op lon."
btree.proposal.3: "Query: lat binnen 0,009 graden van de gebruiker (1 km), lon binnen 0,009 graden / cos(lat); hou daarna de rijen over waarvan de exacte afstand onder 1 km ligt."
btree.band.text: "Elke index apart selecteert een band rond de hele planeet, dus één buurt kost een strook van de aarde."
btree.band.why: "Goed. Een breedtebereik van plus of min 0,009 graden is een strook van zo'n 2 km hoog die om de hele aarde loopt; een lengtebereik is een strook van pool tot pool. De database gebruikt één index en filtert de strook rij voor rij, of neemt de doorsnede van twee grote verzamelingen rij-id's; het werk groeit met de strook, niet met het antwoord. Een samengestelde index op (lat, lon) lost het niet op: het bereik op lat komt eerst, dus lon wordt alleen binnen de strook gefilterd. Je hebt een index nodig over beide dimensies tegelijk: geohash (of S2- of H3-cellen), een quadtree of een R-tree."
btree.cos.text: "Het vergeet dat een lengtegraad korter wordt naarmate je verder van de evenaar komt, dus het zoekvak is te smal."
btree.cos.why: "Zwak. Lees het voorstel nog eens: het deelt het lengtebereik al door cos(lat), en dat is precies die correctie. (Bij de polen loopt die correctie uit de hand, maar dat is een randgeval, niet de fout.)"
btree.corners.text: "Een rechthoek is geen cirkel: de hoeken liggen zo'n 1,4 km van de gebruiker, dus hij levert ook plekken buiten de straal."
btree.corners.why: "Zwak. Klopt, en het kan geen kwaad: de laatste stap houdt alleen rijen over waarvan de exacte afstand onder 1 km ligt. Een grof filter met daarna een exacte controle is het normale patroon; het probleem is hoeveel dat grove filter leest."
btree.floats.text: "B-tree-indexen op floating-pointkolommen kunnen bereikqueries niet betrouwbaar beantwoorden."
btree.floats.why: "Zwak. Een B-tree sorteert floating-pointgetallen net als andere getallen en beantwoordt BETWEEN met een range scan. Met doubles is de afronding aan de rand van het zoekvak ver onder een millimeter."
index.prompt.1: "\"Akkoord: we hebben een index over beide dimensies nodig. We draaien al PostgreSQL, en het team is twee man. Welke kant ga je op?\""
index.postgis.text: "PostGIS in de PostgreSQL die we al draaien: een GiST-index beantwoordt 'binnen 1 km' en sorteert op afstand, en niemand leert een nieuw systeem."
index.postgis.why: "Goed voor dit team, en discutabel, zoals elk antwoord hier. Een GiST-index is een R-tree-achtige index over beide dimensies; ST_DWithin op geography-waarden vindt alles binnen een straal in meters, en read replicas dragen de leeslast. Bouw pas een eigen index als dit aantoonbaar niet meer bijbeent."
index.geohash.text: "Een geohash-kolom met een gewone index: elke database kan dat aan, en één prefixbereik geeft één cel terug."
index.geohash.why: "Ook goed, en discutabel. Een geohash vlecht de bits van lengte- en breedtegraad in één sorteerbare string, dus een gewone B-tree of een sorted set doet het werk (Redis GEO slaat een 52-bit geohash op als score in een sorted set), en hij is makkelijk te sharden op prefix. De nadelen: vaste cellen die geen rekening houden met dichtheid, en de randgevallen uit de volgende rondes."
index.quadtree.text: "Een quadtree in het geheugen van elke zoekserver, die elke cel met meer dan zo'n 100 plekken in vieren deelt."
index.quadtree.why: "Half goed. Een quadtree past zich aan de dichtheid aan, wat vaste cellen niet kunnen, en 100 miljoen punten passen in het geheugen. Maar dan beheren twee mensen een eigen index: bouwen, bijwerken als plekken veranderen en naar elke server kopiëren. Een sterk antwoord voor een groter team of een grotere last; veel voor dit team. Discutabel."
index.noedges.text: "Een quadtree, omdat die geen celranden heeft, dus een zoekopdracht kijkt nooit buiten de cel van de gebruiker."
index.noedges.why: "Zwak: verkeerde reden. Een quadtree heeft ook randen: een zoekopdracht bezoekt elke cel die de zoekcirkel overlapt, en bij een rand zijn dat er meerdere. Hij past de celgrootte aan de dichtheid aan; randen verdwijnen er niet door."
index.prefix.text: "Geohash, omdat plekken die dicht bij elkaar liggen altijd een lang prefix delen, dus één prefixquery op de cel van de gebruiker vindt ze allemaal."
index.prefix.why: "Zwak: verkeerde reden. Een lang gedeeld prefix betekent dichtbij, maar dichtbij betekent geen lang gedeeld prefix. Twee cafés op een paar meter van elkaar, aan weerszijden van de evenaar of de nulmeridiaan, delen helemaal geen prefix, en op elke celgrens is het gedeelde stuk kort. Daarom leest een geohash-zoekopdracht ook de buurcellen."
precision.prompt.1: "\"We gaan voor geohash, dan zie ik of je het snapt. Bij 5 tekens is een cel zo'n 4,9 × 4,9 km; bij 6 zo'n 1,2 km van oost naar west bij 0,6 km van noord naar zuid (op de evenaar).\""
precision.prompt.2: "\"Voor een straal van 1 km: welke precisie, en welke cellen lees je?\""
precision.five.text: "5 tekens: de cel van de gebruiker en zijn 8 buren. Elke cel is meer dan 1 km breed, dus de cirkel kan er nooit buiten komen."
precision.five.why: "Goed. Waar de gebruiker ook staat in de middelste cel, de ring buurcellen voegt in elke richting minstens één hele cel toe, meer dan 1 km. Verder van de evenaar worden cellen smaller van oost naar west (zo'n 3 km op 52 graden noord), maar ze blijven boven 1 km tot ongeveer 78 graden breedte. Negen prefixlookups, volledige resultaten."
precision.six-wide.text: "6 tekens en twee ringen buren, een blok van 5 × 5: 25 lookups, maar in een drukke stad veel minder plekken om te controleren."
precision.six-wide.why: "Ook goed: dit is de afweging tussen straal en precisie. Twee ringen voegen minstens 1,2 km toe naar noord en zuid, en op de evenaar minstens 2,4 km naar oost en west. Op 52 graden noord beslaan de 25 kleine cellen zo'n 11 vierkante km in plaats van zo'n 130 vierkante km, dus in een drukke stad lees je ruwweg een tiende van de plekken. Boven ongeveer 66 graden breedte worden de cellen te smal van oost naar west en moet het blok breder. (Op de evenaar is één ring van oost naar west al genoeg: 3 × 5, 15 cellen.)"
precision.six.text: "6 tekens, de cel van de gebruiker en zijn 8 buren: kleinere cellen, dus minder plekken, en 1 km past nog."
precision.six.why: "Zwak. Een cel van 6 tekens is van noord naar zuid maar zo'n 0,6 km. Een gebruiker bovenin de middelste cel heeft maar één cel van 0,6 km boven zich, dus een café 0,8 km naar het noorden wordt nooit gelezen. Minder kandidaten, maar foute resultaten."
precision.four.text: "4 tekens, de cel van de gebruiker en zijn 8 buren: cellen van zo'n 39 × 20 km, dus niets binnen de straal van 1 km wordt gemist."
precision.four.why: "Half goed. Volledig, maar elke cel heeft zo'n 32 keer de oppervlakte van een cel van 5 tekens, dus een zoekopdracht in een stad kan miljoenen plekken lezen om er twintig terug te geven. Grover is veilig maar verspillend; kies de fijnste precisie waarbij de cellen, samen met de buren die je leest, de straal nog dekken."
precision.seven.text: "7 tekens, alleen de eigen cel van de gebruiker: zo'n 150 × 150 m, dus elk resultaat is dichtbij en het is één lookup."
precision.seven.why: "Zwak. Een cel van 150 m is een snippertje van een cirkel van 1 km, en een gebruiker bij de rand mist zelfs het café aan de overkant. Kleine cellen werken alleen met genoeg ringen buren om de straal te dekken."
ranking.prompt.1: "Ravi schrijft op hoe een collega de resultaten sorteert. \"En wat is hier mis mee?\""
ranking.proposal.1: "Lees de cel van 5 tekens van de gebruiker en zijn 8 buren."
ranking.proposal.2: "Sorteer de kandidaten op hoeveel begintekens van hun geohash van 12 tekens overeenkomen met die van de gebruiker: meer gelijke tekens, dichterbij."
ranking.proposal.3: "Geef de top 20 terug."
ranking.prefix.text: "Een gedeeld prefix is geen afstand: een café 10 m verderop, over een celgrens, kan minder gelijke tekens hebben dan een café op 3 km."
ranking.prefix.why: "Goed. Een gedeeld prefix werkt maar één kant op: een lange overeenkomst betekent dichtbij, maar dichtbij betekent geen lange overeenkomst. Bereken na de cellen voor elke kandidaat de afstand over de bol (haversine; op 1 km is een platte equirectangulaire benadering net zo goed), gooi wat verder dan 1 km ligt weg en sorteer. Cellen zijn het grove filter; afstand bepaalt de volgorde."
ranking.cutoff.text: "Er is geen controle op de straal: plekken die meer dan 10 km verderop in de verre hoeken van de 9 cellen liggen, kunnen in de top 20 belanden."
ranking.cutoff.why: "Half goed. Klopt, en er moet een grens op 1 km komen. Maar zelfs daarmee zet sorteren op gelijke tekens een ver café voor een dichtbij café. De exacte afstand lost allebei op: filter erop, en sorteer erop."
ranking.slow.text: "Strings van 12 tekens vergelijken voor elke kandidaat, duizenden per zoekopdracht, is te traag bij duizenden zoekopdrachten per seconde."
ranking.slow.why: "Zwak. Korte strings vergelijken is goedkoop, en haversine ook: een paar goniometrische aanroepen, tientallen nanoseconden per kandidaat. In een drukke stad kan het aantal kandidaten wel echt gaan kosten (zie de laatste ronde), maar dat los je op met fijnere cellen, niet door op prefix te sorteren. Het probleem hier zijn de foute antwoorden."
ranking.twelve.text: "Alle 12 tekens per plek opslaan verspilt geheugen: de zoekfunctie gebruikt alleen de eerste 5, dus die opslaan zou genoeg zijn."
ranking.twelve.why: "Zwak. Een prefix van een lange geohash is de geohash op die precisie, dus één kolom van 12 tekens bedient elke straal: 5 tekens voor 1 km, 6 voor een dicht blok, 4 voor een straal van zo'n 15 km. Voor een paar bytes per plek krijg je die flexibiliteit."
steps.prompt.1: "\"Goed. Loop nu één zoekopdracht met me door, van de tik tot de lijst. Zet de stappen op volgorde.\""
steps.cell.text: "Bepaal de geohash van de gebruiker op de precisie die bij de straal past: 5 tekens voor 1 km."
steps.cell.why: "Eerst: elke volgende stap begint bij de cel van de gebruiker."
steps.neighbours.text: "Bepaal de 8 cellen eromheen."
steps.neighbours.why: "Daarna: de buren reken je uit vanuit de cel van de gebruiker, je zoekt ze niet op."
steps.fetch.text: "Lees de plekken in die 9 cellen uit de index."
steps.fetch.why: "Dan het grove filter: 9 prefixbereiken, of één gebundelde query, leveren de kandidaten (filter hier op categorie, of hou één index per categorie)."
steps.distance.text: "Bereken voor elke kandidaat de exacte afstand en gooi weg wat verder dan 1 km ligt."
steps.distance.why: "Dan de exacte controle, haversine per kandidaat. Vroeg weggooien laat minder over om te sorteren."
steps.top.text: "Sorteer wat overblijft op afstand en hou de 20 dichtstbijzijnde over."
steps.top.why: "Dan de volgorde. Een heap van 20 doet het zonder alles te sorteren."
steps.details.text: "Haal de namen, foto's en openingstijden van die 20 op."
steps.details.why: "Als laatste: de index bevat alleen id en positie, om klein en snel te blijven. Details voor 20 plekken zijn één lookup op id, en meestal gecachet."
touch.prompt.1: "\"Laatste vraag. Een stad op 52 graden noord, waar een cel van 5 tekens zo'n 3 km breed en 4,9 km hoog is. Stel dat er 500 plekken per vierkante km zijn, over het hele gebied.\""
touch.prompt.2: "\"Met 5 tekens en 9 cellen: hoeveel plekken leest één zoekopdracht ongeveer, vóór de afstandscontrole?\""
touch.working: "Uitwerking: één cel is 3 × 4,9 ≈ 15 vierkante km, dus 9 cellen beslaan zo'n 130 vierkante km. 130 × 500 ≈ 65.000 gelezen plekken. De cirkel van 1 km is pi ≈ 3,1 vierkante km, zo'n 1.600 plekken: één op de veertig overleeft de afstandscontrole. Bij duizenden zoekopdrachten per seconde zijn dat honderd miljoen afstandsberekeningen per seconde of meer, dus drukke gebieden vragen om fijnere cellen (6 tekens in een blok van 5 × 5: zo'n 11 vierkante km, zo'n 5.700 plekken) of een quadtree die volle cellen opsplitst."
touch.lt1k.text: "minder dan 1.000"
touch.lt1k.why: "Te laag. Alleen de cirkel van 1 km bevat al zo'n 1.600 plekken (3,1 vierkante km × 500), en de zoekopdracht leest veel meer dan de cirkel."
touch.circle.text: "1.000 tot 10.000"
touch.circle.why: "Half goed, maar een factor 40 te laag: zoveel bevat de cirkel van 1 km, zo'n 1.600. Maar de zoekopdracht leest eerst alle 9 cellen, zo'n 130 vierkante km, en gooit pas daarna weg wat te ver is."
touch.cells.text: "10.000 tot 100.000"
touch.cells.why: "Goed: zo'n 65.000, dus 40 gelezen plekken voor elke plek binnen 1 km."
touch.wide.text: "100.000 tot 1 miljoen"
touch.wide.why: "Te hoog. Heb je de cellen 4,9 km breed genomen, zoals op de evenaar? Dat geeft 9 × 24 vierkante km × 500 ≈ 108.000. Op 52 graden noord is een cel maar zo'n 3 km breed."
touch.huge.text: "meer dan 1 miljoen"
touch.huge.why: "Veel te hoog: een miljoen plekken bij deze dichtheid vraagt zo'n 2.000 vierkante km aan cellen, ongeveer vier cellen van 4 tekens op deze breedte. De 9 cellen hier beslaan zo'n 130 vierkante km."
hint.index: "Twee mensen, en PostgreSQL draait al. Welke antwoorden geven het minste extra beheer?"
hint.precision: "Een cel moet, samen met de ringen die je leest, de straal in beide richtingen dekken. Van noord naar zuid is een cel van 6 tekens maar 0,6 km."
hint.ranking: "Twee plekken kunnen op een paar meter van elkaar liggen, maar aan weerszijden van een celgrens. Wat doet dat met hun gedeelde prefix?"
hint.touch: "Eerst de oppervlakte: 9 cellen van 3 × 4,9 km. Vermenigvuldig dan met de dichtheid."
hint.breathe: "Rustig aan. Ravi wil de reden achter elke keuze horen: lees het 'omdat' in elke kaart."
won.1: "Ravi doet de dop op zijn stift. \"Buurcellen, exacte afstanden en eerlijke getallen. Als mijn kandidaten het half zo goed doen, ben ik tevreden. Bedankt dat je mijn proefkonijn wilde zijn.\""
lost.1: "\"Laten we hier stoppen.\" Ravi grijnst. \"Interviewen is van beide kanten lastig, zo blijkt. Lees de uitleg, dan doen we het nog een keer wanneer je wilt.\""
