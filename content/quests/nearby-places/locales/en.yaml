title: "Practice interview: places near you"
summary: "Ravi will soon run interviews for his team and wants to practise on you: design the search behind 'cafés near me' for a map app with 100 million places."
offer.1: "Ravi again. From next month I get to interview candidates for my team, and I'd rather practise on someone friendly first."
offer.2: "One design question, played straight: 'cafés near me'. Will you be my candidate?"
active.1: "The whiteboard is ready when you are. Ask before you draw; I'll be taking notes."
done.1: "My first real interview is on Monday. I'm stealing your answer about the neighbour cells."
attacker: "Ravi · backend developer"
intro.1: "Whiteboard interview. Topic: nearby places search."
intro.2: "Ravi straightens his notes and tries to look stern. \"A map app. The user taps 'cafés near me'. Design the search behind that button.\""
clarify.prompt.1: "\"You may ask me two questions before you draw. Which two?\""
clarify.radius.text: "\"Everything within a radius, like 1 km, or the k nearest, however far away they are?\""
clarify.radius.why: "Best. These are different queries. A radius fixes the area, so you know up front which cells to read; the 20 nearest in the countryside may be 30 km away, so a k-nearest search widens ring by ring until it has enough. The answer shapes every later step."
clarify.scale.text: "\"How many places, and how often do they change versus how often we search?\""
clarify.scale.why: "Best. The count decides whether the index fits in one machine's memory; the change rate decides whether you can build the index ahead and copy it. Places that rarely change against constant searching make the system read-heavy: build once, replicate, cache."
clarify.travel.text: "\"Do we rank by straight-line distance, or by the travel time along the roads?\""
clarify.travel.why: "Half right, and debatable. A fair question, but straight-line distance is the usual first answer, and travel time is normally a second pass over the few results, using a routing service. It changes the ranking more than the index. Ask it third."
clarify.tiles.text: "\"Which map style and tile provider will the results be shown on?\""
clarify.tiles.why: "Weak. That is the front end. It says nothing about how to find the places and spends one of your two questions."
clarify.floats.text: "\"Do we store latitude and longitude as doubles, or as fixed-point integers to save memory per place?\""
clarify.floats.why: "Weak, as a first question. A detail to settle later (doubles, or 32-bit fixed-point integers to save memory; both are fine). It tells you nothing about the size or shape of the problem."
btree.prompt.1: "Ravi: \"Radius search, 1 km by default. 100 million places worldwide, rarely changed, thousands of searches a second.\""
btree.prompt.2: "He writes a first idea on the whiteboard. \"What is wrong with it?\""
btree.proposal.1: "One SQL table: places(id, name, lat, lon)."
btree.proposal.2: "A B-tree index on lat, and a second B-tree index on lon."
btree.proposal.3: "Query: lat within 0.009 degrees of the user (1 km), lon within 0.009 degrees / cos(lat); then keep the rows whose exact distance is under 1 km."
btree.band.text: "Each index alone selects a band right around the planet, so the query reads a whole strip of the Earth to answer for one neighbourhood."
btree.band.why: "Best. A latitude range of plus or minus 0.009 degrees is a strip about 2 km high that circles the whole Earth; a longitude range is a strip from pole to pole. The database uses one index and filters the strip row by row, or intersects two large sets of row ids; either way the work grows with the strip, not the answer. A composite index on (lat, lon) does not fix it: the range on lat comes first, so lon is only filtered inside the strip. You need an index over both dimensions at once: geohash, a quadtree or an R-tree."
btree.cos.text: "It forgets that a degree of longitude shrinks away from the equator, so the box is too narrow."
btree.cos.why: "Weak. Read the proposal again: it already divides the longitude range by cos(lat), which is exactly that correction. (Near the poles the correction blows up, but that is an edge case, not the flaw.)"
btree.corners.text: "A box is not a circle: its corners lie about 1.4 km from the user, so it returns places beyond the radius."
btree.corners.why: "Weak. True, and harmless: the last step keeps only the rows whose exact distance is under 1 km. A coarse filter followed by an exact check is the normal pattern; the problem is how much the coarse filter reads."
btree.floats.text: "B-tree indexes on floating-point columns cannot answer range queries reliably."
btree.floats.why: "Weak. A B-tree orders floating-point numbers like any other and answers BETWEEN with a range scan. With doubles, rounding at the edge of the box is far below a millimetre."
index.prompt.1: "\"Agreed: we need an index over both dimensions. We already run PostgreSQL, and the team is two people. Which way do you go?\""
index.postgis.text: "PostGIS in the PostgreSQL we already run: a GiST index answers 'within 1 km' and orders by distance, and nobody learns a new system."
index.postgis.why: "Best for this team, and debatable, like every answer here. A GiST index is an R-tree-like index over both dimensions; ST_DWithin on geography values finds everything within a radius in metres, and read replicas carry the read-heavy load. Build your own index only when this measurably cannot keep up."
index.geohash.text: "A geohash column with an ordinary index: any database can serve it, and one prefix range returns one cell."
index.geohash.why: "Best too, and debatable. A geohash interleaves the bits of longitude and latitude into one sortable string, so a plain B-tree or a sorted set does the work (Redis GEO stores a 52-bit geohash as a sorted-set score), and it shards easily by prefix. The costs: fixed cells that ignore density, and the edge cases of the next rounds."
index.quadtree.text: "An in-memory quadtree on every search server, splitting any cell that holds more than about 100 places into four."
index.quadtree.why: "Half right. A quadtree adapts to density, which fixed cells cannot, and 100 million points fit in memory. But two people would then own a custom index: building it, patching it as places change and copying it to every server. A strong answer for a bigger team or a bigger load; a lot for this one. Debatable."
index.noedges.text: "A quadtree, because it has no cell edges, so a search never looks past the user's own cell."
index.noedges.why: "Weak: wrong reason. A quadtree has edges too: a search visits every cell that overlaps the search circle, and near an edge that is several. It adapts the cell size to the density; it does not make borders go away."
index.prefix.text: "Geohash, because places that are close together always share a long prefix, so a single prefix query on the user's cell finds them all."
index.prefix.why: "Weak: wrong reason. A long shared prefix means close, but close does not mean a long shared prefix. Two cafés a few metres apart on either side of the equator or the prime meridian share no prefix at all, and on any cell border the shared part is short. That is why a geohash search also reads the neighbouring cells."
precision.prompt.1: "\"Let's go with geohash, so I can see that you understand it. At 5 characters a cell is about 4.9 × 4.9 km; at 6, about 1.2 km east to west by 0.6 km north to south (at the equator).\""
precision.prompt.2: "\"For a 1 km radius: which precision, and which cells do you read?\""
precision.five.text: "5 characters: the user's cell and its 8 neighbours. Each cell is over 1 km across, so the circle stays inside them."
precision.five.why: "Best. Wherever the user stands in the middle cell, the ring of neighbours adds at least one whole cell, more than 1 km, in every direction. Away from the equator cells get narrower east to west (about 3 km at 52 degrees north) but stay above 1 km up to about 78 degrees latitude. Nine prefix lookups, complete results."
precision.six-wide.text: "6 characters and two rings of neighbours, a 5 × 5 block: 25 lookups, but in a busy city far fewer places to check."
precision.six-wide.why: "Best too: this is the radius-versus-precision trade-off. Two rings add at least 1.2 km north and south and at least 2.4 km east and west at the equator. At 52 degrees north the 25 small cells cover about 11 square km instead of about 130 square km, so a dense city reads roughly a tenth of the places. Beyond about 66 degrees latitude the cells get too narrow east to west and the block must widen."
precision.six.text: "6 characters, the user's cell and its 8 neighbours: smaller cells, so fewer places, and 1 km still fits."
precision.six.why: "Weak. A 6-character cell is only about 0.6 km from north to south. A user near the top of the middle cell has just one 0.6 km cell above them, so a café 0.8 km to the north is never read. Fewer candidates, but wrong results."
precision.four.text: "4 characters, the user's cell and its 8 neighbours: cells of about 39 × 20 km, so nothing within the radius is ever missed."
precision.four.why: "Half right. Complete, but each cell has about 32 times the area of a 5-character cell, so a search in a city can read millions of places to return twenty. Coarser is safe but wasteful; aim for the finest precision whose cells, with the neighbours you read, still cover the radius."
precision.seven.text: "7 characters, only the user's own cell: about 150 × 150 m, so every result is close and it is one lookup."
precision.seven.why: "Weak. A 150 m cell is a sliver of a 1 km circle, and a user near its edge misses even the café across the street. Small cells only work with enough rings of neighbours to cover the radius."
ranking.prompt.1: "Ravi writes up how a colleague ranks the results. \"And what is wrong with this?\""
ranking.proposal.1: "Read the user's 5-character cell and its 8 neighbours."
ranking.proposal.2: "Rank the candidates by how many leading characters of their 12-character geohash match the user's: more matching characters, closer."
ranking.proposal.3: "Return the top 20."
ranking.prefix.text: "A matching prefix is not a distance: a café 10 m away across a cell border can match fewer characters."
ranking.prefix.why: "Best. A shared prefix only works one way: a long match means close, but close does not mean a long match. After the cells, compute each candidate's great-circle distance (haversine; at 1 km a flat equirectangular approximation is just as good), drop those beyond 1 km and sort. Cells are the coarse filter; distance is the ranking."
ranking.cutoff.text: "There is no radius check: places more than 10 km away, in the far corners of the 9 cells, can still end up in the top 20."
ranking.cutoff.why: "Half right. True, and it needs a cut-off at 1 km. But even with one, ranking by matching characters puts a far café ahead of a near one. The exact distance fixes both: filter on it, then sort by it."
ranking.slow.text: "Comparing 12-character strings for every candidate, thousands per search, is too slow at thousands of searches a second."
ranking.slow.why: "Weak. Comparing short strings is cheap, and so is haversine: a handful of floating-point operations per candidate, well under a millisecond for thousands. The cost of this design is wrong answers, not speed."
ranking.twelve.text: "Storing all 12 characters per place wastes memory: the search only ever uses the first 5, so storing those would be enough."
ranking.twelve.why: "Weak. A prefix of a long geohash is the geohash at that precision, so one 12-character column serves every radius: 5 characters for 1 km, 6 for a dense block, 4 for a radius of about 15 km. A few bytes per place buy that flexibility."
steps.prompt.1: "\"Good. Now take me through one search, from the tap to the list. Put the steps in order.\""
steps.cell.text: "Work out the user's geohash at the precision that fits the radius: 5 characters for 1 km."
steps.cell.why: "First: every later step starts from the user's cell."
steps.neighbours.text: "Work out the 8 cells around it."
steps.neighbours.why: "Next: the neighbours are computed from the user's cell, not looked up."
steps.fetch.text: "Read the places in those 9 cells from the index."
steps.fetch.why: "Then the coarse filter: 9 prefix ranges, or one batched query, return the candidates."
steps.distance.text: "Compute each candidate's exact distance and drop those beyond 1 km."
steps.distance.why: "Then the exact check, haversine per candidate. Dropping early leaves less to sort."
steps.top.text: "Sort what is left by distance and keep the closest 20."
steps.top.why: "Then the ranking. A heap of 20 does it without sorting everything."
steps.details.text: "Fetch the names, photos and opening hours of those 20."
steps.details.why: "Last: the index holds only the id and position, to stay small and fast. Details for 20 places are one lookup by id, and usually cached."
touch.prompt.1: "\"Last one. A city at 52 degrees north, where a 5-character cell is about 3 km wide and 4.9 km high. Say there are 500 places per square km, across the whole area.\""
touch.prompt.2: "\"With 5 characters and 9 cells, about how many places does one search read before the distance check?\""
touch.working: "Working: one cell is 3 × 4.9 ≈ 15 square km, so 9 cells cover about 130 square km. 130 × 500 ≈ 65,000 places read. The 1 km circle is pi ≈ 3.1 square km, about 1,600 places: one in forty survives the distance check. At thousands of searches a second that is a hundred million distance checks a second or more, so busy areas want finer cells (6 characters in a 5 × 5 block: about 11 square km, some 5,700 places) or a quadtree that splits crowded cells."
touch.lt1k.text: "under 1,000"
touch.lt1k.why: "Too low. The 1 km circle alone holds about 1,600 places (3.1 square km × 500), and the search reads far more than the circle."
touch.circle.text: "1,000 to 10,000"
touch.circle.why: "Close: that is what the 1 km circle holds, about 1,600. But the search reads all 9 cells first, about 130 square km, and only then drops what is too far."
touch.cells.text: "10,000 to 100,000"
touch.cells.why: "Right: about 65,000, which is 40 places read for every one within 1 km."
touch.wide.text: "100,000 to 1 million"
touch.wide.why: "Too high. Did you take the cells as 4.9 km wide, as at the equator? That gives 9 × 24 square km × 500 ≈ 108,000. At 52 degrees north a cell is only about 3 km wide."
touch.huge.text: "over 1 million"
touch.huge.why: "Far too high: a million places at this density would need about 2,000 square km of cells, the size of 4-character cells. The 9 cells here cover about 130 square km."
hint.index: "Two people, and PostgreSQL already running. Which answers add the least to look after?"
hint.precision: "A cell must cover the radius in both directions, together with the rings you read. North to south, a 6-character cell is only 0.6 km."
hint.ranking: "Two places can be metres apart but on either side of a cell border. What does that do to their shared prefix?"
hint.touch: "Area first: 9 cells of 3 × 4.9 km. Then multiply by the density."
hint.breathe: "Slow down. Ravi wants the reason behind each choice: read the 'because' in every card."
won.1: "Ravi caps his marker. \"Neighbour cells, exact distances and honest numbers. If my candidates do half as well, I'll be happy. Thanks for being my test subject.\""
lost.1: "\"Let's stop here.\" Ravi grins. \"Interviewing is hard from both sides, it turns out. Read the explanations, and we'll go again whenever you like.\""
