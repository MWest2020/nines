title: "De snoepautomaatklus"
summary: "Vince, achter het kantoor, betaalt €350 voor de prijslijst van een concurrent. Veel geld, karma omlaag, en misschien leest iemand de logs."
offer.1: "Psst. Hier, achter de container. Ik ben Vince. Ik breng mensen die iets nodig hebben samen met mensen die dingen kunnen vinden."
offer.2: "Mijn klant verkoopt snacks uit automaten. Hij wil de prijzen van een concurrent voor 2027. Hun 'openbare' bestandsshare is iets openbaarder dan ze denken."
offer.3: "€350, geen vragen. De laptop op de krat is een gedeelde kiosk. Wees snel, wees stil, en laat je naam er niet op achter."
active.1: "Choco Bar en Cola, de prijzen van 2027, in het dropbestand. En log uit op die kiosk voordat je dropt. Ik ken jou niet."
done.1: "Prettig zakendoen. Jij was hier nooit. Ik ook niet."
done.2: "Grappig trouwens. Munchr heeft een security.txt. Er zijn mensen die betaald krijgen om bedrijven over open mappen te vertellen. Rare mensen."
npc.name: "Vince"
npc.idle: "Mooie dag ervoor. Waarvoor? Precies."
npc.too_clean: "Jij? Met die LinkedIn-glans? Nee. Ga een firewall knuffelen."
npc.after: "Er komt meer werk, zodra mijn andere zzp'ers weer uit het... kantoor zijn. Grapje. Grotendeels."
motd: "kiosk-07, de gedeelde kiosk van de flexplek. Ingelogd als guest (bibliotheekpas 4417). Het briefje van Vince staat in ~/job.txt."
obj.drop: "de prijzen van 2027 voor de Choco Bar en de Cola staan in ~/drop/for-vince.txt"
hint.look: "Het briefje zegt waar de share van Munchr staat. ls laat zien wat erin zit."
hint.readme: "Lees de README in de share: die vertelt je bijna letterlijk welke map niet openbaar hoort te zijn."
hint.drop: "Prijzen gevonden. Log eerst uit (het hittepaneel laat zien wat je nog verraadt), dan edit ~/drop/for-vince.txt en opslaan."
event.hr: "Hun HR-map? Dat is niet eens de klus. Niemand heeft het salaris van Dave nodig om chips te verkopen."
event.drop_gone: "Je hebt het dropbestand verwijderd. Ergens achter een container zucht Vince. De kiosk zet zichzelf terug."
risk.snooped: "je hebt in hun HR-map gezeten"
risk.took: "je hebt hun prijslijst meegenomen in plaats van gelezen: dat merken ze voor de lunch"
risk.beeping: "de kiosk piept bij elk mislukt commando"
risk.dawdling: "je hangt al eeuwen over de kiosk; de barista staart"
risk.signed_in: "nog ingelogd met je eigen bibliotheekpas"
