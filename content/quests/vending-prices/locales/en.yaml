title: "The vending machine job"
summary: "Vince, behind the office, pays €350 for a competitor's price list. Big money, karma down, and somebody might be reading the logs."
offer.1: "Psst. Over here, behind the bin. Name's Vince. I connect people who need things with people who can find things."
offer.2: "My client sells snacks from vending machines. He wants a competitor's 2027 prices. Their 'public' file share is a bit more public than they think."
offer.3: "€350, no questions. The laptop on the crate is a shared kiosk. Be quick, be quiet, and don't leave your name on it."
active.1: "Choco Bar and Cola, the 2027 prices, in the drop file. And sign out of that kiosk before you drop. I don't know you."
done.1: "Pleasure doing business. You were never here. Neither was I."
done.2: "Funny thing. Munchr has a security.txt. Some people get paid for telling companies about open folders. Weird people."
npc.name: "Vince"
npc.idle: "Nice day for it. For what? Exactly."
npc.too_clean: "You? With that LinkedIn glow? Nah. Go hug a firewall."
npc.after: "More work coming, once my other contractors are out of... the office. Kidding. Mostly."
motd: "kiosk-07, the co-working space's shared kiosk. Signed in as guest (library card 4417). Vince's note is in ~/job.txt."
obj.drop: "the 2027 Choco Bar and Cola prices are in ~/drop/for-vince.txt"
hint.look: "The note says where Munchr's share is mounted. ls shows what's in it."
hint.readme: "Read the README in the share: it practically tells you which folder should not be public."
hint.drop: "Prices found. Sign out first (the heat panel shows what still gives you away), then edit ~/drop/for-vince.txt and save."
event.hr: "Their HR folder? That's not even the job. Nobody needs Dave's salary to sell crisps."
event.drop_gone: "You deleted the drop file. Vince sighs somewhere behind a bin. The kiosk resets itself."
risk.snooped: "you went through their HR folder"
risk.took: "you took their price list instead of reading it: they notice by lunch"
risk.beeping: "the kiosk beeps at every failed command"
risk.dawdling: "you've been hunched over the kiosk for ages; the barista is staring"
risk.signed_in: "still signed in with your own library card"
