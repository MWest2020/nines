title: "900 regels, vandaag nog"
summary: "Lars, de senior developer, wil zijn grote pull request goedgekeurd hebben voor de demo van morgen. Een feature, een refactor en een dependency-update, allemaal in één."
offer.1: "Lars. Ik hoor dat jij code kunt lezen. Mooi, want ik heb een pull request dat een tweede paar ogen nodig heeft."
offer.2: "Het is een flinke. Vandaag nog, als het kan. Pak een stoel."
active.1: "Het PR staat nog open, en is nog steeds 900 regels. Zeg het maar als je klaar bent."
done.1: "Ik moet iets bekennen: ik heb hem expres zo groot gemaakt. Jij hebt hem opgesplitst, op de juiste dingen geblokkeerd en bent vriendelijk gebleven. Zo ziet een reviewer eruit."
npc.name: "Lars"
npc.nopath: "Nieuw in Mediorstad? Ga eerst even naar Joyce, de loopbaancoach bij het Career Centre. Als je een pad hebt gekozen, kom dan terug, dan lezen we samen wat code."
npc.mentor.1: "Dus jij gaat voor Software Engineer. Dan ben ik je mentor: code, ontwerpen, en de reviews die ze eerlijk houden."
npc.mentor.2: "Eerste les: een review is een gesprek, geen stempel. Kom maar oefenen op een van de mijne."
npc.side: "Niet jouw pad, maar welkom. Elke engineer reviewt vroeg of laat code, dus doe deze maar als zijquest."
npc.after: "De drie kleine PR's gingen er netjes na elkaar in, en de demo draaide vanaf de branch. Niemand weet nog van die versie met 900 regels. Mooi zo."
attacker: "Lars · senior developer"
intro.1: "Binnengekomen: reviewverzoek van Lars · PR #482 · +870 -34 · \"checkout: discounts, refactor, bump deps\""
intro.2: "Lars buigt zich over je bureau: \"De demo is morgen om tien uur. Alles is getest, grotendeels. Kun je hem vandaag goedkeuren?\""
ask.prompt.1: "Voor je ook maar één regel leest, mag je twee vragen stellen. Welke twee?"
ask.goal.text: "\"Welk probleem lost het op, en wat moet er morgen in de demo precies werken?\""
ask.goal.why: "Goed. Het doel vertelt je wat je goed moet lezen, en de demo vertelt je wat er echt morgen in moet. Vaak is dat veel minder dan het hele PR."
ask.map.text: "\"Welke delen veranderen wat de code doet, en welke verplaatsen alleen code?\""
ask.map.why: "Goed. Dat is de plattegrond van je review. Gedragswijzigingen vragen zorgvuldig lezen en tests; puur verplaatste code vraagt alleen een snelle check dat er verder niets veranderde. Door elkaar moet je alles lezen alsof het riskant is."
ask.changelog.text: "\"Welke libraries heb je geüpdatet, hoeveel versies omhoog, en staan er breaking changes in hun changelogs?\""
ask.changelog.why: "Half goed. Een goede vraag voor het dependency-deel, maar het is een detail. Begrijp eerst waar het PR voor is en hoe het is opgebouwd, en duik dan pas in één deel."
ask.late.text: "\"Waarom zie ik dit nu pas, de dag voor je demo, en niet vorige week toen je eraan begon?\""
ask.late.why: "Zwak. Misschien een terecht punt voor een retrospective, maar nu maakt het Lars alleen defensief en het vertelt je niets over de code."
ask.lint.text: "\"Kun je eerst de formatter draaien, zodat de diff schoon is?\""
ask.lint.why: "Zwak. Stijlwaarschuwingen zijn werk voor een tool en een klein puntje. Als je daar eerst om vraagt, laat je zien dat je de komma's gaat reviewen, niet de logica."
split.prompt.1: "Lars: \"De feature is nieuwe kortingscodes. Toen ik er toch zat, heb ik de checkoutmodule opgeruimd, en de betaallibrary moest sowieso een update.\""
split.prompt.2: "\"Opsplitsen is bezigheidstherapie. Wat zou je überhaupt opsplitsen?\""
split.three.text: "\"Drie PR's: de refactor die geen gedrag verandert, de update apart, en dan de kortingsfeature erbovenop.\""
split.three.why: "Goed. Elk PR heeft één reden van bestaan en één manier om mis te gaan. De refactor check je tegen ongewijzigde tests, de update tegen de changelog en CI, en de feature krijgt de zorgvuldige leesbeurt. Elk deel kun je ook los terugdraaien."
split.two.text: "\"Twee PR's: de update apart, en de refactor met de feature samen, omdat ze dezelfde bestanden raken.\""
split.two.why: "Half goed. De update apart zetten is goed, maar een refactor gemengd met een gedragswijziging verstopt die wijziging: elke verplaatste regel kan een bug zijn, dus de reviewer moet alles nauwkeurig lezen."
split.commits.text: "\"Hou het bij één PR, maar ruim de geschiedenis op zodat ik commit voor commit kan reviewen.\""
split.commits.why: "Half goed, en daarover verschillen de meningen. Nette commits helpen een reviewer zeker, en sommige teams werken zo. Maar CI en de merge zien het nog steeds als één wijziging, dus één revert neemt alle drie de delen mee."
split.folders.text: "\"Splits het per map: de backendbestanden in het ene PR, de frontendbestanden in het andere, elk een eigen reviewer.\""
split.folders.why: "Zwak. Een splitsing per map snijdt elke wijziging doormidden: geen van beide PR's werkt los, en geen enkele reviewer ziet de hele kortingsfeature of de hele update."
block.prompt.1: "In de feature vind je drie dingen: het kortingstotaal, in centen, heeft geen test; de opzoekfunctie voor kortingscodes bouwt zijn SQL door de tekst van de gebruiker in de query te plakken; de ene functie heet calcTotal en de functie ernaast computeSum."
block.prompt.2: "\"Welke daarvan blokkeren?\" Hoe schrijf je je review op?"
block.both.text: "Vraag wijzigingen voor de ontbrekende test en de geplakte SQL; markeer de naamgeving als nit, niet als blocker."
block.both.why: "Goed. Ongeteste geldcode bepaalt wat klanten betalen, en SQL die uit gebruikersinvoer aan elkaar wordt geplakt is een injectielek; allebei kunnen ze na de merge echte schade doen. Naamgeving is een opmerking waard, maar hoeft een merge nooit tegen te houden, en het label nit zegt precies dat."
block.all.text: "Vraag wijzigingen voor alle drie: op de lange termijn kosten slechte namen net zoveel als een ontbrekende test."
block.all.why: "Zwak. Blokkeren op naamgeving zet stijl op hetzelfde niveau als een beveiligingslek, en leert de auteur je blockers te negeren. Bewaar blokkeren voor wat gebruikers of data kan schaden."
block.sql.text: "Vraag alleen wijzigingen voor de SQL, en accepteer meteen na de demo een vervolg-PR met de kortingstests."
block.sql.why: "Half goed. De SQL moest geblokkeerd worden, maar de test voor geldcode hoort in hetzelfde PR: een vervolg na een demo schuift vaak op, en dan bereikt de bug eerst de klanten."
block.approve.text: "Keur goed, met drie opmerkingen voor later: Lars is senior en kent deze code het best."
block.approve.why: "Zwak. Senioriteit maakt code niet veilig, en een goedkeuring vertelt het team dat jij het gecontroleerd hebt. Senioren maken ook fouten; daar zijn reviews voor."
flag.prompt.1: "Lars: \"Goed, ik hoor je. Hier is een deal in plaats van opsplitsen:\""
flag.prompt.2: "\"Nu is het veilig, toch?\""
flag.proposal.1: "Ik zet de nieuwe kortingscode achter een feature flag, standaard uit."
flag.proposal.2: "Dan kan het hele PR vandaag zonder risico gemerged worden."
flag.everyone.text: "De flag verbergt alleen het kortingspad; de refactor en de nieuwe library draaien voor elke klant."
flag.everyone.why: "Goed. Een flag schakelt de code die hij omsluit, meer niet. De omgegooide checkoutmodule en de geüpdatete betaallibrary staan voor iedereen live zodra het gemerged is, flag aan of uit."
flag.debt.text: "Elke flag is een vertakking in de code die iemand later moet opruimen, en oude flags stapelen zich op tot dode code."
flag.debt.why: "Half goed. Klopt, en het opruimen moet je plannen, maar daarom faalt dit voorstel niet: de flag dekt juist de delen met het meeste verborgen risico niet af."
flag.money.text: "Feature flags zijn niet toegestaan rond code die betalingen raakt."
flag.money.why: "Zwak. Zo'n regel bestaat niet; flags zijn juist een gangbare manier om betaalfeatures veilig uit te rollen. Het probleem is wat de flag niet afdekt."
flag.bigger.text: "Een flag maakt een PR dat al veel te groot is om te reviewen nog groter."
flag.bigger.why: "Zwak. Een flag is een paar regels. De omvang is een symptoom; het echte probleem is drie losse wijzigingen die je niet apart kunt controleren of terugdraaien."
land.prompt.1: "Lars gaat akkoord met opsplitsen. In welke volgorde gaan de delen erin? Zet de stappen op volgorde."
land.bump.text: "De dependency-update apart mergen, als CI slaagt en de changelogs gelezen zijn."
land.bump.why: "Eerst, naast de refactor: de update staat los van beide andere delen. Gaat er daarna iets mis, dan wijst dat meteen naar de library."
land.refactor.text: "De refactor mergen, met de bestaande tests ongewijzigd en groen."
land.refactor.why: "Eerst, naast de update; welke van de twee voorgaat maakt niet uit. Ongewijzigde tests die nog steeds slagen zijn het bewijs dat de refactor geen gedrag verandert."
land.feature.text: "De kortingsfeature mergen, met tests en een geparametriseerde query, gerebased op beide."
land.feature.why: "Dan de feature, bovenop de opgeruimde code. Nu laat de diff alleen de gedragswijziging zien, dus de review kan zich richten op het geld en de query."
land.demo.text: "Deployen met de kortingsflag alleen aan voor collega's, en de demo geven."
land.demo.why: "Dan de demo, op gereviewde code, met de flag die bepaalt wie het ziet."
land.cleanup.text: "De flag weghalen zodra de kortingen voor iedereen goed draaien."
land.cleanup.why: "Als laatste: de flag opruimen, zodat hij geen dode code wordt."
time.prompt.1: "Lars: \"Hoe lang had een echte review van die versie met 900 regels eigenlijk geduurd?\""
time.prompt.2: "De vuistregel van je team, discutabel maar jullie gebruiken hem: zo'n 300 regels per uur bij zorgvuldig lezen, en niet langer dan een uur achter elkaar."
time.working: "Uitwerking: 900 regels met zo'n 300 regels per uur is 900 / 300 = 3 uur zorgvuldig lezen, dus drie sessies van een uur, verspreid over een dag. Opgesplitst in drie PR's van een paar honderd regels past elk in één sessie. De getallen zijn een vuistregel, geen wet: de snelheid hangt af van de code en de lezer. Veel teams merken dat de aandacht wegzakt bij diffs van meer dan een paar honderd regels, en dat is het echte argument voor kleine PR's."
time.skim.text: "minder dan een half uur"
time.skim.why: "Te weinig voor zorgvuldig lezen. Een half uur op 900 regels is vluchtig doorbladeren, en zo glipt de geplakte SQL erdoor."
time.hour.text: "een half uur tot 2 uur"
time.hour.why: "Te weinig. Met zo'n 300 regels per uur kosten 900 regels 3 uur, nog voor er iets besproken is."
time.afternoon.text: "2 tot 5 uur"
time.afternoon.why: "Goed: ongeveer 3 uur zorgvuldig lezen, in drie sessies. Daarom blijft zo'n PR dagen in de wachtrij liggen, terwijl een PR van 300 regels dezelfde middag gelezen wordt."
time.days.text: "5 tot 15 uur"
time.days.why: "Half goed. Vragen en een tweede reviewronde kosten zeker extra tijd, maar het lezen zelf is volgens je eigen vuistregel ongeveer 3 uur."
time.week.text: "16 uur of meer"
time.week.why: "Te veel voor wat je weet. Grote PR's voelen eindeloos, maar volgens je eigen getallen is het lezen ongeveer 3 uur."
demo.prompt.1: "Lars: \"Opsplitsen en alle drie reviewen kost me een halve dag, en de demo is morgen om tien uur.\""
demo.prompt.2: "\"Keur hem nou gewoon goed, voor één keer. Ik trakteer op koffie.\""
demo.branch.text: "\"Voor de demo hoeft het niet in main. Demo je branch op staging, en laten we het nu samen opsplitsen.\""
demo.branch.why: "Goed. Zo haal je de twee doelen uit elkaar: de demo heeft een draaiende build nodig, geen merge. Samen opsplitsen kost een uur, maakt je reviews snel, en Lars krijgt zijn demo zonder een stempel van niks."
demo.skim.text: "\"Oké, goedgekeurd. Ik loop de SQL en de tests morgen na je demo zelf nog wel even goed na.\""
demo.skim.why: "Zwak. Een goedkeuring zegt dat jij het gecontroleerd hebt. Na de merge staat de geplakte SQL live, en 'morgen, goed' komt er zelden van."
demo.wall.text: "\"Nee. Niet tot het opgesplitst is, en dan leg jij het team maar uit waarom de demo uitliep.\""
demo.wall.why: "Half goed. Je beschermt de codebase, maar je laat Lars alleen met zijn deadline. Goed nee zeggen komt met een uitweg."
demo.favour.text: "\"Keur het goed, maar ik zet in het PR dat ik er alleen vluchtig naar keek, dus het blijft jouw keuze.\""
demo.favour.why: "Zwak. Het lijkt een review maar is het niet. Het team ziet een goedkeuring, en de waarschuwing verdwijnt in een opmerking die niemand leest."
hint.ask: "Zoek voordat je de code beoordeelt eerst uit waar hij voor is en hoe hij is opgebouwd."
hint.split: "Elk PR hoort één reden van bestaan te hebben en los terug te draaien te zijn."
hint.block: "Blokkeer op wat gebruikers of data kan schaden. Stijl is een opmerking, geen slagboom."
hint.land: "Wijzigingen die geen gedrag veranderen gaan eerst; de feature komt daarbovenop."
hint.kind: "Lars is de vijand niet; hij heeft een demo. Zoek het ja waar geen stempel van niks voor nodig is."
won.1: "Lars grijnst. \"Drie kleine PR's, twee echte blockers, één nit, en een demo vanaf de branch. Je zou versteld staan hoe weinig mensen dat vinden.\""
lost.1: "Lars merget het met de goedkeuring van iemand anders, en jullie weten allebei wat dat betekent. Laten we die review nog eens doen; de uitleg laat zien waar het misging."
