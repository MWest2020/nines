title: "900 lines, due today"
summary: "Lars, the senior developer, wants his big pull request approved before tomorrow's demo. A feature, a refactor and a dependency bump, all in one."
offer.1: "Lars. I hear you can read code. Good, because I've got a pull request that needs a second pair of eyes."
offer.2: "It's a big one. Today, if possible. Pull up a chair."
active.1: "The PR is still open, and still 900 lines. Ready when you are."
done.1: "I'll confess: I made it that big on purpose. You split it, you blocked on the right things, and you stayed kind. That's a reviewer."
npc.name: "Lars"
npc.nopath: "New in Medior City? See Petra, the career coach by the Career Office, first. Once you've picked a path, come back and we'll read some code together."
npc.mentor.1: "So you're going the Software Engineer way. Then I'm your mentor: code, designs, and the reviews that keep them honest."
npc.mentor.2: "First lesson: a review is a conversation, not a stamp. Come and practise on one of mine."
npc.side: "Not your path, but welcome. Every engineer reviews code sooner or later, so take this one as a side quest."
npc.after: "The three small PRs went in one after another, and the demo ran from the branch. Nobody remembers the 900-line version. Good."
attacker: "Lars · senior developer"
intro.1: "Incoming: review request from Lars · PR #482 · +870 -34 · \"checkout: discounts, refactor, bump deps\""
intro.2: "Lars leans over your desk: \"The demo is tomorrow at ten. It's all tested, mostly. Can you approve it today?\""
ask.prompt.1: "Before you read a single line, you get two questions. Which two?"
ask.goal.text: "\"What problem does it solve, and what exactly must work in tomorrow's demo?\""
ask.goal.why: "Best. The goal tells you what to read closely, and the demo tells you what really has to land by tomorrow. Often it is much less than the whole PR."
ask.map.text: "\"Which parts change what the code does, and which only move code around?\""
ask.map.why: "Best. That is the map of the review. Behaviour changes need careful reading and tests; pure moves need a quick check that nothing else changed. Mixed together, you have to read everything as if it were risky."
ask.changelog.text: "\"Which libraries did you bump, by how many versions, and do their changelogs mention breaking changes?\""
ask.changelog.why: "Half right. A good question for the dependency part, but it is a detail. First understand what the PR is for and how it is built up, then dig into one part."
ask.late.text: "\"Why do I only see this now, the day before your demo, and not last week when you started on it?\""
ask.late.why: "Weak. It may be a fair point for a retrospective, but now it only makes Lars defensive and tells you nothing about the code."
ask.lint.text: "\"Can you run the formatter first, so the diff is clean?\""
ask.lint.why: "Weak. Style warnings are a tool's job and a minor nit. Asking for them first signals that you will review the commas, not the logic."
split.prompt.1: "Lars: \"The feature is new discount codes. While I was in there I cleaned up the checkout module, and the payment library needed a bump anyway.\""
split.prompt.2: "\"Splitting is busywork. What would you even split?\""
split.three.text: "\"Three PRs: the refactor that changes no behaviour, the bump alone, then the discount feature on top.\""
split.three.why: "Best. Each PR has one reason to exist and one way to fail. The refactor can be checked against unchanged tests, the bump against the changelog and CI, and the feature gets the careful read. Each can also be reverted alone."
split.two.text: "\"Two PRs: the bump on its own, and the refactor plus the feature together, since they touch the same files.\""
split.two.why: "Half right. Isolating the bump is good, but a refactor mixed with a behaviour change hides that change: every moved line looks like a possible bug, so the reviewer has to read all of it closely."
split.commits.text: "\"Keep one PR, but clean up the history so I can review it commit by commit.\""
split.commits.why: "Half right, and debatable. Clean commits do help a reviewer, and some teams work this way. But CI and the merge still treat it as one change, so one revert takes all three parts with it."
split.folders.text: "\"Split it by folder: the backend files in one PR, the frontend files in another, one reviewer each.\""
split.folders.why: "Weak. A split by folder cuts every change in half: neither PR works alone, and neither reviewer sees the whole of the discount feature or the bump."
block.prompt.1: "In the feature you find three things: the discount total, in cents, has no test; the discount-code lookup builds its SQL by pasting the user's text into the query; one function is called calcTotal and its neighbour computeSum."
block.prompt.2: "\"Which of those are blocking?\" How do you write up your review?"
block.both.text: "Request changes for the missing test and the pasted SQL; mark the naming as a nit, not a blocker."
block.both.why: "Best. Untested money code decides what customers pay, and SQL glued together from user input is an injection hole; either can do real harm after the merge. Naming is worth a comment, but it never has to stop a merge, and labelling it a nit says so."
block.all.text: "Request changes for all three: in the long run, bad names cost as much as a missing test."
block.all.why: "Weak. Blocking on naming puts style on the same level as a security hole, and teaches the author to ignore your blockers. Keep blocking for what can hurt users or data."
block.sql.text: "Request changes for the SQL only, and accept a follow-up PR with the discount tests right after the demo."
block.sql.why: "Half right. The SQL had to be blocked, but the test for money code belongs in the same PR: a follow-up after a demo tends to slip, and the bug would reach customers first."
block.approve.text: "Approve, with three comments for later: Lars is senior and knows this code best."
block.approve.why: "Weak. Seniority does not make code safe, and an approval tells the team you checked it. Senior people make mistakes too; that is what reviews are for."
flag.prompt.1: "Lars: \"Fine, I hear you. Here's a deal instead of splitting:\""
flag.prompt.2: "\"Safe now, right?\""
flag.proposal.1: "I'll put the new discount code behind a feature flag, off by default."
flag.proposal.2: "Then the whole PR can merge today without any risk."
flag.everyone.text: "The flag only hides the discount path; the refactor and the new library run for every customer."
flag.everyone.why: "Best. A flag switches the code it wraps, nothing more. The reshuffled checkout module and the bumped payment library are live for everyone the moment it merges, flag on or off."
flag.debt.text: "Every flag is a branch someone has to remove later, so old flags pile up into dead code."
flag.debt.why: "Half right. True, and worth planning the cleanup, but it is not why this proposal fails: the flag does not cover the parts that carry the most hidden risk."
flag.money.text: "Feature flags are not allowed around code that touches payments."
flag.money.why: "Weak. There is no such rule; flags are a common way to release payment features safely. The problem is what the flag does not cover."
flag.bigger.text: "A flag adds even more lines to a PR that is already far too big to review."
flag.bigger.why: "Weak. A flag is a few lines. The size is a symptom; the real problem is three unrelated changes that cannot be checked or reverted on their own."
land.prompt.1: "Lars agrees to split. In what order do the pieces land? Put the steps in order."
land.bump.text: "Merge the dependency bump alone, once CI passes and the changelogs are read."
land.bump.why: "First, alongside the refactor: the bump is independent of both other parts. On its own, a failure after it lands points straight at the library."
land.refactor.text: "Merge the refactor, with the existing tests unchanged and green."
land.refactor.why: "First, alongside the bump; either may go in first. Unchanged tests that still pass are the evidence that the refactor changes no behaviour."
land.feature.text: "Merge the discount feature, with its tests and a parameterised query, rebased on both."
land.feature.why: "Then the feature, on top of the cleaned-up code. Now the diff shows only the behaviour change, so the review can focus on the money and the query."
land.demo.text: "Deploy with the discount flag on for staff only, and run the demo."
land.demo.why: "Then the demo, on code that has been reviewed, with the flag limiting who sees it."
land.cleanup.text: "Remove the flag once the discounts run well for everyone."
land.cleanup.why: "Last: clean up the flag, so it does not become dead code."
time.prompt.1: "Lars: \"How long would a proper review of the 900-line version have taken, anyway?\""
time.prompt.2: "Your team's rule of thumb, debatable but it's what you use: about 300 lines an hour for a careful read, and no more than an hour in one sitting."
time.working: "Working: 900 lines at about 300 lines an hour is 900 / 300 = 3 hours of careful reading, so three sittings of an hour, spread over a day. Split into three PRs of a few hundred lines, each fits one sitting. The numbers are a rule of thumb, not a law: speed depends on the code and the reader. Many teams find attention drops on diffs past a few hundred lines, which is the real case for small PRs."
time.skim.text: "under half an hour"
time.skim.why: "Too low for a careful read. Half an hour on 900 lines is a skim, and a skim is how the pasted SQL gets through."
time.hour.text: "half an hour to 2 hours"
time.hour.why: "Too low. At about 300 lines an hour, 900 lines take 3 hours, before any discussion."
time.afternoon.text: "2 to 5 hours"
time.afternoon.why: "Right: about 3 hours of careful reading, in three sittings. That is why it waits for days in a queue, while a 300-line PR gets read the same afternoon."
time.days.text: "5 to 15 hours"
time.days.why: "Half right. Questions and a second round of review do add time, but the reading itself is about 3 hours by your own rule of thumb."
time.week.text: "16 hours or more"
time.week.why: "Too high for what you know. Big PRs do feel endless, but by your own numbers the reading is about 3 hours."
demo.prompt.1: "Lars: \"Splitting and reviewing all three costs me half a day, and the demo is tomorrow at ten.\""
demo.prompt.2: "\"Just approve it this once. I'll owe you a coffee.\""
demo.branch.text: "\"The demo doesn't need main. Demo your branch on staging, and let's split it together now.\""
demo.branch.why: "Best. It separates the two goals: the demo needs a running build, not a merge. Pairing on the split costs an hour, makes your reviews quick, and Lars gets his demo without a rubber stamp."
demo.skim.text: "\"OK, approved. I'll go through the SQL and the tests properly myself tomorrow, after your demo.\""
demo.skim.why: "Weak. An approval says you checked it. After the merge, the pasted SQL is live, and 'tomorrow, properly' rarely happens."
demo.wall.text: "\"No. Not until it's split, and the team can hear from you why the demo slipped.\""
demo.wall.why: "Half right. You protect the codebase, but you leave Lars alone with his deadline. Saying no well comes with a way forward."
demo.favour.text: "\"Approve it, but I'll write in the PR that I only skimmed, so it stays your call.\""
demo.favour.why: "Weak. It looks like a review and is not one. The team sees an approval, and the warning is buried in a comment nobody reads."
hint.ask: "Before you judge the code, find out what it is for and how it is built up."
hint.split: "Each PR should have one reason to exist and be revertable on its own."
hint.block: "Block on what can hurt users or data. Style is a comment, not a gate."
hint.land: "Changes that alter no behaviour go first; the feature lands on top of them."
hint.kind: "Lars is not the enemy; he has a demo. Look for the yes that doesn't need a rubber stamp."
won.1: "Lars grins. \"Three small PRs, two real blockers, one nit, and a demo from the branch. You'd be surprised how few people find that.\""
lost.1: "Lars merges it with someone else's approval, and you both know what that means. Let's replay that review; the explanations show where it slipped."
