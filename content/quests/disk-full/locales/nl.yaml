title: "Schijf vol"
summary: "Op web-01 is de schijf vol en betalingen mislukken. Maak ruimte op /var zonder iets kapot te maken."
offer.1: "Hoi, ik ben Femke, ik doe Ops hier. Betalingen mislukken op web-01 en de logs zeggen: no space left on device."
offer.2: "Kun jij wat ruimte maken op /var? Het serverrek staat in de serverruimte. Maar... blijf van de database af."
active.1: "web-01 staat in het rek in de serverruimte. df -h vertelt je welke schijf vol is."
done.1: "/var kan weer ademen en betalen werkt. Goed gedaan! Oude gerouleerde logs zijn meestal de boosdoener."
npc.name: "Femke"
npc.idle: "Elke schijf loopt ooit vol. De kunst is weten wat veilig weg kan."
npc.after: "Volgende week regelen we fatsoenlijke logrotatie. Of de week erna."
motd: "web-01. Betalingen mislukken met 'no space left on device'. Maak ruimte op /var en houd de database en de webserver in leven."
obj.space: "/var is minder dan 80% vol"
obj.database: "de databasebestanden zijn er nog"
obj.web: "nginx draait"
hint.df: "Begin met df -h: welke mount is bijna vol?"
hint.du: "du -sh /var/* laat zien welke map groot is. Ga daarna een niveau dieper."
hint.gz: "Oude gerouleerde logs eindigen op .gz, in /var/log/nginx. En wie heeft debug-logging aan laten staan in /var/log/shop?"
event.database_gone: "Je hebt de database verwijderd. Femke wordt bleek. De DBA zet de back-up van vannacht terug; de klanten zijn een ochtend aan bestellingen kwijt. Dat kostte €150. Probeer het opnieuw, zonder /var/lib."
