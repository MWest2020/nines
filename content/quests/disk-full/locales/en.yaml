title: "Disk full"
summary: "web-01 ran out of disk space and checkouts fail. Free up /var without breaking anything."
offer.1: "Hi, I'm Femke, I run Ops here. Checkouts are failing on web-01 and the logs say: no space left on device."
offer.2: "Can you free up some space on /var? The server rack is in the server room. Just... leave the database alone."
active.1: "web-01 is in the rack in the server room. df -h tells you which disk is full."
done.1: "/var is breathing again and checkouts work. Nice work! Rotated logs are the usual suspect."
npc.name: "Femke"
npc.idle: "Every disk fills up eventually. The trick is knowing what is safe to delete."
npc.after: "Next week we'll set up proper log rotation. Or the week after."
motd: "web-01. Checkouts fail with 'no space left on device'. Free up /var, keep the database and the web server alive."
obj.space: "/var is less than 80% full"
obj.database: "the database files are still there"
obj.web: "nginx is running"
hint.df: "Start with df -h: which mount is almost full?"
hint.du: "du -sh /var/* shows which folder is big. Then go one level deeper."
hint.gz: "Old rotated logs end in .gz, in /var/log/nginx. And who left debug logging on in /var/log/shop?"
event.database_gone: "You deleted the database. Femke goes pale. The DBA restores last night's backup; the customers lose a morning of orders. That cost €150. Try again, without /var/lib."
