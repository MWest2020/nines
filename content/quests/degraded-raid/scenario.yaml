quick:
  - "cat ~/notes.txt"
  - cat /proc/mdstat
  - "tail -n 6 /var/log/kern.log"
  - "ls ~/disks"
  - "edit ~/tickets/DC-REQUEST.txt"
objectives:
  - {id: backup, text: obj.backup, done_when: 'opened("/var/log/backup.log")'}
  - {id: serial, text: obj.serial, done_when: 'file_contains("/home/dev/tickets/DC-REQUEST.txt", "WD-WCC4E9X8Y7Z6")'}
  - {id: healthy, text: obj.healthy, done_when: '!file_contains("/home/dev/tickets/DC-REQUEST.txt", "WD-WCC4E1A2B3C4")'}
hints:
  - {id: mdstat, when: 'commands >= 3 && !opened("/proc/mdstat")', text: hint.mdstat}
  - {id: smart, when: 'opened("/proc/mdstat") && !opened("/home/dev/disks/smart-sdb.txt") && (fails >= 1 || commands >= 6)', text: hint.smart}
  - {id: by-serial, when: 'opened("/home/dev/disks/smart-sdb.txt") && !file_contains("/home/dev/tickets/DC-REQUEST.txt", "WD-WCC4E9X8Y7Z6") && (fails >= 2 || commands >= 10)', text: hint.serial}
  - {id: check-backup, when: 'file_contains("/home/dev/tickets/DC-REQUEST.txt", "WD-WCC4E9X8Y7Z6") && !opened("/var/log/backup.log")', text: hint.backup}
events:
  - id: wrong-disk
    when: 'file_contains("/home/dev/tickets/DC-REQUEST.txt", "WD-WCC4E1A2B3C4")'
    say: event.wrong_disk
  - id: share-gone
    when: 'removed("/srv/share/README.txt")'
    say: event.share_gone
    money: -100
    reset: true
