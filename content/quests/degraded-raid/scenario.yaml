    Nov 28 03:12:47 fs-02 kernel: md/raid1:md0: Operation continuing on 1 devices.
  /var/log/backup.log: |
    2026-11-26 01:00:02 backup fs-02:/srv/share -> backup-01: started
    2026-11-26 01:41:17 backup fs-02:/srv/share -> backup-01: OK, 384 GiB, 0 errors
    2026-11-27 01:00:01 backup fs-02:/srv/share -> backup-01: started
    2026-11-27 01:39:55 backup fs-02:/srv/share -> backup-01: OK, 385 GiB, 0 errors
