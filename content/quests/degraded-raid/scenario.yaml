    2026-11-28 01:40:31 backup fs-02:/srv/share -> backup-01: OK, 385 GiB, 0 errors
    2026-11-28 01:40:33 restore test: 50 random files restored from backup-01 and compared: OK
  /home/dev/disks/bays.txt: |
    Chassis fs-02, front view. Bay numbers are printed on the trays.
    Bay 0: serial WD-WCC4E1A2B3C4
    Bay 1: serial WD-WCC4E9X8Y7Z6
