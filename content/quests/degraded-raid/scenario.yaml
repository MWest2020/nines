  /home/dev/tickets/DC-REQUEST.txt: |
    Remote hands request
    Site: Medior City colocation, rack B4
    Server: fs-02
    Action: replace one failed disk with a new spare of the same size
    Bay:
    Serial of the disk to pull:
    Backup checked before the swap (yes/no):
