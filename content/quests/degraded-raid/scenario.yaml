# fs-02: the office file server's RAID 1 runs on one disk. What it teaches: /proc/mdstat ([2/1]
# [U_], a member marked (F)), the kernel's I/O errors, SMART attributes that matter (reallocated,
# pending and uncorrectable sectors), that sdX names are given at boot and can change, so a disk
# to pull is named by serial and bay, and that a rebuild reads the whole surviving disk, so the
# backup is checked first: RAID is redundancy, not a backup.
schema: 1
host: fs-02
user: dev
home: /home/dev
motd: motd
mounts:
  - {path: /, device: /dev/md0, size: 931G, base_used: 412G}
dirs: [/tmp, /srv/share]
files:
  /home/dev/notes.txt: |
    From: Wim
    - fs-02 mirrors two disks (RAID 1, /dev/md0). Monitoring says the array is degraded.
    - Remote hands at the data centre swap disks for us. They pull exactly the disk we name.
    - Saved SMART reports (smartctl -a) are in ~/disks, with the bay map of the chassis.
    - Write the request in ~/tickets/DC-REQUEST.txt. I'll send it.
  /proc/mdstat: |
    Personalities : [raid1]
    md0 : active raid1 sdb1[1](F) sda1[0]
          976630336 blocks super 1.2 [2/1] [U_]
          bitmap: 3/8 pages [12KB], 65536KB chunk

    unused devices: <none>
