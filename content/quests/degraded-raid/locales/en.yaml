title: "One disk left"
summary: "fs-02's mirrored array lost a disk overnight. Find which one, check the backup, and write the request for the data centre's remote hands."
offer.1: "Wim, systems. Monitoring woke me at three: fs-02, our file server, says its array is degraded. It still serves files, on one disk."
offer.2: "Its console is the rack at the back. Find out which disk died, check that last night's backup is good, and fill in the request for remote hands. They pull exactly what we write down."
active.1: "A mirror with one side gone is not broken yet. It is one bad sector away from broken, though."
done.1: "Serial WD-WCC4E9X8Y7Z6, bay 1, and a backup with a restore test from last night. Remote hands will have the new disk in within the hour, and then the array rebuilds."
done.2: "You wrote the serial, not 'sdb'. Device names are handed out at boot; after a reboot with a disk missing, sdb can be the healthy one. People have pulled the last good disk that way."
npc.name: "Wim"
npc.idle: "RAID keeps you running when a disk dies. It does not keep you safe when someone deletes a folder. That is what backups are for."
npc.mentor: "So you picked systems. Good: someone has to know what is under all those containers. I'll have work for you."
npc.coach: "Haven't picked a path yet? Petra, the career coach, is outside by the Career Office. Come back once you've talked to her."
npc.after: "The rebuild finished in two hours. We also set up alerts on reallocated sectors now, so next time we hear before the kernel gives up on a disk."
motd: "fs-02. The file share's RAID 1 runs on one disk. Find the failed disk, check the backup, and fill in ~/tickets/DC-REQUEST.txt. Wim's notes: ~/notes.txt."
obj.backup: "last night's backup is checked"
obj.serial: "the request names the failed disk by its serial"
obj.healthy: "the healthy disk is not on the request"
hint.mdstat: "Linux software RAID reports in /proc/mdstat: cat it. [2/1] [U_] means two members, one up; a member marked (F) has failed."
hint.smart: "The array dropped sdb1. Is the disk itself dying, or did a cable hiccup? Its saved SMART report in ~/disks tells: look at the overall result and the reallocated and pending sectors."
hint.serial: "Remote hands cannot see 'sdb': they see trays and labels. Put the failing disk's serial number in the request (bays.txt says which bay it sits in)."
hint.backup: "A rebuild reads every block of the surviving disk, and that is when an old disk likes to fail. Before the swap, check that the last backup worked: /var/log/backup.log."
event.wrong_disk: "Wim reads over your shoulder: \"That's the serial of the disk that still works. Pull that one and the array is gone.\" Only the failed disk belongs on the request."
event.share_gone: "You deleted files from the share. The array was the problem, not the data. Wim restores them from backup and sends you the bill: €100. The machine is as it was."
