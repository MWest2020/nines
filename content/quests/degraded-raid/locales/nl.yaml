title: "Nog één schijf"
summary: "De gespiegelde array van fs-02 is vannacht een schijf kwijtgeraakt. Zoek uit welke, controleer de back-up en schrijf het verzoek voor de remote hands van het datacenter."
offer.1: "Wim, systems. Monitoring maakte me om drie uur wakker: fs-02, onze fileserver, meldt dat zijn array degraded is. Hij serveert nog bestanden, op één schijf."
offer.2: "De console is het rack achterin. Zoek uit welke schijf dood is, controleer of de back-up van vannacht goed is en vul het verzoek voor remote hands in. Ze trekken precies de schijf die wij opschrijven."
active.1: "Een spiegel waarvan één kant weg is, is nog niet kapot. Maar wel één slechte sector verwijderd van kapot."
done.1: "Serienummer WD-WCC4E9X8Y7Z6, bay 1, en een back-up met restoretest van vannacht. Remote hands zet binnen het uur de nieuwe schijf erin, en dan bouwt de array zich weer op."
done.2: "Je schreef het serienummer op, niet 'sdb'. Apparaatnamen worden bij het opstarten uitgedeeld; na een reboot met een ontbrekende schijf kan sdb net de gezonde zijn. Zo is er weleens de laatste goede schijf uitgetrokken."
npc.name: "Wim"
npc.idle: "RAID houdt je in de lucht als een schijf sterft. Het beschermt je niet als iemand een map weggooit. Daar zijn back-ups voor."
npc.mentor: "Dus je koos systems. Mooi: iemand moet weten wat er onder al die containers zit. Ik heb werk voor je."
npc.coach: "Nog geen pad gekozen? Petra, de loopbaancoach, staat buiten bij het loopbaanbureau. Kom terug als je haar gesproken hebt."
npc.after: "De rebuild was in twee uur klaar. We hebben nu ook alerts op gerealloceerde sectoren, dus volgende keer horen we het voordat de kernel een schijf opgeeft."
motd: "fs-02. De RAID 1 van de fileshare draait op één schijf. Zoek de kapotte schijf, controleer de back-up en vul ~/tickets/DC-REQUEST.txt in. Wims notities: ~/notes.txt."
obj.backup: "de back-up van vannacht is gecontroleerd"
obj.serial: "het verzoek noemt de kapotte schijf bij zijn serienummer"
obj.healthy: "de gezonde schijf staat niet op het verzoek"
hint.mdstat: "Linux-software-RAID meldt zich in /proc/mdstat: cat dat bestand. [2/1] [U_] betekent twee leden, één actief; een lid met (F) is uitgevallen."
hint.smart: "De array heeft sdb1 laten vallen. Sterft de schijf zelf, of hikte er een kabel? Het bewaarde SMART-rapport in ~/disks zegt het: kijk naar de eindconclusie en de gerealloceerde en pending sectoren."
hint.serial: "Remote hands ziet geen 'sdb': ze zien sleden en labels. Zet het serienummer van de stervende schijf in het verzoek (bays.txt zegt in welke bay hij zit)."
hint.backup: "Een rebuild leest elk blok van de overgebleven schijf, en juist dan gaat een oude schijf graag stuk. Controleer vóór de wissel of de laatste back-up gelukt is: /var/log/backup.log."
event.wrong_disk: "Wim kijkt over je schouder mee: \"Dat is het serienummer van de schijf die het nog doet. Trek die eruit en de array is weg.\" Alleen de kapotte schijf hoort op het verzoek."
event.share_gone: "Je hebt bestanden van de share verwijderd. De array was het probleem, niet de data. Wim zet ze terug uit de back-up en stuurt je de rekening: €100. De machine is weer zoals hij was."
