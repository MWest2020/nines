schema: 1
id: wim
author: {name: "Nines team"}
name: npc.name
tint: "#987048"
spawn: {map: the-stack, slot: npc-4, facing: down}
dialogue:
  - when: 'quest("degraded-raid") == "done"'
    lines: [npc.after]
  - when: '!path_chosen'
    lines: [npc.coach]
  - when: 'career_path("systems")'
    lines: [npc.mentor]
    intro: true
  - lines: [npc.idle]
