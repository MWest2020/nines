title: "Broken pipeline"
summary: "The shop's CI pipeline file is broken, so nothing ships. Fix the YAML until the pipeline passes."
offer.1: "Ravi, developer. Our pipeline has been red since this morning and I have a demo at four."
offer.2: "Could you look at .nines-ci.yml on my laptop? I only changed one tiny thing. I think."
active.1: "The laptop's right here. The last run's output is in ci-last-run.log."
done.1: "Green! I owe you a coffee. YAML and tabs, every single time."
npc.name: "Ravi"
npc.idle: "Works on my machine. Doesn't work on CI's machine. Classic."
npc.after: "I've set my editor to show tabs now. Lesson learned."
motd: "build-01, ~/shop. The pipeline is red. Fix .nines-ci.yml (edit it), then git add and git commit to run CI again."
obj.valid: ".nines-ci.yml is valid"
obj.green: "the pipeline passes after a commit"
hint.log: "Read the last run first: cat ci-last-run.log"
hint.tabs: "YAML refuses tabs for indentation. Open the file with edit .nines-ci.yml and indent with spaces."
hint.stage: "Every job's stage must be one of the names under stages. Check the spelling."
hint.commit: "The file looks good now. CI only sees committed work: git add .nines-ci.yml, then git commit -m \"fix pipeline\"."
