title: "Kapotte pipeline"
summary: "Het pipelinebestand van de webshop is stuk, dus er gaat niets live. Herstel de YAML tot de pipeline slaagt."
offer.1: "Ravi, developer. Onze pipeline is sinds vanochtend rood en ik heb om vier uur een demo."
offer.2: "Wil jij naar .nines-ci.yml kijken op mijn laptop? Ik heb maar één klein dingetje veranderd. Denk ik."
active.1: "De laptop staat hier. De uitvoer van de laatste run staat in ci-last-run.log."
done.1: "Groen! Ik ben je een koffie schuldig. YAML en tabs, elke keer weer."
npc.name: "Ravi"
npc.idle: "Werkt op mijn machine. Werkt niet op de machine van CI. Klassiek."
npc.after: "Mijn editor laat nu tabs zien. Les geleerd."
motd: "build-01, ~/shop. De pipeline is rood. Herstel .nines-ci.yml (met edit) en doe dan git add en git commit om CI opnieuw te draaien."
obj.valid: ".nines-ci.yml is geldig"
obj.green: "de pipeline slaagt na een commit"
hint.log: "Lees eerst de laatste run: cat ci-last-run.log"
hint.tabs: "YAML weigert tabs als inspringing. Open het bestand met edit .nines-ci.yml en spring in met spaties."
hint.stage: "De stage van elke job moet een van de namen onder stages zijn. Let op de spelling."
hint.commit: "Het bestand ziet er nu goed uit. CI ziet alleen gecommit werk: git add .nines-ci.yml en dan git commit -m \"fix pipeline\"."
