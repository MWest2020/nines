title: "Hotfix: the bakery's web shop"
summary: "Bakkerij De Korst's web shop is down after a price update. By the book: fix, change ticket, commit. Or as a contractor: skip the paperwork, earn more, and pay for what you break."
offer.1: "Bakkerij De Korst's web shop is down, and they sell out of croissants by ten. Their box is in the server room, front row."
offer.2: "By the book: fix it, fill in a change ticket, commit the fix for review. My rules are in ~/rules.txt on the box."
offer.3: "Or work as a contractor (menu, Work as): skip the paperwork and bill 50% more. But anything you break goes on your invoice. Times three."
active.1: "The bakery's shop is in the server room. systemctl status first, then mind the commas."
done.1: "Croissants are back online. Somebody tell the bakery that a comma is not a decimal point. In YAML, anyway."
motd: "bakery-01, Bakkerij De Korst's web shop. Down since this morning's price update. Production rules: ~/rules.txt."
obj.shop: "the web shop (bakery-shop) is running"
obj.ticket: "change ticket CHG-1042 is filled in (what, why, rollback)"
obj.review: "the fix is committed in /srv/bakery for review"
hint.status: "systemctl status bakery-shop shows why it will not start."
hint.comma: "The log names the file, the line and the price. In this file a price is written with a dot."
hint.paperwork: "The shop is up. On payroll that is not the end: fill in ~/changes/CHG-1042.txt, then in /srv/bakery: git add, git commit -m."
event.orders_gone: "You deleted today's orders: 41 orders, 140 croissants nobody will bake. The bakery restores last night's backup and sends the bill: €120."
