title: "Hotfix: de webshop van de bakker"
summary: "De webshop van Bakkerij De Korst ligt plat na een prijswijziging. Volgens het boekje: fix, changeticket, commit. Of als zzp'er: sla het papierwerk over, verdien meer, en betaal wat je stukmaakt."
offer.1: "De webshop van Bakkerij De Korst ligt plat, en om tien uur zijn hun croissants uitverkocht. Hun server staat in de serverruimte, voorste rij."
offer.2: "Volgens het boekje: repareren, een changeticket invullen, de fix committen voor review. Mijn regels staan in ~/rules.txt op de machine."
offer.3: "Of werk als zzp'er (menu, Werk als): sla het papierwerk over en factureer 50% meer. Maar alles wat je stukmaakt komt op jouw factuur. Keer drie."
active.1: "De webshop van de bakker staat in de serverruimte. Eerst systemctl status, en let op de komma's."
done.1: "De croissants zijn weer online. Kan iemand de bakker vertellen dat een komma geen decimaalteken is? In YAML in elk geval niet."
motd: "bakery-01, de webshop van Bakkerij De Korst. Plat sinds de prijswijziging van vanochtend. Regels voor productie: ~/rules.txt."
obj.shop: "de webshop (bakery-shop) draait"
obj.ticket: "changeticket CHG-1042 is ingevuld (wat, waarom, terugdraaien)"
obj.review: "de fix is gecommit in /srv/bakery voor review"
hint.status: "systemctl status bakery-shop laat zien waarom hij niet start."
hint.comma: "De log noemt het bestand, de regel en de prijs. In dit bestand schrijf je een prijs met een punt."
hint.paperwork: "De shop draait. In loondienst ben je dan nog niet klaar: vul ~/changes/CHG-1042.txt in, en dan in /srv/bakery: git add, git commit -m."
event.orders_gone: "Je hebt de bestellingen van vandaag verwijderd: 41 bestellingen, 140 croissants die niemand gaat bakken. De bakker zet de back-up van gisteravond terug en stuurt de rekening: €120."
