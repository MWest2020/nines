title: "The Senior interview: a collaborative editor"
summary: "Joris, staff engineer on Senior Summit, asks you to design the part of a document editor that lets a team write together, live and offline."
offer.1: "I'm Joris. I built my first editor before most people had heard of real-time collaboration, and I still lose sleep over it."
offer.2: "Today you design one. There is more than one right answer; I want to hear what yours costs."
active.1: "Two people, one sentence, same moment. Keep asking what each of them sees."
done.1: "That was a proper senior conversation: you named the costs, not only the algorithms."
npc.name: "Joris"
npc.idle: "Ever typed into a document while someone else deleted the paragraph? Come and design one that copes."
npc.after: "Convergence is maths. Making sense is still a human's job. Never let a design pretend otherwise."
attacker: "Joris · staff engineer"
intro.1: "Whiteboard interview. Topic: a collaborative document editor."
intro.2: "Joris opens a laptop with two cursors blinking in one document. \"Teams write together in our editor, live. Design the part that makes that work.\""
clarify.prompt.1: "\"Two questions before you draw. Which two?\""
clarify.scale.text: "\"How many people edit one document at once, and how many documents are open at the same time?\""
clarify.scale.why: "Best. Tens of editors per document means one server can own a document and fan out its edits; millions of open documents decide how you shard. Thousands in one document, a live event, would be a different system."
clarify.offline.text: "\"Must editing work offline, and for how long can a client be away?\""
clarify.offline.why: "Best. This splits the design. Seconds of disconnection are easy for any approach; hours or days of offline work need a model that merges long-diverged copies well, which is the core of the choice between OT and CRDTs."
clarify.rich.text: "\"Plain text, or rich text with formatting, tables, images and comments?\""
clarify.rich.why: "Half right. It matters: formatting ranges and tables merge harder than characters. But the core problem, merging concurrent edits, is the same, and scale and offline shape the architecture first."
clarify.history.text: "\"Do we need version history and undo?\""
clarify.history.why: "Half right. Useful, and it falls out of the operation log you will keep anyway. Undo is per person (undo my last edit, not the document's last edit), which is worth saying, but it does not decide the architecture."
clarify.database.text: "\"Which database will hold the documents, and can it be the one we already run?\""
clarify.database.why: "Weak. A storage choice before the requirements. The hard part is merging concurrent edits; almost any durable store can hold an operation log and snapshots."
clarify.transport.text: "\"WebSockets or long polling?\""
clarify.transport.why: "Weak. A transport detail that follows from the latency requirement, and almost certainly WebSockets. It does not change how edits merge."
overwrite.prompt.1: "Joris shows the first prototype. \"It works on my machine. What breaks when two people use it?\""
overwrite.proposal.1: "Every 2 seconds the client sends the whole document to the server."
overwrite.proposal.2: "The server stores whichever version it received last."
overwrite.proposal.3: "Other clients reload the document when its version changes."
overwrite.lost.text: "Two people typing in the same 2 seconds: the later upload replaces the whole document, and the other's edits vanish."
overwrite.lost.why: "Best. Last-writer-wins on the whole document: two people editing in the same window, even in different paragraphs, silently lose someone's work. Edits must travel as operations (insert or delete at a place) that the system can merge."
overwrite.bandwidth.text: "Uploading the whole document every 2 seconds wastes bandwidth and battery; it should send only what changed since the last upload."
overwrite.bandwidth.why: "Half right. True, and sending operations fixes it, but most documents are small enough that bandwidth is not what hurts. What hurts is lost work."
overwrite.cursor.text: "Every reload resets everyone's cursor and scroll position, so the editor jumps around under people's hands while they type."
overwrite.cursor.why: "Weak. Real and annoying, but cosmetic next to edits disappearing. Fix the merge and the reloads go away with it."
overwrite.locks.text: "There are no paragraph locks: without them two people can type in the same sentence, and that is where their edits collide."
overwrite.locks.why: "Weak. Locks are a fix with their own cost: people wait for each other, and offline editing becomes impossible. And it misplaces the flaw: here, edits in different paragraphs are lost too."
model.prompt.1: "\"Tens of editors per document, all through our servers, and offline on trains and planes: hours, sometimes a day.\""
model.prompt.2: "\"OT or a CRDT? Defend it.\""
model.crdt.text: "A sequence CRDT, as in Yjs or Automerge: merges commute, so a day offline merges cleanly. We pay in metadata per character and in tombstones."
model.crdt.why: "Best, with the cost named. Every character gets a unique, ordered id, and merging is commutative, associative and idempotent, so copies that saw the same operations end up identical without a central transform: a good fit for long offline work. The price: an id per character (compressed well in practice), tombstones for deleted text, and garbage collection that is only safe once every copy has seen the delete. Debatable: OT with a central server is just as defensible here."
model.ot.text: "OT, with our servers ordering each document's operations: proven at scale, no per-character metadata, but a day offline means a long transform."
model.ot.why: "Best, with the cost named. A central server that puts operations in one order makes OT tractable: clients transform their pending edits against what the server sent, as Google Docs does, and documents stay compact with no tombstones. Transform functions are notoriously hard to get right, and a client back from a day offline must transform its whole backlog. Debatable: a CRDT is just as defensible here."
model.converge.text: "A CRDT, because replicas converge whatever order the operations arrive in, so nobody's typing is ever lost or comes out garbled anywhere."
model.converge.why: "Half right. Convergence is real: copies that saw the same operations end up identical. But identical is not the same as what people meant: some algorithms interleave the characters of two concurrent insertions at the same spot, and two people fixing one typo differently can both be applied."
model.p2p.text: "A CRDT, because clients can merge peer to peer, so we can drop the server side: no backend left to run or scale."
model.p2p.why: "Weak. Peer to peer is possible, not required. You still need a server for sign-in and access control, durable storage and history, relaying between clients that cannot reach each other, and presence."
model.nodelete.text: "OT, because a CRDT cannot represent deletions well: once a character is gone, its id is gone, and concurrent edits next to it break."
model.nodelete.why: "Weak. False: a CRDT keeps deleted characters as tombstones, or in a delete set, exactly so that concurrent operations can still refer to them. That is a cost, not a missing feature."
intent.prompt.1: "Joris writes \"we ship on friday\". \"Ana selects 'on friday' and deletes it. At the same moment Ben, who has not seen that yet, types 'next ' in front of 'friday'.\""
intent.prompt.2: "\"Both edits reach everyone. What should the text be?\""
intent.keep.text: "'we ship next ': Ana's characters go, Ben's insert stays. Odd, but no keystroke is silently lost, and both see it and can fix it."
intent.keep.why: "Best. Intent preservation: Ana meant to delete the characters she saw, Ben meant to insert his. OT moves an insert inside a deleted range to where the range was; a sequence CRDT places it next to its neighbours, now tombstones. Both give 'we ship next ' on every copy. It reads oddly, which is honest: neither algorithm understands meaning, so a human resolves it."
intent.drop.text: "'we ship ': Ben's insert lies inside the range that Ana deleted, so her delete wins and his insert is discarded along with the rest."
intent.drop.why: "Half right, and debatable: some editors do this to avoid odd leftovers. But Ben's typing disappears without anyone telling him, and it is not what OT or a CRDT does by default. If you choose it, show Ben what was dropped."
intent.revive.text: "'we ship on next friday': Ben's edit shows the words are still wanted, so Ana's delete is cancelled."
intent.revive.why: "Weak. It overrules Ana on a guess about meaning. No merge algorithm can know intent, and a rule that brings deleted text back gets the opposite case badly wrong."
intent.raw.text: "Apply Ben's insert at the position where he typed it, character 11, in whatever the server's text has become by the time it arrives."
intent.raw.why: "Weak. After Ana's delete the text is 'we ship ', 8 characters, so position 11 does not exist, and on copies that apply the edits in another order it lands elsewhere: the copies diverge. Positions must be transformed, or replaced by ids."
reconnect.prompt.1: "\"The team chose a CRDT. Mila edited for four hours on a plane and has just landed. Put her reconnect in order.\""
reconnect.auth.text: "Reconnect, sign in again, and check that she may still edit this document"
reconnect.auth.why: "First. Four hours is long enough for her access to be revoked, and operations from someone who may no longer edit must not be merged."
reconnect.vectors.text: "Exchange state vectors: each side says which operations it has seen"
reconnect.vectors.why: "Next. A state vector is small, a counter per client, and tells each side exactly what the other is missing without sending the whole document."
reconnect.missing.text: "Each side sends only the operations the other lacks"
reconnect.missing.why: "Then only the difference, in both directions: four hours of her edits up, everyone else's down."
reconnect.persist.text: "The server merges her operations and appends them durably to the document's log"
reconnect.persist.why: "Durable before anything is confirmed: once the server confirms, her client may drop its local backlog, so a crash after that point must not lose her four hours."
reconnect.broadcast.text: "Send her merged operations to the editors who are online now"
reconnect.broadcast.why: "Last, together with the highlight. The other copies converge as soon as they apply her operations."
reconnect.review.text: "Highlight where her offline edits met other people's, for a human to check"
reconnect.review.why: "Last, together with the broadcast. Convergence guarantees the same text everywhere, not text that makes sense: where her edits met someone else's, a person should look."
servers.prompt.1: "Joris draws the production plan. \"Spot the problem.\""
servers.proposal.1: "40 WebSocket servers behind a round-robin balancer; any server takes any client."
servers.proposal.2: "Every keystroke and every cursor move is written to the documents database."
servers.proposal.3: "Each server polls the database every 200 ms for new rows in the documents its clients have open."
servers.owner.text: "One document's editors land on many servers, so nothing orders its operations in one place, and they meet only through polling: lag plus load."
servers.owner.why: "Best. The scaling unit is the document: route every editor of a document to the one server that owns it right now (consistent hashing on the document id, with a handover when servers come and go). That server orders the operations, which OT needs, fans them out from memory and writes the log; the database stops being a message bus, and the 200 ms poll from 40 servers disappears."
servers.cursors.text: "Cursor moves are written to the database: they change many times a second and nobody needs them tomorrow, yet they fill up the log."
servers.cursors.why: "Half right. A real waste: presence (cursors, selections, who is online) is ephemeral, so send it over the socket, keep it in memory with a short expiry, and never store it. But the deeper flaw is that the document has no owner."
servers.sockets.text: "WebSockets cannot pass through an HTTP load balancer, so each client needs the direct address of a server to connect to."
servers.sockets.why: "Weak. A WebSocket starts as an HTTP upgrade and passes through common load balancers; the connection then stays on the server it reached. The problem is which server that is."
servers.threads.text: "Forty servers is far too few for this: every WebSocket needs its own thread, so one server tops out at a few hundred clients."
servers.threads.why: "Weak. Event-driven servers hold tens of thousands of mostly idle WebSockets each; a thread per connection is a choice, not a law. The number of servers is not the flaw."
storage.prompt.1: "\"Each document now has one owning server. How do you store it, so that it opens fast and a crash loses nothing anyone saw confirmed?\""
storage.logsnap.text: "Append each operation to a durable log before confirming it, snapshot every few hundred operations, and open from snapshot plus newer log."
storage.logsnap.why: "Best. The log is the truth and gives history, undo and 'what changed since version v' for clients that reconnect; snapshots bound the time to open. A snapshot is also where a CRDT can compact: drop the tombstones every client has acknowledged, with a cutoff that makes very old clients reload."
storage.latest.text: "Overwrite one stored copy of the full document after every operation, so the database always holds the current text."
storage.latest.why: "Weak. Each operation rewrites the whole document, and the history is gone: OT cannot transform a returning client's backlog without the operations it missed, and there is no version history."
storage.logonly.text: "Append each operation to a durable log before confirming it, and rebuild the document by replaying the log from the first operation on every open."
storage.logonly.why: "Half right. Nothing is lost and the history is complete, but opening a document replays every keystroke since it was created, which grows without bound: years of edits on every open."
storage.memory.text: "Keep the document in the owning server's memory and write a full snapshot every 10 minutes; losing a few minutes in a rare crash is acceptable."
storage.memory.why: "Weak. Up to 10 minutes of edits that people saw confirmed vanish in a crash. A confirmation must mean the operation is durable."
storage.presence.text: "Store operations, cursors and presence together in one durable log, so history can replay who was where and what each person was looking at."
storage.presence.why: "Weak. Presence is ephemeral and frequent: storing it multiplies the log for data nobody needs, and replaying it brings back the ghosts of old cursors."
fanout.prompt.1: "\"An all-hands document: 50 people editing at once. Each client sends one message every 200 ms with its edits and cursor. The server forwards every message to every other editor.\""
fanout.prompt.2: "\"Roughly how many messages per second does the server send for this one document?\""
fanout.working: "Working: each client sends 5 messages a second, so 50 × 5 = 250 come in. Each goes out to the 49 others: 250 × 49 ≈ 12,250 a second, for one document. Fan-out grows with the square of the number of editors. That is why servers coalesce: one outgoing message per client per tick, carrying everyone's changes, is 50 × 5 = 250 a second, and cursors can be sent less often than edits."
fanout.lt1k.text: "under 1,000 per second"
fanout.lt1k.why: "Too low for this design. About 250 is what comes in, 50 × 5, or what goes out if the server batches all changes into one message per client per tick. Forwarding each message separately multiplies it by 49."
fanout.thousands.text: "1,000 to 10,000 per second"
fanout.thousands.why: "Close: 50 × 49 ≈ 2,450 counts one message per editor per second. At one every 200 ms it is five a second."
fanout.tens.text: "10,000 to 100,000 per second"
fanout.tens.why: "Right: about 12,000 a second, for one document."
fanout.hundreds.text: "100,000 to 1 million per second"
fanout.hundreds.why: "Too high. Did you count keystrokes instead of batched messages, or the 49 recipients twice? 250 messages in, 49 copies each, is about 12,000."
fanout.millions.text: "over 1 million per second"
fanout.millions.why: "Far too high for one document with 50 editors: even every keystroke of every editor, forwarded to all others, stays far below that."
hint.model: "Both of the main answers can win. What counts is naming what your choice costs."
hint.intent: "Each person meant to change the characters they saw. Which result throws nothing away without telling anyone?"
hint.servers: "Follow the editors of one document: how many servers do they land on, and how do those servers hear about each other's edits?"
hint.fanout: "Messages in per second first, then copies out per message."
hint.breathe: "Take a breath. Joris wants to hear what each choice costs, not the name of an algorithm."
won.1: "Joris closes the laptop. \"Operations, not documents. An owner per document. Costs named, both ways. That is the level we look for up here.\""
lost.1: "\"Let's stop here for now.\" Joris shrugs kindly. \"Read the explanations: most of this is about what people see at the same moment. Come back whenever you like.\""
