title: "Het Senior-gesprek: een samenwerkingseditor"
summary: "Joris, staff engineer op de Seniortop, vraagt je het deel van een documenteditor te ontwerpen waarmee een team samen schrijft, live en offline."
offer.1: "Ik ben Joris. Ik bouwde mijn eerste editor voordat de meeste mensen van realtime samenwerken hadden gehoord, en ik lig er nog steeds wakker van."
offer.2: "Vandaag ontwerp jij er een. Er is meer dan één goed antwoord; ik wil horen wat het jouwe kost."
active.1: "Twee mensen, één zin, hetzelfde moment. Blijf vragen wat elk van hen ziet."
done.1: "Dat was een echt seniorgesprek: je noemde de kosten, niet alleen de algoritmes."
npc.name: "Joris"
npc.idle: "Ooit in een document getypt terwijl iemand anders de alinea wiste? Kom er een ontwerpen die daar tegen kan."
npc.after: "Convergentie is wiskunde. Of het klopt, blijft mensenwerk. Laat een ontwerp nooit anders beweren."
attacker: "Joris · staff engineer"
intro.1: "Whiteboardgesprek. Onderwerp: een editor waarin je samen aan documenten werkt."
intro.2: "Joris klapt een laptop open met twee knipperende cursors in één document. \"Teams schrijven in onze editor live samen. Ontwerp het deel dat dat mogelijk maakt.\""
clarify.prompt.1: "\"Twee vragen voordat je gaat tekenen. Welke twee?\""
clarify.scale.text: "\"Hoeveel mensen bewerken één document tegelijk, en hoeveel documenten staan er tegelijk open?\""
clarify.scale.why: "Goed. Tientallen bewerkers per document betekent dat één server een document kan bezitten en de wijzigingen kan doorsturen; miljoenen open documenten bepalen hoe je shardt. Duizenden in één document, een live-evenement, zou een ander systeem zijn."
clarify.offline.text: "\"Moet bewerken offline werken, en hoe lang mag een client weg zijn?\""
clarify.offline.why: "Goed. Dit splitst het ontwerp. Seconden zonder verbinding zijn voor elke aanpak makkelijk; uren of dagen offline werken vragen om een model dat lang uiteengelopen kopieën goed samenvoegt, en dat is de kern van de keuze tussen OT en CRDT's."
clarify.rich.text: "\"Platte tekst, of opgemaakte tekst met stijlen, tabellen, afbeeldingen en opmerkingen?\""
clarify.rich.why: "Half goed. Het doet ertoe: opmaakbereiken en tabellen voegen moeilijker samen dan tekens. Maar het kernprobleem, gelijktijdige wijzigingen samenvoegen, blijft hetzelfde, en schaal en offline bepalen de architectuur eerst."
clarify.history.text: "\"Hebben we versiegeschiedenis en ongedaan maken nodig?\""
clarify.history.why: "Half goed. Nuttig, en het volgt uit het operatielog dat je toch bijhoudt. Ongedaan maken is per persoon (mijn laatste wijziging, niet de laatste van het document), en dat is het zeggen waard, maar het bepaalt de architectuur niet."
clarify.database.text: "\"Welke database bewaart de documenten, en kan het de database zijn die we al draaien?\""
clarify.database.why: "Zwak. Een opslagkeuze vóór de eisen. Het moeilijke deel is gelijktijdige wijzigingen samenvoegen; bijna elke duurzame store kan een operatielog en snapshots bewaren."
clarify.transport.text: "\"WebSockets of long polling?\""
clarify.transport.why: "Zwak. Een transportdetail dat volgt uit de latency-eis, en vrijwel zeker WebSockets wordt. Het verandert niets aan hoe wijzigingen samenkomen."
overwrite.prompt.1: "Joris laat het eerste prototype zien. \"Op mijn machine werkt het. Wat gaat er stuk als twee mensen het gebruiken?\""
overwrite.proposal.1: "Elke 2 seconden stuurt de client het hele document naar de server."
overwrite.proposal.2: "De server bewaart de versie die hij het laatst ontving."
overwrite.proposal.3: "Andere clients laden het document opnieuw als de versie verandert."
overwrite.lost.text: "Twee mensen typen binnen dezelfde 2 seconden: de latere upload vervangt het hele document, en de wijzigingen van de ander verdwijnen."
overwrite.lost.why: "Goed. Last-writer-wins op het hele document: twee mensen die in hetzelfde venster werken, ook in verschillende alinea's, raken stilletjes iemands werk kwijt. Wijzigingen moeten reizen als operaties (invoegen of verwijderen op een plek) die het systeem kan samenvoegen."
overwrite.bandwidth.text: "Elke 2 seconden het hele document uploaden verspilt bandbreedte en batterij; stuur alleen wat er sinds de vorige upload veranderd is."
overwrite.bandwidth.why: "Half goed. Klopt, en operaties sturen lost het op, maar de meeste documenten zijn zo klein dat bandbreedte niet het pijnpunt is. Wat pijn doet, is verloren werk."
overwrite.cursor.text: "Elke herlaadbeurt zet ieders cursor en scrollpositie terug, dus de editor springt alle kanten op terwijl mensen typen."
overwrite.cursor.why: "Zwak. Echt en irritant, maar cosmetisch naast wijzigingen die verdwijnen. Los het samenvoegen op en het herladen verdwijnt vanzelf."
overwrite.locks.text: "Er zijn geen alinealocks: zonder die locks kunnen twee mensen in dezelfde zin typen, en daar botsen hun wijzigingen."
overwrite.locks.why: "Zwak. Locks zijn een oplossing met eigen kosten: mensen wachten op elkaar, en offline bewerken wordt onmogelijk. En het wijst de verkeerde fout aan: hier gaan ook wijzigingen in verschillende alinea's verloren."
model.prompt.1: "\"Tientallen bewerkers per document, allemaal via onze servers, en offline in treinen en vliegtuigen: uren, soms een dag.\""
model.prompt.2: "\"OT of een CRDT? Verdedig je keuze.\""
model.crdt.text: "Een sequence-CRDT, zoals in Yjs of Automerge: samenvoegen is commutatief, dus een dag offline voegt netjes samen. We betalen met metadata per teken en tombstones."
model.crdt.why: "Goed, met de kosten erbij. Elk teken krijgt een uniek, geordend id, en samenvoegen is commutatief, associatief en idempotent, dus kopieën die dezelfde operaties zagen worden identiek zonder centrale transformatie: past goed bij lang offline werken. De prijs: een id per teken (in de praktijk goed gecomprimeerd), tombstones voor verwijderde tekst, en opruimen dat pas veilig is als elke kopie de verwijdering heeft gezien. Er valt over te twisten: OT met een centrale server is hier net zo goed te verdedigen."
model.ot.text: "OT, waarbij onze servers de operaties per document ordenen: bewezen op schaal, geen metadata per teken, maar een dag offline betekent een lange transformatie."
model.ot.why: "Goed, met de kosten erbij. Een centrale server die operaties in één volgorde zet, maakt OT hanteerbaar: clients transformeren hun openstaande wijzigingen tegen wat de server stuurde, zoals Google Docs doet, en documenten blijven compact, zonder tombstones. Transformatiefuncties zijn berucht lastig om goed te krijgen, en een client die na een dag offline terugkomt moet zijn hele achterstand transformeren. Er valt over te twisten: een CRDT is hier net zo goed te verdedigen."
model.converge.text: "Een CRDT, omdat replica's convergeren in welke volgorde de operaties ook binnenkomen, dus niemands getypte tekst raakt ooit kwijt of komt ergens verhaspeld uit."
model.converge.why: "Half goed. Convergentie is echt: kopieën die dezelfde operaties zagen, worden identiek. Maar identiek is niet hetzelfde als wat mensen bedoelden: sommige algoritmes vlechten de tekens van twee gelijktijdige invoegingen op dezelfde plek door elkaar, en als twee mensen één typfout elk anders verbeteren, kunnen beide verbeteringen blijven staan."
model.p2p.text: "Een CRDT, omdat clients peer-to-peer kunnen samenvoegen, dus de serverkant kan weg: geen backend meer om te draaien of te schalen."
model.p2p.why: "Zwak. Peer-to-peer kan, maar hoeft niet. Je hebt nog steeds een server nodig voor inloggen en toegangsbeheer, duurzame opslag en geschiedenis, doorsturen tussen clients die elkaar niet kunnen bereiken, en presence."
model.nodelete.text: "OT, omdat een CRDT verwijderingen slecht kan weergeven: is een teken weg, dan is zijn id weg, en gelijktijdige wijzigingen ernaast gaan stuk."
model.nodelete.why: "Zwak. Onjuist: een CRDT bewaart verwijderde tekens als tombstones, of in een delete set, juist zodat gelijktijdige operaties er nog naar kunnen verwijzen. Dat is een kostenpost, geen ontbrekende functie."
intent.prompt.1: "Joris schrijft \"we ship on friday\". \"Ana selecteert 'on friday' en wist het. Op hetzelfde moment typt Ben, die dat nog niet gezien heeft, 'next ' vóór 'friday'.\""
intent.prompt.2: "\"Beide wijzigingen bereiken iedereen. Wat moet de tekst worden?\""
intent.keep.text: "'we ship next ': Ana's tekens gaan weg, Bens invoeging blijft. Vreemd, maar geen toetsaanslag verdwijnt stil, en beiden zien het en herstellen het."
intent.keep.why: "Goed. Intentiebehoud: Ana wilde de tekens wissen die zij zag, Ben wilde zijn tekst invoegen. OT verplaatst een invoeging binnen een gewist bereik naar de plek waar dat bereik stond; een sequence-CRDT zet hem naast zijn buren, die nu tombstones zijn. Beide geven 'we ship next ' op elke kopie. Het leest vreemd, en dat is eerlijk: geen van beide algoritmes begrijpt betekenis, dus een mens lost het op."
intent.drop.text: "'we ship ': de invoeging van Ben ligt binnen het bereik dat Ana wiste, dus haar verwijdering wint en zijn invoeging verdwijnt mee."
intent.drop.why: "Half goed, en er valt over te twisten: sommige editors doen dit om vreemde restjes te voorkomen. Maar wat Ben typte verdwijnt zonder dat iemand het hem vertelt, en het is niet wat OT of een CRDT standaard doet. Kies je dit, laat Ben dan zien wat er weggevallen is."
intent.revive.text: "'we ship on next friday': de wijziging van Ben laat zien dat de woorden nog nodig zijn, dus de verwijdering van Ana vervalt."
intent.revive.why: "Zwak. Het overrulet Ana op basis van een gok over betekenis. Geen enkel samenvoegalgoritme kent de bedoeling, en een regel die gewiste tekst terugbrengt, pakt het omgekeerde geval flink verkeerd uit."
intent.raw.text: "Pas de invoeging van Ben toe op de positie waar hij typte, teken 11, in wat de tekst op de server inmiddels geworden is op het moment dat hij aankomt."
intent.raw.why: "Zwak. Na de verwijdering van Ana is de tekst 'we ship ', 8 tekens, dus positie 11 bestaat niet, en op kopieën die de wijzigingen in een andere volgorde toepassen komt hij ergens anders terecht: de kopieën lopen uiteen. Posities moeten getransformeerd worden, of vervangen door id's."
reconnect.prompt.1: "\"Het team koos een CRDT. Mila werkte vier uur in een vliegtuig en is net geland. Zet haar herverbinding op volgorde.\""
reconnect.auth.text: "Opnieuw verbinden, opnieuw inloggen, en controleren of ze dit document nog mag bewerken"
reconnect.auth.why: "Eerst. Vier uur is lang genoeg om haar toegang in te trekken, en operaties van iemand die misschien niet meer mag bewerken, horen niet samengevoegd te worden."
reconnect.vectors.text: "State vectors uitwisselen: elke kant zegt welke operaties hij gezien heeft"
reconnect.vectors.why: "Daarna. Een state vector is klein, een teller per client, en vertelt elke kant precies wat de ander mist, zonder het hele document te sturen."
reconnect.missing.text: "Elke kant stuurt alleen de operaties die de ander mist"
reconnect.missing.why: "Dan alleen het verschil, in beide richtingen: vier uur van haar wijzigingen omhoog, die van alle anderen omlaag."
reconnect.persist.text: "De server voegt haar operaties samen en schrijft ze duurzaam weg in het log van het document"
reconnect.persist.why: "Duurzaam voordat er iets bevestigd wordt: zodra de server bevestigt, mag haar client zijn lokale achterstand weggooien, dus een crash na dat moment mag haar vier uur niet kosten."
reconnect.broadcast.text: "Haar samengevoegde operaties sturen naar de bewerkers die nu online zijn"
reconnect.broadcast.why: "Als laatste, samen met het markeren. De andere kopieën convergeren zodra ze haar operaties toepassen."
reconnect.review.text: "Markeren waar haar offline wijzigingen die van anderen raakten, zodat een mens ernaar kijkt"
reconnect.review.why: "Als laatste, samen met het doorsturen. Convergentie garandeert overal dezelfde tekst, niet tekst die klopt: waar haar wijzigingen die van een ander raakten, hoort een mens te kijken."
servers.prompt.1: "Joris tekent het productieplan. \"Zie je het probleem?\""
servers.proposal.1: "40 WebSocket-servers achter een round-robin balancer; elke server neemt elke client aan."
servers.proposal.2: "Elke toetsaanslag en elke cursorbeweging wordt naar de documentendatabase geschreven."
servers.proposal.3: "Elke server pollt de database elke 200 ms op nieuwe rijen in de documenten die zijn clients open hebben."
servers.owner.text: "Eén document heeft bewerkers op veel servers: niets ordent zijn operaties op één plek, en ze horen elkaar alleen via polling: vertraging plus last."
servers.owner.why: "Goed. De schaaleenheid is het document: stuur elke bewerker van een document naar de ene server die het op dat moment bezit (consistent hashing op het document-id, met een overdracht als servers komen en gaan). Die server ordent de operaties, wat OT nodig heeft, stuurt ze vanuit het geheugen door en schrijft het log; de database is geen berichtenbus meer, en het pollen elke 200 ms vanaf 40 servers verdwijnt."
servers.cursors.text: "Cursorbewegingen gaan naar de database: ze veranderen vele keren per seconde en niemand heeft ze morgen nodig, en toch vullen ze het log."
servers.cursors.why: "Half goed. Echte verspilling: presence (cursors, selecties, wie er online is) is vluchtig, dus stuur het over de socket, houd het in het geheugen met een korte vervaltijd, en sla het nooit op. Maar de diepere fout is dat het document geen eigenaar heeft."
servers.sockets.text: "WebSockets kunnen niet door een HTTP-load-balancer heen, dus elke client heeft het directe adres van een server nodig om te verbinden."
servers.sockets.why: "Zwak. Een WebSocket begint als een HTTP-upgrade en gaat door gangbare load balancers heen; de verbinding blijft daarna op de server waar hij terechtkwam. Het probleem is welke server dat is."
servers.threads.text: "Veertig servers is veel te weinig: elke WebSocket heeft een eigen thread nodig, dus één server houdt op bij een paar honderd clients."
servers.threads.why: "Zwak. Event-driven servers houden elk tienduizenden grotendeels stille WebSockets open; een thread per verbinding is een keuze, geen wet. Het aantal servers is niet de fout."
storage.prompt.1: "\"Elk document heeft nu één eigenaar-server. Hoe sla je het op, zodat het snel opent en een crash niets kwijtraakt dat iemand bevestigd zag?\""
storage.logsnap.text: "Schrijf elke operatie naar een duurzaam log voordat je hem bevestigt, maak elke paar honderd operaties een snapshot, en open vanaf snapshot plus nieuwer log."
storage.logsnap.why: "Goed. Het log is de waarheid en geeft geschiedenis, ongedaan maken en 'wat is er veranderd sinds versie v' voor clients die terugkomen; snapshots begrenzen de openingstijd. Een snapshot is ook waar een CRDT kan compacteren: gooi de tombstones weg die elke client heeft bevestigd, met een grens waarna heel oude clients opnieuw moeten laden."
storage.latest.text: "Overschrijf na elke operatie één opgeslagen kopie van het hele document, zodat de database altijd de huidige tekst heeft."
storage.latest.why: "Zwak. Elke operatie herschrijft het hele document, en de geschiedenis is weg: OT kan de achterstand van een terugkerende client niet transformeren zonder de operaties die hij miste, en er is geen versiegeschiedenis."
storage.logonly.text: "Schrijf elke operatie naar een duurzaam log voordat je hem bevestigt, en bouw het document bij elke keer openen op door het log vanaf de eerste operatie af te spelen."
storage.logonly.why: "Half goed. Niets raakt kwijt en de geschiedenis is compleet, maar een document openen speelt elke toetsaanslag af sinds het bestaat, en dat groeit onbegrensd: jaren aan wijzigingen bij elke keer openen."
storage.memory.text: "Houd het document in het geheugen van de eigenaar-server en schrijf elke 10 minuten een snapshot; een paar minuten verliezen bij een zeldzame crash is acceptabel."
storage.memory.why: "Zwak. Tot 10 minuten aan wijzigingen die mensen bevestigd zagen, verdwijnen bij een crash. Een bevestiging moet betekenen dat de operatie duurzaam is."
storage.presence.text: "Sla operaties, cursors en presence samen op in één duurzaam log, zodat de geschiedenis kan afspelen wie waar was en waar iedereen naar keek."
storage.presence.why: "Zwak. Presence is vluchtig en frequent: opslaan vermenigvuldigt het log met data die niemand nodig heeft, en afspelen brengt de geesten van oude cursors terug."
fanout.prompt.1: "\"Een document voor de hele organisatie: 50 mensen bewerken tegelijk. Elke client stuurt elke 200 ms één bericht met zijn wijzigingen en cursor. De server stuurt elk bericht door naar elke andere bewerker.\""
fanout.prompt.2: "\"Hoeveel berichten per seconde verstuurt de server ongeveer voor dit ene document?\""
fanout.working: "Uitwerking: elke client stuurt 5 berichten per seconde, dus er komen er 50 × 5 = 250 binnen. Elk gaat naar de 49 anderen: 250 × 49 ≈ 12.250 per seconde, voor één document. Fan-out groeit met het kwadraat van het aantal bewerkers. Daarom bundelen servers: één uitgaand bericht per client per tik, met ieders wijzigingen erin, is 50 × 5 = 250 per seconde, en cursors kun je minder vaak sturen dan wijzigingen."
fanout.lt1k.text: "minder dan 1.000 per seconde"
fanout.lt1k.why: "Te laag voor dit ontwerp. Zo'n 250 is wat er binnenkomt, 50 × 5, of wat er uitgaat als de server alle wijzigingen bundelt in één bericht per client per tik. Elk bericht apart doorsturen vermenigvuldigt het met 49."
fanout.thousands.text: "1.000 tot 10.000 per seconde"
fanout.thousands.why: "Dichtbij: 50 × 49 ≈ 2.450 telt één bericht per bewerker per seconde. Met één per 200 ms zijn het er vijf per seconde."
fanout.tens.text: "10.000 tot 100.000 per seconde"
fanout.tens.why: "Goed: zo'n 12.000 per seconde, voor één document."
fanout.hundreds.text: "100.000 tot 1 miljoen per seconde"
fanout.hundreds.why: "Te hoog. Telde je toetsaanslagen in plaats van gebundelde berichten, of de 49 ontvangers dubbel? 250 berichten binnen, elk 49 keer verstuurd, is zo'n 12.000."
fanout.millions.text: "meer dan 1 miljoen per seconde"
fanout.millions.why: "Veel te hoog voor één document met 50 bewerkers: zelfs elke toetsaanslag van elke bewerker, doorgestuurd naar alle anderen, blijft daar ver onder."
hint.model: "Beide hoofdantwoorden kunnen winnen. Het gaat erom dat je noemt wat jouw keuze kost."
hint.intent: "Ieder wilde de tekens veranderen die hij zag. Welke uitkomst gooit niets weg zonder het iemand te vertellen?"
hint.servers: "Volg de bewerkers van één document: op hoeveel servers landen ze, en hoe horen die servers van elkaars wijzigingen?"
hint.fanout: "Eerst de berichten die per seconde binnenkomen, dan de kopieën per bericht."
hint.breathe: "Even ademhalen. Joris wil horen wat elke keuze kost, niet de naam van een algoritme."
won.1: "Joris klapt de laptop dicht. \"Operaties, geen documenten. Eén eigenaar per document. Kosten genoemd, van beide kanten. Dat is het niveau dat we hier boven zoeken.\""
lost.1: "\"Laten we hier voor nu stoppen.\" Joris haalt vriendelijk zijn schouders op. \"Lees de uitleg: het meeste hiervan gaat over wat mensen op hetzelfde moment zien. Kom terug wanneer je wilt.\""
