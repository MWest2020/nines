title: "Service down"
summary: "The shop's web server will not start. Find the cause in the logs, fix it and restart the service."
offer.1: "I'm Bas, on call this week. The shop has been down since three in the morning and I've had one coffee."
offer.2: "Nginx won't start on app-01. Can you take a look? It's in the rack in the server room."
active.1: "Don't just restart it over and over. The logs tell you why it fails: journalctl -u nginx."
done.1: "It's up! One letter. One letter took the shop down for six hours. I'm going back to bed."
npc.name: "Bas"
npc.idle: "Rule one of on-call: read the logs before you touch anything."
npc.after: "I've added nginx -t to my checklist. Test the config before you restart."
motd: "app-01. The shop is down: nginx failed to start at 03:12. Find out why, fix it, restart it."
obj.web: "nginx is running"
hint.status: "systemctl status nginx shows the service and its last log lines."
hint.journal: "Restarting again won't help. Read why it failed: journalctl -u nginx"
hint.typo: "The log names a file and a line: /etc/nginx/conf.d/shop.conf:2. Open it with edit and look closely at that line."
event.config_gone: "You deleted the shop's config. If nginx starts now, it will happily serve its 'Welcome to nginx!' page instead of the shop. Write a new shop.conf with edit, or think again."
