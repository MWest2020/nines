title: "Service plat"
summary: "De webserver van de webshop wil niet starten. Zoek de oorzaak in de logs, herstel het en herstart de service."
offer.1: "Ik ben Bas, ik heb deze week dienst. De webshop ligt sinds drie uur vannacht plat en ik heb pas één koffie op."
offer.2: "Nginx start niet op app-01. Wil jij even kijken? Hij staat in het rek in de serverruimte."
active.1: "Niet steeds opnieuw herstarten. De logs vertellen waarom het misgaat: journalctl -u nginx."
done.1: "Hij draait! Eén letter. Eén letter legde de webshop zes uur plat. Ik ga terug naar bed."
npc.name: "Bas"
npc.idle: "Regel één van piketdienst: lees de logs voordat je iets aanraakt."
npc.after: "Ik heb nginx -t op mijn checklist gezet. Test de config voordat je herstart."
motd: "app-01. De webshop ligt plat: nginx kon om 03:12 niet starten. Zoek uit waarom, herstel het en herstart."
obj.web: "nginx draait"
hint.status: "systemctl status nginx toont de service en zijn laatste logregels."
hint.journal: "Nog eens herstarten helpt niet. Lees waarom het misging: journalctl -u nginx"
hint.typo: "Het log noemt een bestand en een regel: /etc/nginx/conf.d/shop.conf:2. Open het met edit en kijk goed naar die regel."
event.config_gone: "Je hebt de config van de webshop verwijderd. Als nginx nu start, toont hij vrolijk 'Welcome to nginx!' in plaats van de webshop. Schrijf een nieuwe shop.conf met edit, of denk nog eens na."
