# Amara, SRE lead and the SRE path's mentor in Medior City. No sprite yet: a placeholder tinted
# in the palette's brick red.
schema: 1
id: amara
author: {name: "Nines team"}
name: npc.name
tint: "#882828"
spawn: {map: medior-city, slot: npc-3, facing: down}
dialogue:
  - when: 'quest("error-budget") == "done"'
    lines: [npc.after]
  - when: '!path_chosen'
    lines: [npc.nopath]
  - when: 'career_path("sre")'
    lines: [npc.mentor.1, npc.mentor.2]
    intro: true
  - lines: [npc.side]
    intro: true
