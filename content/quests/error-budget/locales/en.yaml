title: "Burning, not on fire"
summary: "Amara, the SRE lead, wants you on her on-call rotation. First, walk her through a payments API that has been quietly failing since nine."
offer.1: "Amara. I run the on-call rotation, and I could use another pair of hands. But not before I know how you think."
offer.2: "Perfect timing, actually: payments is having a quiet bad day. Sit with me."
active.1: "The payments dashboard is still open. Shall we go through it?"
done.1: "Numbers right, alerts that only page for real trouble, and a policy instead of a punishment. Welcome to the rotation."
npc.name: "Amara"
npc.nopath: "You've just arrived, haven't you? Go and see Petra, the career coach by the Career Office, first. Once you've chosen a path, I'll show you how we keep things up."
npc.mentor.1: "SRE, then. Good choice: I'm your mentor. SLOs, error budgets, on-call, and a pager that gets quieter every month."
npc.mentor.2: "We start with the budget. Everything else in this job follows from it."
npc.side: "Not your path, but welcome. Whoever ships code should know what an error budget is, so take this one as a side quest."
npc.after: "The burn-rate alert fired twice last week, both times for something real. Nobody got paged for a blip. That's the job."
attacker: "Amara · SRE lead"
intro.1: "DASHBOARD 10:12 · payments-api · error rate 1.44% for 70 minutes · SLO 99.9%"
intro.2: "Amara turns her screen towards you: \"Not on fire, but burning. Nobody was paged; I found it on a dashboard. Walk me through it.\""
budget.prompt.1: "Amara: \"First the basics. payments-api has an availability SLO of 99.9% over a rolling 30 days.\""
budget.prompt.2: "\"How many minutes of full unavailability does that allow in those 30 days?\""
budget.working: "Working: 30 days × 24 hours × 60 minutes = 43,200 minutes. The SLO allows 100% - 99.9% = 0.1% of that: 43,200 × 0.001 = 43.2 minutes. For comparison: 99.99% allows 4.32 minutes, 99% allows 432 minutes, 7.2 hours."
budget.four.text: "under 5 minutes"
budget.four.why: "Too low: that is four nines. 99.99% over 30 days allows 4.32 minutes; 99.9% allows ten times as much."
budget.quarter.text: "5 to 20 minutes"
budget.quarter.why: "Too low. 0.1% of 43,200 minutes is 43.2 minutes."
budget.hour.text: "20 to 60 minutes"
budget.hour.why: "Right: 43.2 minutes, 0.1% of the 43,200 minutes in 30 days. Every failed request spends a little of it."
budget.hours.text: "1 to 10 hours"
budget.hours.why: "Too high: 7.2 hours is what 99% allows. Each extra nine divides the budget by ten."
budget.day.text: "at least 10 hours"
budget.day.why: "Far too high. Even a 99% SLO allows only 7.2 hours in 30 days; 99.9% allows 43.2 minutes."
burn.prompt.1: "Amara: \"Since the 09:00 deploy, 1.44% of payment requests fail. The SLO is still 99.9%.\""
burn.prompt.2: "\"What's the burn rate, and what does it tell you?\""
burn.ratio.text: "14.4: errors arrive 14.4 times faster than the SLO allows."
burn.ratio.why: "Best. 1.44% / 0.1% = 14.4. Burn rate is the observed error rate divided by the allowed error rate, 1 - SLO. A burn rate of 1 spends exactly the budget over the whole window; 14.4 spends it 14.4 times faster."
burn.same.text: "1.44: the burn rate is simply the error rate itself, as a share of all requests."
burn.same.why: "Weak. The error rate alone says nothing about the budget; you have to compare it with what the SLO allows. 1.44% is fine for a 98% SLO and terrible for 99.9%."
burn.nines.text: "144: divide 1.44% by the 0.01% that three nines leave over for errors."
burn.nines.why: "Weak. Three nines, 99.9%, leave 0.1% for errors, not 0.01%. That would be four nines, and a burn rate ten times too high."
burn.hours.text: "14.4: so at this rate, the month's whole budget is gone in about 14 hours."
burn.hours.why: "Half right. The ratio is right, but it is a speed, not a number of hours. At 14.4 times the allowed rate, a 30-day budget lasts 30 days / 14.4, about 50 hours."
runway.prompt.1: "Amara: \"The budget was untouched this month: no earlier errors in the 30-day window.\""
runway.prompt.2: "\"If the burn rate stays at 14.4, when is the whole budget gone?\""
runway.working: "Working: 30 days is 720 hours. At burn rate 1 the budget lasts all 720 hours; at 14.4 it lasts 720 / 14.4 = 50 hours, about 2.08 days. Per hour that is 14.4 / 720 = 2% of the budget, so after these first 70 minutes about 2.3% is already gone."
runway.hours.text: "under 6 hours"
runway.hours.why: "Too soon. Each hour at 14.4 spends 2% of the budget, so 6 hours spends about 12%."
runway.day.text: "6 to 24 hours"
runway.day.why: "Too soon. A full day at 14.4 spends 48% of the budget, a bit less than half."
runway.days.text: "24 to 72 hours"
runway.days.why: "Right: 720 / 14.4 = 50 hours, about two days. Time enough to act calmly, but far too fast for a ticket next week: this is the kind of burn that should page someone."
runway.week.text: "3 to 10 days"
runway.week.why: "Too late. That would be a burn rate between 3 and 10; at 14.4 it takes 50 hours."
runway.month.text: "10 days or more"
runway.month.why: "Far too late. Only a burn rate of 3 or less lasts 10 days or more; at 1 the budget lasts exactly the 30 days."
alert.prompt.1: "Amara: \"70 minutes and nobody was paged. Our only alert fires when the error rate passes 5%.\""
alert.prompt.2: "\"What would you set up instead?\""
alert.windows.text: "Page when both the 1-hour and 5-minute windows burn at 14.4x or more; slower burns get longer windows."
alert.windows.why: "Best. 14.4x over an hour means 2% of the month's budget is gone in that hour: worth waking someone. The 5-minute window makes the page stop soon after the fix. Slower burns, such as 6x over 6 hours, page or open a ticket depending on the team; 1x over 3 days is a ticket. These are common examples, not laws: tune them to your service."
alert.every.text: "Page on every 5xx from payments-api, so that not a single failed payment ever goes by unnoticed."
alert.every.why: "Weak. Every service has some errors; the SLO even budgets for them. Paging on each one floods on-call with noise until they stop looking."
alert.threshold.text: "Page when more than 1% of requests fail over the last 5 minutes."
alert.threshold.why: "Half right. It would have caught this one, but a short window on its own pages for brief blips that barely touch the budget, and it ignores slow burns below 1%."
alert.spent.text: "Page when the whole 30-day error budget is spent, because that is the moment the SLO breaks."
alert.spent.why: "Weak. By then it is too late to protect anything. The point of a burn-rate alert is to warn while there is still budget left."
noise.prompt.1: "In the review afterwards, a colleague proposes:"
noise.prompt.2: "Amara: \"What's wrong with that?\""
noise.proposal.1: "We missed this because we alert too little."
noise.proposal.2: "From now on: page on every pod restart, CPU above 80%, and any 5xx."
noise.proposal.3: "More pages, fewer surprises."
noise.symptoms.text: "Causes and blips, not what users feel: on-call learns to ignore pages and misses the real one."
noise.symptoms.why: "Best. Page on symptoms users feel, such as failed or slow payments against the SLO. A pod restart or a busy CPU may be harmless; put them on a dashboard for when you investigate. Too many pages train people to ignore them."
noise.cpu.text: "80% CPU is normal for many busy services; set the threshold at 95% instead and it becomes a useful page."
noise.cpu.why: "Half right. 80% is often harmless, true, but a higher threshold is still a cause, not a symptom. Users don't feel CPU; they feel failed payments."
noise.tickets.text: "Pages cost sleep, so make them all tickets that on-call reads the next morning."
noise.tickets.why: "Weak. Then a real outage at night waits until morning. The fix is fewer, better pages, not no pages."
noise.client.text: "5xx errors usually mean the client sent a bad request, so they shouldn't count."
noise.client.why: "Weak. 5xx codes are server errors; client errors are the 4xx range. Failed payments with a 5xx are exactly what the SLO should count."
policy.prompt.1: "By Thursday this incident and a second one have used up the whole budget. The product manager asks:"
policy.prompt.2: "\"So what happens to next week's release?\""
policy.agreed.text: "\"What we agreed in the policy: risky releases wait, and reliability fixes go first until the budget recovers.\""
policy.agreed.why: "Best. An error budget policy is written with product before anything breaks, so this is a known agreement, not a fight. Fixes and low-risk changes keep flowing; the budget decides how much risk you can take."
policy.freeze.text: "\"Nothing ships for the rest of the month, fixes included. The team has to feel this.\""
policy.freeze.why: "Weak. A budget is not a punishment, and blocking the fixes keeps the service unreliable for longer. Policies that feel like penalties get ignored or gamed."
policy.days.text: "\"Features ship as planned, but only on quiet days, with someone watching the dashboards.\""
policy.days.why: "Half right. Watching releases is good practice, but nothing changes in what the team works on: no reliability work goes first, so next month looks the same."
policy.lower.text: "\"We lower the SLO to 99.5% this month, so the budget is back and nothing has to change.\""
policy.lower.why: "Weak. Moving the target to escape the policy makes the SLO meaningless. Debatable in one way: if users really are fine with 99.5%, revisit the SLO, but in a calm review with product, not mid-month to dodge it."
setup.prompt.1: "Next quarter the refund API gets the same treatment. Put the steps in order."
setup.journey.text: "Pick the user journey and its SLI: the share of refund requests that succeed in time."
setup.journey.why: "First: what users care about, and how you measure it. Everything else is built on this number."
setup.target.text: "Agree the SLO target and window with product, for example 99.9% over 30 days."
setup.target.why: "Then the target, together with product: it decides the size of the budget and how much risk the team can take."
setup.policy.text: "Write the error budget policy together: what happens when the budget runs out."
setup.policy.why: "Then the policy, alongside the alerts; either may come first. Agree it while things are calm, not during an incident."
setup.alerts.text: "Set up burn-rate alerts: page on fast burns, a ticket for slow ones."
setup.alerts.why: "Alongside the policy: the alerts need the SLO and window, nothing more."
setup.review.text: "After a month, check the target and the alerts against real incidents and pages."
setup.review.why: "Last: a review with real data. Did pages match real trouble? Is the target what users need? Then tune."
hint.budget: "30 days have 43,200 minutes. How much is 0.1% of that?"
hint.burn: "Divide the error rate you see by the error rate the SLO allows."
hint.alert: "Page for a fast burn confirmed by a short window; a slow burn can wait for working hours."
hint.policy: "An error budget is an agreement made in advance, not a penalty after the fact."
hint.calm: "It's burning, not on fire: you have hours, not minutes. Think in budget, not in panic."
won.1: "Amara nods. \"43.2 minutes, a burn rate of 14.4, fifty hours of runway, and a policy we can live with. You're on the rotation from Monday.\""
lost.1: "Amara closes the laptop gently. \"Not yet. Let's go through it again; the explanations show where the numbers slipped.\""
