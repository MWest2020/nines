title: "Het smeult, het brandt nog niet"
summary: "Amara, de SRE-lead, wil je in haar on-callrooster. Eerst loop je met haar door een betaal-API die sinds negen uur stilletjes fouten geeft."
offer.1: "Amara. Ik regel het on-callrooster, en ik kan wel een extra paar handen gebruiken. Maar niet voor ik weet hoe jij denkt."
offer.2: "Goede timing eigenlijk: payments heeft een stille slechte dag. Kom even naast me zitten."
active.1: "Het payments-dashboard staat nog open. Zullen we het doorlopen?"
done.1: "Getallen goed, alerts die alleen piepen bij echte problemen, en een policy in plaats van een straf. Welkom in het rooster."
npc.name: "Amara"
npc.nopath: "Je bent er net, hè? Ga eerst even naar Petra, de loopbaancoach bij het loopbaanbureau. Als je een pad hebt gekozen, laat ik je zien hoe wij alles in de lucht houden."
npc.mentor.1: "SRE dus. Goede keuze: ik ben je mentor. SLO's, error budgets, on-call, en een pager die elke maand stiller wordt."
npc.mentor.2: "We beginnen bij het budget. Al het andere in dit vak volgt daaruit."
npc.side: "Niet jouw pad, maar welkom. Wie code oplevert, hoort te weten wat een error budget is, dus doe deze maar als zijquest."
npc.after: "De burn-rate-alert ging vorige week twee keer af, allebei voor iets echts. Niemand is gepiept voor een kleine hapering. Daar gaat het om."
attacker: "Amara · SRE-lead"
intro.1: "DASHBOARD 10:12 · payments-api · error rate 1.44% for 70 minutes · SLO 99.9%"
intro.2: "Amara draait haar scherm naar je toe: \"Het brandt niet, maar het smeult. Niemand is gepiept; ik zag het toevallig op een dashboard. Loop er eens met me doorheen.\""
budget.prompt.1: "Amara: \"Eerst de basis. payments-api heeft een beschikbaarheids-SLO van 99,9% over een rollend venster van 30 dagen.\""
budget.prompt.2: "\"Hoeveel minuten volledige onbeschikbaarheid mag dat in die 30 dagen?\""
budget.working: "Uitwerking: 30 dagen × 24 uur × 60 minuten = 43.200 minuten. De SLO staat 100% - 99,9% = 0,1% daarvan toe: 43.200 × 0,001 = 43,2 minuten. Ter vergelijking: 99,99% staat 4,32 minuten toe, 99% staat 432 minuten toe, 7,2 uur."
budget.four.text: "minder dan 5 minuten"
budget.four.why: "Te weinig: dat is vier negens. 99,99% over 30 dagen staat 4,32 minuten toe; 99,9% tien keer zoveel."
budget.quarter.text: "5 tot 20 minuten"
budget.quarter.why: "Te weinig. 0,1% van 43.200 minuten is 43,2 minuten."
budget.hour.text: "20 tot 60 minuten"
budget.hour.why: "Goed: 43,2 minuten, 0,1% van de 43.200 minuten in 30 dagen. Elke mislukte request gebruikt er een beetje van."
budget.hours.text: "1 tot 10 uur"
budget.hours.why: "Te veel: 7,2 uur is wat 99% toestaat. Elke negen erbij deelt het budget door tien."
budget.day.text: "10 uur of meer"
budget.day.why: "Veel te veel. Zelfs een SLO van 99% staat maar 7,2 uur toe in 30 dagen; 99,9% staat 43,2 minuten toe."
burn.prompt.1: "Amara: \"Sinds de deploy van 09:00 mislukt 1,44% van de betaalverzoeken. De SLO is nog steeds 99,9%.\""
burn.prompt.2: "\"Wat is de burn rate, en wat zegt die je?\""
burn.ratio.text: "14,4: de fouten komen 14,4 keer sneller binnen dan de SLO toestaat."
burn.ratio.why: "Goed. 1,44% / 0,1% = 14,4. De burn rate is het gemeten foutpercentage gedeeld door het toegestane foutpercentage, 1 - SLO. Bij een burn rate van 1 gebruik je precies het budget over het hele venster; bij 14,4 gaat het 14,4 keer zo snel."
burn.same.text: "1,44: de burn rate is gewoon het foutpercentage zelf, als aandeel van alle verzoeken."
burn.same.why: "Zwak. Het foutpercentage alleen zegt niets over het budget; je moet het vergelijken met wat de SLO toestaat. 1,44% is prima bij een SLO van 98% en heel slecht bij 99,9%."
burn.nines.text: "144: deel 1,44% door de 0,01% die drie negens overlaten voor fouten."
burn.nines.why: "Zwak. Drie negens, 99,9%, laten 0,1% over voor fouten, niet 0,01%. Dat zou vier negens zijn, en een burn rate die tien keer te hoog is."
burn.hours.text: "14,4: dus in dit tempo is het hele maandbudget over zo'n 14 uur op."
burn.hours.why: "Half goed. De verhouding klopt, maar het is een snelheid, geen aantal uren. Bij 14,4 keer het toegestane tempo houdt een budget van 30 dagen het 30 dagen / 14,4 vol, ongeveer 50 uur."
runway.prompt.1: "Amara: \"Het budget was deze maand nog onaangeroerd: geen eerdere fouten in het venster van 30 dagen.\""
runway.prompt.2: "\"Als de burn rate op 14,4 blijft, wanneer is het hele budget dan op?\""
runway.working: "Uitwerking: 30 dagen is 720 uur. Bij burn rate 1 houdt het budget alle 720 uur stand; bij 14,4 houdt het 720 / 14,4 = 50 uur stand, ongeveer 2,08 dagen. Per uur is dat 14,4 / 720 = 2% van het budget, dus na deze eerste 70 minuten is al zo'n 2,3% op."
runway.hours.text: "binnen 6 uur"
runway.hours.why: "Te vroeg. Elk uur op 14,4 kost 2% van het budget, dus 6 uur kost zo'n 12%."
runway.day.text: "6 tot 24 uur"
runway.day.why: "Te vroeg. Een hele dag op 14,4 kost 48% van het budget, net iets minder dan de helft."
runway.days.text: "24 tot 72 uur"
runway.days.why: "Goed: 720 / 14,4 = 50 uur, ongeveer twee dagen. Genoeg tijd om rustig te handelen, maar veel te snel voor een ticket volgende week: bij zo'n burn hoort iemand gepiept te worden."
runway.week.text: "3 tot 10 dagen"
runway.week.why: "Te laat. Dat hoort bij een burn rate tussen 3 en 10; bij 14,4 duurt het 50 uur."
runway.month.text: "10 dagen of meer"
runway.month.why: "Veel te laat. Alleen een burn rate van 3 of minder houdt het 10 dagen of langer vol; bij 1 duurt het budget precies de 30 dagen."
alert.prompt.1: "Amara: \"70 minuten, en niemand is gepiept. Onze enige alert gaat af als het foutpercentage boven de 5% komt.\""
alert.prompt.2: "\"Wat zou jij ervoor in de plaats zetten?\""
alert.windows.text: "Piepen als 1 uur én 5 minuten allebei op 14,4x of meer branden; tragere burns krijgen langere vensters."
alert.windows.why: "Goed. 14,4x over een uur betekent dat 2% van het maandbudget in dat uur op is: reden genoeg om iemand wakker te maken. Het venster van 5 minuten zorgt dat de alert snel na de fix stopt. Tragere burns, zoals 6x over 6 uur, piepen of worden een ticket, afhankelijk van het team; 1x over 3 dagen is een ticket. Dit zijn gangbare voorbeelden, geen wetten: stem ze af op je dienst."
alert.every.text: "Piepen bij elke 5xx van payments-api, zodat er geen enkele mislukte betaling ooit ongemerkt voorbijgaat."
alert.every.why: "Zwak. Elke dienst heeft wat fouten; de SLO rekent er zelfs op. Piepen bij elke fout overspoelt on-call met ruis, tot ze niet meer kijken."
alert.threshold.text: "Piepen als meer dan 1% van de verzoeken mislukt in de laatste 5 minuten."
alert.threshold.why: "Half goed. Deze had je nu gevangen, maar een kort venster alleen piept bij korte haperingen die het budget nauwelijks raken, en mist trage burns onder de 1%."
alert.spent.text: "Piepen als het hele error budget van 30 dagen op is, want dat is het moment dat de SLO breekt."
alert.spent.why: "Zwak. Dan is het te laat om nog iets te beschermen. Het hele punt van een burn-rate-alert is waarschuwen zolang er nog budget over is."
noise.prompt.1: "Bij de evaluatie achteraf stelt een collega voor:"
noise.prompt.2: "Amara: \"Wat is daar mis mee?\""
noise.proposal.1: "We hebben dit gemist omdat we te weinig alerts hebben."
noise.proposal.2: "Vanaf nu: piepen bij elke pod-herstart, CPU boven de 80% en elke 5xx."
noise.proposal.3: "Meer piepjes, minder verrassingen."
noise.symptoms.text: "Oorzaken en haperingen, niet wat gebruikers merken: on-call leert piepjes te negeren en mist de echte."
noise.symptoms.why: "Goed. Piep op symptomen die gebruikers merken, zoals mislukte of trage betalingen afgezet tegen de SLO. Een herstartende pod of een drukke CPU kan onschuldig zijn; zet die op een dashboard voor als je iets onderzoekt. Te veel piepjes leren mensen ze te negeren."
noise.cpu.text: "80% CPU is normaal voor veel drukke diensten; zet de drempel op 95% en het wordt meteen een bruikbare alert."
noise.cpu.why: "Half goed. 80% is vaak onschuldig, klopt, maar een hogere drempel blijft een oorzaak, geen symptoom. Gebruikers merken geen CPU; ze merken mislukte betalingen."
noise.tickets.text: "Piepjes kosten slaap, dus maak er tickets van die on-call de volgende ochtend leest."
noise.tickets.why: "Zwak. Dan wacht een echte storing 's nachts tot de ochtend. De oplossing is minder en betere piepjes, niet geen piepjes."
noise.client.text: "5xx-fouten betekenen meestal dat de client een fout verzoek stuurde, dus die tellen niet."
noise.client.why: "Zwak. 5xx-codes zijn serverfouten; clientfouten zitten in de 4xx-reeks. Mislukte betalingen met een 5xx zijn precies wat de SLO moet tellen."
policy.prompt.1: "Tegen donderdag hebben dit incident en een tweede het hele budget opgebruikt. De productmanager vraagt:"
policy.prompt.2: "\"En wat betekent dat voor de release van volgende week?\""
policy.agreed.text: "\"Wat we in de policy hebben afgesproken: riskante releases wachten, betrouwbaarheid gaat voor tot het budget herstelt.\""
policy.agreed.why: "Goed. Een error budget policy schrijf je samen met product voordat er iets stukgaat, dus dit is een bekende afspraak, geen ruzie. Fixes en kleine, veilige wijzigingen blijven gewoon doorgaan; het budget bepaalt hoeveel risico je kunt nemen."
policy.freeze.text: "\"Er gaat de rest van de maand niets live, fixes ook niet. Het team moet dit voelen.\""
policy.freeze.why: "Zwak. Een budget is geen straf, en als je de fixes tegenhoudt, blijft de dienst langer onbetrouwbaar. Policies die als straf voelen, worden genegeerd of omzeild."
policy.days.text: "\"Features gaan live zoals gepland, maar alleen op rustige dagen, met iemand die de dashboards in de gaten houdt.\""
policy.days.why: "Half goed. Releases in de gaten houden is goed, maar er verandert niets aan waar het team aan werkt: betrouwbaarheidswerk krijgt geen voorrang, dus volgende maand ziet er hetzelfde uit."
policy.lower.text: "\"We verlagen de SLO deze maand naar 99,5%, dan is het budget terug en hoeft er niets te veranderen.\""
policy.lower.why: "Zwak. Het doel verschuiven om onder de policy uit te komen maakt de SLO betekenisloos. Op één punt valt erover te twisten: als gebruikers echt tevreden zijn met 99,5%, herzie dan de SLO, maar in een rustige evaluatie met product, niet halverwege de maand om eronderuit te komen."
setup.prompt.1: "Volgend kwartaal krijgt de refund-API dezelfde aanpak. Zet de stappen op volgorde."
setup.journey.text: "Kies de gebruikersreis en de SLI: het aandeel refundverzoeken dat op tijd slaagt."
setup.journey.why: "Eerst: waar gebruikers om geven, en hoe je dat meet. Al het andere bouwt op dit getal."
setup.target.text: "Spreek het SLO-doel en het venster af met product, bijvoorbeeld 99,9% over 30 dagen."
setup.target.why: "Dan het doel, samen met product: dat bepaalt hoe groot het budget is en hoeveel risico het team kan nemen."
setup.policy.text: "Schrijf samen de error budget policy: wat er gebeurt als het budget op is."
setup.policy.why: "Dan de policy, naast de alerts; welke eerst komt maakt niet uit. Spreek hem af als het rustig is, niet tijdens een incident."
setup.alerts.text: "Zet burn-rate-alerts op: piepen bij snelle burns, een ticket bij trage."
setup.alerts.why: "Naast de policy: de alerts hebben alleen de SLO en het venster nodig."
setup.review.text: "Leg na een maand het doel en de alerts naast echte incidenten en piepjes."
setup.review.why: "Als laatste: een evaluatie met echte data. Pasten de piepjes bij echte problemen? Is het doel wat gebruikers nodig hebben? Stem dan bij."
hint.budget: "30 dagen hebben 43.200 minuten. Hoeveel is 0,1% daarvan?"
hint.burn: "Deel het foutpercentage dat je ziet door het foutpercentage dat de SLO toestaat."
hint.alert: "Piep bij een snelle burn die een kort venster bevestigt; een trage burn kan wachten tot kantoortijd."
hint.policy: "Een error budget is een afspraak vooraf, geen straf achteraf."
hint.calm: "Het smeult, het brandt niet: je hebt uren, geen minuten. Denk in budget, niet in paniek."
won.1: "Amara knikt. \"43,2 minuten, een burn rate van 14,4, vijftig uur speelruimte, en een policy waar we mee kunnen leven. Vanaf maandag sta je in het rooster.\""
lost.1: "Amara klapt de laptop zachtjes dicht. \"Nog niet. Laten we het nog eens doorlopen; de uitleg laat zien waar de getallen misgingen.\""
