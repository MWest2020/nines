title: "Pentest: Klompz staging-webshop"
summary: "Een geautoriseerde test van de stagingsite van een webshop. Lees de getekende scope, bewijs het lek uit config en logs zonder de geheimen te openen, blijf uit productie, en schrijf het op."
offer.1: "Esra, Duinwacht Security. Klein bureau, goede klanten. Sanne in Junior Village zegt dat jij de scope leest voordat je iets aanraakt. Mooi."
offer.2: "Klompz verkoopt klompen online en heeft getekend voor een test van hun staging-webshop, shop-stg-01. Hun machine staat bij de pentestbalie in The Stack."
offer.3: "Mediorregels: de scope zegt staging, dus productie is niet van jou, ook niet om te lezen. Geheimen die je vindt: zeg waar ze lekken, open ze niet. En melden, niet repareren."
offer.4: "Mijn mentees mogen eerst kiezen, maar iedereen met een schoon blazoen en een eigen pad is welkom. Klaar?"
active.1: "Eerst de scope. Dan de config van de site, de instellingen van de app en de logs. Bewijs het daarmee, en blijf van de .env af."
done.1: "Debugmodus aan op staging, en een diagnosepagina open voor heel internet. Iemand haalde hem om drie uur 's nachts op. Klompz heeft voor de lunch elke sleutel geroteerd."
done.2: "En je hebt de geheimen genoemd zonder ze te lezen. Dat is het verschil tussen een bevinding en een datalek."
npc.name: "Esra"
npc.no_path: "Wij nemen consultants die weten waar ze heen willen. Praat eerst met Petra, de loopbaancoach: kies een pad, en kom dan bij mij terug."
npc.no_clearance: "Elke klant checkt wie we sturen. Met jouw blazoen zeggen ze nee, en ik ook. Het Repair Café in Junior Village doet taakstraffen: begin daar."
npc.mentee: "Je zit op mijn pad, dus hier is de regel die elke mentee van me krijgt: de scope is het enige verschil tussen een pentest en een misdrijf."
npc.side: "Niet mijn pad, maar elke engineer moet een systeem één keer bekijken zoals een aanvaller dat doet. Schoon blazoen, getekende scope, en je bent binnen."
npc.after_mentee: "Goede opdracht. Volgende keer mag jij de nabespreking met de klant leiden. Zo wordt een mentee een lead."
npc.after_side: "Bedankt voor je hulp bij Klompz. Als je eigen pad je ooit verveelt: Duinwacht zoekt altijd mensen die de scope lezen."
motd: "shop-stg-01, staging-webshop van Klompz. Opdracht KZ-2026-12 is getekend: de scope staat in ~/engagement/scope.txt. Lees die eerst."
obj.scope: "lees de getekende scope"
obj.where: "finding-01 noemt de instelling en haar bestand, en het webpad"
obj.what: "finding-01 noemt wat de pagina weggeeft (de geheimen bij naam, niet hun waarde)"
obj.severity: "finding-01 geeft een oordeel: Severity: low, medium, high of critical"
obj.close: "finding-01 raadt aan het te dichten: debug op false, of de route verwijderen of afschermen"
obj.rotate: "finding-01 raadt aan te roteren wat al gelekt is"
hint.scope: "Niets vóór de scope: cat ~/engagement/scope.txt. Daarin staat wat staging is en wat niet."
hint.config: "Wat kan internet bereiken? nginx bepaalt welke paden naar de app gaan (zijn sites staan in /etc/nginx/sites-enabled), en de app heeft eigen instellingen in /srv/staging/app."
hint.route: "Een uitgecommentarieerde allow en deny betekent: open voor iedereen. Heeft iemand van buiten kantoor dat pad gebruikt? De site heeft een eigen accesslog in /var/log/nginx."
hint.exposed: "Wat liet die pagina zien? Open de .env niet om daarachter te komen. De app schrijft een eigen log in /var/log/klompz, en die is spraakzaam over zijn diagnose."
hint.write: "Schrijf het op in ~/engagement/finding-01.txt: de instelling en het pad, de geheimen die het laat zien (alleen namen), hoe erg dat is, hoe je het dicht, en wat te doen met sleutels die vreemden al hebben gezien."
event.scope_first: "Esra tikt op het bureau: \"Eerst de scope. Altijd. Tot je hebt gelezen wat ze tekenden, weet je niet wat staging is en wat een misdrijf.\""
event.production: "Dat is /srv/releases/prod: productie, buiten scope. Een recursieve grep over /srv loopt er ook recht in. Esra stopt de test en belt Klompz om het te melden. Verloren uren en een ongemakkelijk telefoontje: €150."
event.opened_secrets: "Je hebt de .env geopend. Dat hoefde niet: de log van de app noemde al elke variabele die de pagina laat zien. Echte geheimen lezen is waar een test ophoudt beleefd te zijn."
event.fixed_it: "Je hebt hun stagingmachine aangepast. De scope zegt: melden, niet repareren. De developers van Klompz zoeken een uur waarom staging zich anders gedraagt, en de machine wordt teruggezet. Dat kostte €75."
check.where_path: "finding-01 noemt het webpad nog niet: welke route toont de debugpagina?"
check.where_setting: "finding-01 noemt de instelling nog niet: wat zet de debugpagina aan, en in welk bestand?"
check.what_secrets: "finding-01 zegt nog niet wat de pagina weggeeft: noem de geheimen (namen, geen waarden)."
check.severity_low: "Severity is {value}. Live sleutels op een openbare pagina zijn erger dan dat."
check.close_missing: "finding-01 raadt nog niet aan om het te sluiten: debug uit, of de route weg of afgeschermd."
check.rotate_missing: "finding-01 zegt nog niet wat er moet gebeuren met sleutels die vreemden al gezien kunnen hebben."
