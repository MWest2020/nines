title: "Pentest: Klompz staging webshop"
summary: "An authorised web application assessment of a webshop's staging site. Read the signed scope, prove the hole from config and logs without opening the secrets, stay out of production, and write it up."
offer.1: "Esra, Duinwacht Security. Small firm, good clients. Sanne in Junior Village says you read a scope before you touch a thing. Good."
offer.2: "Klompz sells clogs online and signed off on a test of their staging webshop, shop-stg-01. Their box is at the pentest desk in The Stack."
offer.3: "Medior rules: the scope says staging, so production is not yours, not even to read. Secrets you find: say where they leak, don't open them. And report, don't fix."
offer.4: "My mentees get first pick of engagements, but anyone with a clean record and a path of their own is welcome. Ready?"
active.1: "Scope first. Then the site's config, the app's settings and the logs. Prove it from those, and keep your hands off the .env."
done.1: "Debug mode on staging, and a diagnostics page open to the whole internet. Someone fetched it at three in the morning. Klompz rotated every key before lunch."
done.2: "And you named the secrets without reading them. That's the difference between a finding and a breach."
npc.name: "Esra"
npc.no_path: "We take consultants who know where they're heading. Talk to Joyce, the career coach, first: pick a path, then come back to me."
npc.no_clearance: "Every client checks who we send. With your record they'd say no, and so do I. The Repair Café in Junior Village does community service: start there."
npc.mentee: "You're on my path, so here's the rule I give every mentee: the scope is the only thing between a pentest and a crime."
npc.side: "Not my path, but every engineer should see a system the way an attacker does once. Clean record, signed scope, and you're in."
npc.after_mentee: "Good engagement. Next time I'll let you run the debrief with the client. That's how a mentee becomes a lead."
npc.after_side: "Thanks for the help on Klompz. If your own path ever bores you, Duinwacht always needs people who read the scope."
motd: "shop-stg-01, Klompz staging webshop. Engagement KZ-2026-12 is signed: the scope is in ~/engagement/scope.txt. Read it first."
obj.scope: "read the signed scope"
obj.where: "finding-01 names the setting and its file, and the web path"
obj.what: "finding-01 names what the page gives away (the secrets by name, not their values)"
obj.severity: "finding-01 rates it: Severity: low, medium, high or critical"
obj.close: "finding-01 recommends closing it: debug false, or the route removed or denied"
obj.rotate: "finding-01 recommends rotating what already leaked"
hint.scope: "Nothing before the scope: cat ~/engagement/scope.txt. It says what is staging and what is not."
hint.config: "What can the internet reach? nginx decides which paths go to the app (its sites are in /etc/nginx/sites-enabled), and the app has its own settings in /srv/staging/app."
hint.route: "A commented-out allow and deny means: open to everyone. Has anyone from outside the office used that path? The site has its own access log in /var/log/nginx."
hint.exposed: "What did that page print? Don't open the .env to find out. The app writes its own log in /var/log/klompz, and it is chatty about its diagnostics."
hint.write: "Write it up in ~/engagement/finding-01.txt: the setting and the path, the secrets it shows (names only), how bad that is, how to close it, and what to do about keys that strangers have already seen."
event.scope_first: "Esra taps the desk: \"Scope first. Every time. Until you've read what they signed, you don't know what's staging and what's a crime.\""
event.production: "That's /srv/releases/prod: production, out of scope. Esra stops the test and calls Klompz to report it, and a recursive grep over /srv walks right into it. Lost hours and an awkward call: €150."
event.opened_secrets: "You opened the .env. You didn't need to: the app's log already named every variable the page shows. Reading live secrets is where an assessment stops being polite."
event.fixed_it: "You changed their staging box. The scope says: report, don't fix. Klompz's developers lose an hour finding out why staging behaves differently, and the machine is put back as it was. That cost €75."
