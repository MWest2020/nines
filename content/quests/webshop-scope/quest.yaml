# The ethical hacker's Medior engagement (DESIGN.md, Ethical hacker): an authorised assessment of
# a fictional webshop's STAGING site, with a signed scope. The finding is a misconfiguration read
# from config and logs: debug mode left on, and the nginx route to its diagnostics page opened to
# everyone, so anyone could read the app's environment (a payment test key, the database
# password). The player proves it without opening the secrets, stays out of production, changes
# nothing, and writes finding-01. Esra gives it to anyone who chose a career path and has a clean
# record: her mentees on the ethical path, everyone else as a side quest.
