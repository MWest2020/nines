title: "The 3 AM pager"
summary: "The pager goes off in the middle of the night: checkouts fail after a deploy. Triage it, with Bas on the line."
offer.1: "You're on the on-call rota now. Congratulations, I think."
offer.2: "When the pager goes, I'm on the line with you. You lead, I ask the annoying questions."
active.1: "The on-call laptop is by the coffee machine, if you want to replay that night."
done.1: "Rolled back, verified, told support, slept. Then a blameless postmortem. That's the whole job, really."
attacker: "PAGER · checkout-api"
intro.1: "PAGER 03:07 · checkout-api · 5xx error rate 18% (alert at 1%)"
intro.2: "Your phone buzzes on the nightstand. Bas joins the call, sleepy: \"I see it too. You're on call. Talk me through it.\""
first.prompt.1: "Bas: \"18% of checkouts are failing. What's your first move?\""
first.ack.text: "Acknowledge the page so it stops escalating, then open the checkout dashboard to see the impact."
first.ack.why: "Best. Acknowledging is taking ownership: the escalation stops and nobody else starts working blind in parallel. The dashboard then shows the impact: how bad, since when, which part."
first.code.text: "Open the checkout code and find the bug."
first.code.why: "Weak. The root cause comes later. First learn the impact and what changed; reading code at 3 AM without a lead is slow, and customers keep failing meanwhile."
first.restart.text: "Restart all checkout pods, because a restart clears bad state quickly and buys time to investigate while customers can pay again."
first.restart.why: "Weak. An action without a diagnosis. If the new version is broken, restarted pods run the same broken code, and you may wipe evidence. Restarts can help against a leak or a stuck process, but decide that after looking."
first.wait.text: "Wait ten minutes: night alerts are often noise."
first.wait.why: "Weak. A flapping alert can be watched for a while; 18% of checkouts failing is lost orders every minute. The page is real until the data says otherwise."
change.prompt.1: "The dashboard: errors jumped from 0.05% to 18% at 03:00, all on checkout-api. Traffic is normal."
change.prompt.2: "Bas: \"Where do you look next?\""
change.deploys.text: "At what changed around 03:00: the deploy log shows checkout-api v2.14 went out at 02:59."
change.deploys.why: "Best. A sudden step at an exact minute usually means a change: a deploy, a config change, a feature flag. Most incidents follow a change, just like the handover note on app-01 showed. Start from the last change."
change.resources.text: "At the CPU and memory graphs of every host, because an overloaded node is the most common reason a service starts returning 5xx."
change.resources.why: "Half right. Saturation matters, but it tends to climb, not to jump at an exact minute while traffic is normal. Check what changed first, then resources."
change.database.text: "At the database's slow query log, because checkout writes orders, and a slow or locked database shows up as checkout errors first."
change.database.why: "Half right. Possible, but only checkout-api is failing and traffic is normal; a database problem would usually show up in more than one service. Look at what changed first."
change.social.text: "At social media, to hear what customers say."
change.social.why: "Weak, for now. The metrics already tell you the impact. Customer messages matter for communication later, not for the diagnosis."
steps.prompt.1: "Bas: \"OK, the deploy it is. Put the next steps in order.\""
steps.declare.text: "Declare an incident in the incident channel and say who leads it."
steps.declare.why: "First: declare and lead. One person coordinates, everyone else knows where to look. It takes seconds; when a rollback is one click, many teams start it while declaring, which is fine too."
steps.rollback.text: "Roll checkout-api back to v2.13, the last version that worked."
steps.rollback.why: "Then mitigate. Rolling back to a known-good version stops the damage fastest; understanding the bug can wait until customers are safe."
steps.support.text: "Tell support what customers see and when the next update comes."
steps.support.why: "At the same time as the rollback, either order is right: a first update while the rollback runs. Who communicates and who fixes can be different people; that is why you declared."
steps.verify.text: "Check on the dashboard that the error rate is back to normal."
steps.verify.why: "Verify. A rollback is a hypothesis until the graph agrees. Only then say 'mitigated'."
steps.cause.text: "Find the root cause in v2.14, with its logs and its diff."
steps.cause.why: "Root cause, once customers are safe, ideally in daylight. The logs and the diff of v2.14 against v2.13 are the leads."
steps.postmortem.text: "Write a blameless postmortem with action items."
steps.postmortem.why: "Postmortem last: the timeline, the cause, what went well, and actions that make the system safer."
hotfix.prompt.1: "Ravi joins the call, wide awake. \"No rollback needed, I see the bug. Here's my plan:\""
hotfix.prompt.2: "Bas: \"What is the problem with Ravi's plan?\""
hotfix.proposal.1: "Patch the missing null check in v2.14 right now."
hotfix.proposal.2: "Push it straight to main and skip CI, because the pipeline takes 12 minutes."
hotfix.proposal.3: "Deploy the patch to production directly."
hotfix.untested.text: "Roll back to the known-good v2.13 first, then fix forward through the normal pipeline, in daylight."
hotfix.untested.why: "Best. Rolling back to a version that ran fine for weeks is the lowest-risk way to stop the damage. Skipping CI under pressure is how one incident becomes two. The fix still ships, with tests, in daylight."
hotfix.branch.text: "Push the patch to a branch with a quick review first."
hotfix.branch.why: "Weak. A review is better than none, but where the commit goes is not the danger: skipping the tests and changing production with an unknown is, when a known-good version is one rollback away."
hotfix.never.text: "Hotfixes are never allowed during an incident, because any code change while production is broken makes the root cause harder to find."
hotfix.never.why: "Weak. Fixing forward is sometimes the only way, for example when a database migration cannot be undone and v2.13 would break on the new schema. Here a rollback is possible, so it is the safer choice."
hotfix.fine.text: "Nothing serious: at 3 AM speed matters more than a 12-minute pipeline."
hotfix.fine.why: "Weak. Twelve minutes is long at 3 AM, but a rollback redeploys an image that is already built and proven, usually faster than any patch and with far less risk. If CI is too slow for emergencies, that is an action item for the postmortem, not a reason to skip it tonight."
budget.prompt.1: "Bas: \"Our SLO: 99.9% of checkout requests succeed, measured over 30 days. Tonight 18% failed for 40 minutes. Assume traffic at the monthly average.\""
budget.prompt.2: "\"Roughly how much of this month's error budget did we just burn?\""
budget.working: "Working: 0.1% of 30 days is 30 × 24 × 60 × 0.001 = 43.2 minutes of full outage. Tonight: 18% of requests for 40 minutes is 0.18 × 40 = 7.2 minutes of full outage. 7.2 / 43.2 ≈ 17%. Real traffic at 3 AM is lower than average, so counted per request the burn is smaller still."
budget.tiny.text: "under 5%"
budget.tiny.why: "Too low. Did you compare with a year's budget (525.6 minutes)? The SLO window here is 30 days: 43.2 minutes."
budget.some.text: "5% to 25%"
budget.some.why: "Right: about 17%."
budget.big.text: "25% to 50%"
budget.big.why: "Too high. Check the budget: 0.1% of 30 days is 43.2 minutes, and 18% for 40 minutes is only 7.2 minutes of full outage."
budget.most.text: "50% to 100%"
budget.most.why: "Too high. Counting all 40 minutes as a full outage would give about 93%, but only 18% of requests failed."
budget.blown.text: "more than 100%: the SLO is blown"
budget.blown.why: "Far too high. Burning the whole budget takes 43.2 minutes of full outage, or about 4 hours at 18%."
after.prompt.1: "03:40. The rollback is done and errors are back to 0.05%."
after.prompt.2: "Bas: \"Now what?\""
after.watch.text: "Watch the graphs a while, tell support it is mitigated, note the timeline, and leave the root cause for working hours."
after.watch.why: "Best. Customers are safe, so the urgency is gone. Tired people make mistakes, and a short timeline written while it is fresh makes the postmortem easy."
after.dig.text: "Stay up and find the root cause tonight, while the logs and the details are still fresh in your head."
after.dig.why: "Half right, and debatable. Curiosity is good, but the risk has passed, and tired debugging is slow and error-prone. Even if v2.14 has to ship soon, a morning start is soon enough."
after.quiet.text: "Close the incident and go to bed; the graphs are green."
after.quiet.why: "Weak. Support still thinks checkout is broken, and the team wakes up to a mystery. Closing an incident includes saying so."
after.redeploy.text: "Deploy v2.14 once more for a few minutes while watching closely, to confirm the deploy was really the cause before the postmortem."
after.redeploy.why: "Weak. Reproducing the bug in production hurts customers a second time. Reproduce it in a test environment, with the diff and the logs."
blame.prompt.1: "Monday. The postmortem draft says:"
blame.prompt.2: "Bas: \"What's wrong with it?\""
blame.proposal.1: "Root cause: Ravi forgot a null check in v2.14."
blame.proposal.2: "Action item: Ravi will be more careful."
blame.blameless.text: "It blames a person. Ask why the system let the bug through (no test, no canary, an unwatched night deploy) and fix that."
blame.blameless.why: "Best. People make mistakes; systems decide whether a mistake reaches customers. 'Be more careful' changes nothing. A test, a canary step or a rule against unwatched night deploys does."
blame.fine.text: "Nothing: it names the exact cause and gives the follow-up an owner, which is what a postmortem is for."
blame.fine.why: "Weak. Accurate about the line of code, useless as a lesson. Blame makes people hide mistakes next time, which makes every future incident harder."
blame.reviewer.text: "It should also name the reviewer who approved the change, so the review step gets the same accountability as the author."
blame.reviewer.why: "Weak. More names, same problem. Ask what the review missed and how a check could catch it automatically."
blame.too-short.text: "No postmortem is needed at all: they are only worth writing for outages longer than an hour, and this one was over in forty minutes."
blame.too-short.why: "Weak. 18% of checkouts failing for 40 minutes is worth learning from. Many teams set the bar by impact or by error budget burned, not by duration alone."
hint.change: "Remember app-01: the handover note said exactly what changed at 02:55. A jump at an exact minute means: look at the last change."
hint.steps: "Stop the bleeding before you study the wound: mitigate, verify, then investigate."
hint.hotfix: "Ravi's pipeline once failed on a single tab character. What could a 3 AM patch without CI do?"
hint.budget: "Turn the SLO into minutes: 0.1% of 30 days. Then turn tonight into minutes of full outage: 18% of 40 minutes."
hint.calm: "Breathe. In an incident, the safe and boring move is usually the right one."
won.1: "04:05. Errors back to normal, support informed, postmortem booked for Monday. Bas: \"Textbook. Go back to sleep.\""
lost.1: "Bas takes over for the rest of the night. \"No shame in it, it's 3 AM. Read the debrief and we'll replay it.\""
