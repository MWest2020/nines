title: "De pieper van drie uur 's nachts"
summary: "Midden in de nacht gaat de pieper: afrekenen mislukt na een deploy. Doe de triage, met Bas aan de lijn."
offer.1: "Je staat nu op het on-call-rooster. Gefeliciteerd, denk ik."
offer.2: "Als de pieper gaat, zit ik met je aan de lijn. Jij leidt, ik stel de vervelende vragen."
active.1: "De on-call-laptop staat bij het koffieapparaat, als je die nacht nog eens wilt overdoen."
done.1: "Teruggedraaid, gecontroleerd, support ingelicht, geslapen. Daarna een blameless postmortem. Meer is het eigenlijk niet."
attacker: "PAGER · checkout-api"
intro.1: "PAGER 03:07 · checkout-api · 5xx-foutpercentage 18% (alarm bij 1%)"
intro.2: "Je telefoon zoemt op het nachtkastje. Bas komt slaperig in de call: \"Ik zie het ook. Jij hebt dienst. Neem me erdoorheen.\""
first.prompt.1: "Bas: \"18% van het afrekenen mislukt. Wat doe je als eerste?\""
first.ack.text: "De page bevestigen, zodat hij niet verder escaleert en iedereen weet dat iemand het oppakt. Dan het checkout-dashboard openen."
first.ack.why: "Goed. Bevestigen is eigenaarschap nemen: de escalatie stopt en niemand anders gaat er blind naast zitten werken. Het dashboard laat daarna de impact zien: hoe erg, sinds wanneer, welk deel."
first.code.text: "De checkout-code openen en de bug zoeken."
first.code.why: "Zwak. De oorzaak komt later. Eerst de impact en wat er veranderd is; om drie uur 's nachts zonder spoor code lezen is traag, en intussen blijven klanten vastlopen."
first.restart.text: "Meteen alle checkout-pods herstarten."
first.restart.why: "Zwak. Een actie zonder diagnose. Als de nieuwe versie stuk is, draaien herstarte pods dezelfde kapotte code, en misschien wis je bewijs. Herstarten kan helpen tegen een lek of een vastgelopen proces, maar besluit dat pas na het kijken."
first.wait.text: "Tien minuten wachten of het vanzelf overgaat."
first.wait.why: "Zwak. Een alarm dat aan en uit flappert, kun je even aanzien; 18% mislukte checkouts is elke minuut verloren bestellingen. De page is echt tot de data iets anders zegt."
change.prompt.1: "Het dashboard: de fouten sprongen om 02:41 van 0,05% naar 18%, allemaal op checkout-api. Het verkeer is normaal."
change.prompt.2: "Bas: \"Waar kijk je nu?\""
change.deploys.text: "Naar wat er rond 02:41 veranderd is: het deploylog laat zien dat checkout-api v2.14 om 02:40 is uitgerold."
change.deploys.why: "Goed. Een plotselinge sprong op een exacte minuut betekent meestal een wijziging: een deploy, een configwijziging, een feature flag. De meeste incidenten volgen op een wijziging, zoals het overdrachtsbriefje op app-01 al liet zien. Begin bij de laatste wijziging."
change.resources.text: "Naar de CPU- en geheugengrafieken van alle hosts."
change.resources.why: "Half goed. Verzadiging doet ertoe, maar die loopt meestal op en springt niet op een exacte minuut terwijl het verkeer normaal is. Kijk eerst wat er veranderd is, dan naar resources."
change.database.text: "Naar de slow query log van de database."
change.database.why: "Half goed. Kan, maar alleen checkout-api faalt en het verkeer is normaal; een databaseprobleem zie je meestal in meer dan één service. Kijk eerst wat er veranderd is."
change.social.text: "Naar social media, om te zien wat klanten zeggen."
change.social.why: "Zwak, voor nu. De metrics vertellen je de impact al. Berichten van klanten zijn later belangrijk voor de communicatie, niet voor de diagnose."
steps.prompt.1: "Bas: \"Oké, het is de deploy. Zet de volgende stappen op volgorde.\""
steps.declare.text: "Een incident uitroepen in het incidentkanaal en zeggen wie het leidt."
steps.declare.why: "Eerst: uitroepen en leiden. Eén persoon coördineert, de rest weet waar ze moeten kijken. Kort, maar eerst."
steps.rollback.text: "checkout-api terugdraaien naar v2.13, de laatste versie die werkte."
steps.rollback.why: "Dan de schade beperken. Terug naar een versie waarvan je weet dat hij werkt, stopt de schade het snelst; de bug begrijpen kan wachten tot klanten veilig zijn."
steps.support.text: "Support vertellen wat klanten zien en wanneer de volgende update komt."
steps.support.why: "Tegelijk met het terugdraaien, de volgorde maakt niet uit: een eerste update terwijl de rollback loopt. Wie communiceert en wie repareert, kunnen verschillende mensen zijn; daarom riep je het incident uit."
steps.verify.text: "Op het dashboard controleren dat het foutpercentage weer normaal is."
steps.verify.why: "Controleren. Een rollback is een hypothese tot de grafiek het bevestigt. Pas dan zeg je 'beperkt'."
steps.cause.text: "De oorzaak in v2.14 vinden, met de logs en de diff."
steps.cause.why: "De oorzaak, als klanten veilig zijn, liefst bij daglicht. De logs en de diff van v2.14 ten opzichte van v2.13 zijn de sporen."
steps.postmortem.text: "Een blameless postmortem schrijven, met actiepunten."
steps.postmortem.why: "De postmortem als laatste: de tijdlijn, de oorzaak, wat goed ging, en acties die het systeem veiliger maken."
hotfix.prompt.1: "Ravi komt klaarwakker in de call. \"Terugdraaien hoeft niet, ik zie de bug al. Dit is mijn plan:\""
hotfix.prompt.2: "Bas: \"Wat is het probleem met het plan van Ravi?\""
hotfix.proposal.1: "De ontbrekende null-check in v2.14 nu meteen patchen."
hotfix.proposal.2: "Direct naar main pushen en CI overslaan, want de pipeline duurt 12 minuten."
hotfix.proposal.3: "De patch rechtstreeks naar productie deployen."
hotfix.untested.text: "Een ongeteste patch om drie uur 's nachts kan op nieuwe manieren falen. Eerst terug naar v2.13, die bekend goed is, en dan vooruit fixen via de normale pipeline."
hotfix.untested.why: "Goed. Terug naar een versie die wekenlang goed draaide, is de minst riskante manier om de schade te stoppen. CI overslaan onder druk is hoe één incident er twee worden. De fix komt er nog steeds, met tests, bij daglicht."
hotfix.branch.text: "Hij moet naar een branch pushen, niet naar main."
hotfix.branch.why: "Zwak. Waar de commit heen gaat, is niet het gevaar; de tests overslaan en productie veranderen met iets onbekends wel."
hotfix.never.text: "Hotfixes mogen nooit tijdens een incident."
hotfix.never.why: "Zwak. Vooruit fixen is soms de enige weg, bijvoorbeeld als een databasemigratie niet terug kan en v2.13 zou breken op het nieuwe schema. Hier kan terugdraaien wel, dus dat is de veiligere keuze."
hotfix.fine.text: "Niks: 12 minuten CI is te lang tijdens een incident."
hotfix.fine.why: "Zwak. Twaalf minuten is lang om drie uur 's nachts, maar een rollback duurt ongeveer even lang en is veel minder riskant. Is CI te traag voor noodgevallen, dan is dat een actiepunt voor de postmortem, geen reden om het vannacht over te slaan."
budget.prompt.1: "Bas: \"Onze SLO: 99,9% van de checkout-requests slaagt, gemeten over 30 dagen. Vannacht mislukte 18%, 40 minuten lang. Ga uit van gemiddeld verkeer.\""
budget.prompt.2: "\"Hoeveel van het foutbudget van deze maand hebben we ongeveer verbrand?\""
budget.working: "Uitwerking: 0,1% van 30 dagen is 30 × 24 × 60 × 0,001 = 43,2 minuten volledige storing. Vannacht: 18% van de requests gedurende 40 minuten is 0,18 × 40 = 7,2 minuten volledige storing. 7,2 / 43,2 ≈ 17%. Echt verkeer om drie uur 's nachts is lager dan gemiddeld, dus per request geteld is het verbruik nog kleiner."
budget.tiny.text: "minder dan 5%"
budget.tiny.why: "Te laag. Heb je vergeleken met het budget van een jaar (525,6 minuten)? Het SLO-venster is hier 30 dagen: 43,2 minuten."
budget.some.text: "5% tot 25%"
budget.some.why: "Goed: ongeveer 17%."
budget.big.text: "25% tot 50%"
budget.big.why: "Te hoog. Reken het budget na: 0,1% van 30 dagen is 43,2 minuten, en 18% gedurende 40 minuten is maar 7,2 minuten volledige storing."
budget.most.text: "50% tot 100%"
budget.most.why: "Te hoog. Als je alle 40 minuten als volledige storing telt, kom je op zo'n 93%, maar er mislukte maar 18% van de requests."
budget.blown.text: "meer dan 100%: de SLO is gebroken"
budget.blown.why: "Veel te hoog. Het hele budget opmaken kost 43,2 minuten volledige storing, of zo'n 4 uur bij 18%."
after.prompt.1: "03:31. De rollback is klaar en de fouten zijn terug op 0,05%."
after.prompt.2: "Bas: \"En nu?\""
after.watch.text: "De grafieken nog even in de gaten houden, support laten weten dat het beperkt is, de tijdlijn opschrijven, en de oorzaak voor werktijd bewaren."
after.watch.why: "Goed. Klanten zijn veilig, dus de haast is weg. Moeie mensen maken fouten, en een korte tijdlijn die je opschrijft terwijl het vers is, maakt de postmortem makkelijk."
after.dig.text: "Opblijven en vannacht nog de oorzaak vinden."
after.dig.why: "Half goed, en er valt over te twisten. Nieuwsgierigheid is goed, maar het risico is voorbij, en moe debuggen is traag en foutgevoelig. Ook als v2.14 snel moet, is morgenochtend vroeg genoeg."
after.quiet.text: "Het incident sluiten en naar bed gaan zonder iemand iets te zeggen."
after.quiet.why: "Zwak. Support denkt nog steeds dat afrekenen stuk is, en het team wordt wakker met een raadsel. Een incident sluiten hoort erbij te zeggen."
after.redeploy.text: "v2.14 opnieuw deployen, om zeker te weten dat de deploy de oorzaak was."
after.redeploy.why: "Zwak. De bug in productie reproduceren, raakt klanten een tweede keer. Reproduceer hem in een testomgeving, met de diff en de logs."
blame.prompt.1: "Maandag. In het concept van de postmortem staat:"
blame.prompt.2: "Bas: \"Wat is hier mis mee?\""
blame.proposal.1: "Oorzaak: Ravi is een null-check vergeten in v2.14."
blame.proposal.2: "Actiepunt: Ravi let voortaan beter op."
blame.blameless.text: "Het wijst een persoon aan. Vraag waarom het systeem de bug doorliet: geen test voor dat geval, geen canary, een deploy om 02:40 waar niemand naar keek. De actiepunten moeten dát oplossen."
blame.blameless.why: "Goed. Mensen maken fouten; systemen bepalen of een fout bij klanten aankomt. 'Beter opletten' verandert niets. Een test, een canary-stap of een regel tegen onbewaakte nachtelijke deploys wel."
blame.fine.text: "Niks: het klopt en het is kort."
blame.fine.why: "Zwak. Het klopt over die regel code, maar als les is het nutteloos. Schuld zoeken zorgt dat mensen fouten de volgende keer verstoppen, en dat maakt elk volgend incident moeilijker."
blame.reviewer.text: "De reviewer die de wijziging goedkeurde, moet er ook bij staan."
blame.reviewer.why: "Zwak. Meer namen, hetzelfde probleem. Vraag wat de review miste en hoe een check het automatisch kan vangen."
blame.too-short.text: "Een postmortem is alleen nodig bij storingen van meer dan een uur."
blame.too-short.why: "Zwak. 40 minuten lang 18% mislukte checkouts is de moeite van het leren waard. Veel teams leggen de lat bij impact of verbruikt foutbudget, niet alleen bij duur."
hint.change: "Denk aan app-01: het overdrachtsbriefje zei precies wat er om 02:55 veranderde. Een sprong op een exacte minuut betekent: kijk naar de laatste wijziging."
hint.steps: "Eerst het bloeden stoppen, dan de wond bestuderen: beperken, controleren, dan pas onderzoeken."
hint.hotfix: "Ravi's pipeline ging ooit onderuit op één tabteken. Wat kan een patch om drie uur 's nachts zonder CI dan doen?"
hint.budget: "Reken de SLO om naar minuten: 0,1% van 30 dagen. Reken vannacht dan om naar minuten volledige storing: 18% van 40 minuten."
hint.calm: "Adem even. Bij een incident is de veilige, saaie zet meestal de goede."
won.1: "03:58. Fouten terug op normaal, support ingelicht, postmortem staat voor maandag. Bas: \"Volgens het boekje. Ga maar weer slapen.\""
lost.1: "Bas neemt de rest van de nacht over. \"Geen schande, het is drie uur 's nachts. Lees de nabespreking, dan doen we het nog een keer.\""
