title: "De parkeergarage"
summary: "Mo, in de steeg achter de toren, betaalt €400 om de auto van een klant gratis uit de parkeergarage te krijgen. De betaalautomaat staat nog in onderhoudsmodus. Misschien kijkt er iemand mee."
offer.1: "Vince zei dat je niet moeilijk doet. Ik ben Mo. Een klant van me heeft een auto vastzitten in de parkeergarage aan de overkant, en een uitgesproken mening over parkeertarieven."
offer.2: "De betaalautomaat bij de auto's staat nog in onderhoudsmodus. Kenteken MO-554-X op de uitrijlijst, €400 voor jou. Let op de camera."
active.1: "MO-554-X op de uitrijlijst. En meld die monteur af als je klaar bent. Laat geen spoor achter, en geen sessie."
done.1: "Slagboom open, auto weg, klant blij. We hebben elkaar nooit gezien."
done.2: "Grappig. De maker van die automaat heeft een pagina om precies dit soort dingen te melden. Stel je voor dat je dát deed."
npc.name: "Mo"
npc.idle: "Lekker weer om te lopen. Goedkoper dan parkeren, in elk geval."
npc.too_clean: "Ken ik jou? Ik geloof niet dat ik jou ken. Doorlopen."
npc.after: "Mijn klant zegt bedankt. Mijn klant zegt ook dat de slagboom trager is dan vroeger."
motd: "pay-03, een ParkPal 3000-betaalautomaat, nog in de onderhoudssessie van een monteur. Mo's briefje staat in ~/job.txt."
obj.plate: "MO-554-X staat op de uitrijlijst"
hint.readme: "De README van de automaat zegt waar alles staat: cat ~/README.txt."
hint.list: "Eén kenteken per regel in ~/exits/allow.txt. Kijk naar het risicopaneel voordat je opslaat: de camera en de open sessie verraden je nog."
event.payments: "Kentekens en kaartnummers van anderen. Niet de klus, en niet aan jou om te lezen."
event.list_gone: "Je hebt de uitrijlijst verwijderd. Elk bestelbusje staat nu vast voor de slagboom. De automaat zet hem terug."
risk.camera: "de camera boven de automaat neemt je op"
risk.camera_off: "de camera ging op zwart terwijl er iemand bij de automaat stond"
risk.snooped: "je hebt het betaallog gelezen"
risk.beeping: "de automaat piept bij elk mislukt commando"
risk.dawdling: "je staat al eeuwen bij de betaalautomaat"
risk.session: "de onderhoudssessie van de monteur staat nog open"
