title: "The car park"
summary: "Mo, in the alley behind the tower, pays €400 to get a client's car out of the car park for free. The pay station was left in maintenance mode. Somebody might be watching."
offer.1: "Vince said you're not squeamish. I'm Mo. A client of mine has a car stuck in the car park across the road, and a strong opinion about parking fees."
offer.2: "The pay station by the cars was left in maintenance mode. Plate MO-554-X on the exit list, €400 for you. Mind the camera."
active.1: "MO-554-X on the exit list. And sign that technician out when you're done. Leave no trace, leave no session."
done.1: "Barrier up, car out, client happy. We never met."
done.2: "Funny. That pay station's maker has a page for reporting exactly this kind of thing. Imagine telling them instead."
npc.name: "Mo"
npc.idle: "Nice weather for walking. Cheaper than parking, anyway."
npc.too_clean: "Do I know you? I don't think I know you. Keep walking."
npc.after: "My client says thanks. My client also says the barrier is slower than it used to be."
motd: "pay-03, a ParkPal 3000 pay station, still in a technician's maintenance session. Mo's note is in ~/job.txt."
obj.plate: "MO-554-X is on the exit list"
hint.readme: "The station's README says where everything lives: cat ~/README.txt."
hint.list: "One plate per line in ~/exits/allow.txt. Check the heat panel before you save: the camera and the open session still give you away."
event.payments: "Other people's plates and card endings. Not the job, and not yours to read."
event.list_gone: "You deleted the exit list. Every delivery van is now stuck behind the barrier. The station restores it."
risk.camera: "the camera over the station is recording you"
risk.camera_off: "the camera went dark while someone stood at the station: that gets noticed too"
risk.snooped: "you read the payment log"
risk.beeping: "the station beeps at every failed command"
risk.dawdling: "you've stood at the pay station for ages"
risk.session: "the technician's maintenance session is still open"
