title: "Het Medior-gesprek: een rate limiter"
summary: "De weg naar Mediorstad gaat open na één system-design-gesprek. Ingrid vraagt je een rate limiter te ontwerpen voor een publieke API."
offer.1: "Ik ben Ingrid, staff engineer in Mediorstad. Iedereen die doorgroeit, doet eerst één whiteboardsessie met mij."
offer.2: "Niks uit je hoofd leren. Ik wil horen hoe je denkt. Zeg het maar als je klaar bent."
active.1: "Neem je tijd. Eerst vragen, dan tekenen: dat is het halve gesprek."
done.1: "Dat was een goede sessie. De weg naar Mediorstad is open. Blijf vragen: 'wat gebeurt er als het stukgaat?'"
npc.name: "Ingrid"
npc.idle: "De weg naar Mediorstad begint bij mijn whiteboard."
npc.after: "Rate limiters lijken klein. Het interessante is altijd waar de teller staat en wat er gebeurt als die weg is."
attacker: "Ingrid · staff engineer"
intro.1: "Whiteboardgesprek. Onderwerp: een rate limiter."
intro.2: "Ingrid pakt een stift. \"Onze publieke REST-API wordt platgebeukt door een paar clients, en de rest heeft er last van. Ontwerp er een rate limiter voor.\""
clarify.prompt.1: "\"Voordat je iets tekent: je mag me twee vragen stellen. Welke twee?\""
clarify.key.text: "\"Waarop limiteren we (API-key, gebruiker of IP-adres), en wat is de limiet?\""
clarify.key.why: "Goed. De sleutel en de limiet bepalen het hele ontwerp: wat je telt, hoeveel tellers er zijn en hoeveel geheugen ze kosten. Zonder die twee ben je aan het gokken."
clarify.scale.text: "\"Draait de API op één server, of op veel instances achter een load balancer?\""
clarify.scale.why: "Goed. Dit bepaalt of een teller in het geheugen van het proces genoeg is, of dat de telling gedeeld moet worden tussen instances: de kernvraag van dit ontwerp."
clarify.overflow.text: "\"Moet een client boven de limiet geweigerd worden, of in een wachtrij vertraagd?\""
clarify.overflow.why: "Half goed. Een nuttige vraag, maar de meeste publieke API's weigeren gewoon. Stel hem als je weet wat je limiteert en hoe de API draait."
clarify.language.text: "\"In welke programmeertaal moet ik het schrijven?\""
clarify.language.why: "Zwak. Een implementatiedetail: het zegt niets over het systeem en kost je een van je twee vragen."
clarify.redis.text: "\"Mag ik Redis gebruiken?\""
clarify.redis.why: "Zwak, als eerste vraag. Je kiest een tool voordat je de eisen kent; met één server heb je helemaal geen gedeelde opslag nodig. Later vragen welke infrastructuur er al is, is prima."
algorithm.prompt.1: "\"Per API-key: 100 requests per minuut, en korte pieken mogen. Het draait op 20 instances achter een round-robin load balancer.\""
algorithm.prompt.2: "\"Welk algoritme kies je, en waarom?\""
algorithm.bucket.text: "Een token bucket: elke key heeft een emmer met maximaal 100 tokens die met 100 per minuut bijvult, zodat pieken erdoor mogen en het gemiddelde begrensd blijft."
algorithm.bucket.why: "Goed. Een token bucket laat een piek toe tot zijn capaciteit en dwingt het gemiddelde af via de bijvulsnelheid. Hij heeft twee getallen per key nodig (resterende tokens en het tijdstip van de laatste bijvulling) en werkt in constante tijd."
algorithm.smooth.text: "Een token bucket, omdat die pieken omzet in een gelijkmatige stroom, zodat de backend nooit een piek ziet."
algorithm.smooth.why: "Zwak: goede naam, verkeerde reden. Pieken omzetten in een gelijkmatige uitstroom doet een leaky bucket die als wachtrij werkt. Een token bucket laat een piek in één keer door, tot zijn capaciteit, en weigert wat erboven komt."
algorithm.fixed.text: "Een fixed-window-teller: tel requests per key per klokminuut en zet de teller aan het begin van elke minuut op nul. Simpel en goedkoop."
algorithm.fixed.why: "Half goed. Eén teller per key per venster is simpel en goedkoop. Maar rond de grens van een venster kan een client 100 requests sturen om 0:59 en nog 100 om 1:00: twee keer de limiet binnen een paar seconden. Voor veel API's prima, maar het dwingt 'pieken mogen, het gemiddelde moet kloppen' niet af."
algorithm.log.text: "Een sliding-window-log: bewaar het tijdstip van elk request en tel die van de laatste 60 seconden. Op elk moment exact."
algorithm.log.why: "Half goed. Exact, maar het bewaart één tijdstip per request: hier tot 100 per key, en veel meer bij hogere limieten. Een token bucket geeft dezelfde bescherming met twee getallen per key. Een sliding-window-teller (twee vaste vensters, gewogen) is de goedkope benadering."
burst.prompt.1: "\"De nachtelijke job van een partner stuurt 300 requests in 5 seconden en daarna een uur niks. Zijn emmer is vol: 100 tokens, bijvullen met 100 per minuut.\""
burst.prompt.2: "\"Wat gebeurt er met die job?\""
burst.right.text: "Ongeveer de eerste 100 gaan direct door, de rest wordt geweigerd. Tokens komen terug met zo'n 1,7 per seconde, dus de andere 200 hebben nog ongeveer twee minuten aan gespreide retries nodig."
burst.right.why: "Goed. De volle emmer dekt een piek van 100 (plus de paar tokens die in die 5 seconden bijkomen). Daarna heeft elk request een nieuw token nodig: 100 per minuut is ongeveer 1,7 per seconde, dus 200 extra requests duren zo'n twee minuten."
burst.all.text: "Alle 300 gaan door: over het hele uur blijft de job ver onder de 100 per minuut."
burst.all.why: "Zwak. Een token bucket middelt niet over een uur; hij begrenst een piek op de capaciteit van de emmer. Middelen over een lang venster is precies wat deze job de API zou laten platleggen."
burst.queued.text: "Alle 300 komen in een wachtrij en worden met een vaste 1,7 per seconde afgehandeld."
burst.queued.why: "Zwak. Dat is een leaky bucket als wachtrij (traffic shaping). Een token bucket houdt geen requests vast: zonder token wordt een request geweigerd."
burst.window.text: "De eerste 100 gaan door, daarna is de job geblokkeerd tot de volgende minuut begint."
burst.window.why: "Zwak. Zo gedraagt een fixed window zich. Een token bucket vult continu bij, dus tokens druppelen meteen terug in plaats van allemaal tegelijk op de hele minuut."
local.prompt.1: "Ingrid tekent een eerdere poging van een collega op het whiteboard. \"Wat is hier mis mee?\""
local.proposal.1: "20 API-instances achter een round-robin load balancer."
local.proposal.2: "Elke instance houdt per API-key een token bucket bij in zijn eigen geheugen."
local.proposal.3: "Elke emmer staat de volle 100 requests per minuut toe."
local.multiply.text: "De requests van een client worden verdeeld over 20 instances die elk 100 per minuut toestaan, dus de echte limiet is tot 2.000 per minuut."
local.multiply.why: "Goed. Round-robin verdeelt één client over alle instances, en elke instance telt alleen wat hij zelf ziet. De limiet wordt vermenigvuldigd met het aantal instances en verandert bij elke schaalstap. De telling moet gedeeld worden, of elke key moet steeds op dezelfde instance landen."
local.slow.text: "Tellers in het geheugen zijn te traag om bij elk request te controleren."
local.slow.why: "Zwak. Een lookup in het eigen geheugen van het proces is het snelste wat er is, veel sneller dan elke netwerkaanroep. Snelheid is hier niet het probleem; correctheid wel."
local.restart.text: "Als een instance herstart, is hij zijn tellers kwijt en krijgen clients een nieuwe piek cadeau."
local.restart.why: "Half goed. Klopt, maar het is klein: een herstart geeft een paar clients één extra piek. De echte fout is dat de limiet de hele tijd met 20 vermenigvuldigd wordt."
local.roundrobin.text: "Round-robin is het verkeerde algoritme voor een API-load-balancer."
local.roundrobin.why: "Zwak. Round-robin is prima voor stateless services. Het probleem is dat de limiter zijn state per instance bijhoudt, niet hoe de requests verdeeld worden."
store.prompt.1: "\"Eens, de telling moet gedeeld worden. Waar staat die, en hoe werk je hem bij?\""
store.redis.text: "In een gedeelde in-memory store zoals Redis, bijgewerkt met één atomaire operatie per request (INCR met een expiry, of een klein Lua-script voor de token bucket)."
store.redis.why: "Goed. Alle instances zien één telling, de atomaire operatie sluit race conditions uit en de store is snel. De prijs is een netwerkrondje per request (ruim onder een milliseconde binnen één datacenter) en een nieuwe afhankelijkheid, en dus de vraag wat er gebeurt als die plat ligt."
store.sql.text: "In een rij per key in de hoofddatabase (SQL), bijgewerkt in een transactie bij elk request."
store.sql.why: "Zwak. Logisch klopt het, maar elke API-call wordt een schrijftransactie op een hete rij: lock-contention en schrijflast op je belangrijkste database, voor data die niet duurzaam bewaard hoeft te worden."
store.split.text: "Houd lokale emmers, maar geef elke instance een twintigste van de limiet: 5 per minuut."
store.split.why: "Half goed, en er valt over te twisten. Geen gedeelde afhankelijkheid, maar alleen correct als de balancer elke key gelijk verdeelt. Met weinig requests per key is de verdeling grillig, dus clients raken de limiet te vroeg of te laat, en de getallen veranderen als je schaalt. Een redelijke benadering als exactheid er niet toe doet."
store.readwrite.text: "In Redis: lees de telling, tel er in de applicatie één bij op, schrijf hem terug."
store.readwrite.why: "Zwak: een race condition. Twee instances lezen tegelijk 99, schrijven allebei 100, en één request is nooit geteld. Gebruik een atomaire operatie (INCR, of een Lua-script dat in één stap leest en schrijft)."
estimate.prompt.1: "\"De API verwerkt 50 miljoen requests per dag, en het drukste uur draait op drie keer het gemiddelde tempo. Elk request kost één aanroep naar de store van de limiter.\""
estimate.prompt.2: "\"Hoeveel aanroepen per seconde moet de store op de piek ongeveer aankunnen?\""
estimate.working: "Uitwerking: een dag heeft 86.400 seconden; reken met 100.000. 50 miljoen / 100.000 = 500 per seconde gemiddeld (precies zo'n 580). De piek is drie keer zoveel: ongeveer 1.500 tot 1.750 per seconde. Eén Redis-node doet in de orde van 100.000 simpele operaties per seconde, dus doorvoer is het probleem niet; beschikbaarheid wel."
estimate.lt100.text: "minder dan 100 per seconde"
estimate.lt100.why: "Te laag. 50 miljoen per dag is gemiddeld al zo'n 580 per seconde, nog zonder de piek."
estimate.hundreds.text: "100 tot 1.000 per seconde"
estimate.hundreds.why: "Dichtbij: dat is het daggemiddelde (zo'n 580 per seconde). De store moet het drukste uur overleven, drie keer zoveel."
estimate.thousands.text: "1.000 tot 10.000 per seconde"
estimate.thousands.why: "Goed: ongeveer 1.700 per seconde op de piek."
estimate.tens.text: "10.000 tot 100.000 per seconde"
estimate.tens.why: "Te hoog. Heb je gedeeld door de seconden in een uur (3.600) in plaats van in een dag (86.400)? Dat geeft zo'n 14.000, en dan nog keer drie."
estimate.huge.text: "meer dan 100.000 per seconde"
estimate.huge.why: "Veel te hoog: zelfs met een drievoudige piek komt 50 miljoen per dag daar niet in de buurt. Reken de seconden in een dag na: 86.400."
response.prompt.1: "\"Een client zit boven zijn limiet. Wat stuurt de API terug?\""
response.too-many.text: "429 Too Many Requests, met een Retry-After-header die zegt wanneer het weer mag, en headers die de limiet en het restant laten zien."
response.too-many.why: "Goed. 429 (RFC 6585) vertelt de client dat híj te veel stuurt, en Retry-After geeft seconden of een datum. Veel API's sturen ook X-RateLimit-Limit, -Remaining en -Reset mee; een IETF-draft standaardiseert de velden RateLimit en RateLimit-Policy, dus de namen verschillen nog per API."
response.unavailable.text: "503 Service Unavailable, zodat clients terugschakelen."
response.unavailable.why: "Zwak. 503 zegt dat de server in de problemen zit, terwijl hier één client over zijn quotum gaat. Je monitoring telt het als jouw storing, en de retry-logica van clients kan het verkeerd lezen. 503 met Retry-After past als de hele service load afwerpt."
response.forbidden.text: "403 Forbidden."
response.forbidden.why: "Zwak. 403 betekent 'dit mag je helemaal niet'. Later opnieuw proberen helpt niet, dus een nette client geeft het op of slaat alarm in plaats van te wachten."
response.delay.text: "Neem het request aan, maar houd het vast tot er een token vrij is."
response.delay.why: "Half goed, en er valt over te twisten. Dat is traffic shaping. Het kan passen bij interne wachtrijen, maar op een publieke API houdt het verbindingen en threads bezet, en clients krijgen een timeout zonder te weten waarom. Snel weigeren met 429 is de gebruikelijke keuze."
outage.prompt.1: "\"Laatste vraag. Redis valt om tijdens de piek. Wat doet je limiter?\""
outage.open.text: "Fail open: laat requests door, met een grove limiet per instance als terugval, en alarmeer. De limiter beschermt de API; hij mag niet zelf de storing worden."
outage.open.why: "Goed voor een algemene API-limiet. Zonder de store verlies je precisie, niet de API. Een grove lokale limiet houdt de ergste stormen nog tegen, en het alarm zorgt dat de store gerepareerd wordt."
outage.per-endpoint.text: "Fail closed alleen waar misbruik duur is (inloggen, wachtwoord-reset, sms'jes versturen); overal elders fail open met een lokale terugval."
outage.per-endpoint.why: "Goed, de senior-versie. Bij limieten die veiligheid of geld bewaken, is alles doorlaten erger dan een korte storing van dat ene endpoint. Per endpoint beslissen is het eerlijke antwoord op 'fail open of closed?'"
outage.closed.text: "Fail closed: weiger elk request tot Redis terug is."
outage.closed.why: "Zwak voor een algemene API-limiet: een falend hulpje wordt een volledige storing van de API die het moest beschermen. Fail closed hoort bij de paar endpoints waar misbruik duur is."
outage.retry.text: "Probeer Redis opnieuw binnen het request, tot hij antwoordt."
outage.retry.why: "Zwak. Requests stapelen zich op, de latency explodeert en threads raken op, dus de storing verspreidt zich naar de API. Gebruik een korte timeout en een circuit breaker, en val dan terug."
hint.algorithm: "Pieken mogen, maar het gemiddelde moet kloppen. Welk algoritme houdt een voorraad tegoed bij die met een vaste snelheid bijvult?"
hint.local: "Volg de requests van één client door een round-robin balancer: hoeveel emmers raken ze?"
hint.estimate: "Een dag heeft 86.400 seconden; rond af op 100.000 en de som wordt makkelijk."
hint.outage: "Vraag je af wat de limiter beschermt, en wat erger is: een paar requests te veel, of helemaal geen API?"
hint.breathe: "Even ademhalen. Ingrid wil je redenering horen, geen buzzword: lees het 'omdat' in elke optie."
won.1: "Ingrid legt de stift neer. \"Heldere eisen, een passend algoritme, een gedeelde teller en eerlijke antwoorden over falen. Je bent klaar voor Mediorstad.\""
lost.1: "\"Laten we het hier vandaag bij laten.\" Ingrid zegt het vriendelijk. \"Lees de uitleg, denk na over waar de teller staat, en kom terug wanneer je wilt.\""
