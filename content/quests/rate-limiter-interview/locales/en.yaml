title: "The Medior interview: a rate limiter"
summary: "The road to Medior City opens after one system-design interview. Ingrid asks you to design a rate limiter for a public API."
offer.1: "I'm Ingrid, staff engineer in Medior City. Everyone who moves up does one whiteboard session with me first."
offer.2: "Nothing to memorise. I want to hear how you think. Ready when you are."
active.1: "Take your time. Ask before you draw; that is half the interview."
done.1: "That was a good session. The road to Medior City is open. Keep asking 'what happens when it breaks?'"
npc.name: "Ingrid"
npc.idle: "The road to Medior City starts at my whiteboard."
npc.after: "Rate limiters look small. The interesting part is always where the counter lives and what happens when it is gone."
attacker: "Ingrid · staff engineer"
intro.1: "Whiteboard interview · Topic: a rate limiter"
intro.2: "Ingrid uncaps a marker. \"Our public REST API gets hammered by a few clients, and everyone else suffers. Design a rate limiter for it.\""
clarify.prompt.1: "\"Before you draw anything: you may ask me two questions. Which two?\""
clarify.key.text: "\"What do we limit by, and what is the limit?\""
clarify.key.why: "Best. The key and the limit define the whole design: what you count, how many counters exist and how much memory they need. Without them you are guessing."
clarify.scale.text: "\"One server, or many instances behind a load balancer?\""
clarify.scale.why: "Best. This decides whether a counter in the process's own memory is enough or the count must be shared between instances: the central question of this design."
clarify.overflow.text: "\"When a client goes over the limit, should we reject the request, or queue it and slow the client down?\""
clarify.overflow.why: "Half right. A useful question, but most public APIs reject. Ask it once you know what you limit and how the API is deployed."
clarify.language.text: "\"Which language should I write it in?\""
clarify.language.why: "Weak. An implementation detail: it says nothing about the system and spends one of your two questions."
clarify.redis.text: "\"Can I use Redis for the counters?\""
clarify.redis.why: "Weak, as a first question. It picks a tool before you know the requirements; with one server you would not need a shared store at all. Asking what infrastructure already exists is fine later."
algorithm.prompt.1: "\"Per API key: 100 requests per minute, and short bursts are fine. It runs on 20 instances behind a round-robin load balancer.\""
algorithm.prompt.2: "\"Which algorithm do you pick, and why?\""
algorithm.bucket.text: "A token bucket per key: capacity 100, refilled at 100 per minute. Bursts pass up to the capacity; the average stays capped."
algorithm.bucket.why: "Best. A token bucket allows a burst up to its capacity and enforces the average through its refill rate. It needs two numbers per key (tokens left and the time of the last refill) and updates in constant time."
algorithm.smooth.text: "A token bucket per key, because it turns bursts into a steady stream at the refill rate, so the backend never sees a spike from one client."
algorithm.smooth.why: "Weak: right name, wrong reason. Turning bursts into a steady outflow is what a leaky bucket used as a queue does. A token bucket lets a burst through at once, up to its capacity, and rejects what goes over."
algorithm.fixed.text: "A fixed-window counter per key per clock minute, reset at each minute: one number per key, so it is the cheapest option that still holds the average."
algorithm.fixed.why: "Half right. One counter per key per window is simple and cheap, and the average holds. But the burst depends on the clock: 100 requests at 0:59 and 100 more at 1:00 is twice the limit within two seconds, while a token bucket caps any burst at its capacity and refills smoothly. Fine for many APIs."
algorithm.log.text: "A sliding-window log: store the timestamp of every request and count those in the last 60 seconds. Exact at every moment."
algorithm.log.why: "Half right. Exact, but it stores one timestamp per request: up to 100 per key here, and far more for higher limits. A token bucket gives the same protection with two numbers per key. A sliding-window counter (two fixed windows, weighted) is the cheap approximation."
burst.prompt.1: "\"A partner's nightly job sends 300 requests in 5 seconds, then nothing for an hour. Its bucket is full: 100 tokens, refilling at 100 per minute.\""
burst.prompt.2: "\"What happens to the job?\""
burst.right.text: "About 100 pass at once, the rest are rejected; at about 1.7 tokens a second, the other 200 need about two more minutes."
burst.right.why: "Best. The full bucket covers a burst of 100 (plus the few tokens that refill during those 5 seconds). After that every request needs a fresh token: 100 per minute is about 1.7 per second, so 200 more requests take about two minutes."
burst.all.text: "All 300 pass, because the bucket's limit is 100 per minute, and measured over the full hour this job averages far less than that."
burst.all.why: "Weak. A token bucket does not average over an hour; it caps a burst at the bucket's capacity. Averaging over a long window is exactly what would let this job flatten the API."
burst.queued.text: "All 300 are accepted, then released at about 1.7 per second, so the job is done in about three minutes."
burst.queued.why: "Weak. That is a leaky bucket used as a queue (traffic shaping). A token bucket does not hold requests: without a token, a request is rejected."
burst.window.text: "The first 100 pass, and the other 200 are rejected until the next minute starts, when the full 100 tokens are available again at once."
burst.window.why: "Weak. That is how a fixed window behaves. A token bucket refills continuously, so tokens trickle back right away instead of all at once on the minute."
local.prompt.1: "Ingrid draws a colleague's earlier attempt on the whiteboard. \"What is wrong with this?\""
local.proposal.1: "20 API instances behind a round-robin load balancer."
local.proposal.2: "Each instance keeps a token bucket per API key in its own memory."
local.proposal.3: "Each bucket allows the full 100 requests per minute."
local.multiply.text: "One client is spread over 20 instances that each allow 100 per minute: the real limit is up to 2,000 per minute."
local.multiply.why: "Best. Round-robin spreads one client over all instances, and each instance counts only what it sees. The limit is multiplied by the number of instances and changes whenever you scale. The count has to be shared, or each key has to land on one instance."
local.slow.text: "In-memory counters add latency to every call; use a separate service."
local.slow.why: "Weak. A lookup in the process's own memory is the fastest option there is, far faster than a call to a separate service. Speed is not the problem here; correctness is."
local.restart.text: "A restarted instance loses its buckets, so every client it served gets a fresh burst of 100, and deploys restart instances all the time."
local.restart.why: "Half right. True, and deploys make it more common, but it hands out one extra burst now and then. The real flaw multiplies the limit by 20 all the time."
local.roundrobin.text: "Round-robin ignores how busy each instance is; least-connections would spread the load better."
local.roundrobin.why: "Weak. True in general, but beside the point: how the load is spread is not the problem here. The limiter keeping its state per instance is."
store.prompt.1: "\"Agreed, the count must be shared. Where does it live, and how do you update it?\""
store.redis.text: "In Redis, shared by all instances: a small Lua script that refills the bucket and takes a token in one atomic step."
store.redis.why: "Best. All instances see one count, and the script makes refill-and-take one atomic step, so there are no races. (For a fixed window: INCR and EXPIRE inside one script or MULTI, so a crash cannot leave a counter that never expires.) The price is a network round trip per request, well under a millisecond inside one data centre, and a new dependency: what happens when it is down?"
store.sql.text: "In the main SQL database, in a transaction per request."
store.sql.why: "Weak. It works logically, but every API call becomes a write transaction on a hot row: lock contention and write load on your most important database, for data that does not need to be durable."
store.split.text: "Keep local buckets but give each instance a twentieth of the limit, 5 per minute, so there is no shared dependency that can fail."
store.split.why: "Half right, and debatable. No shared dependency at all, but only correct if the balancer spreads each key evenly. With few requests per key the split is lumpy, so clients hit the limit too early or too late, and the numbers change when you scale. A fair approximation when exactness does not matter."
store.readwrite.text: "In Redis: read the count, check it in the app, write it back."
store.readwrite.why: "Weak: a race condition. Two instances read 99 at the same moment, both write 100, and one request was never counted. Use an atomic operation (INCR, or a Lua script that reads and writes in one step)."
estimate.prompt.1: "\"The API serves 50 million requests a day, and the busiest hour runs at three times the average rate. Every request costs one call to the limiter's store.\""
estimate.prompt.2: "\"Roughly how many calls per second must the store handle at peak?\""
estimate.working: "Working: a day has 86,400 seconds; call it 100,000. 50 million / 100,000 = 500 per second on average (precisely about 580). The peak is three times that: about 1,500 to 1,750 per second. One Redis node handles on the order of 100,000 simple operations per second, so throughput is not the issue; availability is."
estimate.lt100.text: "under 100 per second"
estimate.lt100.why: "Too low. 50 million a day is already about 580 per second on average, before the peak."
estimate.hundreds.text: "100 to 1,000 per second"
estimate.hundreds.why: "Close: that is the daily average (about 580 per second). The store has to survive the busiest hour, three times as much."
estimate.thousands.text: "1,000 to 10,000 per second"
estimate.thousands.why: "Right: about 1,700 per second at peak."
estimate.tens.text: "10,000 to 100,000 per second"
estimate.tens.why: "Too high. Did you divide by the seconds in an hour (3,600) instead of in a day (86,400)? That gives about 14,000, and three times that."
estimate.huge.text: "over 100,000 per second"
estimate.huge.why: "Far too high: even with a threefold peak, 50 million a day gets nowhere near that. Check the seconds in a day: 86,400."
response.prompt.1: "\"A client is over its limit. What does the API send back?\""
response.too-many.text: "429 Too Many Requests with a Retry-After header, plus headers showing the limit and what is left."
response.too-many.why: "Best. 429 (RFC 6585) tells the client that it is the one sending too much, and Retry-After gives seconds or a date. Many APIs add X-RateLimit-Limit, -Remaining and -Reset; an IETF httpapi working-group draft proposes standard RateLimit and RateLimit-Policy fields, so header names still differ between APIs."
response.unavailable.text: "503 Service Unavailable, so clients back off and retry."
response.unavailable.why: "Weak. 503 says the server is in trouble, while here one client is over its quota; your monitoring would count it as your outage. Some big APIs do throttle with 503 (S3's SlowDown, for one), and it fits when the whole service sheds load, but for one client's quota 429 is the clear answer."
response.forbidden.text: "403 Forbidden: the client may not make more calls right now."
response.forbidden.why: "Weak. 403 means 'you may not do this at all', so a client cannot tell that waiting will help. Some APIs (GitHub, for years) have answered rate limits with 403 and documented it, but 429 says exactly what happened and is the clear answer."
response.delay.text: "Accept the request but hold it until a token is free, so the client never sees an error and only notices a slower response."
response.delay.why: "Half right, and debatable. That is traffic shaping. It can suit internal queues, but on a public API it ties up connections and threads, and clients time out without knowing why. Rejecting quickly with 429 is the usual default."
outage.prompt.1: "\"Last one. Redis goes down at peak. What does your limiter do?\""
outage.open.text: "Fail open with a rough per-instance limit as a fallback, and alert: the limiter must not become the outage."
outage.open.why: "Best for a general API limit. Without the store you lose precision, not the API. A coarse local limit still stops the worst floods, and the alert gets the store fixed."
outage.per-endpoint.text: "Fail closed where abuse is costly (login, password reset, text messages); fail open with a local fallback elsewhere."
outage.per-endpoint.why: "Best, too. For limits that guard security or money, letting everything through is worse than a short outage of that one endpoint. Deciding per endpoint is an equally good, more detailed answer to 'fail open or closed?'"
outage.closed.text: "Fail closed and reject everything until Redis is back, because without the shared count we cannot prove any client is under its limit."
outage.closed.why: "Weak for a general API limit: a failing helper becomes a full outage of the API it was meant to protect. Fail closed belongs on the few endpoints where abuse is costly."
outage.retry.text: "Retry Redis inside the request until it answers; cache outages are short."
outage.retry.why: "Weak. Requests pile up waiting, latency explodes and threads run out, so the outage spreads to the API. Use a short timeout and a circuit breaker, then fall back."
hint.algorithm: "Bursts are allowed, but the average must hold. Which algorithm keeps a stock of credit that refills at a fixed rate?"
hint.local: "Follow one client's requests through a round-robin balancer: how many buckets do they touch?"
hint.estimate: "A day has 86,400 seconds; round it to 100,000 and the sum gets easy."
hint.outage: "Ask what the limiter protects, and what is worse: a few extra requests, or no API at all?"
hint.breathe: "Take a breath. Ingrid wants your reasoning more than a buzzword: read the 'because' in each option."
won.1: "Ingrid puts the marker down. \"Clear requirements, a fitting algorithm, a shared counter and honest answers about failure. You are ready for Medior City.\""
lost.1: "\"Let's stop here for today.\" Ingrid is friendly about it. \"Read the explanations, think about where the counter lives, and come back whenever you like.\""
