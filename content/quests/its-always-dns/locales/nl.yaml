title: "Het is altijd DNS"
summary: "De facturen-API start niet meer sinds de database verhuisd is. DNS kent het nieuwe adres. Waarom belt de API dan nog steeds het oude?"
offer.1: "Hoi, ik ben Yara, netwerkteam. Gisteravond heb ik de facturendatabase verhuisd naar een nieuwe server, db-02."
offer.2: "Ik heb DNS bijgewerkt en het drie keer gecontroleerd. Het klopt. En toch wil invoice-api op api-02 niet starten."
offer.3: "Het is geen DNS. Het kan geen DNS zijn. Wil jij even kijken? api-02 is het reserverek in de serverruimte."
active.1: "Lees eerst wat de service zegt voordat je het netwerk de schuld geeft. Vraag je dan af wie er op die machine antwoordt voor db.internal."
done.1: "/etc/hosts? Een 'tijdelijke' regel uit 2024? Natuurlijk. DNS had al die tijd gelijk, en de machine vroeg het niet eens."
done.2: "Het is altijd DNS. Behalve als het /etc/hosts is, en dat is erger. Ik zet een grep op /etc/hosts op de checklist voor migraties."
npc.name: "Yara"
npc.idle: "Namen opzoeken gaat in een vaste volgorde: /etc/nsswitch.conf bepaalt wie er het eerst gevraagd wordt."
npc.after: "Ik heb op elke server /etc/hosts doorzocht op db.internal. Nog twee gevonden. Niet tegen Bas zeggen."
motd: "api-02. invoice-api ligt sinds gisteren 18:12 plat, vlak na de databaseverhuizing. DNS zegt dat db.internal 10.0.4.30 is."
obj.api: "invoice-api draait"
obj.names: "api-02 kent zijn eigen namen nog"
hint.status: "systemctl status invoice-api toont de service en zijn laatste logregels."
hint.resolved: "Het log zegt dat db.internal werd opgezocht als 10.0.4.12, de oude server. DNS antwoordt 10.0.4.30. Iets op deze machine antwoordt eerder dan DNS: cat /etc/nsswitch.conf"
hint.hosts: "hosts: files dns betekent dat /etc/hosts eerst gelezen wordt. Kijk maar: grep db.internal /etc/hosts. Open dan /etc/hosts met edit, haal de verouderde regel weg en herstart invoice-api."
event.hosts_gone: "/etc/hosts is weg, en localhost en de eigen naam van api-02 zijn mee verdwenen. Met hosts: files dns hangen die namen nu af van de DNS-server en het netwerk; sudo begint te klagen met 'unable to resolve host api-02'. De machine is hersteld: haal alleen de verouderde regel weg."
event.pinned_again: "Dat werkt, maar je hebt db.internal opnieuw vastgezet. Bij de volgende databaseverhuizing breekt deze regel de API weer. DNS weet de weg al: de regel kan gewoon weg."
