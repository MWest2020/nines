title: "It's always DNS"
summary: "The invoice API won't start since the database moved. DNS has the new address. So why does the API keep calling the old one?"
offer.1: "Hi, I'm Yara, network team. Last night I moved the invoice database to a new server, db-02."
offer.2: "I updated DNS and checked it three times. It's right. And still invoice-api on api-02 won't come up."
offer.3: "It's not DNS. It can't be DNS. Could you look? api-02 is the spare rack in the server room."
active.1: "Read what the service says before you blame the network. Then ask yourself who answers for db.internal on that box."
done.1: "/etc/hosts? A 'temporary' line from 2024? Of course. DNS was right all along, and the box never asked it."
done.2: "It's always DNS. Except when it's /etc/hosts, which is worse. I'm adding a grep of /etc/hosts to the migration checklist."
npc.name: "Yara"
npc.idle: "Name resolution has an order: /etc/nsswitch.conf decides who gets asked first."
npc.after: "I grepped every server for db.internal in /etc/hosts. Found two more. Nobody tell Bas."
motd: "api-02. invoice-api has been down since 18:12 yesterday, just after the database move. DNS says db.internal is 10.0.4.30."
obj.api: "invoice-api is running"
obj.names: "api-02 still knows its own names"
hint.status: "systemctl status invoice-api shows the service and its last log lines."
hint.resolved: "The log says db.internal resolved to 10.0.4.12, the old server. DNS answers 10.0.4.30. Something on this machine answers before DNS does: cat /etc/nsswitch.conf"
hint.hosts: "hosts: files dns means /etc/hosts is read first. Look: grep db.internal /etc/hosts. Then edit /etc/hosts, remove the stale line and restart invoice-api."
event.hosts_gone: "/etc/hosts is gone, and localhost and api-02's own name went with it. With hosts: files dns those names now depend on the DNS server and the network; sudo starts saying 'unable to resolve host api-02'. The machine is restored: take out only the stale line."
event.pinned_again: "That works, but you've pinned db.internal again. The next time the database moves, this line breaks the API all over again. DNS already knows the way: the line can just go."
