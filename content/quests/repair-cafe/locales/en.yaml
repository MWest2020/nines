title: "Community service: Repair Café"
summary: "The Repair Café's booking page has been down since the power cut. Get it running and write in the logbook what you did. Pays in karma, not euros."
offer.1: "Ah, you're the one the TLA sent. Or the judge. From behind a toaster they all look the same. I'm Henk."
offer.2: "Community service: our booking page has been down since last night's power cut, and the toaster queue is out the door."
offer.3: "The laptop on the stall. Get the booking page running and write in the logbook what you did. No heroics."
active.1: "Booking page up, logbook filled in. That's the whole shift."
done.1: "Booking page is up and the logbook says what happened. That's more than most of our toasters can say."
done.2: "Your record's clean again: probation over, karma back to at least zero. Try to keep it that way."
npc.name: "Henk"
npc.idle: "Repair Café, every Saturday. We fix toasters, bikes and the odd laptop. Volunteers welcome. Some even come voluntarily."
npc.after: "Thanks for the shift. The kettle's always on, and the toasters are always broken."
motd: "repaircafe-pc. The booking page has been down since the power cut at 21:03. Henk's notes are in ~/README.txt."
obj.booking: "the booking page (booking-web) is running"
obj.logbook: "the logbook says what you did today"
hint.status: "systemctl status booking-web tells you whether it crashed or just never came back."
hint.start: "Inactive, not failed: it was stopped cleanly when the power went, and nothing started it again. systemctl start booking-web. Then edit ~/logbook.txt."
event.logbook_gone: "You deleted the logbook. Three years of toaster history, gone. Henk has a paper copy, of course. The laptop is put back as it was."
