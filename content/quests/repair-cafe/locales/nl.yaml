title: "Taakstraf: Repair Café"
summary: "De boekingspagina van het Repair Café ligt plat sinds de stroomstoring. Zet hem weer aan en schrijf in het logboek wat je deed. Betaalt in karma, niet in euro's."
offer.1: "Ah, jij bent degene die de DDL heeft gestuurd. Of de rechter. Van achter een broodrooster zien ze er allemaal hetzelfde uit. Ik ben Henk."
offer.2: "Taakstraf: onze boekingspagina ligt plat sinds de stroomstoring van gisteravond, en de rij met broodroosters staat tot buiten."
offer.3: "De laptop op de kraam. Zet de boekingspagina weer aan en schrijf in het logboek wat je deed. Geen heldendaden."
active.1: "Boekingspagina in de lucht, logboek ingevuld. Dat is de hele dienst."
done.1: "De boekingspagina draait en het logboek zegt wat er gebeurde. Dat is meer dan de meeste van onze broodroosters kunnen zeggen."
done.2: "Je blad is weer schoon: proeftijd voorbij, karma terug op minstens nul. Probeer het zo te houden."
npc.name: "Henk"
npc.idle: "Repair Café, elke zaterdag. We maken broodroosters, fietsen en af en toe een laptop. Vrijwilligers welkom. Sommigen komen zelfs vrijwillig."
npc.after: "Bedankt voor je dienst. De waterkoker staat altijd aan, en de broodroosters zijn altijd kapot."
motd: "repaircafe-pc. De boekingspagina ligt plat sinds de stroomstoring om 21:03. De aantekeningen van Henk staan in ~/README.txt."
obj.booking: "de boekingspagina (booking-web) draait"
obj.logbook: "het logboek zegt wat je vandaag deed"
hint.status: "systemctl status booking-web vertelt je of hij is gecrasht of gewoon nooit is teruggekomen."
hint.start: "Inactive, niet failed: hij is netjes gestopt toen de stroom uitviel, en niets heeft hem weer gestart. systemctl start booking-web. Daarna edit ~/logbook.txt."
event.logbook_gone: "Je hebt het logboek verwijderd. Drie jaar broodroostergeschiedenis, weg. Henk heeft natuurlijk een papieren kopie. De laptop wordt teruggezet."
