title: "CrashLoopBackOff"
summary: "shop-api keeps crashing on Kubernetes since a config change. Find out why with kubectl, fix the manifest, apply it and get the pods running."
offer.1: "Hi, I'm Mila, platform team. Last week we moved shop-api onto our Kubernetes cluster. This morning its pods started restarting, over and over."
offer.2: "The jump host is the rack at the back right of the server room. kubectl is set up there, and my handover note has the rest."
active.1: "CrashLoopBackOff is the symptom, not the cause. The container keeps dying; its logs say why."
done.1: "Two pods, both Running. The kubelet kept restarting the crashed container, waiting longer each time, but no restart fixes a bad config. That part was you."
done.2: "And thank you for fixing the file and applying it. Had you patched the cluster by hand, the next deploy would have brought 'verbose' right back."
npc.name: "Mila"
npc.idle: "Pods are cattle, not pets. Delete one and its Deployment makes a new one. Same bug, though."
npc.after: "Joost wants CI to reject a bad LOG_LEVEL before it ever reaches the cluster. I like Joost again."
motd: "jump-01. kubectl talks to the shop's cluster. shop-api has been restarting since this morning's config change: get its pods Running again. Start with ~/handover.txt."
obj.running: "shop-api's pods are Running"
hint.start: "Start with the pods: kubectl get pods. The handover says they live in the namespace shop, so add -n shop."
hint.logs: "CrashLoopBackOff: the container starts, dies, and is restarted after a growing pause. Why it dies is in its logs: kubectl logs <pod> -n shop. kubectl describe pod shows where its settings come from."
hint.edit: "The log names the culprit: LOG_LEVEL must be debug, info, warn or error. The pods get it from the ConfigMap shop-api-config, and its manifest is ~/shop-k8s/configmap.yaml. Open it with edit."
hint.apply: "Saving the file changes your disk, not the cluster. kubectl apply -f sends a file to the cluster: the one you fixed."
hint.restart: "A container reads its environment when it starts. These would pick up the fix at their next restart attempt, but the back-off can take minutes. A rollout restart of the Deployment starts fresh pods now (mind the namespace)."
event.manifest_gone: "You deleted the ConfigMap's manifest. The cluster still runs the broken copy, and now the source of truth is gone too. The file is back: fix it instead."
