title: "CrashLoopBackOff"
summary: "shop-api crasht op Kubernetes sinds een configwijziging. Zoek met kubectl uit waarom, herstel het manifest, apply het en krijg de pods aan de praat."
offer.1: "Hoi, ik ben Mila, van het platformteam. Vorige week hebben we shop-api naar ons Kubernetes-cluster verhuisd. Vanochtend begonnen de pods te herstarten, steeds weer."
offer.2: "De jumphost is het rek achter rechts in de serverruimte. kubectl staat daar klaar, en in mijn overdrachtsnotitie staat de rest."
active.1: "CrashLoopBackOff is het symptoom, niet de oorzaak. De container gaat steeds dood; de logs zeggen waarom."
done.1: "Twee pods, allebei Running. De Deployment bleef gecrashte pods vervangen, maar geen enkele vervanging lost een foute config op. Dat deel was jij."
done.2: "En bedankt dat je het bestand hebt hersteld en ge-applied. Had je het cluster met de hand gepatcht, dan bracht de volgende deploy 'verbose' gewoon terug."
npc.name: "Mila"
npc.idle: "Pods zijn vee, geen huisdieren. Gaat er een dood, dan maakt de Deployment een nieuwe. Met dezelfde bug, dat wel."
npc.after: "Joost wil dat CI een foute LOG_LEVEL afkeurt voordat die ooit het cluster haalt. Ik vind Joost weer aardig."
motd: "jump-01. kubectl praat met het cluster van de shop. shop-api herstart sinds de configwijziging van vanochtend: krijg de pods weer Running. Begin met ~/handover.txt."
obj.running: "De pods van shop-api zijn Running"
hint.start: "Begin bij de pods: kubectl get pods. Volgens de overdracht wonen ze in de namespace shop, dus zet er -n shop bij."
hint.logs: "CrashLoopBackOff: de container start, gaat dood en wordt na een steeds langere pauze opnieuw gestart. Waarom hij doodgaat staat in de logs: kubectl logs <pod> -n shop. kubectl describe pod laat zien waar de instellingen vandaan komen."
hint.edit: "De log noemt de boosdoener: LOG_LEVEL moet debug, info, warn of error zijn. De pods krijgen die uit de ConfigMap shop-api-config, en het manifest daarvan is ~/shop-k8s/configmap.yaml. Open het met edit."
hint.apply: "Opslaan verandert je schijf, niet het cluster. Stuur het erheen: kubectl apply -f ~/shop-k8s/configmap.yaml"
hint.restart: "Een container leest zijn omgeving bij het starten. Deze zouden de fix bij hun volgende herstartpoging oppikken, maar de back-off kan minuten duren. kubectl rollout restart deployment/shop-api -n shop start nu verse pods."
event.manifest_gone: "Je hebt het manifest van de ConfigMap verwijderd. Het cluster draait nog steeds de kapotte versie, en nu is ook de bron van de waarheid weg. Het bestand is terug: herstel het liever."
