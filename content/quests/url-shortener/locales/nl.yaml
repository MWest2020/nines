title: "Medior-ontwerpreview: een URL-verkorter"
summary: "Je eerste sessie in Mediorstad. Ingrid vraagt je een dienst te ontwerpen die lange links inkort en die snel, goedkoop en lastig te misbruiken is."
offer.1: "Welkom in Medior. De sessies duren hier langer, en de getallen zijn groter. De kantoren in de stad worden nog gebouwd, dus we gebruiken mijn whiteboard bij de poort."
offer.2: "Vandaag: een URL-verkorter. Een klein product met veel beslissingen erin. Klaar?"
active.1: "De stift is van jou. Eerst de getallen, dan de blokjes."
done.1: "Een degelijke review. Je hebt elke keuze afgewogen tegen wat hij kost; dat is de Medior-gewoonte."
attacker: "Ingrid · staff engineer"
intro.1: "Whiteboardgesprek · Onderwerp: een URL-verkorter"
intro.2: "Ingrid schrijft s.example/aB3x9Kq op het bord. \"Er gaat een lange link in, er komt een korte uit, en de korte stuurt door naar de lange. Ontwerp de dienst.\""
clarify.prompt.1: "\"Twee vragen voordat je blokjes tekent. Welke twee?\""
clarify.volume.text: "\"Hoeveel links worden er per dag gemaakt, en hoe vaak wordt elke link aangeklikt?\""
clarify.volume.why: "Goed. Dat geeft het schrijftempo, de verhouding tussen lezen en schrijven (vaak zo'n 100 op 1) en, met hoe lang links bewaard blijven, de opslag. Alle verdere getallen volgen hieruit."
clarify.clicks.text: "\"Hebben we klikstatistieken nodig, en kan het doel van een link later veranderd of uitgezet worden?\""
clarify.clicks.why: "Goed. Dit bepaalt de redirectstatus (een redirect die de browser cachet, kun je niet tellen en niet veranderen), of elke klik bij jou langs moet komen, en of je überhaupt een analytics-pijplijn nodig hebt."
clarify.alias.text: "\"Mogen gebruikers een eigen alias kiezen, zoals s.example/zomer-actie, en verlopen links ooit vanzelf?\""
clarify.alias.why: "Half goed, en het is discutabel. Allebei belangrijk: eigen aliassen delen de naamruimte met gegenereerde codes en vragen om een uniciteitscontrole en een lijst gereserveerde woorden; een vervaldatum vraagt om een controle bij elke leesactie en een opruimtaak. Maar geen van beide verandert de vorm van het systeem zoals schaal en analytics dat doen. Stel hem daarna."
clarify.length.text: "\"Moeten de korte codes 6 tekens lang zijn, of 7, of zo kort als we ze kunnen maken?\""
clarify.length.why: "Zwak. De lengte van de code is geen eis maar een uitkomst: die volgt uit hoeveel links je moet kunnen opslaan, en dat is de vraag die je moet stellen."
clarify.framework.text: "\"Welk webframework gebruikt het team?\""
clarify.framework.why: "Zwak. Een implementatiedetail: het zegt niets over het systeem en kost je een van je twee vragen."
storage.prompt.1: "\"100 miljoen nieuwe links per maand, vijf jaar bewaard. Zo'n 500 bytes per link: de lange URL, de code, de eigenaar en een paar tijdstempels. Er zijn 100 keer zoveel kliks als nieuwe links.\""
storage.prompt.2: "\"Hoeveel opslag hebben de links ongeveer nodig, vóór replicatie?\""
storage.working: "Uitwerking: 100 miljoen × 12 maanden × 5 jaar = 6 miljard links. 6 miljard × 500 bytes = 3 biljoen bytes, zo'n 3 TB. Ter vergelijking: een maand is zo'n 2,6 miljoen seconden, dus 100 miljoen per maand is zo'n 40 nieuwe links per seconde, en 100 op 1 maakt gemiddeld zo'n 4.000 redirects per seconde. Codes: 62^6 ≈ 57 miljard en 62^7 ≈ 3,5 biljoen, dus 7 base62-tekens laten ruim plek voor 6 miljard links."
storage.gb.text: "minder dan 100 GB"
storage.gb.why: "Veel te laag: 100 GB bevat maar 200 miljoen links van 500 bytes, genoeg voor twee maanden."
storage.year.text: "100 GB tot 1 TB"
storage.year.why: "Bijna: dat is één jaar (1,2 miljard links × 500 bytes = 600 GB). De links blijven vijf jaar bewaard."
storage.tb.text: "1 tot 10 TB"
storage.tb.why: "Goed: zo'n 3 TB. Ruim haalbaar voor een geshardede key-value store; met drie replica's zo'n 9 TB op schijf."
storage.clicks.text: "10 tot 100 TB"
storage.clicks.why: "Te hoog. Zoveel kost het om elke klik op te slaan (600 miljard kliks van zo'n 100 bytes is 60 TB), en dat is het werk van de analytics-opslag en een aparte schatting."
storage.huge.text: "meer dan 100 TB"
storage.huge.why: "Veel te hoog. 6 miljard links × 500 bytes is 3 biljoen bytes: zo'n 3 TB."
ids.prompt.1: "\"Codes zijn 7 tekens base62: a tot z, A tot Z en 0 tot 9. Hoe maak je ze?\""
ids.blocks.text: "Een teller in blokken van 1.000 ID's per server, door een omkeerbare permutatie met geheime sleutel en dan in base62 geschreven."
ids.blocks.why: "Goed. Elke app-server haalt af en toe een blok bij een centrale sequence (of een ticketserver), dus er is geen coördinatie per link en nooit een botsing. De permutatie met geheime sleutel, een klein blokcijfer over het ID-bereik, laat opeenvolgende ID's er willekeurig uitzien, zodat niemand de links kan aflopen door te tellen (willekeurig proberen werkt nog steeds; daar is de rate limiter voor). Een crash verspilt de rest van een blok, en dat kost niets. Discutabel tegenover willekeurige codes; allebei goed."
ids.random.text: "Willekeurige codes van 7 tekens, opgeslagen met een unique constraint op de code; bij de zeldzame botsing trek je gewoon een nieuwe."
ids.random.why: "Ook goed, en discutabel welke van de twee beter is. Geen coördinatie en geen volgorde om te volgen. (Korte codes blijven geen geheimen: zo vol als de ruimte dan is, hoort één willekeurige code op de 600 bij een echte link, dus begrens het aantal lookups, en geef privélinks langere codes of een login.) Zelfs met 6 miljard codes in een ruimte van 3,5 biljoen botst een nieuwe code ongeveer één keer op de 600 pogingen, dus opnieuw proberen is goedkoop, en de unique constraint, geen geluk, garandeert dat codes uniek blijven. De prijs is een uniciteitscontrole bij elke insert."
ids.sequence.text: "Eén databasesequence, in base62 geschreven en aangevuld tot 7 tekens: korte codes, geen botsingen en geen nieuw systeem om te beheren."
ids.sequence.why: "Half goed. Het werkt, en 40 inserts per seconde is niets voor één sequence. Maar de codes zijn opeenvolgend: iedereen kan elke link aflopen, privélinks ook, door vanaf zijn eigen link door te tellen. Voeg een permutatie met geheime sleutel toe en het wordt een van de beste antwoorden."
ids.hash.text: "Hash de lange URL en hou daar 7 base62-tekens van over; botst hij met een andere URL, voeg dan een salt toe en hash opnieuw."
ids.hash.why: "Half goed. Correct, en dezelfde URL krijgt altijd dezelfde code, wat dubbele links voorkomt. Maar dat is vaak ongewenst: twee gebruikers die één URL verkorten, delen een code en de statistieken, en geen van beiden kan hem alleen aanpassen. En je hebt de botsingscontrole toch nodig, dus het is niet eenvoudiger dan willekeurige codes."
ids.md5.text: "De eerste 7 tekens van de MD5-hash van de URL: geen coördinatie nodig en geen botsingen, want elke URL krijgt altijd dezelfde hash."
ids.md5.why: "Zwak, om twee redenen. Een vaste hash per URL voorkomt niet dat twee verschillende URL's dezelfde eerste 7 tekens hebben; op deze schaal zijn botsingen zeker. En MD5 schrijf je meestal hexadecimaal: 7 hextekens geven maar 16^7 ≈ 268 miljoen codes, veel minder dan 6 miljard links."
ids.uuid.text: "Een UUID per link: overal te maken, zonder coördinatie, en hij botst nooit."
ids.uuid.why: "Zwak. Klopt, maar een UUID is 36 tekens (22 zelfs in base64): het tegendeel van een korte link. De 122 willekeurige bits zijn veel meer dan 6 miljard links nodig hebben."
counters.prompt.1: "Ingrid tekent een ontwerp uit een oude review. \"Wat is hier mis mee?\""
counters.proposal.1: "Vijf app-servers achter een load balancer."
counters.proposal.2: "Elke server houdt een teller bij in zijn eigen geheugen, beginnend bij 1."
counters.proposal.3: "Een nieuwe link krijgt het volgende getal van zijn server, in base62 geschreven."
counters.duplicates.text: "Alle vijf servers tellen 1, 2, 3: één code voor vijf links, en na een herstart begint de telling weer bij 1."
counters.duplicates.why: "Goed. Vijf losse tellers maken dezelfde getallen, dus links overschrijven elkaar, of de inserts falen als de code uniek moet zijn. Een herstart zet de teller terug en herhaalt codes die al bestaan. De getallen moeten van één plek komen (een sequence die blokken uitdeelt), of de codes moeten willekeurig zijn en gecontroleerd worden."
counters.guessable.text: "De codes komen op volgorde, dus iedereen kan alle links van de dienst aflopen door gewoon door te tellen."
counters.guessable.why: "Half goed. Klopt, en een echt privacyprobleem, maar het ontwerp is daarvoor al stuk: de codes zijn niet eens uniek."
counters.slow.text: "Een teller in het geheugen kan op de piek geen 20.000 requests per seconde aan; daar is een database voor nodig."
counters.slow.why: "Zwak. Een getal in het geheugen ophogen kost nanoseconden. En die 20.000 per seconde zijn redirects, die de teller nooit aanraken; nieuwe links komen binnen met zo'n 40 per seconde."
counters.case.text: "Base62 is hoofdlettergevoelig, dus mensen die een code met de hand overtikken, van een poster bijvoorbeeld, doen dat vaak fout."
counters.case.why: "Zwak. Een terecht punt over gebruiksgemak (sommige diensten gebruiken daarom alleen kleine letters en cijfers, met langere codes als prijs), maar hier niet waar het om gaat."
redirect.prompt.1: "\"Marketing wil klikaantallen per link, en gebruikers willen het doel van een link na een tikfout kunnen verbeteren. Iemand klikt op s.example/aB3x9Kq: welk antwoord stuur je?\""
redirect.temporary.text: "302 Found, of 307: niet gecachet tenzij wij dat zeggen, dus elke klik komt langs om geteld te worden, en een nieuw doel geldt meteen."
redirect.temporary.why: "Goed voor deze eisen, en in het algemeen discutabel. Elke klik komt terug, dus hij kan geteld worden, en een veranderd of uitgezet doel geldt meteen. De prijs is belasting: elke herhaalde klik is een request, en dat vangt de cache ervoor op. 307 is hetzelfde, maar belooft de methode te behouden; voor een klik, een GET, maakt dat niets uit. 301 is de gebruikelijke keuze als je niet telt en niet wijzigt: browsers en zoekmachines behandelen hem als definitief, en dat scheelt belasting."
redirect.max-age.text: "301 Moved Permanently met Cache-Control: max-age van één dag, zodat herhaalde kliks ons overslaan en een wijziging binnen een dag aankomt."
redirect.max-age.why: "Half goed, en het is discutabel. Een expliciete max-age begrenst hoe lang een browser de redirect bewaart, dus dit is een echt compromis dat sommige verkorters maken, meestal met een veel kortere max-age. Maar herhaalde kliks vanuit dezelfde browser worden niet meer geteld, en een verbetering kan een dag op zich laten wachten, en beide druisen in tegen wat er gevraagd werd."
redirect.permanent.text: "301 Moved Permanently: browsers vragen het elke keer eerst bij ons na voordat ze hem volgen, dus elke klik wordt bij ons nog steeds geteld."
redirect.permanent.why: "Zwak: zo werkt een 301 niet. Browsers mogen een 301 cachen zonder enige cacheheader, vaak lang, dus herhaalde kliks gaan rechtstreeks naar het doel en jij ziet ze nooit, en je kunt het doel voor die gebruikers ook niet meer veranderen. De belasting daalt; tellingen en controle verdwijnen mee."
redirect.page.text: "200 OK met een pagina die de klik logt in JavaScript en de browser daarna doorstuurt."
redirect.page.why: "Zwak als standaardroute. Het is trager, het faalt voor clients die geen JavaScript draaien (apps, linkvoorbeelden in chats, curl), en crawlers zien een pagina in plaats van een redirect. Een tussenpagina heeft wel één goed gebruik: een waarschuwing vóór een link die gemeld is."
cache.prompt.1: "\"Gemiddeld zo'n 4.000 redirects per seconde, met pieken van vijf keer zoveel. Een handvol links krijgt de meeste kliks; de meeste links worden na hun eerste dag nauwelijks nog aangeklikt.\""
cache.prompt.2: "\"Hoe zet je een cache voor de opslag?\""
cache.aside.text: "Cache-aside in het geheugen met LRU: bij een miss lees je de opslag en bewaar je het antwoord; cache 'niet gevonden' ook kort."
cache.aside.why: "Goed. Kliks zijn sterk scheef verdeeld, dus een cache van een klein deel van de 3 TB bevat bijna alle populaire codes (een week aan nieuwe links is zo'n 23 miljoen items, zo'n 12 GB), en de meeste redirects bereiken de opslag nooit. Links veranderen nauwelijks: haal een code uit de cache bij wijzigen of verwijderen, en geef items een TTL van een paar minuten als vangnet. Korte 'niet gevonden'-items vangen herhaalde misses op, zoals een dode link die nog veel aangeklikt wordt; scanners met willekeurige codes zijn werk voor de rate limiter of een Bloom-filter van bestaande codes."
cache.everything.text: "Schrijf elke nieuwe link in de cache, zonder eviction, zodat elke redirect een cache-hit is."
cache.everything.why: "Zwak. Dat is een tweede kopie van 3 TB in het geheugen, bijna allemaal links die niemand nog aanklikt. Het geheugen is voor die paar populaire links; een evictionbeleid bepaalt welke dat zijn."
cache.cdn.text: "Laat een CDN de redirects een paar minuten cachen, dicht bij de gebruikers, en tel de kliks uit de logs van het CDN."
cache.cdn.why: "Half goed, en het is discutabel. Op grote schaal is dit een sterk antwoord: de edge vangt de pieken op. Maar de redirect moet dan een paar minuten cachebaar zijn, dus een wijziging of een takedown wacht zo lang, tenzij je de URL bij elke wijziging via de API van het CDN purget, en de tellingen hangen af van een logpijplijn vanuit het CDN. Veel ontwerpen zetten het bovenop een cache in het geheugen, niet in plaats daarvan."
cache.none.text: "Geen cache: de database houdt populaire rijen al in zijn eigen geheugen, dus een cache is een kopie om bij te houden."
cache.none.why: "Zwak. De eigen cache van de database helpt, maar elke klik kost nog steeds een query en een verbinding, en een virale link stuurt al zijn kliks naar de ene shard die hem bezit. Een cachenode bedient een populaire key veel goedkoper, en de allerpopulairste codes kunnen zelfs in het geheugen van elke app-server staan. Links veranderen nauwelijks, dus de kopie bijhouden is het makkelijke deel."
create.prompt.1: "\"Nu het schrijfpad. Iemand stuurt een lange URL in om te verkorten. Zet de stappen op volgorde.\""
create.limit.text: "Stel vast wie de aanvrager is en controleer zijn rate limit."
create.limit.why: "Eerst: stel vast wie het is, zodat elk request, ook een ongeldig, meetelt voor de limiet en een stortvloed stopt vóór al het andere werk."
create.validate.text: "Controleer of de lange URL klopt: http of https, een echte hostnaam, niet absurd lang."
create.validate.why: "Dan de goedkope lokale controles: een kapotte URL, of een javascript:-URL, wordt geweigerd vóór elke lookup."
create.blocklist.text: "Zoek het doel op in blocklists voor malware en phishing."
create.blocklist.why: "Dan de externe controle, op een URL waarvan je weet dat hij klopt. Die kost een lookup, dus hij komt na de goedkope controles."
create.code.text: "Neem het volgende ID uit het blok van de server, permuteer het en schrijf het in base62."
create.code.why: "Nu een code maken. Het kan ook eerder (een verspild ID kost niets), maar zo maak je er geen voor geweigerde links, en staat de code naast het schrijven dat hem gebruikt."
create.insert.text: "Sla de code en de URL op, met een unique constraint op de code."
create.insert.why: "Het schrijven. De unique constraint is de laatste verdedigingslinie tegen een dubbele code: een bug, of een gebruiker die precies deze code al als eigen alias heeft geclaimd; neem dan het volgende ID en probeer opnieuw."
create.reply.text: "Geef de korte link terug met 201 Created."
create.reply.why: "Als laatste: antwoord pas als de link is opgeslagen, zodat de korte link werkt op het moment dat de gebruiker hem heeft."
abuse.prompt.1: "\"Laatste vraag. Een maand na de lancering beginnen mailfilters ons domein te blokkeren: spammers maken duizenden links naar nagemaakte inlogpagina's van banken.\""
abuse.prompt.2: "\"Wat verander je?\""
abuse.layers.text: "Controleer doelen tegen dreigingslijsten bij het maken en later opnieuw, begrens het aanmaken, en toon een waarschuwing bij gemelde links."
abuse.layers.why: "Goed. Geen enkele maatregel is genoeg. Een doel kan schoon zijn als de link gemaakt wordt en een week later kwaadaardig worden, dus scan opnieuw en handel meldingen af. Rate limits per account en per IP maken massaal aanmaken duur. Een waarschuwingspagina in plaats van de redirect beschermt mensen zonder het bewijs te vernietigen. Dreigingslijsten zoals Google Safe Browsing (Web Risk voor commercieel gebruik) bieden een API voor precies deze lookup."
abuse.accounts.text: "Verplicht een account om links te maken, zodat spammers te traceren en te blokkeren zijn."
abuse.accounts.why: "Half goed. Het legt de lat hoger en geeft je iets om te blokkeren, maar accounts zijn goedkoop in bulk te maken. Eén nuttige laag, niet het hele antwoord."
abuse.captcha.text: "Zet een CAPTCHA vóór elke redirect, accepteer alleen https-doelen en blokkeer domeinen die jonger zijn dan een week."
abuse.captcha.why: "Zwak. De CAPTCHA straft elke eerlijke klik en breekt apps en linkvoorbeelden; phishingpagina's gebruiken net zo goed https; en een blokkade op nieuwe domeinen mist de gehackte oude sites waar aanvallers juist de voorkeur aan geven."
abuse.once.text: "Controleer elk doel één keer tegen de dreigingslijsten, bij het maken van de link: een link die op die dag schoon was, is voorgoed te vertrouwen."
abuse.once.why: "Zwak. Aanvallers linken naar een onschuldige pagina en verruilen die later voor een phishingpagina; de korte link verandert nooit. Controles moeten herhaald worden, en meldingen afgehandeld."
abuse.permanent.text: "Zet elke redirect om naar een 301, zodat browsers hem cachen en de foute links onze servers niet meer belasten en uit onze logs verdwijnen."
abuse.permanent.why: "Zwak. Het verbergt het probleem voor jou, niet voor de slachtoffers: mensen komen nog steeds op de phishingpagina terecht, en je kunt een link niet meer uitzetten voor iedereen wiens browser hem gecachet heeft."
hint.storage: "Eerst de links: 100 miljoen × 12 × 5. Vermenigvuldig dan met 500 bytes."
hint.ids: "Twee losse problemen: twee servers mogen nooit dezelfde code kiezen, en buitenstaanders mogen de volgende niet kunnen raden."
hint.counters: "Stel je voor dat server 1 en server 2 allebei hun allereerste link maken."
hint.redirect: "Welke van deze antwoorden mag een browser bewaren en hergebruiken zonder het jou opnieuw te vragen?"
hint.breathe: "Ingrid wil de kosten van elke keuze horen. Leg elke kaart naast wat ze vroeg: tellingen, wijzigingen, korte codes."
won.1: "Ingrid doet een stap terug van het bord. \"Eerst de getallen, botsingen afgevangen, elke klik verantwoord en een plan tegen misbruik. Dat is een Medior-antwoord.\""
lost.1: "\"We stoppen hier.\" Ingrid veegt het bord schoon. \"Lees de uitleg, vooral over de kosten. Het bord staat hier wanneer jij zover bent.\""
