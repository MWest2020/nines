title: "Medior design review: a URL shortener"
summary: "Your first session in Medior City. Ingrid asks you to design a service that turns long links into short ones, and to keep it fast, cheap and hard to abuse."
offer.1: "Welcome to Medior. The sessions get longer here, and the numbers bigger. The city's offices are still being built, so we'll use my whiteboard by the gate."
offer.2: "Today: a URL shortener. A small product with a lot of decisions in it. Ready?"
active.1: "The marker is yours. Numbers first, then boxes."
done.1: "A solid review. You weighed every choice against what it costs; that is the Medior habit."
attacker: "Ingrid · staff engineer"
intro.1: "Whiteboard interview. Topic: a URL shortener."
intro.2: "Ingrid writes s.example/aB3x9Kq on the board. \"A long link goes in, a short one comes out, and the short one redirects to the long one. Design the service.\""
clarify.prompt.1: "\"Two questions before you draw any boxes. Which two?\""
clarify.volume.text: "\"How many links are made a day, and how often is each one clicked?\""
clarify.volume.why: "Best. That gives the write rate, the read-to-write ratio (often around 100 to 1) and, with how long links are kept, the storage. Every later number follows from it."
clarify.clicks.text: "\"Do we need click statistics, and can a link's target be changed or switched off later?\""
clarify.clicks.why: "Best. This decides the redirect status (a redirect the browser caches can be neither counted nor changed), whether every click must reach you, and whether you need an analytics pipeline at all."
clarify.alias.text: "\"Can users pick their own alias, like s.example/summer-sale, and do links ever expire on their own?\""
clarify.alias.why: "Half right, and debatable. Both matter: custom aliases share the namespace with generated codes and need a uniqueness check and a list of reserved words; expiry needs a check on every read and a cleanup job. But neither changes the shape of the system the way scale and analytics do. Ask it next."
clarify.length.text: "\"Should the short codes be 6 characters long, or 7, or as short as we can make them?\""
clarify.length.why: "Weak. The code length is not a requirement but a result: it follows from how many links you must hold, and that is the question to ask instead."
clarify.framework.text: "\"Which web framework does the team use?\""
clarify.framework.why: "Weak. An implementation detail: it says nothing about the system and spends one of your two questions."
storage.prompt.1: "\"100 million new links a month, kept for five years. About 500 bytes per link: the long URL, the code, the owner and a few timestamps. Clicks outnumber new links 100 to 1.\""
storage.prompt.2: "\"Roughly how much storage do the links need, before replication?\""
storage.working: "Working: 100 million × 12 months × 5 years = 6 billion links. 6 × 10⁹ × 500 bytes = 3 × 10¹² bytes, about 3 TB. For scale: a month is about 2.6 million seconds, so 100 million a month is about 40 new links a second, and 100 to 1 makes about 4,000 redirects a second on average. Codes: 62⁶ ≈ 57 billion and 62⁷ ≈ 3.5 trillion, so 7 base62 characters leave ample room for 6 billion links."
storage.gb.text: "under 100 GB"
storage.gb.why: "Far too low: 100 GB holds only 200 million links of 500 bytes, two months' worth."
storage.year.text: "100 GB to 1 TB"
storage.year.why: "Close: that is one year (1.2 billion links × 500 bytes = 600 GB). The links are kept for five."
storage.tb.text: "1 to 10 TB"
storage.tb.why: "Right: about 3 TB. Comfortable for a sharded key-value store; with three replicas, about 9 TB on disk."
storage.clicks.text: "10 to 100 TB"
storage.clicks.why: "Too high. That is the size of storing every click (600 billion clicks at about 100 bytes each is 60 TB), which is the analytics store's job and a separate estimate."
storage.huge.text: "over 100 TB"
storage.huge.why: "Far too high. 6 billion links × 500 bytes is 3 × 10¹² bytes: about 3 TB."
ids.prompt.1: "\"Codes are 7 characters of base62: a to z, A to Z and 0 to 9. How do you generate them?\""
ids.blocks.text: "A counter handed out in blocks of 1,000 IDs per server, put through a keyed reversible shuffle, then written in base62."
ids.blocks.why: "Best. Each app server fetches a block from a central sequence (or a ticket server) now and then, so there is no coordination per link and never a collision. The keyed shuffle, a small block cipher over the ID range, makes consecutive IDs look unrelated, so nobody can walk through the links by counting. A crash wastes the rest of a block, which costs nothing. Debatable against random codes; both are good."
ids.random.text: "Random 7-character codes, stored under a unique constraint on the code; on the rare clash, simply draw a new one."
ids.random.why: "Best too, and debatable which of the two is better. No coordination and nothing to guess. Even with 6 billion codes in a space of 3.5 trillion, a new code clashes about once in 600 tries, so a retry is cheap, and the unique constraint, not luck, guarantees that codes stay unique. The price is a uniqueness check on every insert."
ids.sequence.text: "One database sequence written in base62: short codes, no collisions and nothing new to run."
ids.sequence.why: "Half right. It works, and 40 inserts a second is nothing for one sequence. But the codes are consecutive: anyone can enumerate every link, private ones included, by counting up from their own. Add a keyed shuffle and it becomes one of the best answers."
ids.hash.text: "Hash the long URL and keep 7 base62 characters of it; on a clash with another URL, add a salt and hash again."
ids.hash.why: "Half right. Correct, and the same URL always gets the same code, which deduplicates. But that is often unwanted: two users who shorten one URL share a code and its statistics, and neither can change it alone. And you still need the collision check, so it is no simpler than random codes."
ids.md5.text: "The first 7 characters of the URL's MD5 hash: no coordination needed and no collisions, because every URL always gets the same hash."
ids.md5.why: "Weak, twice over. A fixed hash per URL does not stop two different URLs from sharing the first 7 characters; at this scale collisions are certain. And MD5 is normally written in hex: 7 hex characters give only 16⁷ ≈ 268 million codes, far fewer than 6 billion links."
ids.uuid.text: "A UUID per link: made anywhere, with no coordination, and it never collides."
ids.uuid.why: "Weak. True, but a UUID is 36 characters (22 even in base64): the opposite of a short link. Its 122 random bits are far more than 6 billion links need."
counters.prompt.1: "Ingrid draws a design from an old review. \"What is wrong with this?\""
counters.proposal.1: "Five app servers behind a load balancer."
counters.proposal.2: "Each server keeps a counter in its own memory, starting at 1."
counters.proposal.3: "A new link gets the next number from its server, written in base62."
counters.duplicates.text: "All five servers count 1, 2, 3: one code for five links, and a restart counts from 1 again."
counters.duplicates.why: "Best. Five independent counters produce the same numbers, so links overwrite each other, or the inserts fail if the code is unique. A restart resets the counter and repeats codes that already exist. The numbers must come from one place (a sequence handing out blocks), or the codes must be random and checked."
counters.guessable.text: "The codes come out in order, so anyone can walk through all the links on the service just by counting upwards."
counters.guessable.why: "Half right. True, and a real privacy problem, but the design is broken before that: the codes are not even unique."
counters.slow.text: "A counter in memory cannot keep up with 4,000 requests a second at peak; it needs a database."
counters.slow.why: "Weak. Adding one to a number in memory takes nanoseconds. And the 4,000 a second are redirects, which never touch the counter; new links arrive at about 40 a second."
counters.case.text: "Base62 is case-sensitive, so people who type a code by hand, from a poster say, will often get it wrong."
counters.case.why: "Weak. A fair usability point (some services use only lower case and digits for that reason, at the price of longer codes), but beside the point here."
redirect.prompt.1: "\"Marketing wants click counts per link, and users want to fix a link's target after a typo. Someone clicks s.example/aB3x9Kq: which response do you send?\""
redirect.temporary.text: "302 Found, or 307: not cached unless we say so, so every click reaches us to be counted, and a new target applies at once."
redirect.temporary.why: "Best for these requirements, and debatable in general. Every click comes back, so it can be counted, and a changed or disabled target applies at once. The price is load: every repeat click is a request, which the cache in front absorbs. 307 is the same but promises to keep the method; for a click, which is a GET, there is no difference."
redirect.max-age.text: "301 Moved Permanently with Cache-Control: max-age of one day, so repeat clicks skip us and an edit still lands within a day."
redirect.max-age.why: "Half right, and debatable. An explicit max-age bounds how long a browser keeps the redirect, so this is a real compromise some shorteners make, usually with a much shorter max-age. But repeat clicks from the same browser are no longer counted, and a fix can take a day to arrive, both against what was asked."
redirect.permanent.text: "301 Moved Permanently: browsers check back with us each time before they follow it, so every click still gets counted on our side."
redirect.permanent.why: "Weak: that is not how a 301 works. Browsers may cache a 301 without any cache header, often for a long time, so repeat clicks go straight to the target and you never see them, nor can you change the target for those users. Load drops; counts and control go with it."
redirect.page.text: "200 OK with a page that logs the click in JavaScript and then sends the browser on."
redirect.page.why: "Weak as the normal path. It is slower, it fails for clients that do not run JavaScript (apps, chat link previews, curl), and crawlers see a page instead of a redirect. A page in between does have one good use: a warning in front of a link that has been reported."
cache.prompt.1: "\"About 4,000 redirects a second on average, and peaks at five times that. A handful of links get most of the clicks; most links are hardly clicked after their first day.\""
cache.prompt.2: "\"How do you put a cache in front of the store?\""
cache.aside.text: "Cache-aside in memory with LRU eviction: on a miss, read the store and keep the answer; cache 'not found' briefly too."
cache.aside.why: "Best. Clicks are heavily skewed, so a cache a small fraction of the 3 TB holds nearly all hot codes, and most redirects never reach the store. Links barely change: drop a code from the cache on edit or delete. Short-lived 'not found' entries absorb repeated misses; scanners that try random codes are a job for the rate limiter, or a Bloom filter of existing codes."
cache.everything.text: "Write every new link into the cache, with no eviction, so that every redirect is a cache hit."
cache.everything.why: "Weak. That is a second copy of 3 TB in memory, nearly all of it links nobody clicks again. Memory belongs to the hot few; an eviction policy decides which."
cache.cdn.text: "Let a CDN cache the redirects for a few minutes, close to the users, and count the clicks from the CDN's logs."
cache.cdn.why: "Half right, and debatable. At large scale this is a strong answer: the edge absorbs the peaks. But the redirect must then be cacheable for a few minutes, so an edit or a takedown waits that long, and the counts depend on a log pipeline from the CDN. Many designs add it on top of an in-memory cache rather than instead of one."
cache.none.text: "No cache: the database already keeps hot rows in its own memory, so a cache would be a copy to keep in sync."
cache.none.why: "Weak. The database's own cache helps, but every click still costs a query and a connection, and a viral link sends all its clicks to the one shard that owns it. A cache node serves a hot key far more cheaply, and the very hottest codes can even live in each app server's memory. Links barely change, so keeping the copy in sync is the easy part."
create.prompt.1: "\"Now the write path. Someone posts a long URL to be shortened. Put the steps in order.\""
create.limit.text: "Identify the caller and check their rate limit."
create.limit.why: "First: the cheapest check, and it stops a flood before it costs anything, invalid requests included."
create.validate.text: "Check that the long URL is well formed: http or https, a real host name, not absurdly long."
create.validate.why: "Then the cheap local checks: a broken URL, or a javascript: one, is refused before any lookup."
create.blocklist.text: "Look the target up in malware and phishing blocklists."
create.blocklist.why: "Then the external check, on a URL known to be well formed. It costs a lookup, so it comes after the cheap checks."
create.code.text: "Take the next ID from the server's block, shuffle it and write it in base62."
create.code.why: "Only now make a code: only for a link you are actually going to store."
create.insert.text: "Store the code and the URL, under a unique constraint on the code."
create.insert.why: "The write. The unique constraint is the last line of defence against a duplicate, from a bug or from a custom alias that is already taken."
create.reply.text: "Return the short link with 201 Created."
create.reply.why: "Last: answer only once the link is stored, so the short link works the moment the user has it."
abuse.prompt.1: "\"Last one. A month after launch, mail filters start blocking our domain: spammers are making thousands of links to fake bank login pages.\""
abuse.prompt.2: "\"What do you change?\""
abuse.layers.text: "Check targets against threat lists when made and later again, rate-limit creation, and show a warning page on reported links."
abuse.layers.why: "Best. No single measure is enough. A target can be clean when the link is made and turn malicious a week later, so scan again and act on reports. Rate limits per account and per IP make bulk creation expensive. A warning page instead of the redirect protects people without destroying the evidence. Threat lists such as Google Safe Browsing offer an API for exactly this lookup."
abuse.accounts.text: "Require an account to make links, so that spammers can be traced and banned."
abuse.accounts.why: "Half right. It raises the bar and gives you something to ban, but accounts are cheap to make in bulk. One useful layer, not the answer on its own."
abuse.longer.text: "Make the codes longer and random, so that spammers can no longer guess them."
abuse.longer.why: "Weak. Spammers do not guess codes; they make their own links, like any user. Code length does nothing against that."
abuse.once.text: "Check each target against the threat lists once, when the link is made: a link that was clean on the day it was made can be trusted for good."
abuse.once.why: "Weak. Attackers link to a harmless page and swap it for a phishing page later; the short link never changes. Checks must be repeated, and reports acted on."
abuse.permanent.text: "Switch every redirect to a 301, so that browsers cache it and the bad links stop hitting our servers and showing up in our logs."
abuse.permanent.why: "Weak. It hides the problem from you, not from the victims: people still land on the phishing page, and you can no longer disable a link for anyone whose browser has cached it."
hint.storage: "Links first: 100 million × 12 × 5. Then multiply by 500 bytes."
hint.ids: "Two separate problems: two servers must never pick the same code, and outsiders must not be able to guess the next one."
hint.counters: "Picture server 1 and server 2 each making their very first link."
hint.redirect: "Which of these responses may a browser keep and reuse without asking you again?"
hint.breathe: "Ingrid wants the cost of every choice. Hold each card against what she asked for: counts, edits, short codes."
won.1: "Ingrid steps back from the board. \"Numbers first, collisions handled, every click accounted for and a plan for abuse. That is a Medior answer.\""
lost.1: "\"We'll stop here.\" Ingrid wipes the board. \"Read the explanations, especially the costs. The board will be here when you are.\""
