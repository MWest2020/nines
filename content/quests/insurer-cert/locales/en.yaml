title: "Grachtgarant: the certificate expires tonight"
summary: "An insurer's internal portal runs on a TLS certificate that expires at midnight. The renewal is delivered and the change approved: point nginx at the new pair, restart it, and do the paperwork. Or, as a contractor, skip the paperwork and pay triple for what you break."
offer.1: "Marieke, IT manager at Grachtgarant, the insurer on the canal. Our portal's certificate expires tonight at midnight, and four hundred colleagues log in to it every morning."
offer.2: "The PKI team delivered the renewed certificate and key, and the change is approved: CHG-2291. The portal's rack is in The Stack."
offer.3: "We're an insurer, so we do it by the book: the change record filled in, the certificate inventory updated. Compliance reads both."
offer.4: "Working as a contractor? Then skip our paperwork and bill half as much again. But what you break, you pay for. Three times. Compliance insisted on that too."
active.1: "The change record is on the box, in ~/changes. Renewed files in /etc/nginx/tls/2026. Don't touch the 2025 ones until the new certificate is live."
done.1: "Valid until June, and the portal never blinked. Compliance will find the change record complete, which is the most romantic thing that ever happens here."
done.2: "Certificates live shorter every year. One day this is automated, and I'll miss it. A bit."
npc.name: "Marieke"
npc.idle: "Insurance is the business of things that probably won't happen. IT at an insurer is the business of making sure they don't."
npc.no_clearance: "Our compliance department checks every contractor, and your record would not get past them. Come back with a clean one: the Repair Café in Junior Village does community service."
npc.after: "The inventory says June. I've already put a reminder in for May. Old habits."
motd: "portal-01, Grachtgarant's internal portal (production). Its TLS certificate expires tonight. Approved change: ~/changes/CHG-2291.txt."
obj.live: "nginx runs on the renewed certificate and its new key"
obj.chain: "nginx sends the full chain: the certificate first, then the intermediate"
obj.change: "change record CHG-2291: the implementer's lines are filled in"
obj.inventory: "the certificate inventory has the portal's new expiry date instead of tonight's"
hint.change: "At an insurer nothing happens without a change record: cat ~/changes/CHG-2291.txt."
hint.delivery: "The renewal is in /etc/nginx/tls/2026. Its README says which file is which, and what the PKI team checked."
hint.config: "Which files does nginx use now? Its sites are in /etc/nginx/sites-enabled: there are two ssl_ lines, one for the certificate and one for its key."
hint.mismatch: "nginx refused to start, and the portal is down until it runs. systemctl status nginx shows why. key values mismatch means the key is not the certificate's own: both ssl_ lines have to point at the same delivery. Check every path, letter by letter."
hint.chain: "nginx is happy with cert.pem, but a browser that has never seen the intermediate is not. The README describes a file that carries both."
hint.paperwork: "The portal is safe. On payroll the change is done when the record says so: the implementer's lines in ~/changes/CHG-2291.txt, and the new expiry date (checks.txt has it) in the inventory."
event.rollback_gone: "You deleted the 2025 files before the new certificate was live. They were the rollback, and the change record said so. Grachtgarant restores them from last night's backup and the CAB wants a word: €150."
event.key_gone: "The new private key is gone from its folder. Deleted or moved somewhere else, it's the same: a key that left its place can't be trusted. The PKI team revokes the certificate and rushes a new key pair through the CA: €200."
event.delivery_gone: "A delivered certificate file is gone from its folder. Marieke downloads the delivery again from the CA's portal and puts it back: half an hour of her evening, €25."
