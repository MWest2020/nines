title: "Grachtgarant: het certificaat verloopt vannacht"
summary: "Het interne portaal van een verzekeraar draait op een TLS-certificaat dat om middernacht verloopt. De vernieuwing is geleverd en de change goedgekeurd: zet nginx op het nieuwe paar, herstart hem en doe het papierwerk. Of sla als zzp'er het papierwerk over en betaal driedubbel voor wat je stukmaakt."
offer.1: "Marieke, IT-manager bij Grachtgarant, de verzekeraar aan de gracht. Het certificaat van ons portaal verloopt vannacht om twaalf uur, en vierhonderd collega's loggen er elke ochtend op in."
offer.2: "Het PKI-team heeft het vernieuwde certificaat en de sleutel geleverd, en de change is goedgekeurd: CHG-2291. Het rack van het portaal staat in The Stack."
offer.3: "We zijn een verzekeraar, dus het gaat volgens het boekje: het changeformulier ingevuld, de certificateninventaris bijgewerkt. Compliance leest allebei."
offer.4: "Werk je als zzp'er? Sla dan ons papierwerk over en factureer de helft extra. Maar wat je stukmaakt, betaal je. Drie keer. Daar stond compliance ook op."
active.1: "Het changeformulier staat op de machine, in ~/changes. De vernieuwde bestanden in /etc/nginx/tls/2026. Blijf van die van 2025 af tot het nieuwe certificaat live is."
done.1: "Geldig tot juni, en het portaal heeft niet eens geknipperd. Compliance gaat het changeformulier compleet vinden, en romantischer wordt het hier niet."
done.2: "Certificaten leven elk jaar korter. Ooit is dit geautomatiseerd, en dan ga ik het missen. Een beetje."
npc.name: "Marieke"
npc.idle: "Verzekeren is het vak van dingen die waarschijnlijk niet gebeuren. IT bij een verzekeraar is het vak van zorgen dat ze echt niet gebeuren."
npc.no_clearance: "Onze complianceafdeling controleert elke externe kracht, en met jouw blazoen kom je daar niet langs. Kom terug met een schoon blazoen: het Repair Café in Junior Village doet taakstraffen."
npc.after: "In de inventaris staat juni. Ik heb al een herinnering gezet voor mei. Oude gewoonte."
motd: "portal-01, het interne portaal van Grachtgarant (productie). Het TLS-certificaat verloopt vannacht. Goedgekeurde change: ~/changes/CHG-2291.txt."
obj.live: "nginx draait op het vernieuwde certificaat en zijn nieuwe sleutel"
obj.chain: "nginx stuurt de volledige keten: eerst het certificaat, dan het intermediate"
obj.change: "changeformulier CHG-2291: de regels van de uitvoerder zijn ingevuld"
obj.inventory: "de certificateninventaris heeft de nieuwe vervaldatum van het portaal in plaats van die van vannacht"
hint.change: "Bij een verzekeraar gebeurt niets zonder changeformulier: cat ~/changes/CHG-2291.txt."
hint.delivery: "De vernieuwing staat in /etc/nginx/tls/2026. De README zegt welk bestand wat is, en wat het PKI-team heeft gecontroleerd."
hint.config: "Welke bestanden gebruikt nginx nu? Zijn sites staan in /etc/nginx/sites-enabled: er zijn twee ssl_-regels, één voor het certificaat en één voor de sleutel."
hint.mismatch: "nginx wilde niet starten, en het portaal ligt plat tot hij draait. systemctl status nginx laat zien waarom. key values mismatch betekent dat de sleutel niet bij het certificaat hoort: beide ssl_-regels moeten naar dezelfde levering wijzen. Controleer elk pad, letter voor letter."
hint.chain: "nginx is tevreden met cert.pem, maar een browser die het intermediate nooit heeft gezien niet. De README beschrijft een bestand met allebei erin."
hint.paperwork: "Het portaal is veilig. In loondienst is de change pas klaar als het formulier dat zegt: de regels van de uitvoerder in ~/changes/CHG-2291.txt, en de nieuwe vervaldatum (die staat in checks.txt) in de inventaris."
event.rollback_gone: "Je hebt de bestanden van 2025 verwijderd voordat het nieuwe certificaat live was. Dat was de rollback, en dat stond in het changeformulier. Grachtgarant zet ze terug uit de back-up van vannacht en de CAB wil je spreken: €150."
event.key_gone: "De nieuwe private key is weg uit zijn map. Verwijderd of ergens anders neergezet, het maakt niet uit: een sleutel die van zijn plek is geweest, vertrouw je niet meer. Het PKI-team trekt het certificaat in en jaagt een nieuw sleutelpaar door de CA: €200."
event.delivery_gone: "Een geleverd certificaatbestand is weg uit zijn map. Marieke downloadt de levering opnieuw van het portaal van de CA en zet hem terug: een half uur van haar avond, €25."
