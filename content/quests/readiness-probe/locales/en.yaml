title: "Not ready"
summary: "invoice-api 2.0 is out, but none of its pods becomes Ready and invoices fail. Find out why with kubectl, fix the manifest and apply it."
offer.1: "Hey, I'm Jesse, I lead the billing team. We rolled out invoice-api 2.0 an hour ago and the invoice page says 'no healthy upstream'. The pods are running, though. I checked."
offer.2: "The jump host is the desk by the window. kubectl is set up for our namespace, billing, and my handover note is in the home folder."
active.1: "Running is not the same as ready. Kubernetes asks each pod a question before it sends it traffic."
done.1: "Three pods Ready, and the invoices are flowing again. The probe was asking for a page that 2.0 no longer has, so every answer was a 404."
done.2: "And you kept the readiness probe instead of deleting it. Next time the database is down, those pods step out of the Service instead of serving errors. And once we can roll out side by side again, the same probe stops a bad rollout while the old pods keep serving."
npc.name: "Jesse"
npc.idle: "Our release notes said /healthz was gone. Our manifest did not get the memo."
npc.coach: "New in town? Petra, the career coach, is in front of the Career Office. Pick a path with her first, then come and help us."
npc.after: "We added a check to CI that compares the probe paths with the ones the app says it serves. Humans read changelogs; pipelines do not forget."
motd: "jump-02. kubectl talks to the cluster. invoice-api 2.0 runs in the namespace billing, but no pod becomes Ready: get it serving again. Start with ~/handover.txt."
obj.ready: "invoice-api's pods are Ready"
obj.probe: "the readiness probe is kept and asks /readyz"
hint.start: "Start with the pods: kubectl get pods -n billing. Look at READY as well as STATUS."
hint.ready: "Running but READY 0/1: the container runs, but its readiness probe fails, so the Service sends it no traffic. kubectl describe pods -n billing shows what the probe asked and what it got."
hint.path: "The probe gets a 404: it asks for a page the app does not serve. Which health endpoints does 2.0 have? The pod's logs and ~/invoice-k8s/CHANGELOG.md both say. The probe lives in ~/invoice-k8s/deployment.yaml."
hint.apply: "Saving the file changes your disk, not the cluster. kubectl apply -f sends it; a changed pod template rolls the Deployment out by itself."
event.manifest_gone: "You deleted the Deployment's manifest. The cluster keeps running the broken copy, and now nobody knows what it should look like. The file is back: fix it instead."
event.probe_removed: "Without a readiness probe every pod counts as Ready the moment it starts, even with the database down. Jesse would like the probe back, asking the right question."
