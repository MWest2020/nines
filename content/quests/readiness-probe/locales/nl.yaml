title: "Niet ready"
summary: "invoice-api 2.0 is uitgerold, maar geen enkele pod wordt Ready en facturen mislukken. Zoek met kubectl uit waarom, herstel het manifest en apply het."
offer.1: "Hoi, ik ben Jesse, ik leid het billingteam. We hebben een uur geleden invoice-api 2.0 uitgerold en de factuurpagina zegt 'no healthy upstream'. De pods draaien wel, dat heb ik gecontroleerd."
offer.2: "De jumphost is het bureau bij het raam. kubectl staat ingesteld op onze namespace, billing, en mijn overdrachtsbriefje staat in de thuismap."
active.1: "Draaien is niet hetzelfde als ready zijn. Kubernetes stelt elke pod een vraag voordat het er verkeer heen stuurt."
done.1: "Drie pods Ready en de facturen lopen weer. De probe vroeg om een pagina die 2.0 niet meer heeft, dus elk antwoord was een 404."
done.2: "En je hebt de readiness probe gehouden in plaats van hem te schrappen. Als de database straks plat ligt, stappen die pods uit de Service in plaats van fouten te serveren."
npc.name: "Jesse"
npc.idle: "In onze release notes stond dat /healthz weg was. Ons manifest had dat memo niet gelezen."
npc.coach: "Nieuw in de stad? Joyce, de loopbaancoach, staat voor het Career Centre. Kies eerst een pad bij haar, en kom ons daarna helpen."
npc.after: "We hebben een check in CI gezet die de probe-paden vergelijkt met wat de app zegt te serveren. Mensen lezen changelogs; pipelines vergeten niets."
motd: "jump-02. kubectl praat met het cluster. invoice-api 2.0 draait in de namespace billing, maar geen pod wordt Ready: zorg dat hij weer verkeer krijgt. Begin met ~/handover.txt."
obj.ready: "de pods van invoice-api zijn Ready"
obj.probe: "de readiness probe blijft en vraagt /readyz"
hint.start: "Begin bij de pods: kubectl get pods -n billing. Kijk naar READY, niet alleen naar STATUS."
hint.ready: "Running maar READY 0/1: de container draait, maar zijn readiness probe faalt, dus de Service stuurt er geen verkeer heen. kubectl describe pods -n billing laat zien wat de probe vroeg en wat hij kreeg."
hint.path: "De probe krijgt een 404: hij vraagt om een pagina die de app niet serveert. Welke health-endpoints heeft 2.0? De logs van de pod en ~/invoice-k8s/CHANGELOG.md zeggen het allebei. De probe staat in ~/invoice-k8s/deployment.yaml."
hint.apply: "Opslaan verandert je schijf, niet het cluster. kubectl apply -f stuurt het bestand op; een gewijzigde pod-template rolt de Deployment vanzelf uit."
event.manifest_gone: "Je hebt het manifest van de Deployment verwijderd. Het cluster draait de kapotte versie gewoon door, en nu weet niemand meer hoe hij eruit hoort te zien. Het bestand is terug: herstel het liever."
event.probe_removed: "Zonder readiness probe telt elke pod als Ready zodra hij start, ook als de database plat ligt. Jesse wil de probe graag terug, met de juiste vraag."
