npc.name: "Petra"
intro.1: "Welkom in Mediorstad! Ik ben Petra, de loopbaancoach. Een junior lost op wat voor zijn neus ligt; een medior kiest een richting en wordt daar goed in."
intro.2: "Hier beginnen zes paden. Elk heeft een mentor in de stad met een eerste klus voor je. Bekijk ze allemaal en kies dan het pad dat bij je past."
mentor.swe: "Software engineering dus. Lars is je mentor: hij zit op het caféterras op het plein, meestal met een pull request open."
mentor.sre: "Site reliability dus. Amara is je mentor: je vindt haar bij de fontein, met een oog op de dashboards."
mentor.devops: "DevOps dus. Ruben is je mentor: hij werkt aan een bureau in The Stack, de coworkingplek met de glazen deur."
mentor.platform: "Platform engineering dus. Kim is je mentor: ze staat op het plein golden paths te schetsen."
mentor.systems: "Systems engineering dus. Wim is je mentor: hij staat op de colocatievloer achter in The Stack."
mentor.ethical: "Ethical hacking dus. Esra is je mentor: ze heeft een bureau in The Stack, met een getekende scope erop."
again: "Toch iets anders? Bij mij kun je van pad wisselen, tegen betaling. Wat je geleerd hebt, blijft van jou."
