npc.name: "Ans"
desk.1: "Hoi, ik ben Ans, van de bibliotheekbalie. Ben zo terug: de printer eet weer iemands scriptie op."
desk.2: "Ze loopt weg. Op de balie ligt een bibliotheekpas: nummer 2291, J. Visser. Niemand kijkt."
choice.pocket: "Pas in je zak steken"
choice.hand_in: "Pas aan Ans geven"
choice.leave: "Laten liggen"
pocket.1: "Je laat pas 2291 in je zak glijden. Hij is niet van jou. Dat is het punt, en het probleem: lenen is niet het woord dat de politie zou gebruiken."
hand_in.1: "Ans: De pas van Joris! Die had de hele middag lopen zoeken. Dank je. Eerlijke mensen zijn zeldzamer dan werkende printers."
leave.1: "Je laat hem liggen. Andermans pas, andermans middag."
missing.1: "Ans: Heb jij een bibliotheekpas gezien? 2291, van Joris. Hij zet de leeszaal op zijn kop."
missing.2: "Je houdt je hand uit je zak. Hij voelt zwaarder dan een pasje hoort te voelen."
thanks.1: "Ans: Joris zegt nog steeds bedankt. Hij wil een koffie voor je kopen. Uit de automaat, dus niet te blij worden."
legal.1: "Ans: Iets gevonden dat openstaat en dat niet hoort? Meld het bij de eigenaar. De meeste bedrijven hebben een security.txt, en sommige betalen je er zelfs voor."
idle.1: "Ans: De kiosk bij de co-working space? Log in met je eigen pas, en log uit als je klaar bent. Iedereen vergeet het."
