npc.name: "Ans"
desk.1: "Hi, I'm Ans, library desk. Back in a minute: the printer is eating someone's thesis again."
desk.2: "She hurries off. A library card lies on the desk: number 2291, name J. Visser. Nobody is looking."
choice.pocket: "Pocket the card"
choice.hand_in: "Give it to Ans"
choice.leave: "Leave it there"
pocket.1: "You slip card 2291 into your pocket. It isn't yours. That's the point, and the problem: borrowed is not the word the police would use."
hand_in.1: "Ans: Joris's card! He'd have spent all afternoon looking. Thanks. Honest people are rarer than working printers."
leave.1: "You leave it where it is. Somebody else's card, somebody else's afternoon."
missing.1: "Ans: Have you seen a library card? 2291, Joris's. He's turning the reading room upside down."
missing.2: "You keep your hand out of your pocket. It feels heavier than a card should."
thanks.1: "Ans: Joris says thanks again. He wants to buy you a coffee. From the machine, so don't get excited."
legal.1: "Ans: Found something that's open and shouldn't be? Tell the owner. Most companies have a security.txt, and some even pay you for it."
idle.1: "Ans: The kiosk by the co-working space? Sign in with your own card, and sign out when you're done. Everybody forgets."
