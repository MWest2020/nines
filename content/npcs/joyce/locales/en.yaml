npc.name: "Joyce"
intro.1: "Welcome to Medior City! I'm Joyce, the career coach. A Junior fixes what is in front of them; a Medior picks a direction and gets good at it."
intro.2: "Six paths start here. Each has a mentor in town with a first job for you. Have a look at them all, then pick the one that sounds like you."
mentor.swe: "Software engineering it is. Lars is your mentor: he's at the café terrace on the plaza, usually with a pull request open."
mentor.sre: "Site reliability it is. Amara is your mentor: find her by the fountain, keeping an eye on the dashboards."
mentor.devops: "DevOps it is. Ruben is your mentor: he works at a desk in The Stack, the co-working space with the glass door."
mentor.platform: "Platform engineering it is. Kim is your mentor: she's on the plaza, sketching golden paths."
mentor.systems: "Systems engineering it is. Wim is your mentor: he's on the colocation floor at the back of The Stack."
mentor.ethical: "Ethical hacking it is. Esra is your mentor: she has a desk in The Stack, with a signed scope on it."
again: "Changed your mind? You can switch paths with me, for a fee. What you've learned stays yours."
