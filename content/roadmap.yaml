# The Career Trail: our own nodes. Towns are career stages, branches are the routes between
# them. A node lights up when a quest that names it as roadmap_node is done.
schema: 1
towns:
  - {id: junior, stage: junior, title: town.junior}
  - {id: medior, stage: medior, title: town.medior}
  - {id: senior, stage: senior, title: town.senior}
branches:
  - {id: linux, title: branch.linux}
  - {id: networking, title: branch.networking}
  - {id: git, title: branch.git}
  - {id: cicd, title: branch.cicd}
  - {id: containers, title: branch.containers}
  - {id: iac, title: branch.iac}
  - {id: observability, title: branch.observability}
  - {id: incident, title: branch.incident}
  - {id: design, title: branch.design}
nodes:
  - {id: linux-files, branch: linux, stage: junior, title: node.linux.files, requires: []}
  - {id: linux-disk, branch: linux, stage: junior, title: node.linux.disk, requires: []}
  - {id: linux-services, branch: linux, stage: junior, title: node.linux.services, requires: [linux-files]}
  - {id: git-basics, branch: git, stage: junior, title: node.git.basics, requires: []}
  - {id: cicd-pipeline, branch: cicd, stage: junior, title: node.cicd.pipeline, requires: []}
  - {id: incident-first, branch: incident, stage: junior, title: node.incident.first, requires: []}
  - {id: incident-pager, branch: incident, stage: junior, title: node.incident.pager, requires: [incident-first]}
  - {id: cicd-release-scope, branch: cicd, stage: junior, title: node.cicd.release_scope, requires: [cicd-pipeline]}
  - {id: design-rate-limiter, branch: design, stage: junior, title: node.design.rate_limiter, requires: []}
  - {id: design-nearby, branch: design, stage: junior, title: node.design.nearby, requires: []}
  - {id: observability-logs, branch: observability, stage: medior, title: node.observability.logs, requires: [incident-first]}
  - {id: containers-pods, branch: containers, stage: medior, title: node.containers.pods, requires: [linux-services]}
  - {id: networking-dns, branch: networking, stage: medior, title: node.networking.dns, requires: [linux-files]}
  - {id: iac-first, branch: iac, stage: medior, title: node.iac.first, requires: [git-basics, cicd-pipeline]}
  - {id: design-url-shortener, branch: design, stage: medior, title: node.design.url_shortener, requires: [design-rate-limiter]}
