# The Career Trail: our own nodes. Towns are career stages, branches are the routes between
# them. A node lights up when a quest that names it as roadmap_node is done. A town's map that
# content/maps does not have yet is planned: content may be written for it ahead of the map.
schema: 1
towns:
  - {id: junior, stage: junior, title: town.junior, map: junior-village}
  - {id: medior, stage: medior, title: town.medior, map: medior-city}
  - {id: senior, stage: senior, title: town.senior, map: senior-summit}
branches:
  - {id: linux, title: branch.linux}
  - {id: networking, title: branch.networking}
  - {id: git, title: branch.git}
  - {id: cicd, title: branch.cicd}
  - {id: containers, title: branch.containers}
  - {id: iac, title: branch.iac}
  - {id: observability, title: branch.observability}
  - {id: incident, title: branch.incident}
  - {id: design, title: branch.design}
  - {id: kubernetes, title: branch.kubernetes}
  # the ethical hacker's branch, which came with Medior City (DESIGN.md, Karma)
  - {id: security, title: branch.security}
# The six career paths, chosen at Medior City (DESIGN.md, Career paths; the sixth, ethical
# hacker, came with karma on 27 Nov 2026). A quest names the
# paths it counts towards in its quest.yaml `paths`.
paths:
  - {id: swe, title: path.swe, pitch: path.swe.pitch}
  - {id: sre, title: path.sre, pitch: path.sre.pitch}
  - {id: devops, title: path.devops, pitch: path.devops.pitch}
  - {id: platform, title: path.platform, pitch: path.platform.pitch}
  - {id: systems, title: path.systems, pitch: path.systems.pitch}
  - {id: ethical, title: path.ethical, pitch: path.ethical.pitch}
nodes:
  - {id: linux-files, branch: linux, stage: junior, title: node.linux.files, requires: []}
  - {id: linux-disk, branch: linux, stage: junior, title: node.linux.disk, requires: []}
  - {id: linux-services, branch: linux, stage: junior, title: node.linux.services, requires: [linux-disk]}
  - {id: git-basics, branch: git, stage: junior, title: node.git.basics, requires: []}
  - {id: cicd-pipeline, branch: cicd, stage: junior, title: node.cicd.pipeline, requires: []}
  - {id: incident-first, branch: incident, stage: junior, title: node.incident.first, requires: []}
  - {id: incident-pager, branch: incident, stage: junior, title: node.incident.pager, requires: [incident-first]}
  - {id: cicd-release-scope, branch: cicd, stage: junior, title: node.cicd.release_scope, requires: [cicd-pipeline]}
  - {id: design-rate-limiter, branch: design, stage: junior, title: node.design.rate_limiter, requires: []}
  - {id: design-nearby, branch: design, stage: junior, title: node.design.nearby, requires: []}
  # The Kubernetes learning path (DESIGN.md, Kubernetes learning path): Junior follows the four
  # KCNA domains. CKAD (Medior) and CKA/CKS (Senior) nodes arrive with their quests.
  - {id: k8s-fundamentals, branch: kubernetes, stage: junior, title: node.k8s.fundamentals, requires: []}
  - {id: k8s-orchestration, branch: kubernetes, stage: junior, title: node.k8s.orchestration, requires: [k8s-fundamentals]}
  - {id: k8s-delivery, branch: kubernetes, stage: junior, title: node.k8s.delivery, requires: [k8s-fundamentals]}
  - {id: k8s-architecture, branch: kubernetes, stage: junior, title: node.k8s.architecture, requires: [k8s-fundamentals]}
  - {id: observability-logs, branch: observability, stage: medior, title: node.observability.logs, requires: [incident-first]}
  - {id: design-url-shortener, branch: design, stage: medior, title: node.design.url_shortener, requires: [design-rate-limiter]}
  # Medior City (DESIGN.md, Medior City): each path's first quest, the CKAD start, the enterprise
  # job and the city's side job. The screen holds six branch rows per town, so Medior keeps to
  # observability, design, cicd, kubernetes, linux and security.
  - {id: observability-slo, branch: observability, stage: medior, title: node.observability.slo, requires: [incident-first]}
  - {id: cicd-code-review, branch: cicd, stage: medior, title: node.cicd.code_review, requires: [cicd-pipeline]}
  - {id: cicd-cache-secrets, branch: cicd, stage: medior, title: node.cicd.cache_secrets, requires: [cicd-pipeline]}
  - {id: ckad-config-security, branch: kubernetes, stage: medior, title: node.ckad.config_security, requires: [k8s-fundamentals]}
  - {id: ckad-observability, branch: kubernetes, stage: medior, title: node.ckad.observability, requires: [k8s-fundamentals]}
  - {id: linux-raid, branch: linux, stage: medior, title: node.linux.raid, requires: [linux-disk]}
  - {id: linux-tls, branch: linux, stage: medior, title: node.linux.tls, requires: [linux-services]}
  - {id: security-web-scope, branch: security, stage: medior, title: node.security.web_scope, requires: [linux-files]}
  - {id: security-defaults, branch: security, stage: medior, title: node.security.defaults, requires: [linux-files]}
  - {id: design-ticket-booking, branch: design, stage: senior, title: node.design.ticket_booking, requires: [design-rate-limiter]}
  - {id: design-collab-editor, branch: design, stage: senior, title: node.design.collab_editor, requires: [design-rate-limiter]}
