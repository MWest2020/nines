# Homelab gear. Effects are the only levers; the engine knows these three. A consumable is
# bought again and again and only adds tokens (core/tokens.ts: a hint costs one).
schema: 1
items:
  - id: raspberry-pi
    title: item.raspberry_pi
    description: item.raspberry_pi.desc
    price: 200
    requires: []
    effects:
      income_per_quest: 10
      hint_boost: 1
  - id: ai-credits
    title: item.ai_credits
    description: item.ai_credits.desc
    price: 40
    requires: []
    consumable: true
    effects:
      tokens: 3
