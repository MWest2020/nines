# Roadmap, as data, for the overview at westerweel.work/nu/ (ratatoskr's status_site.py reads it).
# Written 2026-11-26 by the Nines architect agent from Mark's brief of 26 Nov 2026. An item is
# "done" only with evidence (a merged PR, a CI run or a document); everything else is "open".
# Schema: project, goal, current (a phase id), phases [id, name, summary], and done_means for the
# current phase [item, status done|open, evidence]. Later phases may carry their own done_means.
project: nines
goal: "A retro top-down RPG in the browser and on Android where you grow from Junior to Senior engineer along one of six career paths by fixing simulated machines in an in-game terminal, with karma that tracks which side of the law you work on; hints come from an AI that costs tokens; no ads or third-party tracking, any online feature opt-in; content as data."
current: android
phases:
  - id: architecture
    name: "Architecture and skeleton"
    summary: "ARCHITECTURE.md, DESIGN.md, JSON Schemas, the parser and condition language with tests, the three MVP quests as content, CI"
    done_means:
      - {item: "ARCHITECTURE.md: modules, the terminal-sim state model, the command parser, the condition language (parsed, never eval), content schemas, saves and versioning, i18n, offline content loading, the Capacitor build", status: done, evidence: "https://github.com/MWest2020/nines/pull/1"}
      - {item: "DESIGN.md: CC0 Kenney packs with URLs, the palette, sprite and tile sizes, mock-ups of the terminal, dialogue box, Career Trail, shop and mobile controls", status: done, evidence: "https://github.com/MWest2020/nines/pull/1"}
      - {item: "JSON Schemas for quest, scenario, npc and locale files (plus roadmap and shop) and a content validator run by npm test and CI", status: done, evidence: "https://github.com/MWest2020/nines/pull/1"}
      - {item: "Skeleton: TypeScript, Vite, Phaser 3 and Vitest pinned exactly; the command parser and condition evaluator implemented and tested; the three MVP quests completable in the simulator tests", status: done, evidence: "https://github.com/MWest2020/nines/pull/1"}
      - {item: "CI on every pull request and push to main (npm ci, content validation, tests, build, a scan of what ships), actions pinned to SHAs, green", status: done, evidence: "https://github.com/MWest2020/nines/pull/1"}
  - id: mvp
    name: "MVP build"
    summary: "Junior Village with three NPCs and the server room, the three terminal quests, money and a shop with one homelab item, the Career Trail with three nodes, save/load, NL/EN, desktop and touch controls"
    done_means:
      - {item: "Junior Village: one Tiled map, player movement with collision, three NPCs, the server room interior; CC0 tiles recorded in ASSETS.md", status: done, evidence: "https://github.com/MWest2020/nines/pull/8"}
      - {item: "The terminal overlay (xterm.js output, own input line, quick-command buttons, the built-in editor) runs the simulator; the three quests are completable on desktop (tests/e2e/smoke.py plays them in CI)", status: done, evidence: "https://github.com/MWest2020/nines/pull/12"}
      - {item: "Money from quests and a shop with the Raspberry Pi, reachable in play (quests finished in the terminal, the shop counter in the village)", status: done, evidence: "https://github.com/MWest2020/nines/pull/17"}
      - {item: "The Career Trail screen shows the three completed nodes after playing the three quests", status: done, evidence: "https://github.com/MWest2020/nines/pull/17"}
      - {item: "Save and load in localStorage; the NL/EN toggle", status: done, evidence: "https://github.com/MWest2020/nines/pull/9"}
      - {item: "Game state and screens: money, XP per branch, rewards paid once, purchases, save format 2 with its migration, the HUD, dialogue box, Career Trail, shop and credits screens, and the game API the world, terminal and battle code call; Vitest tests", status: done, evidence: "https://github.com/MWest2020/nines/pull/9"}
      - {item: "Touch controls: D-pad, tap to walk and use, the terminal usable with the Android soft keyboard and quick commands (checked in phone and tablet emulation; a real device is the Android phase)", status: done, evidence: "https://github.com/MWest2020/nines/pull/17"}
      - {item: "No runtime network requests, verified in devtools and documented; npm ci && npm run build gives a static site that runs offline", status: done, evidence: "https://github.com/MWest2020/nines/pull/17"}
      - {item: "Battles: the engine (src/battle), schemas/battle.schema.json and the validator checks, with Vitest tests for every question type, the meters, retries, hints and triggers", status: done, evidence: "https://github.com/MWest2020/nines/pull/5"}
      - {item: "Battles: three Junior encounters as content (rate limiter interview as the gate to Medior City, the 3 AM pager, Friday scope creep), each won by a perfect play and lost by an all-wrong play in tests", status: done, evidence: "https://github.com/MWest2020/nines/pull/5"}
      - {item: "Battles in the game: the war-room overlay from DESIGN.md (desktop layout, basic touch), NPC, pager and gate triggers wired, rewards and retries", status: done, evidence: "https://github.com/MWest2020/nines/pull/15"}
      - {item: "Battles on a phone: DESIGN.md's portrait layout (thin gauges under the header, hints as a count that opens over the transcript) and a landscape layout, checked in phone emulation (a real device is the Android phase)", status: done, evidence: "https://github.com/MWest2020/nines/pull/17"}
  - {id: android, name: "Android", summary: "Capacitor project, signed AAB from env vars, portrait and landscape, the three quests completed on a real device (touch controls, the soft keyboard in the terminal, a battle in portrait), PLAY_STORE.md filled in"}
  - id: cameo
    name: "Fourth-quest cameo proof"
    summary: "a sample guest quest added as one /content folder in its own commit, with no code change, and CONTRIBUTING.md's full worked example; done 27 Nov 2026 (#16), ahead of the Android phase"
    done_means:
      - {item: "A terminal cameo needs no map edit: spare cameo racks in the server room, the validator lets a cameo-* object wait for its guest and refuses two quests on one object; tests no longer enumerate all content", status: done, evidence: "https://github.com/MWest2020/nines/pull/16"}
      - {item: "Sample cameo \"It's always DNS\" (content/quests/its-always-dns: quest, scenario, NPC on cameo-1 with a CC0 sprite recorded in npc.yaml, NL/EN) added by one commit that adds only that folder", status: done, evidence: "https://github.com/MWest2020/nines/pull/16"}
      - {item: "npm test validates it and plays it (tests/quests/cameo.test.ts); the browser smoke test (tests/e2e/smoke.py) plays it as the fourth quest in CI; its author shows on the credits screen from the author field", status: done, evidence: "https://github.com/MWest2020/nines/pull/16"}
      - {item: "CONTRIBUTING.md: a full worked example of that folder, file by file: schemas, the validator, the IP and licence rules and the denylist, NL/EN parity, and how a battle cameo differs", status: done, evidence: "https://github.com/MWest2020/nines/pull/16"}
  - id: battles
    name: "More battles"
    summary: "the system-design battles from docs/content-backlog.md (Mark, 26 Nov 2026): all four written (#11, #13); the Senior Summit map that makes the two Senior interviews reachable is still to build"
    done_means:
      - {item: "Battle: nearby places search (Junior): geohash with neighbour cells, quadtree, ranking by exact distance", status: done, evidence: "https://github.com/MWest2020/nines/pull/11"}
      - {item: "Battle: URL shortener (Medior): ID generation, base62, caching, 301 vs 302", status: done, evidence: "https://github.com/MWest2020/nines/pull/11"}
      - {item: "Battle: ticket booking (Senior): holds with a TTL, conditional writes or row locks, idempotency", status: done, evidence: "https://github.com/MWest2020/nines/pull/13"}
      - {item: "Battle: collaborative editor (Senior): OT vs CRDT, offline merge", status: done, evidence: "https://github.com/MWest2020/nines/pull/13"}
      - {item: "Senior Summit map with spawn slots npc-1 (Noor) and npc-2 (Joris): makes the two Senior interviews reachable", status: open, evidence: "https://github.com/MWest2020/nines/blob/main/ARCHITECTURE.md"}
  - id: paths
    name: "Career paths, AI tokens and Kubernetes"
    summary: "Mark, 27 Nov 2026: hints are AI usage and cost tokens; five career paths (SWE, SRE, DevOps, Platform, Systems); a Kubernetes learning path along KCNA, CKAD and CKA/CKS; Nines is no children's app, so optional online features may come, opt-in"
    done_means:
      - {item: "AI tokens in the pure core: a token balance, a hint costs one, rewards scale to max(40%, 100% - 20% per hint) and never go negative, no hint without tokens, AI credits (€40 for 3) in the shop, save format 3 with the v2 to v3 migration; Vitest tests (tests/core/tokens.test.ts)", status: done, evidence: "https://github.com/MWest2020/nines/pull/22"}
      - {item: "Hints ask first in the terminal and the war room (\"Ask the AI? -1 token, -20% XP and money on this quest\"), tokens in the HUD and the shop; the browser smoke tests pay a hint in a quest and a battle and buy AI credits", status: done, evidence: "https://github.com/MWest2020/nines/pull/22"}
      - {item: "Five career paths in content/roadmap.yaml with NL/EN pitches; quests declare paths (schema and validator); existing quests tagged; choosePath in the rules and the save; DESIGN.md, Career paths", status: done, evidence: "https://github.com/MWest2020/nines/pull/22"}
      - {item: "Kubernetes learning path designed against the official KCNA, CKAD, CKA and CKS domains (DESIGN.md, sources cited); the four KCNA nodes on the Career Trail", status: done, evidence: "https://github.com/MWest2020/nines/pull/22"}
      - {item: "First Kubernetes quest, CrashLoopBackOff (Junior, KCNA): kubectl describe and apply -f in the simulator, played in tests/quests/k8s.test.ts and the browser smoke test, independently reviewed", status: done, evidence: "https://github.com/MWest2020/nines/pull/22"}
      - {item: "Policy: AGENTS.md rule 3 rewritten (not a children's app; network features opt-in, no third-party analytics or ads unless Mark asks); DESIGN.md, Share my progress (option A recommended)", status: done, evidence: "https://github.com/MWest2020/nines/pull/22"}
      - {item: "The Kubernetes path's remaining KCNA pieces, the rest of CKAD (Medior; readiness probes and the golden path are in, #29) and CKA/CKS (Senior) content and the kubectl commands they need (docs/content-backlog.md)", status: open, evidence: "https://github.com/MWest2020/nines/blob/main/docs/content-backlog.md"}
      - {item: "Medior City map with the career coach: the gate opens after the rate-limiter win, the path choice in play (a paid switch later, issue 24's default), each path's mentor with a first quest, the URL shortener moved to the city, the CKAD start (a readiness probe), an enterprise job gated on karma and a side hustle; walked, chosen and played in tests/e2e/medior_smoke.py", status: done, evidence: "https://github.com/MWest2020/nines/pull/29"}
      - {item: "Each path's full Medior quest line (two to four more quests), its gate interview into Senior Summit and its homelab item (docs/content-backlog.md, Career paths)", status: open, evidence: "https://github.com/MWest2020/nines/blob/main/docs/content-backlog.md"}
  - id: karma
    name: "Karma, side hustles, the contractor and the ethical hacker"
    summary: "Mark, 27 Nov 2026: karma paths (a fixer behind a building, fines, arrests, a three-letter agency), the independent contractor who skips procedures and pays for damage, and ethical hacker as a sixth career path"
    done_means:
      - {item: "Karma in the pure core: -100..100 from 0, the meter (saint, trusted, neutral, shady, wanted), progress facts karma, probation, strikes and contractor for content gates (available_when), negative numbers in the condition language, save format 4 with the v3 to v4 migration; Vitest tests for the bounds, the thresholds and the migration (tests/core/karma.test.ts)", status: done, evidence: "https://github.com/MWest2020/nines/pull/26"}
      - {item: "Side hustles: quest kind hustle, a scenario risk (base plus factors), the touched() fact, a roll seeded by the save (never unseeded), caught (fine, karma, strike), arrested (big fine, probation), the agency at -60, community service (kind service) as the way back; the heat shown live in the terminal", status: done, evidence: "https://github.com/MWest2020/nines/pull/26"}
      - {item: "One side job: the vending machine job (content/quests/vending-prices, Vince behind the office), abstract and fictional, ending on responsible disclosure; played careful and sloppy in tests/quests/karma.test.ts and in the browser smoke test", status: done, evidence: "https://github.com/MWest2020/nines/pull/26"}
      - {item: "The independent contractor: a flag in the save and the menu, procedure objectives skipped, 150% pay, damage billed 3x; the bakery hotfix as its quest variant, played by the book and as a contractor in tests and the browser smoke test", status: done, evidence: "https://github.com/MWest2020/nines/pull/26"}
      - {item: "Ethical hacker as the sixth path (schema, validator, roadmap, NL/EN pitch, content tagged); the Junior pentest of Polderbank staging (signed scope, a directory-listing misconfiguration, the finding written up), played in tests and the browser smoke test", status: done, evidence: "https://github.com/MWest2020/nines/pull/26"}
      - {item: "Community service at the Repair Café (content/quests/repair-cafe); the karma meter on the Career Trail and karma toasts in the HUD; DESIGN.md, Karma", status: done, evidence: "https://github.com/MWest2020/nines/pull/26"}
      - {item: "More side jobs and contractor quests, the report-it-instead variant of the vending job, and the rest of the ethical hacker's Medior line (the security branch, the web app assessment, the car-park hustle and the enterprise certificate job came with Medior City, #29) (docs/content-backlog.md, Karma)", status: open, evidence: "https://github.com/MWest2020/nines/blob/main/docs/content-backlog.md"}
  - id: playtest
    name: "Playtest fixes"
    summary: "Mark's first playtest (27 Nov 2026): the basics every terminal should have, nginx and kubectl tooling, fair grading of written work, an explicit done, the kiosk logout and a social-engineering choice"
    done_means:
      - {item: "A shared base shell on every machine: /etc (passwd, group, hostname, hosts, os-release, motd), whoami, id, who, w, last, logout, hostname, uname, ps, kill, pkill, env, echo, head, wc, sort, uniq, find, which, man, history; git log, diff, restore and -C everywhere a scenario has a repository", status: done, evidence: "PRURL"}
      - {item: "nginx -t, -T, -v and -s reload with file:line errors; systemctl runs the same test; service-down lets the player test the fix before restarting", status: done, evidence: "PRURL"}
      - {item: "kubectl get deploy|svc|cm|ns|events|rs|nodes|all (-n, -A, -o wide|yaml|name), describe deploy|svc|cm|node, rollout status|history|undo, scale, edit, delete pod, top, on the stored cluster model", status: done, evidence: "PRURL"}
      - {item: "Fair free-text grading (src/sim/check.ts) with a note in the objectives panel on what is still wrong; applied to both pentest findings, the change tickets, the logbook and the drop file", status: done, evidence: "PRURL"}
      - {item: "Done is explicit: a done banner with Close and Practice again (a fresh machine, no reward); a battle's win offers Practice again", status: done, evidence: "PRURL"}
      - {item: "The kiosk logout (who, logout, kill, pkill -u) and Ans's desk: a dialogue choice for a borrowed library card that lowers the job's risk, costs karma and raises the fine when caught; honest unknown-command replies and a dev-only list of them", status: done, evidence: "PRURL"}
      - {item: "Alpine shell in the browser: decided by Mark (default: keep extending the simulator)", status: open, evidence: "ISSUEURL"}
  - id: later
    name: "Later: share, cafés, minigames, swag"
    summary: "ideas Mark named on 27 Nov 2026, not designed beyond a line each; tech, memes and fun lead"
    done_means:
      - {item: "Share my progress: a self-reported share card (PNG and a link with the progress in the URL fragment), opt-in, no server (DESIGN.md, option A)", status: open, evidence: "https://github.com/MWest2020/nines/blob/main/DESIGN.md"}
      - {item: "Meme internet cafés: a place in each town with tech-meme side quests, tech debt and a jukebox", status: open, evidence: "https://github.com/MWest2020/nines/blob/main/DESIGN.md"}
      - {item: "Miniature games: small arcade cabinets (a log-grep race, packet Tetris, a YAML-indent rhythm game)", status: open, evidence: "https://github.com/MWest2020/nines/blob/main/DESIGN.md"}
      - {item: "Swag shop: stickers, hoodies and mugs in-game first; real merchandise only if Mark wants it", status: open, evidence: "https://github.com/MWest2020/nines/blob/main/DESIGN.md"}
done_means:
  - {item: "Capacitor project: @capacitor/core, cli and android 8.6.0 pinned exactly; android/ committed; target SDK 36 (Play's requirement since 31 Aug 2026); portrait and landscape; no permissions at all (INTERNET removed); allowBackup off; the Android back button closes what the game would; no service worker in the app; own launcher icon", status: done, evidence: "https://github.com/MWest2020/nines/pull/19"}
  - {item: "Signed AAB from env vars: Gradle signs the release only from NINES_KEYSTORE, NINES_KEYSTORE_PASSWORD, NINES_KEY_ALIAS and NINES_KEY_PASSWORD (unsigned with a warning when none are set); a new upload key outside the repo; a signed AAB built and verified with jarsigner", status: done, evidence: "https://github.com/MWest2020/nines/pull/19"}
  - {item: "CI builds the debug APK and an unsigned release AAB on every push to main, checks the badging (no permissions, target 36, no backup) and keeps both as workflow artifacts; no secrets", status: done, evidence: "https://github.com/MWest2020/nines/pull/19"}
  - {item: "PLAY_STORE.md filled in: listing in NL and EN, Data safety (no data collected or shared), content rating notes, screenshot checklist, target API level, release steps", status: done, evidence: "https://github.com/MWest2020/nines/blob/main/PLAY_STORE.md"}
  - {item: "The three quests (and the DNS cameo) completed on a real device: touch controls, the soft keyboard in the terminal, a battle in portrait; the app loads without the INTERNET permission", status: open, evidence: "https://github.com/MWest2020/nines/issues/20"}
