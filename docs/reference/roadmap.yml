# Roadmap, as data, for the overview at westerweel.work/nu/ (ratatoskr's status_site.py reads it).
# Written 2026-11-26 by the Nines architect agent from Mark's brief of 26 Nov 2026. An item is
# "done" only with evidence (a merged PR, a CI run or a document); everything else is "open".
# Schema: project, goal, current (a phase id), phases [id, name, summary], and done_means for the
# current phase [item, status done|open, evidence].
project: nines
goal: "A retro top-down RPG in the browser and on Android where you grow from Junior to Senior engineer by fixing simulated machines in an in-game terminal: no tracking, no ads, no network, content as data."
current: mvp
phases:
  - id: architecture
    name: "Architecture and skeleton"
    summary: "ARCHITECTURE.md, DESIGN.md, JSON Schemas, the parser and condition language with tests, the three MVP quests as content, CI"
    done_means:
      - {item: "ARCHITECTURE.md: modules, the terminal-sim state model, the command parser, the condition language (parsed, never eval), content schemas, saves and versioning, i18n, offline content loading, the Capacitor build", status: done, evidence: "PR_URL"}
      - {item: "DESIGN.md: CC0 Kenney packs with URLs, the palette, sprite and tile sizes, mock-ups of the terminal, dialogue box, Career Trail, shop and mobile controls", status: done, evidence: "PR_URL"}
      - {item: "JSON Schemas for quest, scenario, npc and locale files (plus roadmap and shop) and a content validator run by npm test and CI", status: done, evidence: "PR_URL"}
      - {item: "Skeleton: TypeScript, Vite, Phaser 3 and Vitest pinned exactly; the command parser and condition evaluator implemented and tested; the three MVP quests completable in the simulator tests", status: done, evidence: "PR_URL"}
      - {item: "CI on every push and pull request (npm ci, content validation, tests, build), actions pinned to SHAs, green", status: done, evidence: "PR_URL"}
  - {id: mvp, name: "MVP build", summary: "Junior Village with three NPCs and the server room, the three terminal quests, money and a shop with one homelab item, the Career Trail with three nodes, save/load, NL/EN, desktop and touch controls"}
  - {id: android, name: "Android", summary: "Capacitor project, signed AAB from env vars, portrait and landscape, the three quests completed on a real device, PLAY_STORE.md filled in"}
  - {id: cameo, name: "Fourth-quest cameo proof", summary: "a sample guest quest added as one /content folder in its own commit, with no code change, and CONTRIBUTING.md's full worked example"}
done_means:
  - {item: "Junior Village: one Tiled map, player movement with collision, three NPCs, the server room interior; CC0 tiles recorded in ASSETS.md", status: open, evidence: "https://github.com/MWest2020/nines/blob/main/DESIGN.md"}
  - {item: "The terminal overlay (xterm.js output, own input line, quick-command buttons, the built-in editor) runs the simulator; the three quests are completable on desktop", status: open, evidence: "https://github.com/MWest2020/nines/blob/main/ARCHITECTURE.md"}
  - {item: "Money from quests and a shop with the Raspberry Pi", status: open, evidence: "https://github.com/MWest2020/nines/blob/main/content/shop.yaml"}
  - {item: "The Career Trail screen shows the three completed nodes", status: open, evidence: "https://github.com/MWest2020/nines/blob/main/content/roadmap.yaml"}
  - {item: "Save and load in localStorage; the NL/EN toggle", status: open, evidence: "https://github.com/MWest2020/nines/blob/main/src/core/save.ts"}
  - {item: "Touch controls: D-pad, tap to walk and use, the terminal usable with the Android soft keyboard and quick commands", status: open, evidence: "https://github.com/MWest2020/nines/blob/main/DESIGN.md"}
  - {item: "No runtime network requests, verified in devtools and documented; npm ci && npm run build gives a static site that runs offline", status: open, evidence: "https://github.com/MWest2020/nines/blob/main/AGENTS.md"}
