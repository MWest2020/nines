# Roadmap, as data, for the overview at westerweel.work/nu/ (ratatoskr's status_site.py reads it).
# Written 2026-11-26 by the Nines architect agent from Mark's brief of 26 Nov 2026. An item is
# "done" only with evidence (a merged PR, a CI run or a document); everything else is "open".
# Schema: project, goal, current (a phase id), phases [id, name, summary], and done_means for the
# current phase [item, status done|open, evidence].
project: nines
goal: "A retro top-down RPG in the browser and on Android where you grow from Junior to Senior engineer by fixing simulated machines in an in-game terminal: no tracking, no ads, no network, content as data."
current: mvp
phases:
  - id: architecture
    name: "Architecture and skeleton"
    summary: "ARCHITECTURE.md, DESIGN.md, JSON Schemas, the parser and condition language with tests, the three MVP quests as content, CI"
    done_means:
      - {item: "ARCHITECTURE.md: modules, the terminal-sim state model, the command parser, the condition language (parsed, never eval), content schemas, saves and versioning, i18n, offline content loading, the Capacitor build", status: done, evidence: "https://github.com/MWest2020/nines/pull/1"}
      - {item: "DESIGN.md: CC0 Kenney packs with URLs, the palette, sprite and tile sizes, mock-ups of the terminal, dialogue box, Career Trail, shop and mobile controls", status: done, evidence: "https://github.com/MWest2020/nines/pull/1"}
      - {item: "JSON Schemas for quest, scenario, npc and locale files (plus roadmap and shop) and a content validator run by npm test and CI", status: done, evidence: "https://github.com/MWest2020/nines/pull/1"}
      - {item: "Skeleton: TypeScript, Vite, Phaser 3 and Vitest pinned exactly; the command parser and condition evaluator implemented and tested; the three MVP quests completable in the simulator tests", status: done, evidence: "https://github.com/MWest2020/nines/pull/1"}
      - {item: "CI on every pull request and push to main (npm ci, content validation, tests, build, a scan of what ships), actions pinned to SHAs, green", status: done, evidence: "https://github.com/MWest2020/nines/pull/1"}
  - {id: mvp, name: "MVP build", summary: "Junior Village with three NPCs and the server room, the three terminal quests, money and a shop with one homelab item, the Career Trail with three nodes, save/load, NL/EN, desktop and touch controls"}
  - {id: android, name: "Android", summary: "Capacitor project, signed AAB from env vars, portrait and landscape, the three quests completed on a real device, PLAY_STORE.md filled in"}
  - {id: cameo, name: "Fourth-quest cameo proof", summary: "a sample guest quest added as one /content folder in its own commit, with no code change, and CONTRIBUTING.md's full worked example"}
  - id: battles
    name: "More battles"
    summary: "the system-design battles still to write (nearby places for Junior Village, a URL shortener for Medior City, ticket booking and a collaborative editor for Senior Summit), from docs/content-backlog.md (Mark, 26 Nov 2026)"
    done_means:
      - {item: "Battle: nearby places search (Junior): geohash with neighbour cells, quadtree, ranking by exact distance", status: done, evidence: "https://github.com/MWest2020/nines/pull/11"}
      - {item: "Battle: URL shortener (Medior): ID generation, base62, caching, 301 vs 302", status: done, evidence: "https://github.com/MWest2020/nines/pull/11"}
      - {item: "Battle: ticket booking (Senior): holds with a TTL, conditional writes or row locks, idempotency", status: done, evidence: "https://github.com/MWest2020/nines/pull/13"}
      - {item: "Battle: collaborative editor (Senior): OT vs CRDT, offline merge", status: done, evidence: "https://github.com/MWest2020/nines/pull/13"}
      - {item: "Senior Summit map with spawn slots npc-1 (Noor) and npc-2 (Joris): makes the two Senior interviews reachable", status: open, evidence: "https://github.com/MWest2020/nines/blob/main/ARCHITECTURE.md"}
done_means:
  - {item: "Junior Village: one Tiled map, player movement with collision, three NPCs, the server room interior; CC0 tiles recorded in ASSETS.md", status: done, evidence: "https://github.com/MWest2020/nines/pull/8"}
  - {item: "The terminal overlay (xterm.js output, own input line, quick-command buttons, the built-in editor) runs the simulator; the three quests are completable on desktop (tests/e2e/smoke.py plays them in CI)", status: done, evidence: "https://github.com/MWest2020/nines/pull/12"}
  - {item: "Money from quests and a shop with the Raspberry Pi, reachable in play (quests finished in the terminal, the shop counter in the village)", status: open, evidence: "https://github.com/MWest2020/nines/blob/main/content/shop.yaml"}
  - {item: "The Career Trail screen shows the three completed nodes after playing the three quests", status: open, evidence: "https://github.com/MWest2020/nines/blob/main/content/roadmap.yaml"}
  - {item: "Save and load in localStorage; the NL/EN toggle", status: done, evidence: "https://github.com/MWest2020/nines/pull/9"}
  - {item: "Game state and screens: money, XP per branch, rewards paid once, purchases, save format 2 with its migration, the HUD, dialogue box, Career Trail, shop and credits screens, and the game API the world, terminal and battle code call; Vitest tests", status: done, evidence: "https://github.com/MWest2020/nines/pull/9"}
  - {item: "Touch controls: D-pad, tap to walk and use, the terminal usable with the Android soft keyboard and quick commands", status: open, evidence: "https://github.com/MWest2020/nines/blob/main/DESIGN.md"}
  - {item: "No runtime network requests, verified in devtools and documented; npm ci && npm run build gives a static site that runs offline", status: open, evidence: "https://github.com/MWest2020/nines/blob/main/AGENTS.md"}
  - {item: "Battles: the engine (src/battle), schemas/battle.schema.json and the validator checks, with Vitest tests for every question type, the meters, retries, hints and triggers", status: done, evidence: "https://github.com/MWest2020/nines/pull/5"}
  - {item: "Battles: three Junior encounters as content (rate limiter interview as the gate to Medior City, the 3 AM pager, Friday scope creep), each won by a perfect play and lost by an all-wrong play in tests", status: done, evidence: "https://github.com/MWest2020/nines/pull/5"}
  - {item: "Battles in the game: the war-room overlay from DESIGN.md, NPC, pager and gate triggers wired, rewards and retries", status: open, evidence: "https://github.com/MWest2020/nines/blob/main/DESIGN.md"}
