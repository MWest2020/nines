name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # never cut a main deploy short

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate content
        run: npm run validate:content
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Check what ships
        run: npm run check:dist
      # The three MVP quests, played in a headless browser by typing real commands; fails on
      # any request outside the page's origin (tests/e2e/smoke.py).
      - name: Play the three quests in a browser
        run: |
          python3 -m venv "$RUNNER_TEMP/e2e"
          "$RUNNER_TEMP/e2e/bin/pip" install --quiet --no-cache-dir --require-hashes -r tests/e2e/requirements.txt
          "$RUNNER_TEMP/e2e/bin/python" -m playwright install --with-deps --only-shell chromium
          "$RUNNER_TEMP/e2e/bin/python" -u tests/e2e/smoke.py --shots "$RUNNER_TEMP/shots"
      # The battles, played to a win, a loss and a retry by real keys, clicks and a drag
      # (tests/e2e/battle_smoke.py); also fails on any request outside the origin.
      - name: Play the battles in a browser
        run: '"$RUNNER_TEMP/e2e/bin/python" -u tests/e2e/battle_smoke.py "$RUNNER_TEMP/battle-shots"'
      - name: Upload the site for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  # Mark, 26 Nov 2026: "mag openbaar" (repo and the playable web version). Only main deploys;
  # the job gets the Pages permissions, the build job keeps contents: read.
  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
