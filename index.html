<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- resizes-content: Chrome on Android shrinks the page when the soft keyboard opens, so the
         terminal's input line stays above it (src/game/touch/viewport.ts covers other browsers). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- No request may leave the origin: no analytics, no fonts, no CDNs. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; media-src 'self' data: blob:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <title>Nines</title>
    <style>
      /* No page scroll, no pull-to-refresh, no double-tap zoom: the game is the whole page. */
      html, body { margin: 0; height: 100%; background: #101820; overflow: hidden; overscroll-behavior: none; touch-action: manipulation; }
      /* src/game/touch/controls.ts sizes and places the canvas (a whole-number scale where it fits) */
      #game { position: absolute; left: 0; top: 0; width: 100vw; height: 100dvh; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      canvas { display: block; image-rendering: pixelated; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
